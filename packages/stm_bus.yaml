# ─── STM bus stops near home: map markers ───
#
# The hallway tablet's party-mode "Buses to the metro" card links each bus to a
# map page (tablets-subviews/subview-bus-<stop>). Those maps show the stop's
# arrival sensors (sensor.stm_<stop>_arrival_1..3, GTFS Realtime entry "STM",
# GPS from STM's vehicle positions feed), zone.home, and the stop itself from
# these static sensors. Coordinates are from STM's GTFS stops.txt (2026-11-03);
# they are Jinja so they render as numbers (static YAML numbers stay strings,
# and the map card skips non-numeric coordinates).

template:
  - sensor:
      - name: "STM stop 52457"
        unique_id: stm_stop_52457
        icon: mdi:bus-stop
        state: "De Lorimier / Marie-Anne"
        attributes:
          latitude: "{{ 45.534102 }}"
          longitude: "{{ -73.570342 }}"
          routes: "10 Sud → Papineau"
      - name: "STM stop 52381"
        unique_id: stm_stop_52381
        icon: mdi:bus-stop
        state: "du Mont-Royal / De Lorimier"
        attributes:
          latitude: "{{ 45.535296 }}"
          longitude: "{{ -73.572412 }}"
          routes: "97 Ouest, night 368 → Mont-Royal"
      - name: "STM stop 52389"
        unique_id: stm_stop_52389
        icon: mdi:bus-stop
        state: "Papineau / Marie-Anne"
        attributes:
