blueprint:
  name: Hue Dial Light Controller
  description: Controls a light group using a Hue dial remote, supporting light toggle,
    full brightness, brightness adjustment via dial rotation, color effects, and dim-to-minimum
    via button presses. Select the dial device and the light (group) to control. Button
    2 additionally turns off any UV switch (switch.*uv*) in the room and stops running
    light effects (via 'effect_stop' for LIFX, 'Solid' for WLED, or 'off' for a ZHA
    colorloop, depending on what the device supports).
  domain: automation
  input:
    dial_device:
      name: Hue Dial Remote
      description: The ZHA Hue dial / remote device that triggers the automation.
      selector:
        device:
          integration: zha
          multiple: false
    target_light:
      name: Light / Light Group
      description: The light or light group to control. A light group entity works
        best so the brightness conditions and color logic operate on the whole group.
        For button 2's room logic (UV switches off, effect stop) use a Home Assistant
        helper light group or an entity with an area assigned — native ZHA/Hue group
        entities cannot be expanded into their members.
      selector:
        entity:
          domain:
          - light
          multiple: false
          reorder: false
mode: restart
variables:
  controlled_light: !input target_light
triggers:
- device_id: !input dial_device
  domain: zha
  type: remote_button_short_press
  subtype: dim_up
  trigger: device
  id: brightness_step_up
- device_id: !input dial_device
  domain: zha
  type: remote_button_short_press
  subtype: dim_down
  trigger: device
  id: brightness_step_down
- device_id: !input dial_device
  domain: zha
  type: remote_button_short_press
  subtype: button_1
  trigger: device
  id: button_1_press
- device_id: !input dial_device
  domain: zha
  type: remote_button_short_press
  subtype: button_2
  trigger: device
  id: button_2_press
- device_id: !input dial_device
  domain: zha
  type: remote_button_short_press
  subtype: button_3
  trigger: device
  id: button_3_press
- device_id: !input dial_device
  domain: zha
  type: remote_button_short_press
  subtype: button_4
  trigger: device
  id: button_4_press
- device_id: !input dial_device
  domain: zha
  type: remote_button_long_press
  subtype: button_2
  trigger: device
  id: button_2_hold
- device_id: !input dial_device
  domain: zha
  type: remote_button_long_press
  subtype: button_1
  trigger: device
  id: button_1_hold
- device_id: !input dial_device
  domain: zha
  type: remote_button_long_press
  subtype: button_3
  trigger: device
  id: button_3_hold
- device_id: !input dial_device
  domain: zha
  type: remote_button_long_press
  subtype: button_4
  trigger: device
  id: button_4_hold
- device_id: !input dial_device
  domain: zha
  type: remote_button_quintuple_press
  subtype: button_2
  trigger: device
  id: button_2_quintuple_press
- device_id: !input dial_device
  domain: zha
  type: remote_button_quintuple_press
  subtype: button_1
  trigger: device
  id: button_1_quintuple_press
conditions: []
actions:
- choose:
  - conditions:
    - condition: trigger
      id:
      - button_1_press
    sequence:
    - action: light.toggle
      metadata: {}
      data:
        transition: 2
      target:
        entity_id: !input target_light
  - conditions:
    - condition: trigger
      id:
      - button_1_hold
    sequence:
    - action: light.toggle
      metadata: {}
      data:
        transition: 2
        brightness_pct: 100
        color_temp_kelvin: 4922
      target:
        entity_id: !input target_light
    - choose:
      - conditions: []
        sequence: []
      - conditions:
        - condition: state
          entity_id: !input target_light
          attribute: brightness
          state: ''
        - condition: numeric_state
          entity_id: !input target_light
          attribute: brightness
          below: 99
        sequence:
        - action: light.turn_on
          metadata: {}
          data:
            transition: 1
            brightness_pct: 100
          target:
            entity_id: !input target_light
  - conditions:
    - condition: trigger
      id:
      - button_2_press
    sequence:
    - variables:
        room_areas: "{{ ((expand(controlled_light) | map(attribute='entity_id')\n
          \    | map('area_id') | list)\n    + [area_id(controlled_light)])\n   |
          reject('none') | unique | list }}"
        uv_switches: "{{ room_areas | map('area_entities') | sum(start=[])\n   | select('match',
          'switch\\.')\n   | select('search', '(\\.|_)uv([0-9]*)(_|$)')\n   | unique
          | list }}"
        effect_candidates: "{{ ((expand(controlled_light) | map(attribute='entity_id')
          | list)\n    + (expand(room_areas | map('area_entities') | sum(start=[])\n
          \             | select('match', 'light\\.') | list)\n       | selectattr('state',
          'eq', 'on')\n       | map(attribute='entity_id') | list))\n   | unique |
          list }}"
        effect_stop_lights: "{{ expand(effect_candidates)\n   | selectattr('attributes.effect_list',
          'defined')\n   | rejectattr('attributes.effect_list', 'none')\n   | selectattr('attributes.effect_list',
          'contains', 'effect_stop')\n   | map(attribute='entity_id') | unique | list
          }}"
        solid_lights: "{{ expand(effect_candidates)\n   | selectattr('attributes.effect_list',
          'defined')\n   | rejectattr('attributes.effect_list', 'none')\n   | selectattr('attributes.effect_list',
          'contains', 'Solid')\n   | rejectattr('attributes.effect_list', 'contains',
          'effect_stop')\n   | map(attribute='entity_id') | unique | list }}"
        zha_colorloop_lights: "{{ expand(effect_candidates)\n   | selectattr('attributes.effect_list',
          'defined')\n   | rejectattr('attributes.effect_list', 'none')\n   | selectattr('attributes.effect_list',
          'contains', 'off')\n   | selectattr('attributes.effect', 'defined')\n   |
          selectattr('attributes.effect', 'eq', 'colorloop')\n   | map(attribute='entity_id')
          | unique | list }}"
    - if:
      - condition: template
        value_template: '{{ uv_switches | count > 0 }}'
      then:
      - action: switch.turn_off
        target:
          entity_id: '{{ uv_switches }}'
    - if:
      - condition: template
        value_template: '{{ effect_stop_lights | count > 0 }}'
      then:
      - action: light.turn_on
        data:
          effect: effect_stop
        target:
          entity_id: '{{ effect_stop_lights }}'
    - if:
      - condition: template
        value_template: '{{ solid_lights | count > 0 }}'
      then:
      - action: light.turn_on
        data:
          effect: Solid
        target:
          entity_id: '{{ solid_lights }}'
    - if:
      - condition: template
        value_template: '{{ zha_colorloop_lights | count > 0 }}'
      then:
      - action: light.turn_on
        data:
          effect: 'off'
        target:
          entity_id: '{{ zha_colorloop_lights }}'
    - action: light.turn_on
      metadata: {}
      data:
        transition: 1
        color_temp_kelvin: 5238
        brightness_pct: 100
      target:
        entity_id: !input target_light
  - conditions:
    - condition: trigger
      id:
      - button_3_press
    sequence:
    - action: script.change_received_lights_to_random_colors
      metadata: {}
      data:
        light:
        - !input target_light
        saturation: 100
  - conditions:
    - condition: trigger
      id:
      - button_4_press
    sequence:
    - action: light.turn_on
      metadata: {}
      data:
        brightness_pct: 1
      target:
        entity_id: !input target_light
  - conditions:
    - condition: trigger
      id:
      - button_2_hold
    sequence:
    - action: script.change_received_lights_to_random_pastel_colors
      metadata: {}
      data:
        light:
        - !input target_light
    - action: light.turn_on
      metadata: {}
      data:
        transition: 1
        brightness_pct: 100
      target:
        entity_id: !input target_light
  - conditions:
    - condition: trigger
      id:
      - button_3_hold
    sequence:
    - action: script.change_received_lights_to_warm_saturated_colors
      metadata: {}
      data:
        light:
        - !input target_light
  - conditions:
    - condition: trigger
      id:
      - button_4_hold
    sequence:
    - action: light.turn_on
      metadata: {}
      data:
        transition: 1
        brightness_pct: 1
      target:
        entity_id: !input target_light
    - action: script.change_received_lights_to_warm_saturated_colors
      metadata: {}
      data:
        light:
        - !input target_light
  - conditions:
    - condition: trigger
      id:
      - button_2_quintuple_press
    sequence:
    - variables:
        room_areas: "{{ ((expand(controlled_light) | map(attribute='entity_id')\n
          \    | map('area_id') | list)\n    + [area_id(controlled_light)])\n   |
          reject('none') | unique | list }}"
        uv_groups: "{{ room_areas | map('area_entities') | sum(start=[])\n   | select('match',
          'switch\\.group_')\n   | select('search', '(\\.|_)uv([0-9]*)(_|$)')\n   |
          unique | list }}"
    - if:
      - condition: template
        value_template: '{{ uv_groups | count > 0 }}'
      then:
      - action: switch.toggle
        target:
          entity_id: '{{ uv_groups }}'
  - conditions:
    - condition: trigger
      id:
      - button_1_quintuple_press
    sequence:
    - variables:
        room_areas: "{{ ((expand(controlled_light) | map(attribute='entity_id')\n
          \    | map('area_id') | list)\n    + [area_id(controlled_light)])\n   |
          reject('none') | unique | list }}"
        morph_lights: "{{ expand(room_areas | map('area_entities') | sum(start=[])\n
          \         | select('match', 'light\\.') | list)\n   | selectattr('attributes.effect_list',
          'defined')\n   | rejectattr('attributes.effect_list', 'none')\n   | selectattr('attributes.effect_list',
          'contains', 'effect_morph')\n   | map(attribute='entity_id') | unique |
          list }}"
    - if:
      - condition: template
        value_template: '{{ morph_lights | count > 0 }}'
      then:
      - action: lifx.effect_morph
        data:
          speed: 3
        target:
          entity_id: '{{ morph_lights }}'
  - conditions:
    - condition: trigger
      id:
      - brightness_step_up
    sequence:
    - choose:
      - conditions:
        - condition: numeric_state
          entity_id: !input target_light
          attribute: brightness
          enabled: true
          above: 253
        sequence:
        - variables:
            lights_saturated: '{{ expand(controlled_light)    | selectattr(''attributes.hs_color'',
              ''defined'') | map(attribute=''entity_id'') | list }}

              '
        - repeat:
            for_each: '{{lights_saturated}}'
            sequence:
            - action: light.turn_on
              metadata: {}
              data:
                hs_color: '{% set sat = ((state_attr(repeat.item,''hs_color'') ).1
                  - 21) %} {{[state_attr(repeat.item,''hs_color'').0] +  [([0, sat,
                  100]|sort)[1]] }}

                  '
                transition: 1
              target:
                entity_id: '{{ repeat.item }}

                  '
      default:
      - action: light.turn_on
        metadata: {}
        data:
          brightness_step_pct: 10
          transition: 1
        target:
          entity_id: !input target_light
  - conditions:
    - condition: trigger
      id:
      - brightness_step_down
    sequence:
    - choose:
      - conditions:
        - condition: numeric_state
          entity_id: !input target_light
          attribute: brightness
          above: 253
        - condition: template
          value_template: "{{ expand(controlled_light)\n   | selectattr('attributes.hs_color',
            'defined')\n   | rejectattr('attributes.hs_color', 'none')\n   | rejectattr('attributes.color_mode',
            'eq', 'color_temp')\n   | selectattr('attributes.hs_color.1', 'lt', 95)\n
            \  | list | count > 0 }}\n"
        sequence:
        - variables:
            lights_desaturated: "{{ expand(controlled_light)\n   | selectattr('attributes.hs_color',
              'defined')\n   | rejectattr('attributes.hs_color', 'none')\n   | rejectattr('attributes.color_mode',
              'eq', 'color_temp')\n   | selectattr('attributes.hs_color.1', 'lt',
              95)\n   | map(attribute='entity_id') | list }}\n"
        - repeat:
            for_each: '{{ lights_desaturated }}'
            sequence:
            - action: light.turn_on
              metadata: {}
              data:
                hs_color: '{% set sat = ((state_attr(repeat.item,''hs_color'') ).1
                  + 21) %} {{[state_attr(repeat.item,''hs_color'').0] +  [([0, sat,
                  100]|sort)[1]] }}

                  '
                transition: 1
              target:
                entity_id: '{{ repeat.item }}

                  '
      default:
      - action: light.turn_on
        metadata: {}
        data:
          transition: 1
          brightness_step_pct: -15
        target:
          entity_id: !input target_light
- delay:
    hours: 0
    minutes: 0
    seconds: 0
    milliseconds: 50
  enabled: false
