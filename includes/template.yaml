              {% elif cooking_mode == "on" and room == "kitchen" %}                                     
                {% set ns.activityname = "Cooking" %}    
              {% elif phone_in_use == true %}                               
                {% set ns.activityname = "Using Phone" %}  
              {% elif vacuum_cleaning == true %}                               
                {% set ns.activityname = "Cleaning" %}       
             {% endif %} 
            {% endif %}
            {{ns.activityname }}                   
