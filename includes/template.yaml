  # ─── Person Counting & Presence Sensors ───
  # Counts partners, crashers, and residents at home using HA labels on person entities.
  # Also provides a "Users Present" binary sensor with a 7-minute delay-off.
  - trigger:
      - trigger: state
        entity_id:
          - person.maximiliano
          - person.myriam
          - person.fay
          - person.lylou
      - trigger: homeassistant
        event: start
    binary_sensor:
      - name: "Users Present"
        unique_id: user_home
        delay_off:
          minutes: 7
        state: >-
          {{ states.person | selectattr('state', 'eq', 'home') | list | count > 0 }}
    sensor:
      - name: "amount partners home"
        unique_id: "amount_partners_home"
        unit_of_measurement: "partners"
        state: >-
            {% set ns = namespace(total_partners = 0) %}
            {% for person in states.person %}
            {% if "partners" in person.entity_id | labels() and person.state == "home" %}
              {% set ns.total_partners = ns.total_partners + 1 %}
            {% endif %}
            {% endfor %}
            {{ ns.total_partners }}

      - name: "amount people crashing at home"
        unique_id: "amount_crashing_home"
        unit_of_measurement: "crashers"
        state: >-
            {% set ns = namespace(crashers = 0) %}
            {% for person in states.person %}
            {% if "crashers" in person.entity_id | labels() and person.state == "home" %}
              {% set ns.crashers = ns.crashers + 1 %}
            {% endif %}
            {% endfor %}
            {{ ns.crashers }}

      - name: "amount residents at home"
        unique_id: "amount_residents_home"
        unit_of_measurement: "residents"
        state: >-
            {% set ns = namespace(residents = 0) %}
            {% for person in states.person %}
            {% if "residents" in person.entity_id | labels() and person.state == "home" %}
              {% set ns.residents = ns.residents + 1 %}
            {% endif %}
            {% endfor %}
            {{ ns.residents }}
        attributes:
          rooms: >
            {% set info = [
              ('watch', 'sensor.bermuda_maxi_watch_bps_zone', 'sensor.bermuda_maxi_watch_area'),
              ('bracelet', 'sensor.bermuda_maxi_ankle_beacon_bps_zone', 'sensor.bermuda_maxi_ankle_beacon_bps_zone'),
              ('phone', 'device_tracker.espresense_phone_maxi', 'sensor.bermuda_maxi_phone_area'),
            ] %}
            {% set gpslocation = states('device_tracker.phone_maxi') | lower %}
            {% set ns = namespace(rooms=[], results=[]) %}
            {% for name, room, sensor in info if ( name != 'watch' or (name == 'watch' and is_state('binary_sensor.maxi_watch_on_body_sensor', 'on') and is_state('sensor.maxi_watch_charger_type', 'none') )) and (name != 'phone' or (name == 'phone' and is_state('sensor.phone_maxi_charger_type', 'none') and is_state('binary_sensor.phone_maxi_interactive', 'on') )) %}
              {% set room, sensor = (room, sensor) | map('states') | map('lower') | list %}
                {% if room != 'not_home' and room != 'main floor' and room  != 'unknown' and room  != 'home' and room!= 'unavailable' %}
                  {% set ns.rooms = ns.rooms + [(name, room)] %}
                {% endif %}
                {% if sensor != 'not_home' and sensor != 'main floor' and sensor  != 'unknown' and sensor  != 'home' and sensor != 'unavailable' %}
                  {% set ns.rooms = ns.rooms + [(name, sensor)] %}
                {% endif %}
            {% endfor %}
            {% if is_state('binary_sensor.maxi_alone', 'on') %}
              {% set ns.rooms = ns.rooms + [('last',states('sensor.last_active_room')|lower)] %}
            {% endif %}
            {% for room, items in ns.rooms | groupby(attribute='1') %}
               {% set ns.results = ns.results + [(room, items | map(attribute='0') | list )] %}
            {% endfor %}
            {%- for room, devices in ns.results %}
              '{{ room }}': {{ devices | tojson | replace('[','(') | replace(']',')') }}{{ ',' if not loop.last }}
            {%- endfor %}

  # ─── Average House Humidity ───
  # Computes the mean humidity across all room temperature/humidity sensors.
  # Used by the shower detection binary sensor to identify humidity spikes.
  - trigger:
      - trigger: state
        entity_id:
          - sensor.sensor_outside_temperature_humidity
          - sensor.sensor_stove_temperature_humidity
          - sensor.sensor_closet_temperature_humidity
          - sensor.sensor_bedroom_temperature_humidity
          - sensor.sensor_workshop_temperature_humidity
          - sensor.sensor_hotbox_down_temperature_humidity
          - sensor.sensor_bathroom_temperature_humidity
          - sensor.sensor_lounge_temperature_humidity
          - sensor.sensor_server_temperature_humidity
          - sensor.sensor_kitchen_temperature_humidity
          - sensor.sensor_salon_temperature_humidity
      - trigger: homeassistant
        event: start
    sensor:
      - name: "Average House Humidity"
        unique_id: "average_house_humidity"
        unit_of_measurement: '%'
        state: >-
            {{ expand(
              'sensor.sensor_outside_temperature_humidity',
              'sensor.sensor_stove_temperature_humidity',
              'sensor.sensor_closet_temperature_humidity',
              'sensor.sensor_bedroom_temperature_humidity',
              'sensor.sensor_workshop_temperature_humidity',
              'sensor.sensor_hotbox_down_temperature_humidity',
              'sensor.sensor_bathroom_temperature_humidity',
              'sensor.sensor_lounge_temperature_humidity',
              'sensor.sensor_server_temperature_humidity',
              'sensor.sensor_kitchen_temperature_humidity',
              'sensor.sensor_salon_temperature_humidity')
              | rejectattr('state', 'in', ['unavailable', 'unknown'])
              | map(attribute='state')
              | map('float', 0)
              | list
              | average(default=0)
              | round(2) }}

  # ─── Active Media Playback Tracking ───
  # Tracks which rooms have active Chromecast or speaker playback.
  # Provides muted/unmuted room lists as attributes for volume-aware automations.
  - trigger:
      - trigger: state
        entity_id:
          - media_player.universal_bedroom_chromecast
          - media_player.universal_salon_chromecast
          - media_player.universal_kitchen_chromecast
          - media_player.universal_hotbox_top_chromecast
          - media_player.universal_patio_chromecast
          - media_player.universal_workshop_chromecast
          - media_player.universal_tablet_myriam_s8
          - media_player.mass_bathroom_vpe_speaker
          - media_player.mass_bedroom_aux2_speaker
          - media_player.mass_closet_vpe_speaker
          - media_player.mass_lounge_wiim_speaker
          - media_player.mass_kitchen_wiim_speaker
          - media_player.mass_hallway_wiim_speaker
          - media_player.mass_salon_wiim_speaker
          - media_player.mass_workshop_wiim_speaker
          - media_player.mass_patio_wiim_speaker
          - media_player.mass_hotbox_wiim_speaker
          - media_player.mass_bedroom_vpe_speaker
      - trigger: homeassistant
        event: start
    sensor:
      # Lists room names where a universal Chromecast media player is currently playing.
      # Also provides muted_rooms/unmuted_rooms attributes for volume-aware automations.
      # Cast app_ids 84912283 and A078F6B0 are the Home Assistant dashboard receivers:
      # a device showing a dashboard reports 'playing' permanently (the kitchen Google
      # Hub does, 24/7) but is not media, so those are rejected from all three lists.
      - name: "active_chromecast_rooms"
        unique_id: "active_chromecast_rooms"
        state: >-
            {% set playing = expand(
              'media_player.universal_bedroom_chromecast',
              'media_player.universal_salon_chromecast',
              'media_player.universal_kitchen_chromecast',
              'media_player.universal_hotbox_top_chromecast',
              'media_player.universal_patio_chromecast',
              'media_player.universal_workshop_chromecast')
              | selectattr('state', 'eq', 'playing')
              | rejectattr('attributes.app_id', 'in', ['84912283', 'A078F6B0']) %}
            {{ playing
              | map(attribute='entity_id')
              | map('regex_replace', 'media_player.universal_', '')
              | map('regex_replace', '_chromecast', '')
              | list }}
        attributes:
          muted_rooms: >-
              {% set playing = expand(
                'media_player.universal_bedroom_chromecast',
                'media_player.universal_salon_chromecast',
                'media_player.universal_kitchen_chromecast',
                'media_player.universal_hotbox_top_chromecast',
                'media_player.universal_patio_chromecast',
                'media_player.universal_workshop_chromecast')
                | selectattr('state', 'eq', 'playing')
                | rejectattr('attributes.app_id', 'in', ['84912283', 'A078F6B0'])
                | selectattr('attributes.is_volume_muted', 'eq', true) %}
              {{ playing
                | map(attribute='entity_id')
                | map('regex_replace', 'media_player.universal_', '')
                | map('regex_replace', '_chromecast', '')
                | list }}
          unmuted_rooms: >-
              {% set playing = expand(
                'media_player.universal_bedroom_chromecast',
                'media_player.universal_salon_chromecast',
                'media_player.universal_kitchen_chromecast',
                'media_player.universal_hotbox_top_chromecast',
                'media_player.universal_patio_chromecast',
                'media_player.universal_workshop_chromecast')
                | selectattr('state', 'eq', 'playing')
                | rejectattr('attributes.app_id', 'in', ['84912283', 'A078F6B0'])
                | selectattr('attributes.is_volume_muted', 'eq', false) %}
              {{ playing
                | map(attribute='entity_id')
                | map('regex_replace', 'media_player.universal_', '')
                | map('regex_replace', '_chromecast', '')
                | list }}

      # Same as active_chromecast_rooms but for Music Assistant WiiM/VPE speakers.
      # Provides muted_rooms/unmuted_rooms attributes for speaker-specific volume control.
      - name: "active_speakers_rooms"
        unique_id: "active_speakers_rooms"
        state: >-
            {% set playing = expand(
              'media_player.mass_bathroom_vpe_speaker',
              'media_player.mass_bedroom_aux2_speaker',
              'media_player.mass_closet_vpe_speaker',
              'media_player.mass_lounge_wiim_speaker',
              'media_player.mass_kitchen_wiim_speaker',
              'media_player.mass_hallway_wiim_speaker',
              'media_player.mass_salon_wiim_speaker',
              'media_player.mass_workshop_wiim_speaker',
              'media_player.mass_patio_wiim_speaker',
              'media_player.mass_hotbox_wiim_speaker',
              'media_player.mass_bedroom_vpe_speaker')
              | selectattr('state', 'eq', 'playing') %}
            {{ playing
              | map(attribute='entity_id')
              | map('regex_replace', 'media_player.mass_', '')
              | map('regex_replace', '_wiim_speaker', '')
              | map('regex_replace', '_vpe_speaker', '')
              | map('regex_replace', '_aux2_speaker', '')
              | unique | list }}
        attributes:
          muted_rooms: >-
              {% set playing = expand(
                'media_player.mass_bathroom_vpe_speaker',
                'media_player.mass_bedroom_aux2_speaker',
                'media_player.mass_closet_vpe_speaker',
                'media_player.mass_lounge_wiim_speaker',
                'media_player.mass_kitchen_wiim_speaker',
                'media_player.mass_hallway_wiim_speaker',
                'media_player.mass_salon_wiim_speaker',
                'media_player.mass_workshop_wiim_speaker',
                'media_player.mass_patio_wiim_speaker',
                'media_player.mass_hotbox_wiim_speaker',
                'media_player.mass_bedroom_vpe_speaker')
                | selectattr('state', 'eq', 'playing')
                | selectattr('attributes.is_volume_muted', 'eq', true) %}
              {{ playing
                | map(attribute='entity_id')
                | map('regex_replace', 'media_player.mass_', '')
                | map('regex_replace', '_wiim_speaker', '')
                | map('regex_replace', '_vpe_speaker', '')
                | map('regex_replace', '_aux2_speaker', '')
                | unique | list }}
          unmuted_rooms: >-
              {% set playing = expand(
                'media_player.mass_bathroom_vpe_speaker',
                'media_player.mass_bedroom_aux2_speaker',
                'media_player.mass_closet_vpe_speaker',
                'media_player.mass_lounge_wiim_speaker',
                'media_player.mass_kitchen_wiim_speaker',
                'media_player.mass_hallway_wiim_speaker',
                'media_player.mass_salon_wiim_speaker',
                'media_player.mass_workshop_wiim_speaker',
                'media_player.mass_patio_wiim_speaker',
                'media_player.mass_hotbox_wiim_speaker',
                'media_player.mass_bedroom_vpe_speaker')
                | selectattr('state', 'eq', 'playing')
                | selectattr('attributes.is_volume_muted', 'eq', false) %}
              {{ playing
                | map(attribute='entity_id')
                | map('regex_replace', 'media_player.mass_', '')
                | map('regex_replace', '_wiim_speaker', '')
                | map('regex_replace', '_vpe_speaker', '')
                | map('regex_replace', '_aux2_speaker', '')
                | unique | list }}

      # Master "is anything playing?" sensor. Combines both speakers AND chromecasts.
      # State is true/false; attributes 'speakers' and 'chromecasts' list room names.
      # Used by the activity detection sensor to determine if someone is watching/listening.
      - name: "active_media_playback"
        unique_id: "active_media_playback"
        state: >-
            {% set speakers = expand(
              'media_player.mass_bathroom_vpe_speaker',
              'media_player.mass_bedroom_aux2_speaker',
              'media_player.mass_closet_vpe_speaker',
              'media_player.mass_lounge_wiim_speaker',
              'media_player.mass_kitchen_wiim_speaker',
              'media_player.mass_hallway_wiim_speaker',
              'media_player.mass_salon_wiim_speaker',
              'media_player.mass_workshop_wiim_speaker',
              'media_player.mass_patio_wiim_speaker',
              'media_player.mass_hotbox_wiim_speaker',
              'media_player.mass_bedroom_vpe_speaker')
              | selectattr('state', 'eq', 'playing')
              | map(attribute='entity_id')
              | map('regex_replace', 'media_player.mass_', '')
              | map('regex_replace', '_wiim_speaker', '')
              | map('regex_replace', '_vpe_speaker', '')
              | map('regex_replace', '_aux2_speaker', '')
              | list %}
            {% set chromecasts = expand(
              'media_player.universal_bedroom_chromecast',
              'media_player.universal_salon_chromecast',
              'media_player.universal_kitchen_chromecast',
              'media_player.universal_hotbox_top_chromecast',
              'media_player.universal_patio_chromecast',
              'media_player.universal_workshop_chromecast')
              | selectattr('state', 'eq', 'playing')
              | rejectattr('attributes.app_id', 'in', ['84912283', 'A078F6B0'])
              | map(attribute='entity_id')
              | map('regex_replace', 'media_player.universal_', '')
              | map('regex_replace', '_chromecast', '')
              | map('regex_replace', '_top', '')
              | map('regex_replace', '_bottom', '')
              | list %}
            {{ (speakers + chromecasts) | unique | list | length > 0 }}
        attributes:
          speakers: >-
              {{ expand(
                'media_player.mass_bathroom_vpe_speaker',
                'media_player.mass_bedroom_aux2_speaker',
                'media_player.mass_closet_vpe_speaker',
                'media_player.mass_lounge_wiim_speaker',
                'media_player.mass_kitchen_wiim_speaker',
                'media_player.mass_hallway_wiim_speaker',
                'media_player.mass_salon_wiim_speaker',
                'media_player.mass_workshop_wiim_speaker',
                'media_player.mass_patio_wiim_speaker',
                'media_player.mass_hotbox_wiim_speaker',
                'media_player.mass_bedroom_vpe_speaker')
                | selectattr('state', 'eq', 'playing')
                | map(attribute='entity_id')
                | map('regex_replace', 'media_player.mass_', '')
                | map('regex_replace', '_wiim_speaker', '')
                | map('regex_replace', '_vpe_speaker', '')
                | map('regex_replace', '_aux2_speaker', '')
                | unique | list }}
          chromecasts: >-
              {{ expand(
                'media_player.universal_bedroom_chromecast',
                'media_player.universal_salon_chromecast',
                'media_player.universal_kitchen_chromecast',
                'media_player.universal_hotbox_top_chromecast',
                'media_player.universal_patio_chromecast',
                'media_player.universal_workshop_chromecast')
                | selectattr('state', 'eq', 'playing')
                | rejectattr('attributes.app_id', 'in', ['84912283', 'A078F6B0'])
                | map(attribute='entity_id')
                | map('regex_replace', 'media_player.universal_', '')
                | map('regex_replace', '_chromecast', '')
                | map('regex_replace', '_top', '')
                | map('regex_replace', '_bottom', '')
                | list }}

  # ─── Motion & Last Active Room Tracking ───
  # Aggregates per-room motion group sensors into a list of active rooms
  # and determines the most recently active room by last_changed timestamp.
  - trigger:
      - trigger: state
        entity_id:
          - binary_sensor.group_bedroom_motion_occupancy
          - binary_sensor.group_closet_motion_occupancy
          - binary_sensor.group_lounge_motion_occupancy
          - binary_sensor.group_hallway_motion_occupancy
          - binary_sensor.group_kitchen_motion_occupancy
          - binary_sensor.group_entrance_motion_occupancy
          - binary_sensor.group_workshop_motion_occupancy
          - binary_sensor.group_workstation_motion_occupancy
          - binary_sensor.group_salon_motion_occupancy
          - binary_sensor.group_hotbox_motion_occupancy
          - binary_sensor.group_patio_motion_occupancy
          - binary_sensor.group_server_motion_occupancy
          - binary_sensor.group_bathroom_motion_occupancy
      - trigger: homeassistant
        event: start
    sensor:
      # Lists rooms with currently active motion sensors (using area_name lookup).
      # Iterates over the security occupancy sensor group and returns unique area names.
      - name: "active_motion_rooms"
        unique_id: "active_motion_rooms"
        state: >-
            {% set ns = namespace(mediaactiverooms = []) %}
            {% for motion_sensor in expand('binary_sensor.home_occupancy') -%}
              {%- if motion_sensor.state == 'on' -%}
                {% set currentroomname = area_name(motion_sensor.entity_id) %}
                {%- set ns.mediaactiverooms = ns.mediaactiverooms + [currentroomname] -%}
              {%- endif -%}
            {% endfor %}
            {{ ns.mediaactiverooms | unique | list }}
      # Determines the most recently active room by sorting motion group sensors
      # by last_changed timestamp. Falls back to current state if no motion is active.
      # Used by sleep detection and activity sensors as a tie-breaker for room location.
      - name: "last active room"
        unique_id: last_active_room
        state: >-
            {% set groups = [
              'binary_sensor.group_bedroom_motion_occupancy',
              'binary_sensor.group_closet_motion_occupancy',
              'binary_sensor.group_lounge_motion_occupancy',
              'binary_sensor.group_hallway_motion_occupancy',
              'binary_sensor.group_kitchen_motion_occupancy',
              'binary_sensor.group_entrance_motion_occupancy',
              'binary_sensor.group_workshop_motion_occupancy',
              'binary_sensor.group_workstation_motion_occupancy',
              'binary_sensor.group_salon_motion_occupancy',
              'binary_sensor.group_patio_motion_occupancy',
              'binary_sensor.group_server_motion_occupancy',
              'binary_sensor.group_bathroom_motion_occupancy'
            ] %}
            {% set active = expand(groups)
              | selectattr('state', 'eq', 'on')
              | sort(reverse=true, attribute='last_changed')
              | map(attribute='entity_id')
              | first | default(none) %}
            {{ area_name(active) | lower if active else this.state | default('unknown') }}

  # ─── Myriam Indoor Location (Petro Algorithm) ───
  # Same voting-based location algorithm as Maxi's, but using Myriam's phone tracker.
  - trigger:
      - trigger: state
        entity_id:
          - device_tracker.myriam_s24_espresense
          - sensor.bermuda_myriam_phone_area
          - device_tracker.phone_myriam_gps
          - binary_sensor.myriam_alone
          - sensor.last_active_room
    sensor:
      - name: "Myriam Location by petro"
        unique_id: myriam_location_by_petro
        state: >-
            {% set info = [
              ('phone', 'device_tracker.myriam_s24_espresense', 'sensor.bermuda_myriam_phone_area'),
            ] %}
            {% set gpslocation = states('device_tracker.phone_myriam_gps') | lower %}
            {% set ns = namespace(rooms=[], results=[]) %}
            {% for name, room, sensor in info %}
              {% set room, sensor = (room, sensor) | map('states') | map('lower') | list %}
                {% if room != 'not_home' and room != 'main floor' and room  != 'unknown' and room  != 'home' and room!= 'unavailable' %}
                  {% set ns.rooms = ns.rooms + [(name, room.split('_').0)] %}
                {% endif %}
                {% if sensor != 'not_home' and sensor != 'main floor' and sensor  != 'unknown' and sensor  != 'home' and sensor != 'unavailable' %}
                  {% set ns.rooms = ns.rooms + [(name, sensor.split('_').0)] %}
                {% endif %}
            {% endfor %}
            {% if is_state('binary_sensor.myriam_alone', 'on') %}
              {% set ns.rooms = ns.rooms + [('last',states('sensor.last_active_room')|lower)] %}
            {% endif %}
            {% for room, items in ns.rooms | groupby(attribute='1') %}
               {% set ns.results = ns.results + [(room, items | map(attribute='0') | list | length)] %}
            {% endfor %}
            {% if is_state('device_tracker.phone_myriam_gps', 'home') %}
              {{ ns.results | sort(attribute='1', reverse=True) | map(attribute='0') | first | default('unknown') }}
            {% elif gpslocation != "home" and gpslocation != "away" %}
              At {{gpslocation}}
            {% else %}
              not_home
            {% endif %}

  # ─── Maxi Pacing (sustained) ───
  # Gate for the "Pacing in the Apartment" rule in Maxi current Activity V3.
  # The raw transition count is spiky, so the threshold alone was too sensitive:
  # a brief flurry of room changes tripped it. delay_on requires the condition to
  # hold for 4 CONTINUOUS minutes, and restarts from zero the moment the count
  # dips below 7 - that strictness is the point.
  # The since_boot check lives here too, so the 4-minute clock cannot even start
  # during the BLE re-acquisition storm that follows a restart.
  - binary_sensor:
      - name: "Maxi Pacing"
        unique_id: maxi_pacing
        icon: mdi:shoe-print
        delay_on:
          minutes: 4
        state: >-
          {% set boot = as_datetime(states('sensor.uptime')) %}
          {% set since_boot = (now() - boot).total_seconds() if boot is not none else 99999 %}
          {{ states('sensor.maxi_room_transitions') | int(0) >= 7 and since_boot > 600 }}

  # ─── Maxi Room Transitions (rolling 5-minute buffer) ───
  # Feeds the "Pacing in the Apartment" rule in Maxi current Activity V3.
  # Kept as its own sensor so the buffer only advances on a real room change,
  # rather than on every re-evaluation of the activity sensor.
  # State      = number of DISTINCT rooms entered in the last 5 minutes.
  # Attributes = buffer, a list of [room, unix_ts] capped at 20 entries.
  - trigger:
      # No hold time / dwell gate here on purpose. petro_v2 is already the
      # filtered source: it votes across watch + ankle beacon + phone and
      # cross-references sensor.active_motion_rooms, restricting candidates to
      # rooms with live motion. Adding a second filter on top would suppress
      # exactly the fast movement pacing is made of. The Pacing threshold in
      # activity.jinja is instead calibrated against 24 h of real history.
      - trigger: state
        entity_id:
          - sensor.maxi_location_by_petro_v2
      - trigger: time_pattern
        minutes: "/1"
      - trigger: homeassistant
        event: start
    sensor:
      - name: "Maxi Room Transitions"
        unique_id: maxi_room_transitions
        unit_of_measurement: "rooms"
        state: >-
          {% set prev = (this.attributes.get('buffer', []) if this is defined and this.attributes is defined else []) %}
          {% set raw = states('sensor.maxi_location_by_petro_v2') | lower %}
          {% set room = raw | replace('_top','') | replace('_bottom','') | replace('_down','')
                            | replace(' top','') | replace(' bottom','') | replace(' down','') | trim %}
          {% set ts = now().timestamp() | round(0) | int %}
          {% set ns = namespace(buf=[]) %}
          {% for e in prev %}
            {% if (e[1] | int(0)) > (ts - 300) %}{% set ns.buf = ns.buf + [e] %}{% endif %}
          {% endfor %}
          {% if room not in ['unknown','unavailable','none','','not_home'] and not room.startswith('at ') %}
            {% if ns.buf | length == 0 or ns.buf[-1][0] != room %}
              {% set ns.buf = ns.buf + [[room, ts]] %}
            {% endif %}
          {% endif %}
          {% set ns.buf = ns.buf[-20:] %}
          {% set ns2 = namespace(rooms=[]) %}
          {% for e in ns.buf %}{% set ns2.rooms = ns2.rooms + [e[0]] %}{% endfor %}
          {{ ns2.rooms | unique | list | count }}
        attributes:
          buffer: >-
            {% set prev = (this.attributes.get('buffer', []) if this is defined and this.attributes is defined else []) %}
            {% set raw = states('sensor.maxi_location_by_petro_v2') | lower %}
            {% set room = raw | replace('_top','') | replace('_bottom','') | replace('_down','')
                              | replace(' top','') | replace(' bottom','') | replace(' down','') | trim %}
            {% set ts = now().timestamp() | round(0) | int %}
            {% set ns = namespace(buf=[]) %}
            {% for e in prev %}
              {% if (e[1] | int(0)) > (ts - 300) %}{% set ns.buf = ns.buf + [e] %}{% endif %}
            {% endfor %}
            {% if room not in ['unknown','unavailable','none','','not_home'] and not room.startswith('at ') %}
              {% if ns.buf | length == 0 or ns.buf[-1][0] != room %}
                {% set ns.buf = ns.buf + [[room, ts]] %}
              {% endif %}
            {% endif %}
            {{ ns.buf[-20:] }}

  # ─── Maxi Activity Detection (V3) ───
  # All rules live in custom_templates/activity.jinja as a single macro that
  # returns JSON, so the state and every attribute come from ONE evaluation of
  # the ladder. That removes V2's triplicated alone/partners/friends cascades:
  # social context is now the `company` attribute, not part of the state.
  #
  # Scoring model: every rule appends a candidate; highest score wins; ties fall
  # back to insertion order. See the `candidates` attribute to debug a ranking.
  #
  # NOTE: after editing activity.jinja run
  #       Developer Tools -> Actions -> "Reload custom Jinja2 templates"
  - trigger:
      - trigger: state
        entity_id:
          # presence & sleep
          - person.maximiliano
          - sensor.is_maxi_asleep
          - sensor.maxi_location_by_petro_v2
          - binary_sensor.maxi_alone
          # away
          - sensor.phone_maxi_detected_activity
          - binary_sensor.phone_maxi_android_auto
          - sensor.phone_maxi_geocoded_location
          # bed - only occupancy is read now that Intimacy is gone; the playing /
          # bed_moving / left+right side sensors were dropped with it
          - binary_sensor.bedroom_bed_weight_sensor_bed_occupied
          - binary_sensor.maxi_cpap_running_hysteresis
          # bathroom / rooms
          - binary_sensor.shower_in_usage
          - binary_sensor.sensor_server_door_contact
          - binary_sensor.group_server_motion_occupancy
          # sesh
          - binary_sensor.active_smoking_in_the_salon
          - input_boolean.dab_timer
          # kitchen
          - binary_sensor.sensor_fridge_door_contact
          - binary_sensor.kitchen_radar_occupancy_occupancy
          - binary_sensor.group_kitchen_motion_occupancy
          - sensor.sensor_stove_temperature_temperature
          - sensor.sensor_stove_temperature_humidity
          - sensor.plug_kitchen_airfryer_electric_consumption_w
          - sensor.plug_kitchen_toaster_electric_consumption_w
          - sensor.plug_kitchen_washer_electric_consumption_w
          - sensor.dryer_current_status
          - input_boolean.cooking_mode
          - timer.cooking
          - binary_sensor.lounge_couch_zone_1_occcupancy
          - binary_sensor.lounge_couch_zone_2_occcupancy
          # desk / discord
          - sensor.is_computer_active
          - binary_sensor.hallway_radar_occupancy_zone_2_occupancy
          - binary_sensor.computer_maxi_pc_computer_maxi_pc_microphoneactive
          - binary_sensor.desktop_maxi_webcamactive
          - binary_sensor.computer_maxi_pc_computer_maxi_pc_webcamactive
          - sensor.discord_user_156149779443875840_voice_channel
          - sensor.discord_user_156149779443875840_voice_self_stream
          - sensor.discord_user_156149779443875840_streaming
          - sensor.maxi1134_8202
          - sensor.steam_maxi
          # phone
          - binary_sensor.maxi_is_talking
          - sensor.phone_maxi_phone_state
          - binary_sensor.phone_maxi_device_locked
          - binary_sensor.phone_maxi_interactive
          # media
          - sensor.active_media_playback
          - sensor.hotbox_roku_active_app
          # social
          - sensor.amount_friends_home
          - sensor.amount_partners_home
          - input_boolean.party_mode
          - input_boolean.kink_party
          - input_select.vibe_arc_phase
          # misc
          - vacuum.roborock_qrevo_curv_series
          - sensor.maxi_room_transitions
          - binary_sensor.maxi_pacing
      # fires exactly when a room has been held for 60 s, so the hallway-desk
      # dwell rule flips on time instead of waiting for the next minute tick
      - trigger: state
        entity_id:
          - sensor.maxi_location_by_petro_v2
        for: "00:01:00"
      # re-evaluate time-decaying rules (fridge 60 s, cooking 45 min, pacing)
      - trigger: time_pattern
        minutes: "/1"
      - trigger: homeassistant
        event: start
    sensor:
      - name: "Maxi current Activity V3"
        unique_id: maxi_current_activity_v3
        state: >-
          {% from 'activity.jinja' import maxi_activity_v3 %}
          {{ (maxi_activity_v3() | trim | from_json).state }}
        icon: >-
          {% from 'activity.jinja' import maxi_activity_v3 %}
          {% set a = (maxi_activity_v3() | trim | from_json).state %}
          {% set icons = {
            'Sleeping':'mdi:sleep', 'Driving':'mdi:car', 'Walking':'mdi:walk',
            'Adventuring':'mdi:map-marker-path',
            'Kinking':'mdi:handcuffs', 'Playing':'mdi:heart-multiple',
            'Showering':'mdi:shower-head', 'Server Maintenance':'mdi:server',
            'Sesh':'mdi:cannabis', 'Raiding the Fridge':'mdi:fridge',
            'On a Video Call':'mdi:video', 'Streaming':'mdi:broadcast',
            'Gaming with Friends':'mdi:account-group', 'Gaming':'mdi:controller',
            'On a Voice Call':'mdi:headset', 'On the Phone':'mdi:phone-in-talk',
            'Watching a Series':'mdi:television-classic', 'Watching a Movie':'mdi:movie-open',
            'Watching TV':'mdi:television', 'Listening to Music':'mdi:music',
            'Cooking':'mdi:chef-hat', 'Eating':'mdi:silverware-fork-knife',
            'On the Patio':'mdi:flower', 'In Bed, Awake':'mdi:cellphone-text',
            'Using the Computer':'mdi:desktop-tower-monitor',
            'Pacing in the Apartment':'mdi:shoe-print', 'Using Phone':'mdi:cellphone',
            'Partying':'mdi:party-popper', 'Hosting':'mdi:account-multiple',
            'Cleaning':'mdi:robot-vacuum', 'Chilling':'mdi:sofa' } %}
          {{ icons.get(a, 'mdi:television-ambient-light' if a.startswith('Watching')
                          else ('mdi:map-marker' if a.startswith('At ') else 'mdi:help-circle-outline')) }}
        attributes:
          detail: >-
            {% from 'activity.jinja' import maxi_activity_v3 %}
            {{ (maxi_activity_v3() | trim | from_json).detail }}
          room: >-
            {% from 'activity.jinja' import maxi_activity_v3 %}
            {{ (maxi_activity_v3() | trim | from_json).room }}
          company: >-
            {% from 'activity.jinja' import maxi_activity_v3 %}
            {{ (maxi_activity_v3() | trim | from_json).company }}
          score: >-
            {% from 'activity.jinja' import maxi_activity_v3 %}
            {{ (maxi_activity_v3() | trim | from_json).score }}
          music: >-
            {# always exposed, even though Listening to Music almost never wins #}
            {% from 'activity.jinja' import maxi_activity_v3 %}
            {{ (maxi_activity_v3() | trim | from_json).music }}
          category: >-
            {# stable bucket (~9 values) for history_stats duration tracking #}
            {% from 'activity.jinja' import maxi_activity_v3 %}
            {{ (maxi_activity_v3() | trim | from_json).category }}
          candidates: >-
            {% from 'activity.jinja' import maxi_activity_v3 %}
            {{ (maxi_activity_v3() | trim | from_json).candidates
               | map(attribute='n') | list }}
          candidates_scored: >-
            {% from 'activity.jinja' import maxi_activity_v3 %}
            {{ (maxi_activity_v3() | trim | from_json).candidates }}
          vacuum: >-
            {{ states('vacuum.roborock_qrevo_curv_series') }} /
            {{ states('sensor.roborock_qrevo_curv_series_current_room') }}
