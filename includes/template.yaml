      # Priority order changes based on whether Maxi is alone, with partners, or with friends.
      - name: "Maxi current Activity V2"
        unique_id: maxi_current_activity_v2
        state: >-  
            {% set ns = namespace( activityname="unsure", mediaactiverooms=[],lasttvactiveroom = states("sensor.last_active_room"), active_sleepers_amount=0, allowed_ids=[],active_sleeper_rooms=[], motion_sensors=[], room = states('sensor.maxi_location'), active_motion_sensors = [] ) %}  {# create a namespace object to store variables #}
