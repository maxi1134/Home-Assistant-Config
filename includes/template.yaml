            {% set kink_mode = states("input_boolean.kink_party") %}
            {% set phone_in_use = states('binary_sensor.phone_maxi_device_locked') == 'off' %}
            {% set cooking_mode = states("input_boolean.cooking_mode") %}
            {% set partnershome = states("sensor.amount_partners_home") | int(0)  %}
            {% set friendshome = states("sensor.amount_friends_home") | int(0)  %} {# Set friendshome to the amount of people #} 
            {% set totalpeoplehome = states("sensor.total_amount_people_home") | int(0)   %}
            {% set crashershome = states("sensor.amount_crashing_home") | int(0)   %}{# Set peoplehome to the amount of people #}
            {% set ns.active_sleepers_amount = states("sensor.active_sleeper_amount") | int(0) %}
            {% set is_maxi_sleeping = states("sensor.is_maxi_asleep") %}
            {% set maxi_current_game = state_attr('sensor.maxi1134_8202', 'game') or state_attr('sensor.steam_maxi', 'game') or 'idle' %}
            {# 'or []' is required: when sensor.active_media_playback is unavailable these
               attributes are None, and both '| length' and 'in' raise TypeError on None. #}
            {% set ns.active_chromecasts_room = state_attr("sensor.active_media_playback", "chromecasts") or [] %} 
            {% set ns.active_speakers_room = state_attr('sensor.active_media_playback', 'speakers') or [] %}   
            {# code down here, variables up there #}
            {% if is_maxi_sleeping  == "asleep" %}  {# if the maxi_alone sensor is on, indicating there is only maxi present #}
              {%set ns.activityname = "Sleeping"%}
            {% elif is_maxi_home == false %}
              {%set ns.activityname = "Adventuring"%}
            {% elif is_maxi_alone == "on" %}
              {% if is_computer_active  == 'true' and room == "salon" %}
                  {% if maxi_current_game != "idle" %}
                    {%set ns.activityname = "Gaming"%}
                  {% else %}                    
                    {%set ns.activityname = "Using the Computer"%}
                  {% endif %}              
              {% elif ns.active_chromecasts_room | length > 0 and room in ns.active_chromecasts_room%}    
                {% set ns.activityname = "Watching TV"  %}                    
              {% elif shower_in_usage == "on" %}                                               
                {% set ns.activityname = "Showering" %}
              {% elif ns.active_speakers_room | length > 0 and room in ns.active_speakers_room%}    
                {% set ns.activityname = "Listening to Music"  %}             
              {% elif cooking_mode == "on" and room == "kitchen" %}                                     
                {% set ns.activityname = "Cooking" %}    
              {% elif phone_in_use == true %}                               
                {% set ns.activityname = "Using Phone" %}        
              {% elif vacuum_cleaning == true %}                               
                {% set ns.activityname = "Cleaning" %}             
              {% endif %}
            {% elif friendshome > 0 %}
              {% if party_mode == "on" %}                                    
                {% set ns.activityname = "Partying" %}   
              {% elif kink_mode == "on" %}                                    
                {% set ns.activityname = "Kinking" %}   
              {% else %}                      
                {% set ns.activityname = "Chilling" %}   
              {% endif %}
            {% elif partnershome > 0 %}
              {% if kink_mode == "on" %}                                    
                {% set ns.activityname = "Playing" %}
              {% elif ns.active_chromecasts_room | length > 0 and room in ns.active_chromecasts_room %}   
                {% set ns.activityname = "Watching TV"  %}
              {% elif is_computer_active  == "true" and room == "salon" %}
                  {% if maxi_current_game != "idle" %}
                    {%set ns.activityname = "Gaming"%}
                  {% else %}                    
                    {%set ns.activityname = "Using the Computer"%}
                  {% endif %}
              {% elif shower_in_usage == "on" and room == "bathroom" %}                                               
                {% set ns.activityname = "Showering" %}
              {% elif ns.active_speakers_room | length > 0 and room in ns.active_speakers_room%}    
                {% set ns.activityname = "Listening to Music"  %}     
              {% elif cooking_mode == "on" and room == "kitchen" %}                                     
                {% set ns.activityname = "Cooking" %}
              {% elif phone_in_use == true %}                               
                {% set ns.activityname = "Using Phone" %}  
              {% elif vacuum_cleaning == true %}                               
                {% set ns.activityname = "Cleaning" %}   
              {% endif %}
            {% else %}            
              {% if is_computer_active  == "true" and room == "salon" %}
                  {% if maxi_current_game != "idle" %}
                    {%set ns.activityname = "Gaming"%}
                  {% else %}                    
                    {%set ns.activityname = "Using the Computer"%}
                  {% endif %}  
              {% elif ns.active_chromecasts_room | length > 0 and room in ns.active_chromecasts_room%}    
                {% set ns.activityname = "Watching TV"  %}     
              {% elif shower_in_usage == "on" and room == "bathroom" %}                                               
