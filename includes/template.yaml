  #############################################################################
  # TRIGGER-BASED TEMPLATES
  # Converted from polling templates to reduce constant domain-wide iterations
  #############################################################################

  # ─── Friends & Hotspot Tracking ───
  # Counts guests by checking which phones are connected to the "Chilling Hotspot" WiFi.
  # Subtracts known partners and crashers to get the friend count.
  - trigger:
      - trigger: state
        entity_id:
          - sensor.chilling_hotspot_client_count
          - device_tracker.phone_maxi
          - device_tracker.phone_lylou
          - device_tracker.phone_myriam_gps
      - trigger: time_pattern
        minutes: "/5"
    sensor:
      - name: "amount friends home"
        unique_id: "amount_friends_home"
        state: >-
            {% set ns = namespace(friends=0) %}
            {% for device_tracker in states.device_tracker | selectattr('state','eq','home') | selectattr('entity_id','search',"phone_") %}
              {% if state_attr(device_tracker.entity_id, "essid") == "Chilling Hotspot" and 'phone' in device_tracker.entity_id %}
                {% set ns.friends = ns.friends + 1 %}
              {% endif %}
            {% endfor %}
            {% set friendshome = [ns.friends | int(0) - states('sensor.amount_partners_home') | int(0) - states('sensor.amount_crashing_home') | int(0), 0] | max %}
            {{ friendshome }}
        unit_of_measurement: "friends"
        attributes:
          friends: >
            {% set ns = namespace(friends=[]) %}
            {% for device_tracker in states.device_tracker | selectattr('state','eq','home') | selectattr('entity_id','search',"phone_") %}
              {% if state_attr(device_tracker.entity_id, "essid") == "Chilling Hotspot" and 'phone' in device_tracker.entity_id %}
                {% set name = device_tracker.entity_id | replace('device_tracker.phone_','') | replace('_',' ') | capitalize %}
                {% set ns.friends = ns.friends + [name] %}
              {% endif %}
            {% endfor %}
            {{ ns.friends }}

      # Lists ALL device_trackers connected to the "Chilling Hotspot" WiFi network.
      # Unlike "amount friends home", this includes partners and crashers too.
      # Useful for debugging which devices are on the guest network.
      - name: "Chilling Hotspot devices"
        unique_id: "which_devices_hotspot"
        state: >-
            {% set ns = namespace(friends=[]) %}
            {% for device_tracker in states.device_tracker | selectattr('state','eq','home') %}
              {% if state_attr(device_tracker.entity_id, "essid") == "Chilling Hotspot" %}
                {% set name = device_tracker.entity_id %}
                {% set ns.friends = ns.friends + [name] %}
              {% endif %}
            {% endfor %}
            {{ ns.friends }}

  # ─── Sleeper Room Tracking ───
  # Tracks which rooms have active "sleeper" flags (input_booleans toggled by
  # automations when a room is detected as having someone sleeping in it).
  - trigger:
      - trigger: state
        entity_id:
          - input_boolean.sleeper_in_bedroom
          - input_boolean.sleeper_in_closet
          - input_boolean.sleeper_in_workshop
          - input_boolean.sleeper_in_patio
          - input_boolean.sleeper_in_hotbox
          - input_boolean.sleeper_in_salon
          - input_boolean.sleeper_in_lounge
      - trigger: homeassistant
        event: start
    sensor:
      # Returns a list of room names (e.g. ['bedroom', 'closet']) where sleeper flags are on
      - name: "active_sleeper_rooms"
        unique_id: "active_sleeper_rooms"
        state: >-
            {% set sleepers = expand('input_boolean.sleeper_in_bedroom', 'input_boolean.sleeper_in_closet', 'input_boolean.sleeper_in_workshop', 'input_boolean.sleeper_in_patio', 'input_boolean.sleeper_in_hotbox', 'input_boolean.sleeper_in_salon', 'input_boolean.sleeper_in_lounge') | selectattr('state','eq','on') | map(attribute='entity_id') | map('replace', 'input_boolean.sleeper_in_', '') | list %}
            {{ sleepers }}

      # Count of active sleeper flags + a 'rooms' attribute mapping index → room name
      - name: "active_sleepers"
        unique_id: "active_sleepers"
        state: >-
            {% set active = expand('input_boolean.sleeper_in_bedroom', 'input_boolean.sleeper_in_closet', 'input_boolean.sleeper_in_workshop', 'input_boolean.sleeper_in_patio', 'input_boolean.sleeper_in_hotbox', 'input_boolean.sleeper_in_salon', 'input_boolean.sleeper_in_lounge') | selectattr('state','eq','on') | list %}
            {{ active | count }}
        attributes:
          rooms: >
            {% set ns = namespace(items=[]) %}
            {% for inp in expand('input_boolean.sleeper_in_bedroom', 'input_boolean.sleeper_in_closet', 'input_boolean.sleeper_in_workshop', 'input_boolean.sleeper_in_patio', 'input_boolean.sleeper_in_hotbox', 'input_boolean.sleeper_in_salon', 'input_boolean.sleeper_in_lounge') | selectattr('state','eq','on') %}
              {% set ns.items = ns.items + [ (loop.index, inp.entity_id | replace('input_boolean.sleeper_in_','') ) ] %}
            {% endfor %}
            {{ dict(ns.items) }}

      # Simple count of how many rooms currently have sleeper flags active
      - name: "active_sleeper_amount"
        unique_id: "active_sleeper_amount"
        state: >-
            {% set active = expand('input_boolean.sleeper_in_bedroom', 'input_boolean.sleeper_in_closet', 'input_boolean.sleeper_in_workshop', 'input_boolean.sleeper_in_patio', 'input_boolean.sleeper_in_hotbox', 'input_boolean.sleeper_in_salon', 'input_boolean.sleeper_in_lounge') | selectattr('state','eq','on') | list %}
            {{ active | count }}

  # ─── Available Rooms Discovery ───
  # Periodically scans all entities to build a list of known area IDs.
  - trigger:
      - trigger: time_pattern
        minutes: "/30"
      - trigger: homeassistant
        event: start
    sensor:
      - name: "Existing Rooms"
        unique_id: "existing_rooms"
        state: >-
          {% set target_floor = 'Main Floor' %}
          {{ floor_areas(target_floor) 

            | map('area_name') 
            | reject('search', 'probe') 
            | list 
          }}

  # ─── Maxi Indoor Location (Petro Algorithm) ───
  # Fuses BLE data from watch, bracelet, and phone with GPS and motion sensors.
  # Uses a voting system: each device reports a room, and the room with the most
  # votes wins. Filters out devices that are charging or not on the body.
  - trigger:
      - trigger: state
        entity_id:
          - device_tracker.phone_maxi
          - binary_sensor.maxi_watch_on_body_sensor
          - sensor.maxi_watch_charger_type
          - sensor.phone_maxi_charger_type
          - binary_sensor.phone_maxi_interactive
          - binary_sensor.maxi_alone
          - sensor.last_active_room
          - sensor.bermuda_maxi_watch_area
          - sensor.bermuda_maxi_watch_bps_zone
          - sensor.bermuda_maxi_ankle_beacon_area
          - sensor.bermuda_maxi_ankle_beacon_bps_zone
          - sensor.bermuda_maxi_phone_area
          - sensor.bermuda_maxi_phone_bps_zone
      # Without this the sensor sits at 'unknown' after a restart until the next
      # BLE update arrives, which starves every downstream room-based sensor.
      - trigger: homeassistant
        event: start
    sensor:
      - name: "Maxi Location by petro v2"
        unique_id: maxi_location_by_petro_v2
        state: >-
            {% set info = [
              ('watch', 'sensor.bermuda_maxi_watch_area', 'sensor.bermuda_maxi_watch_bps_zone'),
              ('bracelet', 'sensor.bermuda_maxi_ankle_beacon_area', 'sensor.bermuda_maxi_ankle_beacon_bps_zone'),
              ('phone', 'sensor.bermuda_maxi_phone_area', 'sensor.bermuda_maxi_phone_bps_zone'),
              ] %}
              {% set invalid = ['not_home', 'away', 'main floor', 'unknown', 'home', 'unavailable', 'none', ''] %}
              {% set occupied = states('sensor.active_motion_rooms')[1:-1].split(',')
                                  | map('replace', "'", '') | map('trim') | map('lower') | list %}
              {% set gpslocation = states('device_tracker.phone_maxi') | lower %}
              {% set raw_current_room = this.state | lower %}
              {% set current_room = raw_current_room if raw_current_room not in invalid and not raw_current_room.startswith('at ') else '' %}
              {% set phone_bps_value = states('sensor.bermuda_maxi_phone_bps_zone') | lower %}
              {% set phone_bps_home = phone_bps_value not in invalid %}
              {% set ns = namespace(votes=[], results=[]) %}
              {% for name, room_entity, zone_entity in info if (name == 'watch' and is_state('binary_sensor.maxi_watch_on_body_sensor', 'on') and is_state('sensor.maxi_watch_charger_type', 'none')) or
                                                              (name == 'phone' and is_state('sensor.phone_maxi_charger_type', 'none') and is_state('binary_sensor.phone_maxi_interactive', 'on')) or
                                                              (name == 'bracelet')
              %}
                {% set area_value = states(room_entity) | lower %}
                {% set bps_value = states(zone_entity) | lower %}
                {% set area_valid = area_value not in invalid %}
                {% set bps_valid = bps_value not in invalid %}
                {% set area_room = area_value.split('_').0 if area_valid else '' %}
                {% set bps_room = bps_value.split('_').0 if bps_valid else '' %}
                {% set chosen_room = '' %}
                {% set chosen_score = 0 %}
                {% set chosen_ts = 0 %}
                {% if area_valid and bps_valid %}
                  {% if area_room == bps_room %}
                    {% set chosen_room = bps_room %}
                    {% set chosen_score = 3 %}
                    {% set chosen_ts = [as_timestamp(states[room_entity].last_changed, 0), as_timestamp(states[zone_entity].last_changed, 0)] | max %}
                  {% else %}
                    {# area and bps disagree: trust the trilaterated zone over the
                       incumbent state. Nearest-scanner area loses at room boundaries,
                       where a probe on the far side of a wall can be the closest one. #}
                    {% set chosen_room = bps_room %}
                    {% set chosen_score = 2 %}
                    {% set chosen_ts = as_timestamp(states[zone_entity].last_changed, 0) %}
                  {% endif %}
                {% elif bps_valid %}
                  {% set chosen_room = bps_room %}
                  {% set chosen_score = 2 %}
                  {% set chosen_ts = as_timestamp(states[zone_entity].last_changed, 0) %}
                {% elif area_valid %}
                  {% if current_room == '' or area_room == current_room %}
                    {% set chosen_room = area_room %}
                    {% set chosen_score = 1 %}
                    {% set chosen_ts = as_timestamp(states[room_entity].last_changed, 0) %}
                  {% endif %}
                {% endif %}
                {% if chosen_room != '' %}
                  {% set ns.votes = ns.votes + [(chosen_room, chosen_score, chosen_ts)] %}
                {% endif %}
              {% endfor %}
              {% if is_state('binary_sensor.maxi_alone', 'on') and states('sensor.last_active_room') | lower not in invalid %}
                {% set last_room = states('sensor.last_active_room') | lower %}
                {# No incumbency gate: this vote's only value is correcting a stale
                   state, which it can only do when it disagrees with one. #}
                {% set ns.votes = ns.votes + [(last_room, 1, as_timestamp(states['sensor.last_active_room'].last_changed, 0))] %}
              {% endif %}
              {% if (gpslocation == 'home' or phone_bps_home) and current_room != '' %}
                {% set ns.votes = ns.votes + [(current_room, 1, 0)] %}
              {% endif %}
              {% for room, votes in ns.votes | groupby(attribute='0') %}
                {% set total = votes | map(attribute='1') | sum %}
                {% set latest = votes | map(attribute='2') | max %}
                {% set bonus = 1 if room in occupied else 0 %}
                {% set ns.results = ns.results + [(room, total + bonus, latest)] %}
              {% endfor %}
              {% if is_state('device_tracker.phone_maxi', 'home') or phone_bps_home %}
                {% set allowed_rooms = occupied %}
                {% if current_room != '' and current_room not in allowed_rooms %}
                  {% set allowed_rooms = allowed_rooms + [current_room] %}
                {% endif %}
                {% set candidates = ns.results | selectattr('0', 'in', allowed_rooms) | list %}
                {% if candidates | length == 0 %}
                  {% set candidates = ns.results %}
                {% endif %}
                {% if candidates | length > 0 %}
                  {% set max_score = candidates | map(attribute='1') | max %}
                  {% set top_candidates = candidates | selectattr('1', 'eq', max_score) | list %}
                  {% if current_room != '' and (top_candidates | selectattr('0', 'eq', current_room) | list | length > 0) %}
                    {{ current_room }}
                  {% else %}
                    {{ top_candidates | sort(attribute='2', reverse=True) | map(attribute='0') | first }}
                  {% endif %}
                {% else %}
                  {{ this.state }}
                {% endif %}
              {% elif gpslocation not in invalid %}
                At {{ gpslocation }}
              {% else %}
                not_home
              {% endif %}
        attributes:
          active_rooms: >-
            {{ states('sensor.active_motion_rooms')[1:-1].split(',')
                 | map('replace', "'", '') | map('trim') | list }}
          devices: >-
            {% set info = [
              ('watch', 'sensor.bermuda_maxi_watch_area', 'sensor.bermuda_maxi_watch_bps_zone'),
              ('bracelet', 'sensor.bermuda_maxi_ankle_beacon_area', 'sensor.bermuda_maxi_ankle_beacon_bps_zone'),
              ('phone', 'sensor.bermuda_maxi_phone_area', 'sensor.bermuda_maxi_phone_bps_zone'),
            ] %}
            {% set ns = namespace(lines=[]) %}
            {% for name, area, bps in info if (name == 'watch' and is_state('binary_sensor.maxi_watch_on_body_sensor', 'on') and is_state('sensor.maxi_watch_charger_type', 'none')) or
                                              (name == 'phone' and is_state('sensor.phone_maxi_charger_type', 'none') and is_state('binary_sensor.phone_maxi_interactive', 'on')) or
                                              (name == 'bracelet')
            %}
              {% set ns.lines = ns.lines + [name ~ ' -> area: ' ~ states(area) ~ ' | bps_zone: ' ~ states(bps)] %}
            {% endfor %}
            {{ ns.lines | join('\n') }}
          last_active_room: >-
            {% if is_state('binary_sensor.maxi_alone', 'on') %}
              {{ states('sensor.last_active_room') }}
            {% else %}
              (not alone)
            {% endif %}
