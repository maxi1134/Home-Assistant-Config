# ─── Template Sensors & Binary Sensors Configuration ───
# This file defines all Jinja2 template-based sensors for the smart home.
# It is split into two main sections:
#   1. Polling templates (binary_sensor/sensor blocks) - re-evaluated on every state change
#   2. Trigger-based templates - only re-evaluated when specific entities change (more efficient)
#
# Key functional areas covered:
#   - Presence & occupancy detection (who is home, which room)
#   - Sleep state inference (combining phone sensors, BLE trackers, room activity)
#   - Activity detection (gaming, showering, cooking, watching TV, etc.)
#   - Security status (locks, alarm state)
#   - Media playback tracking (what is playing where)
#   - People counting (friends, partners, crashers via WiFi hotspot)
#   - Room-level motion aggregation

  # ─── Polling Binary Sensors ───
  # These re-evaluate whenever any referenced entity changes state.
  - binary_sensor:
      # Returns true when 2+ security occupancy sensors detect motion simultaneously
      - name: 'Multi Room Security Motion Occupancy'
        unique_id: multi_room_security_motion_occupancy
        state: >
          {{ expand('binary_sensor.group_security_occupancy_sensors') | selectattr('state', 'eq', 'on') | list | count >= 2 }}

      # ─── Presence Binary Sensors ───
      # Determines if a person is the only one home (zone count == 1, no hotspot clients)
      - name: "Maxi is Alone"
        unique_id: maxi_alone
        delay_off:
          minutes: 1
        state: >-
          {{ is_state('person.maximiliano', 'home')
             and is_state('zone.home', '1')
             and is_state('sensor.chilling_hotspot_client_count', '0') }}

      - name: "Lylou is Alone"
        unique_id: lylou_alone
        state: >-
          {{ is_state('person.lylou', 'home')
             and is_state('zone.home', '1')
             and is_state('sensor.chilling_hotspot_client_count', '0')
             and is_state('sensor.chilling_family', '0') }}

      - name: "Myriam is Alone"
        unique_id: myriam_alone
        state: >-
          {{ is_state('person.myriam', 'home')
             and is_state('zone.home', '1')
             and is_state('sensor.chilling_hotspot_client_count', '0') }}

      # ─── Sleep Detection Binary Sensors ───
      # Hysteresis wrapper for Maxi's CPAP power (plug idles ~2.0-2.5 W):
      # - needs above 5.0 W sustained for 2 minutes to turn on
      # - only turns off after staying below 4.0 W for 5 minutes
      # - holds its previous state between 4.0 W and 5.0 W
      #
      # delay_on exists because the plug emits short bursts that are not the
      # machine running: on 2026-08-23 a 15-second spike to ~7.1 W (14:54:20 ->
      # 14:54:35, idle either side) turned this on, which set sensor
      # .is_maxi_asleep and pinned activity V3 to "Sleeping" (score 100) for
      # over 5 minutes while Maxi was up. A real session is nothing like that -
      # the same night ran 7.9 hours continuously - so requiring 2 minutes
      # rejects the bursts with a large margin and costs almost no detection lag.
      - name: "Maxi CPAP Running Hysteresis"
        unique_id: maxi_cpap_running_hysteresis
        delay_on:
          minutes: 2
        delay_off:
          minutes: 5
        state: >-
          {% set cpap_power = states('sensor.bedroom_plug_bedroom_cpap_machine_power') | float(0) %}
          {% if cpap_power > 5.0 %}
            true
          {% elif cpap_power < 4.0 %}
            false
          {% else %}
            {{ this is defined and this.state == 'on' }}
          {% endif %}


  - binary_sensor:
      # ─── Bathroom & Utility Binary Sensors ───
      # Detects showering: bathroom door closed AND humidity 15% above house average
      - name: "Shower in Usage"
        unique_id: shower_in_usage
        delay_off:
          minutes: 2
        state: >
          {{( states('binary_sensor.sensor_bathroom_door_contact') == 'off' and (states('sensor.sensor_bathroom_temperature_humidity') | float(0)  ) > (states('sensor.average_house_humidity') | float(0) + 15 )) }}

  - trigger:
      - trigger: state
        entity_id:
          - person.maximiliano
          - sensor.is_maxi_asleep
          - sensor.active_sleeper_amount
          - sensor.total_amount_people_home
      - trigger: homeassistant
        event: start
    binary_sensor:
      # True when all present household members are asleep (Maxi must be home and asleep)
      - name: "All Present Sleeping"
        unique_id: all_present_sleeping
        state: >
          {% if ( states('person.maximiliano') == 'home' and states('sensor.is_maxi_asleep') == 'on' ) and (states('sensor.active_sleeper_amount') | int(0) != 0 and states('sensor.active_sleeper_amount') | int(0) >= 2 and states('sensor.active_sleeper_amount') | int(0) >= states('sensor.total_amount_people_home') | int(0) ) %}
            on
          {% else %}
            off
          {% endif %}


  - binary_sensor:
      # Detects indoor motion only (excludes parking, patio, and door sensors)
      - name: "Motion Inside Home"
        unique_id: motion_inside_home
        delay_off:
          minutes: 1
        state: >
          {% set occupancy_sensors = expand('binary_sensor.group_security_occupancy_sensors') | selectattr('state', 'eq', 'on') | rejectattr('entity_id', 'search', 'parking') | rejectattr('entity_id', 'search', 'patio') | rejectattr('entity_id', 'search', 'door') | map(attribute='entity_id') | list %}
          {{ occupancy_sensors | count > 0 }}
        attributes:
          last_active: "{{ states('sensor.last_active_room') }}"
        

  - trigger:
      - trigger: state
        entity_id:
          - sensor.myriam_is_sleeping_at_home
          - sensor.is_maxi_asleep
          - sensor.phone_myriam_s26_wi_fi_connection
          - person.maximiliano
      - trigger: homeassistant
        event: start
    binary_sensor:
      # True when Maxi is home and asleep AND Myriam is either asleep at home or not home.
      # (Maxi and Myriam are the only tracked residents, so an absent resident
      # doesn't block "all residents sleeping" — Maxi home+asleep + Myriam away = True.)
      # Used by automations to enter "night mode" (dim lights, lower speaker volumes, etc.)
      #
      # Myriam's presence is keyed off her phone's WiFi SSID, not GPS. Every home SSID
      # contains "Chilling"; anything else (incl. "<not connected>"/unknown) counts as away.
      # GPS was dropped here on 2026-08-22: the home zone radius is 13 m but her phone rests
      # ~101 m from its centre, so any fix reporting worse than ~88 m accuracy satisfied HA's
      # "distance - accuracy < radius" test and registered a false arrival. That produced 23
      # false flips between 02:00 and 11:45 while she was motionless and away.
      - name: "All residents Sleeping"
        unique_id: all_residents_sleeping
        state: >
            {% set maxi_home = is_state('person.maximiliano', 'home') %}
            {% set maxi_asleep = is_state('sensor.is_maxi_asleep', 'on') %}
            {% set myriam_asleep = is_state('sensor.myriam_is_sleeping_at_home', 'on') %}
            {% set myriam_away = 'chilling' not in (states('sensor.phone_myriam_s26_wi_fi_connection') | lower) %}
            {{ maxi_home and maxi_asleep and (myriam_asleep or myriam_away) }}

  - binary_sensor:
      # ─── Communication Detection Binary Sensors ───
      # Detects if someone is on a call (mic active, phone not idle, or audio mode changed)
      - name: "maxi is talking"
        unique_id: "maxi_is_talking" 
        state: >-
           {{ ( (states('binary_sensor.computer_maxi_pc_computer_maxi_pc_microphoneactive') == "on" or not is_state('sensor.phone_maxi_phone_state', "idle")
              or states('sensor.phone_maxi_audio_mode') != 'normal') and states('person.maximiliano') == 'home'
            ) }}

      # Detects if Myriam is listening to media or on a call at home
      # (phone media session playing OR phone audio mode not normal)
      - name: "myriam_is_listening_at_home"
        unique_id: "myriam_is_listening_at_home"
        state: >-
           {{ ( ( ( is_state('sensor.phone_myriam_media_session', "playing") and states('person.myriam') == 'home' ) 
              or states('sensor.phone_myriam_audio_mode') != 'normal' ) and states('person.myriam') == 'home'
            ) }}

      # Detects if Myriam is on a phone call (phone not idle or audio mode changed)
      - name: "myriam is talking"
        unique_id: "myriam_is_talking"
        state: >-
           {{ ( (not is_state('sensor.phone_myriam_phone_state', "idle")
              or states('sensor.phone_myriam_audio_mode') != 'normal') and states('person.myriam') == 'home'
            ) }}

      # Detects if Maxi is listening to media, on a call, or in a non-normal audio mode at home.
      # Used to avoid broadcasting announcements when someone is on a call or listening to something.
      - name: "maxi_is_listening_at_home"
        unique_id: "maxi_is_listening_at_home"
        state: >-
            {{ (( is_state('sensor.phone_maxi_media_session', "playing")
              or not is_state('sensor.phone_maxi_phone_state', "idle")
              or states('sensor.phone_maxi_audio_mode') != 'normal') and states('person.maximiliano') == 'home' ) }}
  # ─── Polling Sensors ───
  - sensor:
      # ─── Environment Sensors ───
      # Falls back through local outdoor sensor -> Montreal weather -> forecast_home
      - name: "Outside Temperature with Fallback"
        unique_id: "outside_temperature_with_fallback"
        availability: >-
          {{ has_value('sensor.sensor_outside_temperature_temperature')
             or has_value('weather.weather_montreal_forecast')
             or has_value('weather.forecast_home') }}
        state: >-
                {% if has_value('sensor.sensor_outside_temperature_temperature') %}
                {{ states('sensor.sensor_outside_temperature_temperature') }}
                {% elif has_value('weather.weather_montreal_forecast') %}
                  {{ state_attr('weather.weather_montreal_forecast','temperature') | float(0) }}
                {% elif has_value('weather.forecast_home') %}
                  {{ state_attr('weather.forecast_home','temperature') | float(0) }}
                {% else %}
                  0
                {% endif %}
        unit_of_measurement: degrees

      # ─── Security Status Sensor ───
      # Aggregates lock and alarm states into a human-readable security status
      - name: "Security All Clear"
        unique_id: security_all_clear
        state: >-
          {% if is_state('lock.lock_front_door', 'locked') and is_state('lock.back_door', 'locked') and ( states('alarm_control_panel.home_alarm') == "disarmed")  %}
            Clear
          {% elif is_state('alarm_control_panel.home_alarm', 'triggered') %}
            Alarm Triggered
          {% elif is_state('lock.lock_front_door', 'unlocked') or  is_state('lock.back_door', 'unlocked') %}
            Door Unlocked
          {% elif is_state('alarm_control_panel.home_alarm', 'armed_away') %}
            Armed Away
          {% elif is_state('alarm_control_panel.home_alarm', 'armed_home') %}
            Armed Home
          {% elif is_state('alarm_control_panel.home_alarm', 'armed_night') %}
            Armed Night
          {% else %}
            Unknown
          {% endif %}
        icon: >-
          {% if is_state('lock.lock_front_door', 'locked') and is_state('lock.back_door', 'locked') and (states('alarm_control_panel.home_alarm') == "disarmed")  %}
            mdi:shield-home
          {% elif is_state('alarm_control_panel.home_alarm', 'triggered') %}
            mdi:alarm-light
          {% elif is_state('lock.lock_front_door', 'unlocked') or  is_state('lock.back_door', 'unlocked') %}
            mdi:door-open
          {% elif is_state('alarm_control_panel.home_alarm', 'armed_away') %}
            mdi:shield-lock
          {% elif is_state('alarm_control_panel.home_alarm', 'armed_home') %}
            mdi:shield-account
          {% else %}
            mdi:shield-alert
          {% endif %}
          

        
      # ─── Room Usage Sensors ───
      # Reports bathroom status: Showering > Occupied (door closed) > Detected (motion) > Clear
      - name: 'Bathroom Usage'
        state: >-
          {% if states('binary_sensor.shower_in_usage') == "on" %}
            Showering
          {% elif  states('binary_sensor.sensor_bathroom_door_contact') == "off" %}
            Occupied
          {% elif  states('binary_sensor.sensor_bathroom_motion_occupancy') == "on" %}
            Detected
          {% elif  states('binary_sensor.sensor_bathroom_motion_occupancy') == "off" %}
            Clear
          {% endif %}
        icon: >-
          {% if states('binary_sensor.shower_in_usage') == "on" %}
            mdi:shower-head
          {% elif  states('binary_sensor.sensor_bathroom_door_contact') == "off" %}
            mdi:paper-roll-outline
          {% elif  states('binary_sensor.sensor_bathroom_motion_occupancy') == "on" %}
            mdi:run
          {% elif  states('binary_sensor.sensor_bathroom_motion_occupancy') == "off" %}
            mdi:walk
          {% endif %}  
        unique_id: bathroom_usage    

#      - name: 'Timer Remaining'  
#        unit_of_measurement: Minutes
#        state: >-
#          {% if states('timer.cooking') == "active" %}
#          {{  state_attr('timer.cooking', 'remaining') }}
#          {% else %}0
#          {% endif %}
#        unique_id: timer_remaining



      # ─── Location Sensors ───
  - trigger:
      - trigger: state
        entity_id:
          - sensor.bermuda_maxi_ankle_beacon_bps_zone
          - sensor.bermuda_maxi_watch_bps_zone
          - binary_sensor.maxi_watch_on_body_sensor
          - sensor.bermuda_maxi_phone_bps_zone
          - device_tracker.phone_maxi
      - trigger: homeassistant
        event: start
    sensor:
      # Determines Maxi's location by prioritizing: watch (if on body) > bracelet > phone > GPS
      - name: "Maxi Location"
        unique_id: "maxi_location" 
        state: >-            
            {% set braceletroom = states('sensor.bermuda_maxi_ankle_beacon_bps_zone') %}
            {% set watchroom = states('sensor.bermuda_maxi_watch_bps_zone') %}
            {% set watchonbody = states('binary_sensor.maxi_watch_on_body_sensor') %}
            {% set phoneroom = states('sensor.bermuda_maxi_phone_bps_zone') %}
            {% set gpslocation = states('device_tracker.phone_maxi') %}

              {% if watchonbody == "on" and watchroom != "not_home" %}                   
                {% set location = watchroom %}
              {% elif braceletroom != "not_home" %}      
                {% set location = braceletroom %}
              {% elif phoneroom != "not_home" %}
                {% set location = phoneroom %}
              {% elif gpslocation != "not_home"%}
                {% set location = "At " + gpslocation %}
              {% else %}
                {% set location = 'unknown' %}
              {% endif %}
              {{ location }}

  - sensor:
      # ─── Gaming & Activity Sensors ───
      # Reports current game from Discord or Steam, preferring Discord
      - name: "Maxis Current Game"
        unique_id: "maxi_current_game" 
        state: >-
            {% if state_attr('sensor.maxi1134_8202', 'game') %}
            {{ state_attr('sensor.maxi1134_8202', 'game') }}
            {% elif  state_attr('sensor.steam_maxi', 'game') %}
            {{state_attr('sensor.steam_maxi', 'game')}}
            {% else %} idle
            {% endif %}
      # Reports current game from Discord only (via Discord integration sensor)
      - name: "Maxis Current Discord Game"
        unique_id: "maxi_current_discord_game" 
        state: >-
            {% if state_attr('sensor.maxi1134_8202', 'game') %}
            {{ state_attr('sensor.maxi1134_8202', 'game') }}
            {% else %}idle
            {% endif %}
      # Reports current game from Steam only (via Steam integration sensor)
      - name: "Maxis Current Steam Game"
        unique_id: "maxi_current_steam_game" 
        state: >-
            {% if  state_attr('sensor.steam_maxi', 'game') %}
            {{state_attr('sensor.steam_maxi', 'game')}}
            {% else %}idle
            {% endif %} 

      # ─── People Counting Sensors ───
      # Lists friends currently at home (derived from hotspot client tracking)
      - name: "which friends home"
        unique_id: "which_friends_home"
        state: >-
          {{ state_attr('sensor.amount_friends_home', "friends") | default([], true) | list  }}

      # Total non-resident people at home: friends + partners + crashers (excludes Maxi)
      - name: "amount people home"
        unique_id: amount_people_home
        state: >-
             {# Set peoplehome to the amount of people #}
             {% set peoplehome = states('sensor.amount_friends_home') | int(0) + states('sensor.amount_partners_home') | int(0) + states('sensor.amount_crashing_home') | int(0)  %} 
             {{peoplehome}}
        unit_of_measurement: "person(s)"
        
      # Same as "amount people home" but INCLUDES Maxi in the count if he's home.
      # Used by automations that need the true total headcount (e.g. party detection).
      - name: "total amount people home"
        unique_id: total_amount_people_home
        state: >-                     
             {# Set peoplehome to the amount of people #}
             {% set peoplehome = states('sensor.amount_friends_home') | int(0) + states('sensor.amount_partners_home') | int(0) + states('sensor.amount_crashing_home') | int(0)  %} 
             {% if states('person.maximiliano') == "home" %}
             {% set peoplehome = peoplehome +1 %}
             {% endif %}
             {{peoplehome}}

      

      # ─── Active Microphone Tracking ───
  - trigger:
      - trigger: state
        entity_id:
          - binary_sensor.computer_maxi_pc_computer_maxi_pc_microphoneactive
          - sensor.phone_maxi_phone_state
          - sensor.phone_maxi_audio_mode
          - person.maximiliano
          - sensor.maxi_location_by_petro_v2
      - trigger: homeassistant
        event: start
    sensor:
      # Lists rooms where microphones are active (PC mic, phone call, audio mode)
      - name: "active microphones rooms"
        unique_id: "active_microphones_rooms"
        state: >-
            {% set ns = namespace(active_micro_room = []) %}  {# create a namespace object to store variables #}
            {% if states('binary_sensor.computer_maxi_pc_computer_maxi_pc_microphoneactive') == "on" %}
              {% set ns.active_micro_room = ns.active_micro_room + ["hotbox"] %}
            {% endif %}
            {% if states('sensor.phone_maxi_phone_state') != 'idle' and states('person.maximiliano') == 'home' %}            
              {% set ns.active_micro_room = ns.active_micro_room + [ states('sensor.maxi_location_by_petro_v2')] %}
            {% endif %}
            {% if states('sensor.phone_maxi_audio_mode') != 'normal'and states('person.maximiliano') == 'home' %}            
              {% set ns.active_micro_room = ns.active_micro_room + [ states('sensor.maxi_location_by_petro_v2')] %}
            {% endif %}
            {{ ns.active_micro_room | unique | list }}
      # ─── Sleep Detection Sensors ───
  - trigger:
      - trigger: state
        entity_id:
          - binary_sensor.phone_lylou_interactive
          - sensor.phone_lylou_sleep_confidence
          - device_tracker.computer_lylou
          - light.group_hotbox_lights
          - person.lylou
      - trigger: homeassistant
        event: start
    sensor:
      # Determines Lylou's sleep state using phone interactivity, sleep confidence, lights, and PC state
      - name: Is lylou asleep?
        unique_id: "is_lylou_asleep"
        state: >
            {% set phone_interactive = states('binary_sensor.phone_lylou_interactive') %}
            {% set sleep_confidence = states('sensor.phone_lylou_sleep_confidence') | int(0) %}
            {% set computer_state = states('device_tracker.computer_lylou') %}
            {% set light_state  = states('light.group_hotbox_lights') %}
            {% set lylou_home = states('person.lylou') %}
            {% set sleepingstate = "on" %}
            {% if  lylou_home == 'home' %}
            {% if phone_interactive == 'off' and light_state == 'off' and sleep_confidence > 80 and computer_state == 'not_home' %}
                {% set sleepingstate = "asleep" %}
            {% elif phone_interactive == 'off' and light_state == 'off' and sleep_confidence > 90 %}
                {% set sleepingstate = "asleep" %}
            {% elif phone_interactive == 'off' and light_state == 'off' and computer_state == 'not_home'  %}
                {% set sleepingstate = "asleep" %}
            {% endif%}
            {% endif%}
            {{ sleepingstate }}


  - trigger:
      - trigger: state
        entity_id:
          - sensor.myriam_location_by_petro
          - sensor.active_sleeper_amount
          - sensor.active_sleepers
          - sensor.last_active_room
          - sensor.phone_myriam_sleep_confidence
          - binary_sensor.myriam_alone
          - person.myriam
      - trigger: homeassistant
        event: start
    sensor:
      # Determines Myriam's sleep state using room location, sleeper booleans, and phone confidence
      - name: Is myriam asleep?
        unique_id: "is_myriam_asleep"
        state: >
            {% set room = states('sensor.myriam_location_by_petro') %}  {# get the current myriam location sensor state #}
            {% set sleeperamount = states('sensor.active_sleeper_amount') | int(0) %}
            {% set activesleeperrooms = (state_attr('sensor.active_sleepers', 'rooms') or {}).values() | list %}
            {% set lasttvactiveroom = states('sensor.last_active_room') %}
            {% set phone_sleep_confidence = states('sensor.phone_myriam_sleep_confidence') | int(0) %}
            {% set sleepingstate = "on" %}
                {% if states('binary_sensor.myriam_alone') == "on" %}
                    {# if the myriam_alone sensor is on, indicating there is only myriam present #}
                    {% if sleeperamount > 1 %}
                        {# if there is more than one "sleeper" input_boolean that is "on" #}
                        {% if room in activesleeperrooms %}
                            {% set sleepingstate = "asleep" %}
                        {% elif lasttvactiveroom in activesleeperrooms  %}
                           {% set sleepingstate = "asleep" %}
                        {% endif %}
                    {% elif sleeperamount == 1 %}
                        {# if there is only one "sleeper" input_boolean that is "on" #}
                        {% set sleepingstate = "asleep" %}   {# set the roomname to the only "sleeper" input_boolean that is "on" #}
                    {% endif %}
                {% elif states('binary_sensor.myriam_alone') == "off" and room in activesleeperrooms and room != '' %}
                    {# if the myriam_alone sensor is off, it indicates that there is more than myriam present #}
                    {% set sleepingstate = "asleep" %}
                {% elif states('person.myriam') != "home" %}             {# if myriam is not home #}
                    {# check phone sleep confidence to determine if I am sleeping #}
                    {% if phone_sleep_confidence > 94  %}
                        {# Assume myriam is sleeping if confidence is over 94% #}
                        {% set sleepingstate = "asleep" %} {# set sleeping  state as asleep #}
                    {% endif %}
                {% endif %}
            {{ sleepingstate }}


  - trigger:
      - trigger: state
        entity_id:
          - sensor.is_myriam_asleep
          - person.myriam
      - trigger: homeassistant
        event: start
    sensor:
      # Combines Myriam's sleep state with her home/away status.
      # Only reports "asleep" if she is BOTH asleep AND physically at home.
      - name: Myriam is sleeping at home?
        unique_id: "myriam_is_sleeping_at_home"
        state: >            
            {% set sleeping_state = states('sensor.is_myriam_asleep') %}  
            {% set myriam_home = states('person.myriam') %}
                {% if myriam_home == "home" and sleeping_state == "asleep" %}
                  on
                {% else %}
                  off
                {% endif %}

  - trigger:
      - trigger: state
        entity_id:
          # read by state:
          - sensor.maxi_location_by_petro_v2
          - binary_sensor.maxi_cpap_running_hysteresis
          - binary_sensor.maxi_alone
          - person.maximiliano
          # shared by state + location attribute:
          - sensor.active_sleeper_amount
          - sensor.active_sleepers
          - sensor.last_active_room
          - sensor.phone_maxi_sleep_confidence
          # read only by the location attribute (expand of sleeper flags):
          - input_boolean.sleeper_in_bedroom
          - input_boolean.sleeper_in_closet
          - input_boolean.sleeper_in_workshop
          - input_boolean.sleeper_in_patio
          - input_boolean.sleeper_in_hotbox
          - input_boolean.sleeper_in_salon
          - input_boolean.sleeper_in_lounge
      - trigger: homeassistant
        event: start
    sensor:
      # Determines Maxi's sleep state using room location, sleeper booleans, and phone confidence
      # Also exposes a 'location' attribute indicating where Maxi is sleeping
      - name: Is maxi asleep?
        unique_id: "is_maxi_asleep"
        state: >
            {% set room = states('sensor.maxi_location_by_petro_v2') %}  {# get the current maxi location sensor state #}
            {% set sleeperamount = states('sensor.active_sleeper_amount') | int(0) %}
            {% set activesleeperrooms = (state_attr('sensor.active_sleepers', 'rooms') or {}).values() | list %}
            {% set lasttvactiveroom = states('sensor.last_active_room') %}
            {% set phone_sleep_confidence = states('sensor.phone_maxi_sleep_confidence') | int(0) %}
            {% set c_pap_running = is_state('binary_sensor.maxi_cpap_running_hysteresis', 'on') %}
            {% set sleepingstate = "off" %}
            {% if c_pap_running %}
                {% set sleepingstate = "on" %}
            {% else %}
                {% if states('binary_sensor.maxi_alone') == "on" %}
                    {# if the maxi_alone sensor is on, indicating there is only maxi present #}
                    {% if sleeperamount > 1 %}
                        {# if there is more than one "sleeper" input_boolean that is "on" #}
                        {% if room in activesleeperrooms %}
                            {% set sleepingstate = "on" %}
                        {% elif lasttvactiveroom in activesleeperrooms  %}
                           {% set sleepingstate = "on" %}
                        {% endif %}
                    {% elif sleeperamount == 1 %}
                        {# if there is only one "sleeper" input_boolean that is "on" #}
                        {% set sleepingstate = "on" %}   {# set the roomname to the only "sleeper" input_boolean that is "on" #}
                    {% endif %}
                {% elif states('binary_sensor.maxi_alone') == "off" and room != '' and room in activesleeperrooms %}
                    {# if the maxi_alone sensor is off, it indicates that there is more than maxi present #}
                    {% set sleepingstate = "on" %}
                {% elif states('person.maximiliano') != "home" %}             {# if maxi is not home #}
                    {# check phone sleep confidence to determine if I am sleeping #}
                    {% if phone_sleep_confidence > 94  %}
                        {# Assume I am sleeping if confidence is over 94% #}
                        {% set sleepingstate = "on" %} {# set sleeping  state as on #}
                    {% endif %}
                {% endif %}
              {% endif %}
            {{ sleepingstate }}
        attributes:
          location: >
            {% set room = states('sensor.maxi_location_by_petro_v2') %}  {# get the current maxi location sensor state #}
            {% set sleeperamount = states('sensor.active_sleeper_amount') | int(0) %}
            {% set activesleeperrooms = (state_attr('sensor.active_sleepers', 'rooms') or {}).values() | list %}
            {% set lasttvactiveroom = states('sensor.last_active_room') %}
            {% set maxilocation = states('sensor.maxi_location_by_petro_v2') %}
            {% set phone_sleep_confidence = states('sensor.phone_maxi_sleep_confidence') | int(0) %}
            {% set sleepingspot = "" %}
              {% if states('binary_sensor.maxi_alone') == "on" %}  {# if the maxi_alone sensor is on, indicating there is only maxi present #}
                {% if sleeperamount > 1 %}  {# if there is more than one "sleeper" input_boolean that is "on" #}
                {% if room in activesleeperrooms %}
                    {% set sleepingspot = room %}
                  {% elif lasttvactiveroom in activesleeperrooms  %}
                    {% set sleepingspot = lasttvactiveroom %}
                  {% else %}
                  {# this below code set sleepingspots as the last sleeper that eas turned on#}
                  {% set sleepingspot = expand('input_boolean.sleeper_in_bedroom', 'input_boolean.sleeper_in_closet', 'input_boolean.sleeper_in_workshop', 'input_boolean.sleeper_in_patio', 'input_boolean.sleeper_in_hotbox', 'input_boolean.sleeper_in_salon', 'input_boolean.sleeper_in_lounge') | selectattr('state','eq','on') | sort(attribute='last_updated', reverse=True) | map(attribute='entity_id') | first | default | replace('input_boolean.sleeper_in_','') %}
                  {% endif %}

                {% elif sleeperamount == 1 %}  {# if there is only one "sleeper" input_boolean that is "on" #}
                  {% set sleepingspot =  activesleeperrooms | first | default('') %}  {# set the roomname to the only "sleeper" input_boolean that is "on" #}
                {% endif %}

              {% elif states('binary_sensor.maxi_alone') == "off" and states('person.maximiliano') == "home" %}  {# if the maxi_alone sensor is off, it indicates that there is more than maxi present #}
                  {# this below code set sleepingspots as the last sleeper that was turned on#}
                  {% set last_sleeping_spot = expand('input_boolean.sleeper_in_bedroom', 'input_boolean.sleeper_in_closet', 'input_boolean.sleeper_in_workshop', 'input_boolean.sleeper_in_patio', 'input_boolean.sleeper_in_hotbox', 'input_boolean.sleeper_in_salon', 'input_boolean.sleeper_in_lounge') | selectattr('state','eq','on') | sort(attribute='last_updated', reverse=True) | map(attribute='entity_id') | first | default | replace('input_boolean.sleeper_in_','') %}  
                    {% if maxilocation in activesleeperrooms %}
                      {% set sleepingspot = maxilocation %}
                    {% elif last_sleeping_spot == maxilocation %}                    
                      {% set sleepingspot = last_sleeping_spot %}
                    {% endif %}
              {% elif states('person.maximiliano') != "home" %}  {# if maxi is not home #}
                  {# check phone sleep confidence to determine if I am sleeping #}
                  {% if phone_sleep_confidence > 94  %} {# Assume I am sleeping if confidence is over 94% #}
                    {% set sleepingspot = maxilocation %} {# set sleeping spot at current outside of home location #}
                  {% endif %}
              {% endif %}
            {{ sleepingspot }}
            
