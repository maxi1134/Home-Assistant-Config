# ─── REST Command Configuration ───
# HTTP-based commands called from automations and scripts to interact
# with local services (cameras, AI, media servers) and external APIs.

# ─── Reolink Camera PTZ Control ───
# Moves the Reolink camera to a preset position by ID
ptz_reolink:
    url: http://192.168.0.210/cgi-bin/api.cgi?cmd=PtzCtrl&token={{token}}
    method: POST
    payload: '[{"cmd":"PtzCtrl","action":0,"param":{"channel":0,"op":"ToPos","speed":32,"id":{{ptz_id}}}}]'
# Sends a raw PTZ command payload to the Reolink camera
ptz_reolink_var:
    url: http://192.168.0.210/cgi-bin/api.cgi?cmd=PtzCtrl&token={{token}}
    method: POST
    payload: '{{command}}'

# ─── Local AI (LocalAI) Image Generation ───
# Calls LocalAI's Stable Diffusion endpoint to generate images from text prompts
local_ai_generate_image:
    url: http://192.168.0.14:8080/v1/images/generations
    method: POST
    content_type: 'application/json'
    timeout: 60
    payload: > 
      {
      "prompt": "{{prompt}}",
      "steps": {%if steps%}{{steps}}{%else%}20{%endif%},
      "model": "{% if model %}{{model}}{%else%}sd-3.5-large-ggml{%endif%}",
      "size": "{% if size %}{{size}}{%else%}1024x1024{%endif%}",
      "backend": "cuda12-stablediffusion-ggml"
      }
# ─── Local AI Media Type Classification ───
# Asks LocalAI's LLM whether a given title is a movie or TV show
local_ai_describe_media:
    url: http://192.168.0.14:8080/v1/chat/completions
    method: POST
    content_type: 'application/json'
    timeout: 30
    payload: > 
      {
      "messages": [{"role": "user", "content": "Is {{prompt}} a movie or a tv show? Just answer with one or two words", "temperature": 0.1}] ,
      "model": "gpt-4"
      }
# ─── Open WebUI Media Type Classification ───
# Same as above but routes through Open WebUI with a local Llama model
open_webui_describe_media:
    url: http://192.168.0.14:3000/api/chat/completions
    method: POST
    content_type: 'application/json'
    timeout: 30    
    headers:
      authorization: !secret open_webui_rest_headers_secret
    payload: > 
      {
      "messages": [{"role": "user", "content": "Is {{prompt}} a movie or a tv show? Just answer with one or two words", "temperature": 0.1}] ,
      "model": "maxi_llama32:latest"
      }
# ─── Open WebUI Vision / Image Description ───
# Sends an image URL + text prompt to the Llama 3.2 Vision model for analysis
open_webui_describe_image:
    url: http://192.168.0.14:3000/api/chat/completions
    method: POST
    content_type: 'application/json'
    timeout: 120
    headers:
      authorization: !secret open_webui_rest_headers_secret
    payload: > 
      {
      "messages": [
        {
          "role": "user",
          "content": [
            {
              "type": "text",
              "text": "{{prompt}}"
            },
            {
              "type": "image_url",
              "image_url": {
                "url": "{{image}}"
              }
            }
          ]
        }
      ],
      "model": "maxi_llama32-vision:latest"
         }
# ─── Willow Voice Assistant Notification ───
# Sends TTS audio notifications to Willow satellite devices via their API
willow_notify:
    url: http://192.168.0.14:8502/api/client?action=notify
    method: POST
    content_type: application/json
    payload: '{"cmd":"notify","data":{"backlight":"{{backlight}}","backlight_max":"{{backlightMax}}","repeat":"{{repeat}}","audio_url":"https://192.168.0.14:19000/api/tts?speaker=nicolascage&text={{text | replace(" ","+")}}","volume":"{{volume}}"}}'

# ─── Jellyfin Media Search ───
# Searches the local Jellyfin media server library by title and media type
jellyfin_search:
  url: "http://192.168.0.20:8096/Items?api_key={{user_API_KEY}}&searchTerm={{ search_string }}&Recursive=true&IncludeMedia=true&IncludeItemTypes={{ type }}"

# ─── Jellyfin TV shortcuts ───
# The calls behind the Jellyfin TV scripts. script.jellyfin_play_random_episode_on_a_tv (the
# tablet and phone TV-show buttons) finds a series by name and picks one random episode that
# has a file; the LLM TV script (script.llm_script_to_start_tv_shows_and_movies_on_tvs_duplicate)
# searches shows and movies by title; script.jellyfin_play_item_on_a_tv reads the movie or
# episode and asks Jellyfin how to stream it to a Google Cast TV. Auth: the Jellyfin API key
# "HomeAssistant Search" as a full Authorization header (secrets.yaml jellyfin_authorization);
# its DeviceId home-assistant-tv-shortcuts is what Jellyfin's dashboard shows on the transcodes.
jellyfin_find_series:
  url: >-
    http://192.168.0.20:8096/Items?IncludeItemTypes=Series&Recursive=true&Limit=20&EnableImages=false&EnableUserData=false&SearchTerm={{ show | urlencode }}
  method: GET
  timeout: 15
  headers:
    authorization: !secret jellyfin_authorization

jellyfin_random_episode:
  url: >-
    http://192.168.0.20:8096/Items?ParentId={{ series_id | urlencode }}&IncludeItemTypes=Episode&Recursive=true&IsMissing=false&SortBy=Random&Limit=1&Fields=MediaSources,PremiereDate&EnableUserData=false
  method: GET
  timeout: 15
  headers:
    authorization: !secret jellyfin_authorization

# Shows and movies matching a title, best match first (the Meilisearch plugin ranks them; with
# nothing close it still returns loose matches, so the LLM script checks the names). Path gives
# the folder name, which matches titles Jellyfin lists under another name: the French How It's
# Made is called "How It's Made" too, in /data/tvshows/Comment cest fait.
jellyfin_search_titles:
  url: >-
    http://192.168.0.20:8096/Items?IncludeItemTypes=Series,Movie&Recursive=true&Limit=20&EnableImages=false&EnableUserData=false&Fields=Path,ProductionYear&SearchTerm={{ title | urlencode }}
  method: GET
  timeout: 15
  headers:
    authorization: !secret jellyfin_authorization

# One movie or episode, with its media sources (their audio tracks give the English one).
jellyfin_item:
  url: >-
    http://192.168.0.20:8096/Items?Ids={{ item_id | urlencode }}&Fields=MediaSources,PremiereDate&EnableUserData=false
  method: GET
  timeout: 15
  headers:
    authorization: !secret jellyfin_authorization

# PlaybackInfo with a device profile that every Google Cast receiver plays: no direct play;
# HLS with MPEG-TS segments, H.264 (8-bit, level <= 4.1, <= 1080p, SDR) and stereo AAC at up
# to 12 Mbps. Jellyfin remuxes what already fits and transcodes the rest on the GPU (NVENC).
# The answer's TranscodingUrl carries the API key, so the script never handles it. Subtitles
# follow maxi1134's Jellyfin settings (Always, English): sidecar text subtitles come back as
# a WebVTT DeliveryUrl, embedded ones are burned in. Optional: audio_stream_index, and
# max_width / max_height / max_bitrate (default 1920 x 1080 at 12 Mbps; the script sends
# 1280 x 720 at 4 Mbps to the 1st-gen Nest Hub, which refuses any 1080p stream).
jellyfin_playback_info:
  url: >-
    http://192.168.0.20:8096/Items/{{ item_id | urlencode }}/PlaybackInfo?UserId=f3a71871d0e949b38a4be3fe7644501c&MediaSourceId={{ media_source_id | urlencode }}&IsPlayback=true&AutoOpenLiveStream=true{{ '&AudioStreamIndex=' ~ (audio_stream_index | int) if audio_stream_index | default('') | string | length > 0 else '' }}
  method: POST
  content_type: application/json
  timeout: 15
  headers:
    authorization: !secret jellyfin_authorization
  payload: >
    { "DeviceProfile": { "Name": "Home Assistant Chromecast",
      "MaxStreamingBitrate": {{ max_bitrate | default(12000000, true) | int }},
      "MaxStaticBitrate": {{ max_bitrate | default(12000000, true) | int }},
      "MusicStreamingTranscodingBitrate": 192000,
      "DirectPlayProfiles": [ ],
      "TranscodingProfiles": [ { "Container": "ts", "Type": "Video", "VideoCodec": "h264",
        "AudioCodec": "aac", "Context": "Streaming", "Protocol": "hls",
        "MaxAudioChannels": "2", "MinSegments": 1, "BreakOnNonKeyFrames": true } ],
      "ContainerProfiles": [ ],
      "CodecProfiles": [
        { "Type": "Video", "Codec": "h264", "Conditions": [
          { "Condition": "EqualsAny", "Property": "VideoProfile", "Value": "high|main|baseline|constrained baseline" },
          { "Condition": "LessThanEqual", "Property": "VideoLevel", "Value": "41" },
          { "Condition": "LessThanEqual", "Property": "VideoBitDepth", "Value": "8" },
          { "Condition": "EqualsAny", "Property": "VideoRangeType", "Value": "SDR" },
          { "Condition": "NotEquals", "Property": "IsInterlaced", "Value": "true" },
          { "Condition": "LessThanEqual", "Property": "Width", "Value": "{{ max_width | default(1920, true) | int }}" },
          { "Condition": "LessThanEqual", "Property": "Height", "Value": "{{ max_height | default(1080, true) | int }}" } ] },
        { "Type": "VideoAudio", "Codec": "aac", "Conditions": [
          { "Condition": "LessThanEqual", "Property": "AudioChannels", "Value": "2" } ] } ],
      "SubtitleProfiles": [ { "Format": "vtt", "Method": "External" } ] } }

# ─── MusicBrainz Artist Lookup ───
# Queries the MusicBrainz API to find an artist's foreign ID for Lidarr import
music_brainz_artist_query:
  url: "https://musicbrainz.org/ws/2/artist/?query=name:{{artist}}&fmt=json"
  method: GET

# ─── Lidarr Artist Import ───
# Adds a new artist to Lidarr (music management) for automatic download
lidarr_add_artist:
  url: http://192.168.0.20:8686/api/v1/artist
  method: post
  content_type: application/json
  headers:
      authorization: !secret lidarr_auth
  payload: > 
      {
          "ArtistName": "{{artist_name}}",
          "Path": "/media/Music/{{artist_name}}",
          "ForeignArtistId": "{{artist_id}}",
          "QualityProfileId": "1",
          "MetadataProfileId": "1",
          "Monitored": true
      }
journal_montreal_rss:
  url: https://www.journaldemontreal.com/rss.xml
  method: GET
  timeout: 20

# ─── Music Assistant Party Guest Access ───
# Turns the MA Party plugin's guest access on or off (the call the party page's own
# guest-access button makes). Off hides the join QR code on the party page and signs
# every guest out; on makes a new join code. Token: MA long-lived token "party mode
# enabler" (maxi1134, admin), valid until 2027-10-31.
music_assistant_party_guest_access:
  url: http://192.168.0.15:8095/api
  method: POST
  content_type: application/json
  timeout: 20
  headers:
    authorization: !secret music_assistant_api_bearer
  payload: >
    {"message_id": "ha_party_qr", "command": "config/providers/save",
     "args": {"provider_domain": "party", "instance_id": "party",
              "values": {"enable_guest_access": {{ enabled | bool | to_json }}}}}

# ─── Music Assistant DSP ───
# Apply a saved DSP preset to one MA player, or clear that player's DSP back to the
# default (disabled, no filters, unity gain). Driven by the party bass-cut automation.
# DSP is per-player in MA, so group members are each targeted individually. Token: MA
# long-lived token "party mode enabler" (maxi1134, admin), valid until 2027-10-31.
music_assistant_dsp_apply_preset:
  url: http://192.168.0.15:8095/api
  method: POST
  content_type: application/json
  timeout: 20
  headers:
    authorization: !secret music_assistant_api_bearer
  payload: >
    {"message_id": "ha_dsp_apply", "command": "config/players/dsp/apply_preset",
     "args": {"player_id": {{ player_id | to_json }},
              "preset_id": {{ preset_id | to_json }}}}

music_assistant_dsp_reset:
  url: http://192.168.0.15:8095/api
  method: POST
  content_type: application/json
  timeout: 20
  headers:
    authorization: !secret music_assistant_api_bearer
  payload: >
    {"message_id": "ha_dsp_reset", "command": "config/players/dsp/save",
     "args": {"player_id": {{ player_id | to_json }},
              "config": {"enabled": false, "filters": [], "input_gain": 0.0,
                         "output_gain": 0.0, "preset_id": null}}}

# ─── Music Assistant player max volume ───
# Sets one MA player's "Maximum volume" (player config, 0-100). MA *scales* the 0-100 volume
# slider onto 0..max_volume on the device rather than clamping it: at 50 the slider still reads
# 100 when the device is at 50%. Changing the cap never pushes a volume to the device; a device
# already above a lowered cap gets clamped down by MA. Used by the party volume cap. A missing
# max_volume fails the render instead of writing 0.
music_assistant_player_max_volume:
  url: http://192.168.0.15:8095/api
  method: POST
  content_type: application/json
  timeout: 20
  headers:
    authorization: !secret music_assistant_api_bearer
  payload: >
    {"message_id": "ha_max_volume", "command": "config/players/save",
     "args": {"player_id": {{ player_id | to_json }},
              "values": {"max_volume": {{ max_volume | int }}}}}
