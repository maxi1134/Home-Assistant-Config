  ########################## Universal salon Chromecast  ##########################
  # Sony Bravia with Google TV inside, five integrations:
  #   cast              media_player.salon_chromecast        now-playing while casting
  #   androidtv_remote  media_player.bravia_4k_ae2           power state, foreground app, mute state
  #   sony_tv_rs232     media_player.sony_tv                 power, input, volume and mute commands
  #   jellyfin          media_player.salon_sony_tv           the Jellyfin app's own playback
  #   braviatv          media_player.salon_salon_bravia_tv   exact current input, volume level
  # Power, input, volume and mute go over RS-232 (discrete, and independent of the
  # TV's network API). Power only over RS-232: Android TV Remote's power is a POWER
  # key toggle that could undo it. Input/volume/mute are skipped ('none') while
  # bravia_4k_ae2 reports standby, where RS-232 commands fail.
  # braviatv (IP control) was re-added on 2026-10-22. It reports any app as
  # "Smart TV" with no playback state, and polls every 2 min in standby, so it lags
  # a TV just woken. It supplies the input (source, source list, the Batocera helper
  # below) and the volume level.
  # This TV reads 'off' whenever nobody is using it, even with the screen on, so
  # the Speaker/Chromecast mutual mute automation leaves the room's music alone:
  # - screen on with nothing playing (home screen, screensaver): the macro reads
  #   that off itself while the cast is off ('unavailable' while the cast is)
  # - Jellyfin on its menus. Android TV Remote only says which app is in front, so
  #   while that is Jellyfin its own client (media_player.salon_sony_tv, polled
  #   every 10 s) decides: playing/paused/buffering as reported, anything else
  #   (menus, or no session yet) reads off. During playback it is also the active
  #   child, for titles, series and artwork.
  # - Batocera (retro console, HDMI 1) with no controller connected, where the cast
  #   reports the input viewer ("TV") as playing. binary_sensor.salon_tv_batocera_idle
  #   (a template helper, also used by "Mute the salon TV while Batocera sits idle
  #   on HDMI 1") holds that rule: the foreground app is the input viewer
  #   (com.sony.dtv.tvlin), on HDMI 1, with batocera_controller off, unavailable or
  #   count 0. The input comes from IP control when it reports one
  #   (extInput:hdmi?port=1, polled every 10 s), else RS-232 (every 60 s, keeps the
  #   last input even while an app is up), else HDMI 1 is assumed.
  # An overlay (the settings panel, notifications) puts com.android.systemui in front
  # of whatever plays underneath, so while it is up the state and active child keep
  # their current values (read back from this entity) until the overlay closes.
  - platform: universal
    unique_id: universal_salon_chromecast
    name: Universal salon chromecast
    device_class: tv
    children:
      - media_player.salon_chromecast
      - media_player.bravia_4k_ae2
    browse_media_entity: media_player.salon_chromecast
    child_attributes:
      - media_library_title
    active_child_template: >-
      {%- from 'universal_tv.jinja' import tv_child -%}
      {%- set child = tv_child('media_player.salon_chromecast', 'media_player.bravia_4k_ae2', '', 'media_player.bravia_4k_ae2') -%}
      {%- set jellyfin_plays = is_state_attr('media_player.bravia_4k_ae2', 'app_id', 'org.jellyfin.androidtv')
            and states('media_player.salon_sony_tv') in ['playing', 'paused', 'buffering'] -%}
      {%- set child = 'media_player.salon_sony_tv' if jellyfin_plays else child -%}
      {%- set held = state_attr('media_player.universal_salon_chromecast', 'active_child') -%}
      {{- held if held and is_state_attr('media_player.bravia_4k_ae2', 'app_id', 'com.android.systemui') else child -}}
    state_template: >-
      {%- from 'universal_tv.jinja' import tv_state -%}
      {%- set state = tv_state('media_player.salon_chromecast', 'media_player.bravia_4k_ae2', '', 'media_player.bravia_4k_ae2') -%}
      {%- if is_state_attr('media_player.bravia_4k_ae2', 'app_id', 'org.jellyfin.androidtv') -%}
        {%- set jellyfin = states('media_player.salon_sony_tv') -%}
        {%- set state = jellyfin if jellyfin in ['playing', 'paused', 'buffering'] else 'on' -%}
      {%- endif -%}
      {%- set state = 'off' if state == 'on' or is_state('binary_sensor.salon_tv_batocera_idle', 'on') else state -%}
      {%- set held = states('media_player.universal_salon_chromecast') -%}
      {{- held if is_state_attr('media_player.bravia_4k_ae2', 'app_id', 'com.android.systemui')
            and held not in ['unknown', 'unavailable'] else state -}}
    commands:
      turn_on:
        action: media_player.turn_on
        target:
          entity_id: media_player.sony_tv
      turn_off:
        action: media_player.turn_off
        target:
          entity_id: media_player.sony_tv
      volume_mute:
        action: media_player.volume_mute
        target: &salon_rs232
          entity_id: "{{ 'none' if is_state('media_player.bravia_4k_ae2', 'off') else 'media_player.sony_tv' }}"
        data:
          is_volume_muted: "{{ is_volume_muted }}"
      volume_set:
        action: media_player.volume_set
        target: *salon_rs232
        data:
          volume_level: "{{ volume_level }}"
      volume_up:
        action: media_player.volume_up
        target: *salon_rs232
      volume_down:
        action: media_player.volume_down
        target: *salon_rs232
      # The source list is IP control's input titles ("HDMI 3 (eARC/ARC)"); RS-232
      # still switches, under its own names ("hdmi3"). A name RS-232 doesn't know
      # goes to IP control.
      select_source:
        action: media_player.select_source
        target:
          entity_id: >-
            {%- set rs232 = source | regex_replace('^HDMI (\\d).*$', 'hdmi\\1') -%}
            {{- 'none' if is_state('media_player.bravia_4k_ae2', 'off')
                else 'media_player.sony_tv' if rs232 in (state_attr('media_player.sony_tv', 'source_list') or [])
                else 'media_player.salon_salon_bravia_tv' -}}
        data:
          source: >-
            {%- set rs232 = source | regex_replace('^HDMI (\\d).*$', 'hdmi\\1') -%}
            {{- rs232 if rs232 in (state_attr('media_player.sony_tv', 'source_list') or []) else source -}}
      media_play:
        action: media_player.media_play
        target: &salon_transport
          entity_id: >-
            {%- from 'universal_tv.jinja' import tv_target -%}
            {{- tv_target('media_player.salon_chromecast', 'media_player.bravia_4k_ae2', '', 'media_player.bravia_4k_ae2') or 'none' -}}
      media_pause:
        action: media_player.media_pause
        target: *salon_transport
      media_play_pause:
        action: media_player.media_play_pause
        target: *salon_transport
      media_stop:
        action: media_player.media_stop
        target: *salon_transport
      media_next_track:
        action: script.turn_on
        target:
          entity_id: script.universal_tv_skip
        data:
          variables:
            direction: next
            cast: media_player.salon_chromecast
            tv: media_player.bravia_4k_ae2
            native: media_player.bravia_4k_ae2
      media_previous_track:
        action: script.turn_on
        target:
          entity_id: script.universal_tv_skip
        data:
          variables:
            direction: previous
            cast: media_player.salon_chromecast
            tv: media_player.bravia_4k_ae2
            native: media_player.bravia_4k_ae2
      play_media:
        action: media_player.play_media
        target:
          entity_id: media_player.salon_chromecast
        data:
          media_content_type: "{{ media_content_type }}"
          media_content_id: "{{ media_content_id }}"
    attributes:
      # Mute is read from Android TV Remote, which the TV pushes the moment it
      # changes, even though the commands above go over RS-232. RS-232 only noticed a
      # change 18-47 s later (2026-10-25). Right after power-on Android TV Remote says
      # unmuted for 3-7 s before the real value comes in.
      is_volume_muted: media_player.bravia_4k_ae2|is_volume_muted
      # Volume comes from IP control (polled every 10 s while on), because Android TV
      # Remote reports 0 while muted and RS-232 is slower. In standby IP control polls
      # every 2 min, so it can take ~75 s after a power-on to have a volume again.
      volume_level: media_player.salon_salon_bravia_tv|volume_level
      # IP control reports the input actually on screen (none while an app is up);
      # RS-232 keeps reporting the last input it selected.
      source: media_player.salon_salon_bravia_tv|source
      source_list: media_player.salon_salon_bravia_tv|source_list


