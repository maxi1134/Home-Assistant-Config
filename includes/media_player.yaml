          entity_id: script.universal_tv_skip
        data:
          variables:
            direction: previous
            cast: media_player.workshop_chromecast
            tv: media_player.lg_workshop_tv
            tv_input: com.webos.app.hdmi1
            native: media_player.workshop_google_tv
      play_media:
        action: media_player.play_media
        target:
          entity_id: media_player.workshop_chromecast
        data:
          media_content_type: "{{ media_content_type }}"
          media_content_id: "{{ media_content_id }}"
    attributes:
      is_volume_muted: media_player.workshop_chromecast|is_volume_muted
      volume_level: media_player.workshop_chromecast|volume_level
      source: media_player.lg_workshop_tv|source
      source_list: media_player.lg_workshop_tv|source_list


  ##########################  following speaker ##########################

  - platform: universal
    name: Universal following media
    unique_id: universal_following_media
    # Passes on the library the TV universals carry (see child_attributes above).
    child_attributes:
      - media_library_title
    children:
      - media_player.group_mass_home_group_speakers
      - media_player.mass_bedroom_vpe_speaker
      - media_player.mass_bathroom_vpe_speaker
      - media_player.mass_workshop_wiim_speaker
      - media_player.mass_kitchen_wiim_speaker
      - media_player.mass_lounge_wiim_speaker
      - media_player.mass_hallway_wiim_speaker
      - media_player.mass_salon_wiim_speaker
      - media_player.mass_closet_vpe_speaker
      - media_player.mass_patio_wiim_speaker
      - media_player.universal_bedroom_chromecast
      - media_player.universal_salon_chromecast
      - media_player.universal_kitchen_chromecast
      - media_player.universal_hotbox_top_chromecast
      - media_player.universal_patio_chromecast
      - media_player.universal_workshop_chromecast
      - media_player.mass_hotbox_wiim_speaker
    active_child_template: >-
      {% set location = states('sensor.maxi_location_by_petro_v2') %}
      {% set room_children = {
        'bedroom': ['media_player.universal_bedroom_chromecast', 'media_player.mass_bedroom_vpe_speaker'],
        'workshop': ['media_player.universal_workshop_chromecast', 'media_player.mass_workshop_wiim_speaker'],
        'kitchen': ['media_player.universal_kitchen_chromecast', 'media_player.mass_kitchen_wiim_speaker'],
        'lounge': ['media_player.mass_lounge_wiim_speaker'],
        'hallway': ['media_player.mass_hallway_wiim_speaker'],
        'salon': ['media_player.universal_salon_chromecast', 'media_player.mass_salon_wiim_speaker'],
        'closet': ['media_player.mass_closet_vpe_speaker'],
        'patio': ['media_player.universal_patio_chromecast', 'media_player.mass_patio_wiim_speaker'],
        'hotbox': ['media_player.universal_hotbox_top_chromecast', 'media_player.mass_hotbox_wiim_speaker'],
        'bathroom': ['media_player.mass_bathroom_vpe_speaker']
      } %}
      {% set candidates = room_children.get(location, []) %}
      {% set ns = namespace(active='') %}
      {% for entity_id in candidates if not ns.active %}
        {% if states(entity_id) == 'playing' and state_attr(entity_id, 'is_volume_muted') != true %}
          {% set ns.active = entity_id %}
        {% endif %}
      {% endfor %}
      {% for entity_id in candidates if not ns.active %}
        {% if states(entity_id) not in ['unknown', 'unavailable', 'off', 'idle'] and state_attr(entity_id, 'is_volume_muted') != true %}
          {% set ns.active = entity_id %}
        {% endif %}
      {% endfor %}
      {{ ns.active if ns.active else 'media_player.group_mass_home_group_speakers' }}
    state_template: >-
      {% set location = states('sensor.maxi_location_by_petro_v2') %}
      {% set room_children = {
        'bedroom': ['media_player.universal_bedroom_chromecast', 'media_player.mass_bedroom_vpe_speaker'],
        'workshop': ['media_player.universal_workshop_chromecast', 'media_player.mass_workshop_wiim_speaker'],
        'kitchen': ['media_player.universal_kitchen_chromecast', 'media_player.mass_kitchen_wiim_speaker'],
        'lounge': ['media_player.mass_lounge_wiim_speaker'],
        'hallway': ['media_player.mass_hallway_wiim_speaker'],
        'salon': ['media_player.universal_salon_chromecast', 'media_player.mass_salon_wiim_speaker'],
        'closet': ['media_player.mass_closet_vpe_speaker'],
        'patio': ['media_player.universal_patio_chromecast', 'media_player.mass_patio_wiim_speaker'],
        'hotbox': ['media_player.universal_hotbox_top_chromecast', 'media_player.mass_hotbox_wiim_speaker'],
        'bathroom': ['media_player.mass_bathroom_vpe_speaker']
      } %}
      {% set candidates = room_children.get(location, []) %}
      {% set ns = namespace(active='') %}
      {% for entity_id in candidates if not ns.active %}
        {% if states(entity_id) == 'playing' and state_attr(entity_id, 'is_volume_muted') != true %}
          {% set ns.active = entity_id %}
        {% endif %}
      {% endfor %}
      {% for entity_id in candidates if not ns.active %}
        {% if states(entity_id) not in ['unknown', 'unavailable', 'off', 'idle'] and state_attr(entity_id, 'is_volume_muted') != true %}
          {% set ns.active = entity_id %}
        {% endif %}
      {% endfor %}
      {{ states(ns.active if ns.active else 'media_player.group_mass_home_group_speakers') }}
