  ##########################  CHROMECASTS  ##########################
  # One universal per video Chromecast; each one is the TV of its room.
  # Shared logic: custom_templates/universal_tv.jinja (see its header).
  #   state     tv_state: 'off' when the TV is off; else the cast session's state,
  #             else a native TV app's playback, else 'idle' while a cast app is
  #             open but stopped. With the screen on and nothing playing it never
  #             reads 'on' for an idle or missing cast (Maxi, 2026-10-27): 'off'
  #             while the cast is off, 'unavailable' while it is unavailable or
  #             unknown. A Home Assistant dashboard on a screen counts as 'on',
  #             except on the kitchen hub where it is the resting screen and
  #             counts as 'off'.
  #   child     tv_child: the Plex entity playing the cast's Plex ratingKey, so the
  #             Plex artwork and metadata show (and media_library_title, which the
  #             light automations read through active_child); else the native TV
  #             app while it plays; else the cast.
  #   play / pause / stop -> tv_target: the cast session, else the native app while
  #             it plays, else nobody ('none').
  #   next / previous     -> script.universal_tv_skip (cast queue, Plex client,
  #             Android TV media key, then the neighbouring Plex TV episode).
  #   power     the TV's own integration where there is one; a plain Chromecast can
  #             wake its TV over HDMI-CEC but not put it in standby, so turn_off
  #             only stops casting there.
  # media_seek can't be overridden in a universal: it always goes to the active
  # child, so there is no seeking while a Plex Cast session is the child (Plex
  # Cast clients refuse remote control; pause/play/stop go to the cast instead).
  # child_attributes copies media_library_title ("Movies", "TV Shows", "Visuals")
  # from the active Plex child onto the TV itself. Core universal only exposes
  # standard media attributes, so this key needs custom_components/universal, a
  # thin subclass of core's player; without it core silently ignores the key.

  ########################## Universal bedroom Chromecast  ##########################
  # Plain Chromecast and no TV integration: the cast is the only power witness
  # (it reads 'off' when HDMI-CEC says the TV is off or on another input).
  - platform: universal
    unique_id: universal_bedroom_chromecast
    name: Universal bedroom chromecast
    device_class: tv
    children:
      - media_player.bedroom_chromecast
    browse_media_entity: media_player.bedroom_chromecast
    child_attributes:
      - media_library_title
    active_child_template: >-
      {%- from 'universal_tv.jinja' import tv_child -%}
      {{- tv_child('media_player.bedroom_chromecast') -}}
    state_template: >-
      {%- from 'universal_tv.jinja' import tv_state -%}
      {{- tv_state('media_player.bedroom_chromecast') -}}
    commands:
      turn_on:
        action: media_player.turn_on
        target: &bedroom_cast
          entity_id: media_player.bedroom_chromecast
      turn_off:
        action: media_player.turn_off
        target: *bedroom_cast
      volume_mute:
        action: media_player.volume_mute
        target: *bedroom_cast
        data:
          is_volume_muted: "{{ is_volume_muted }}"
      volume_set:
        action: media_player.volume_set
        target: *bedroom_cast
        data:
          volume_level: "{{ volume_level }}"
      volume_up:
        action: media_player.volume_up
        target: *bedroom_cast
      volume_down:
        action: media_player.volume_down
        target: *bedroom_cast
      media_play:
        action: media_player.media_play
        target: &bedroom_transport
          entity_id: >-
            {%- from 'universal_tv.jinja' import tv_target -%}
            {{- tv_target('media_player.bedroom_chromecast') or 'none' -}}
      media_pause:
        action: media_player.media_pause
        target: *bedroom_transport
      media_play_pause:
        action: media_player.media_play_pause
        target: *bedroom_transport
      media_stop:
        action: media_player.media_stop
        target: *bedroom_transport
      media_next_track:
        action: script.turn_on
        target:
