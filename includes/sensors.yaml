# ─── REST Sensor: Frigate Event ID ───
# Polls the Frigate NVR API for the most recent front door camera event.
# Used to retrieve snapshots/clips of the latest detected event.
  - platform: rest
    name: "latest frigate event id"
    unique_id: latest_frigate_event_id
    resource: 'http://192.168.0.11:5000/api/events?cameras=front_door_camera&limit=1'
    method: GET
    scan_interval: 60
    timeout: 120 
    value_template: "{{ value_json[0].id }}"