  # Add support for non-unicode characters by using better glyphset
  font_glyphsets: "GF_Latin_Core"
  # for Greek use "Noto Sans" for other languages use a compatible font family
  font_family: Figtree

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0  # esphome-audio-stack v2026.10.x requires ESPHome 2026.9+
  name_add_mac_suffix: true
  on_boot:
    - priority: 600
      then:
        - script.execute: draw_display
        - delay: 30s
        - if:
            condition:
              lambda: return id(init_in_progress);
            then:
              - lambda: id(init_in_progress) = false;
              - script.execute: draw_display
    # After every component's setup (incl. the codec, which programs its own
    # 0 dB default): re-apply the restored Speaker Gain
    - priority: -100
      then:
        - script.execute: apply_speaker_gain

external_components:
  # Full-duplex I2S + acoustic echo cancellation: the audio backend of
  # esphome-intercom, maintained in its own repo since 2026.7. The AEC is what
  # lets micro_wake_word hear "Stop" over the Box's own speaker.
  - source: github://n-IA-hane/esphome-audio-stack@v2026.10.2
    components: [esp_audio_stack, esp_aec]

esp32:
  board: esp32s3box
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      # esp_audio_stack / esp-sr allocate with plain malloc: route large
      # allocations to PSRAM and keep internal RAM for DMA and Wi-Fi
      # (mirrors esphome-intercom packages/platform/esp32s3_base.yaml)
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_USE_CAPS_ALLOC: "n"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "4096"
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "65536"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      CONFIG_MDNS_TASK_CREATE_FROM_SPIRAM: "y"
      CONFIG_MDNS_MEMORY_ALLOC_SPIRAM: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"

psram:
  mode: octal
  speed: 80MHz

# Keep the FLAC decoder's buffers out of internal RAM: it allocates on every
# TTS response, while the AEC and micro_wake_word are running
audio:
  codecs:
    flac:
      buffer_memory: psram

api:
  on_client_connected:
    - script.execute: draw_display
  on_client_disconnected:
    - script.execute: draw_display

ota:
  - platform: esphome
    id: ota_esphome

logger:
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ap:
captive_portal:

interval:
  # Re-layer the Speaker Gain within 5 s of any codec rewrite (one i2c read when idle)
  - interval: 5s
    then:
      - if:
          condition:
            lambda: 'return !id(init_in_progress);'
          then:
            - script.execute: apply_speaker_gain

button:
  - platform: factory_reset
    id: factory_reset_btn
    internal: true

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      ignore_strapping_warning: true
      mode: INPUT_PULLUP
      inverted: true
    id: left_top_button
    internal: true
    # Since 2026.3 GPIO interrupts wake the loop instantly; debounce so contact bounce
    # doesn't invalidate the multi-click (which then locks out for 1s)
    filters:
      - delayed_on_off: 20ms
    on_multi_click:
      - timing:
          - ON for at least 50ms
          - OFF for at least 50ms
        then:
          - switch.turn_off: timer_ringing
      - timing:
          - ON for at least 10s
        then:
          - button.press: factory_reset_btn
touchscreen:
  - platform: tt21100
    id: box_touch
    interrupt_pin:
      number: GPIO3
      ignore_strapping_warning: true
    # The address is usually 0x24 for these units
    address: 0x24
    on_touch:
      - then:
          - script.execute: touch_action
output:
  - platform: ledc
    pin:
      number: GPIO45
      ignore_strapping_warning: true
    id: backlight_output

light:
  - platform: monochromatic
    id: led
    name: Screen
    icon: "mdi:television"
    entity_category: config
    output: backlight_output
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 250ms

i2c:
  id: i2c_bus
  scl: GPIO18
  sda: GPIO8

# Raw ES8311 register access for the Speaker Gain boost (esp_codec_dev owns the
# codec in TDM mode; the boost is layered on top of its DAC volume register)
i2c_device:
  - id: es8311_raw
    i2c_id: i2c_bus
    address: 0x18

esp_aec:
  id: aec_processor
  sample_rate: 16000
  filter_length: 4
  mode: sr_low_cost

# Full-duplex 4-slot TDM bus in codec mode, as on the Box-3 fleet: esp_codec_dev
# owns the ES7210 (ADC) and ES8311 (DAC). The ES8311 output is wired back into
# ES7210 MIC3, so the AEC reference is captured by the same ADC at the same
# instant as the echo, independent of playback buffering (Espressif's
# esp-skainet reads the OG Box and the Box-3 with the same "RMNM" layout).
# Slot map measured on the fleet: slot 0 = MIC1, slot 1 = MIC3 loopback.
# OG S3-BOX pin: word select is GPIO47 (GPIO45 on the Box-3, the backlight here).
esp_audio_stack:
  id: audio_stack
  i2s_lrclk_pin: GPIO47
  i2s_bclk_pin: GPIO17
  i2s_mclk_pin: GPIO2
  i2s_din_pin: GPIO16
  i2s_dout_pin: GPIO15
  sample_rate: 48000
  output_sample_rate: 16000
  slot_bit_width: 16  # TDM: 16-bit slots x4
  bits_per_sample: 16
  correct_dc_offset: true
  processor_id: aec_processor
  codec:
    i2c_id: i2c_bus
    input:
      type: es7210
      address: 0x40
      mic_selected: 0x0F
      gain_db: 24.0     # same as the ESPHome es7210 driver default used before
      ref_channel: 2    # MIC3 = the DAC loopback (indexes MIC registers, not TDM slots)
      ref_gain_db: 0.0  # unity on the line-level loopback; higher gains clip it
    output:
      type: es8311
      address: 0x18
      use_mclk: true
      no_dac_ref: true
  tdm_total_slots: 4
  tdm_mic_slots: [0]
  tdm_ref_slot: 1
  use_tdm_reference: true
  buffers_in_psram: true
  audio_task_stack_in_psram: true

microphone:
  - platform: esp_audio_stack
    id: box_mic

speaker:
  - platform: esp_audio_stack
    id: box_speaker
    sample_rate: 48000
    timeout: 500ms  # release the stack 500 ms after the last write (platform default: never)

media_player:
  - platform: speaker
    name: None
    id: speaker_media_player
    # Codec mode: this volume is a software gain (-49..0 dB) and the DAC sits at
    # 0 dB + Speaker Gain (6 dB), so 0.22..1.0 gives about -32..+6 dB across HA's
    # slider, the same range the old es8311 driver gave with 0.5..0.8
    volume_min: 0.22
    volume_max: 1.0
    announcement_pipeline:
      speaker: box_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1  # S3 Box only has one output channel
    files:
      - id: timer_finished_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/timer_finished.flac
    on_announcement:
      - script.execute: apply_speaker_gain
      # The streaming (HA-side) wake word still yields to playback. The
      # on-device micro_wake_word keeps listening through it (full duplex +
      # AEC), so "Stop" can interrupt.
      - if:
          condition:
            and:
              - microphone.is_capturing:
              - lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - script.execute: stop_wake_word
            - wait_until:
                - not:
                    voice_assistant.is_running:
      - script.execute: arm_stop_word
      # Since VA isn't running, this is user-intiated media playback. Draw the mute display
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};
            - script.execute: draw_display
    on_idle:
      # Since VA isn't running, this is the end of user-intiated media playback. Restart the wake word.
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - script.execute: start_wake_word
            - script.execute: set_idle_or_mute_phase
            - script.execute: draw_display

micro_wake_word:
  id: mww
  microphone: box_mic
  # Keep listening after a detection so a wake word or "Stop" can interrupt the reply
  stop_after_detection: false
  models:
    - okay_nabu
    - hey_mycroft
    - hey_jarvis
    # Halt word. Internal, so it stays out of HA's wake word selection. It is
    # only armed while the Box is talking or a timer is ringing (arm_stop_word
    # and timer_ringing); internal models always boot disabled.
    - model: https://raw.githubusercontent.com/TaterTotterson/microWakeWords/refs/heads/main/microWakeWords/stop.json
      id: stop
      internal: true
      probability_cutoff: 0.40  # same tuning as the Box-3 fleet (model default 0.5)
      sliding_window_size: 3    # model default 5
  on_wake_word_detected:
    # A ringing timer: any wake word, including "Stop", silences it
    - if:
        condition:
          switch.is_on: timer_ringing
        then:
          - switch.turn_off: timer_ringing
        else:
          - if:
              # Assistant mid-turn or the Box is talking: halt it
              condition:
                or:
                  - voice_assistant.is_running:
                  - media_player.is_announcing:
              then:
                - script.execute: halt_playback
              # Idle: activation words start a turn, a stray "Stop" does nothing
              else:
                - if:
                    condition:
                      lambda: return wake_word != "Stop";
                    then:
                      - voice_assistant.start:
                          wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: box_mic
  media_player: speaker_media_player
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_listening:
    - lambda: id(voice_assistant_phase) = ${voice_assist_listening_phase_id};
    - text_sensor.template.publish:
        id: text_request
        state: "..."
    - text_sensor.template.publish:
        id: text_response
        state: "..."
    - script.execute: draw_display
  on_stt_vad_end:
    - lambda: id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
    - script.execute: draw_display
  on_stt_end:
    - text_sensor.template.publish:
        id: text_request
        state: !lambda return x;
    - script.execute: draw_display
  on_tts_start:
    - text_sensor.template.publish:
        id: text_response
        state: !lambda return x;
    - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
    - script.execute: draw_display
  on_end:
    # Wait a short amount of time to see if an announcement starts
    - wait_until:
        condition:
          - media_player.is_announcing:
        timeout: 0.5s
    # Wait for the reply to finish. Not speaker.is_playing: the duplex bus
    # never has to be free, and the stack's speaker can linger in RUNNING
    - wait_until:
        not:
          media_player.is_announcing:
    # Re-arm the wake word if it stopped (mWW, or HA's streaming wake word after a touch-started turn)
    - script.execute: start_wake_word
    - script.execute: set_idle_or_mute_phase
    - script.execute: draw_display
    # Clear text sensors
    - text_sensor.template.publish:
        id: text_request
        state: ""
    - text_sensor.template.publish:
        id: text_response
        state: ""
  on_error:
    - if:
        condition:
          lambda: return !id(init_in_progress);
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_error_phase_id};
          - script.execute: draw_display
          - delay: 1s
          - if:
              condition:
                switch.is_off: mute
              then:
                - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
              else:
                - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};
          - script.execute: draw_display
  on_client_connected:
    - lambda: id(init_in_progress) = false;
    - script.execute: start_wake_word
    - script.execute: set_idle_or_mute_phase
    - script.execute: draw_display
  on_client_disconnected:
    - script.execute: stop_wake_word
    - lambda: id(voice_assistant_phase) = ${voice_assist_not_ready_phase_id};
    - script.execute: draw_display
  on_timer_started:
    - script.execute: draw_display
  on_timer_cancelled:
    - script.execute: draw_display
  on_timer_updated:
    - script.execute: draw_display
  on_timer_tick:
    - script.execute: draw_display
  on_timer_finished:
    - switch.turn_on: timer_ringing
    - wait_until:
        media_player.is_announcing:
    - lambda: id(voice_assistant_phase) = ${voice_assist_timer_finished_phase_id};
    - script.execute: draw_display

script:
  # Raise the micro_wake_word inference task from priority 3 to 8 so TTS
  # decoding and the media pipeline can't starve it ("Stop" during loud
  # playback). Same value as the Box-3 fleet and esphome-intercom's
  # runtime/mww_task_priority.yaml. The "mww" task is recreated on every start.
  - id: boost_mww_priority
    mode: restart
    then:
      - wait_until:
          condition:
            lambda: 'return xTaskGetHandle("mww") != nullptr;'
          timeout: 2s
      - lambda: |-
          TaskHandle_t mww_task = xTaskGetHandle("mww");
          if (mww_task) {
            vTaskPrioritySet(mww_task, 8);
          }
  # Codec-mode Speaker Gain (from the Box-3 fleet): esp_codec_dev owns ES8311
  # reg 0x32 (DAC volume, 0.5 dB/step, rewritten on volume changes and stack
  # reopen) and its curve caps at 0 dB. Layer the boost on top: if the register
  # differs from what we last wrote, the codec rewrote it, so take that as the
  # new base and re-add the boost.
  - id: apply_speaker_gain
    mode: queued
    max_runs: 2
    then:
      - lambda: |-
          float db = id(speaker_gain).state;
          if (isnan(db)) db = 6.0f;
          db = std::max(0.0f, std::min(12.0f, db));
          const int delta = (int) lroundf(db * 2.0f);
          uint8_t reg = 0;
          if (!id(es8311_raw).read_byte(0x32, &reg)) return;
          int base;
          if (id(gain_last_written) >= 0 && reg == (uint8_t) id(gain_last_written)) {
            base = id(gain_base);   // untouched since our last write
          } else {
            base = reg;             // codec rewrote the register: new base
          }
          int target = base + delta;
          if (target > 255) target = 255;
          if ((uint8_t) target != reg) {
            id(es8311_raw).write_byte(0x32, (uint8_t) target);
          }
          id(gain_base) = base;
          id(gain_last_written) = target;
  # Stop the assistant turn and whatever the Box is saying
  - id: halt_playback
    then:
      - voice_assistant.stop:
      - media_player.stop:
          announcement: true
  # Arm "Stop" while an announcement (TTS reply, HA announcement) plays. The 1 s
  # delay skips very short sounds and lets the AEC settle (Voice PE pattern).
  - id: arm_stop_word
    mode: restart
    then:
      - wait_until:
          condition:
            media_player.is_announcing:
          timeout: 5s
      - delay: 1s
      - if:
          condition:
            media_player.is_announcing:
          then:
            - logger.log: "Stop word armed"
            - micro_wake_word.enable_model: stop
            - wait_until:
                not:
                  media_player.is_announcing:
      - if:
          condition:
            switch.is_off: timer_ringing
          then:
            - logger.log: "Stop word disarmed"
            - micro_wake_word.disable_model: stop
  # Touch: talk when idle; stop the timer, the assistant or an announcement otherwise
  - id: touch_action
    then:
      - if:
          condition:
            switch.is_on: timer_ringing
          then:
            - logger.log: "Touch: stopping timer"
            - switch.turn_off: timer_ringing
          else:
            - if:
                # Listening, thinking, replying, or playing an announcement
                condition:
                  or:
                    - media_player.is_announcing:
                    - lambda: |-
                        return id(voice_assistant_phase) == ${voice_assist_listening_phase_id} ||
                               id(voice_assistant_phase) == ${voice_assist_thinking_phase_id} ||
                               id(voice_assistant_phase) == ${voice_assist_replying_phase_id};
                then:
                  - logger.log: "Touch: stopping assistant"
                  - script.execute: halt_playback
                  - script.execute: set_idle_or_mute_phase
                  - script.execute: draw_display
                  # A stopped turn also ends HA's streaming wake word; re-arm it
                  - wait_until:
                      condition:
                        not:
                          voice_assistant.is_running:
                      timeout: 2s
                  - script.execute: start_wake_word
                else:
                  - if:
                      condition:
                        and:
                          - switch.is_off: mute
                          - api.connected:
                          - lambda: |-
                              return id(voice_assistant_phase) == ${voice_assist_idle_phase_id} ||
                                     id(voice_assistant_phase) == ${voice_assist_error_phase_id};
                      then:
                        - logger.log: "Touch: starting assistant"
                        # The streaming wake word keeps VA busy: stop it first
                        # (on_end re-arms it through start_wake_word)
                        - if:
                            condition:
                              lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
                            then:
                              - lambda: id(va).set_use_wake_word(false);
                              - voice_assistant.stop:
                              - wait_until:
                                  condition:
                                    not:
                                      voice_assistant.is_running:
                                  timeout: 2s
                        - voice_assistant.start:
  - id: draw_display
    then:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - if:
                condition:
                  wifi.connected:
                then:
                  - if:
                      condition:
                        api.connected:
                      then:
                        - lambda: |
                            switch(id(voice_assistant_phase)) {
                              case ${voice_assist_listening_phase_id}:
                                id(s3_box_lcd).show_page(listening_page);
                                id(s3_box_lcd).update();
                                break;
                              case ${voice_assist_thinking_phase_id}:
                                id(s3_box_lcd).show_page(thinking_page);
                                id(s3_box_lcd).update();
                                break;
                              case ${voice_assist_replying_phase_id}:
                                id(s3_box_lcd).show_page(replying_page);
                                id(s3_box_lcd).update();
                                break;
                              case ${voice_assist_error_phase_id}:
                                id(s3_box_lcd).show_page(error_page);
                                id(s3_box_lcd).update();
                                break;
                              case ${voice_assist_muted_phase_id}:
                                id(s3_box_lcd).show_page(muted_page);
                                id(s3_box_lcd).update();
                                break;
                              case ${voice_assist_not_ready_phase_id}:
                                id(s3_box_lcd).show_page(no_ha_page);
                                id(s3_box_lcd).update();
                                break;
                              case ${voice_assist_timer_finished_phase_id}:
                                id(s3_box_lcd).show_page(timer_finished_page);
                                id(s3_box_lcd).update();
                                break;
                              default:
                                id(s3_box_lcd).show_page(idle_page);
                                id(s3_box_lcd).update();
                            }
                      else:
                        - display.page.show: no_ha_page
                        - component.update: s3_box_lcd
                else:
                  - display.page.show: no_wifi_page
                  - component.update: s3_box_lcd
          else:
            - display.page.show: initializing_page
            - component.update: s3_box_lcd

  - id: fetch_first_active_timer
    then:
      - lambda: |
          const auto &timers = id(va).get_timers();
          auto output_timer = *timers.begin();
          for (const auto &timer : timers) {
            if (timer.is_active && timer.seconds_left <= output_timer.seconds_left) {
              output_timer = timer;
            }
          }
          id(global_first_active_timer) = output_timer;
  - id: check_if_timers_active
    then:
      - lambda: |
          const auto &timers = id(va).get_timers();
          bool output = false;
          for (const auto &timer : timers) {
            if (timer.is_active) {
              output = true;
            }
          }
          id(global_is_timer_active) = output;
  - id: fetch_first_timer
    then:
      - lambda: |
          const auto &timers = id(va).get_timers();
          auto output_timer = *timers.begin();
          for (const auto &timer : timers) {
            if (timer.seconds_left <= output_timer.seconds_left) {
              output_timer = timer;
            }
          }
          id(global_first_timer) = output_timer;
  - id: check_if_timers
    then:
      - lambda: |
          const auto &timers = id(va).get_timers();
          bool output = false;
          for (const auto &timer : timers) {
            if (timer.is_active) {
              output = true;
            }
          }
          id(global_is_timer) = output;

  - id: draw_timer_timeline
    then:
      - lambda: |
          id(check_if_timers_active).execute();
          id(check_if_timers).execute();
          if (id(global_is_timer_active)){
            id(fetch_first_active_timer).execute();
            int active_pixels = round( 320 * id(global_first_active_timer).seconds_left / max(id(global_first_active_timer).total_seconds , static_cast<uint32_t>(1)) );
            if (active_pixels > 0){
              id(s3_box_lcd).filled_rectangle(0 , 225 , 320 , 15 , Color::WHITE );
              id(s3_box_lcd).filled_rectangle(0 , 226 , active_pixels , 13 , id(active_timer_color) );
            }
          } else if (id(global_is_timer)){
            id(fetch_first_timer).execute();
            int active_pixels = round( 320 * id(global_first_timer).seconds_left / max(id(global_first_timer).total_seconds , static_cast<uint32_t>(1)));
            if (active_pixels > 0){
              id(s3_box_lcd).filled_rectangle(0 , 225 , 320 , 15 , Color::WHITE );
              id(s3_box_lcd).filled_rectangle(0 , 226 , active_pixels , 13 , id(paused_timer_color) );
            }
          }
  - id: draw_active_timer_widget
    then:
      - lambda: |
          id(check_if_timers_active).execute();
          if (id(global_is_timer_active)){
            id(s3_box_lcd).filled_rectangle(80 , 40 , 160 , 50 , Color::WHITE );
            id(s3_box_lcd).rectangle(80 , 40 , 160 , 50 , Color::BLACK );

            id(fetch_first_active_timer).execute();
            int hours_left = floor(id(global_first_active_timer).seconds_left / 3600);
            int minutes_left = floor((id(global_first_active_timer).seconds_left - hours_left * 3600) / 60);
            int seconds_left = id(global_first_active_timer).seconds_left - hours_left * 3600 - minutes_left * 60 ;
            auto display_hours = (hours_left < 10 ? "0" : "") + std::to_string(hours_left);
            auto display_minute = (minutes_left < 10 ? "0" : "") + std::to_string(minutes_left);
            auto display_seconds = (seconds_left  < 10 ? "0" : "") + std::to_string(seconds_left) ;

            std::string display_string = "";
            if (hours_left > 0) {
              display_string = display_hours + ":" + display_minute;
            } else {
              display_string = display_minute + ":" + display_seconds;
            }
            id(s3_box_lcd).printf(120, 47, id(font_timer), Color::BLACK, "%s", display_string.c_str());
          }
  # Starts either mWW or the streaming wake word, depending on the configured location
  - id: start_wake_word
    then:
      - if:
          condition:
            and:
              - not:
                  - voice_assistant.is_running:
              - not:
                  - micro_wake_word.is_running:
              - lambda: return id(wake_word_engine_location).current_option() == "On device";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - micro_wake_word.start:
            - script.execute: boost_mww_priority
      - if:
          condition:
            and:
              - not:
                  - voice_assistant.is_running:
              - lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(true);
            - voice_assistant.start_continuous:
  # Stops either mWW or the streaming wake word, depending on the configured location
  - id: stop_wake_word
    then:
      - if:
          condition:
            lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - voice_assistant.stop:
      - if:
          condition:
            lambda: return id(wake_word_engine_location).current_option() == "On device";
          then:
            - micro_wake_word.stop:
  # Set the voice assistant phase to idle or muted, depending on if the software mute switch is activated
  - id: set_idle_or_mute_phase
    then:
      - if:
          condition:
            switch.is_off: mute
          then:
            - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
          else:
            - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};

switch:
  - platform: gpio
    name: Speaker Enable
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    disabled_by_default: true
  - platform: template
    name: Mute
    id: mute
    icon: "mdi:microphone-off"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_off:
      - microphone.unmute:
      - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
      - script.execute: draw_display
    on_turn_on:
      - microphone.mute:
      - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};
      - script.execute: draw_display
  - platform: template
    id: timer_ringing
    optimistic: true
    internal: true
    restore_mode: ALWAYS_OFF
    on_turn_off:
      - micro_wake_word.disable_model: stop
      # Turn off the repeat mode and disable the pause between playlist items
      - lambda: |-
              id(speaker_media_player)
                ->make_call()
                .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_REPEAT_OFF)
                .set_announcement(true)
                .perform();
              id(speaker_media_player)->set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 0);
      # Stop playing the alarm
      - media_player.stop:
          announcement: true
    on_turn_on:
      # "Stop" (or any wake word) silences the alarm
      - micro_wake_word.enable_model: stop
      # Turn on the repeat mode and pause for 1000 ms between playlist items/repeats
      - lambda: |-
            id(speaker_media_player)
              ->make_call()
              .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_REPEAT_ONE)
              .set_announcement(true)
              .perform();
            id(speaker_media_player)->set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 1000);
      - media_player.speaker.play_on_device_media_file:
          media_file: timer_finished_sound
          announcement: true
      - delay: 15min
      - switch.turn_off: timer_ringing

select:
  - platform: template
    entity_category: config
    name: Wake word engine location
    id: wake_word_engine_location
    icon: "mdi:account-voice"
    optimistic: true
    restore_value: true
    options:
      - In Home Assistant
      - On device
    initial_option: On device
    on_value:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - wait_until:
                lambda: return id(voice_assistant_phase) == ${voice_assist_muted_phase_id} || id(voice_assistant_phase) == ${voice_assist_idle_phase_id};
            - if:
                condition:
                  lambda: return x == "In Home Assistant";
                then:
                  - micro_wake_word.stop
                  - delay: 500ms
                  - if:
                      condition:
                        switch.is_off: mute
                      then:
                        - lambda: id(va).set_use_wake_word(true);
                        - voice_assistant.start_continuous:
            - if:
                condition:
                  lambda: return x == "On device";
                then:
                  - lambda: id(va).set_use_wake_word(false);
                  - voice_assistant.stop
                  - delay: 500ms
                  - if:
                      condition:
                        switch.is_off: mute
                      then:
                        - micro_wake_word.start
                        - script.execute: boost_mww_priority

number:
  # Post-AEC mic gain, for tuning wake word pickup from HA. Defaults to 0 dB (unchanged).
  - platform: esp_audio_stack
    mic_gain:
      name: Mic Gain
      min_value: -20
      max_value: 30
  # Hardware boost on top of the codec's DAC volume, which tops out at 0 dB in
  # codec mode (the old ESPHome es8311 driver went up to ~+6.5 dB at this
  # media player's volume_max). Much above ~7 dB clips loud TTS peaks.
  - platform: template
    name: Speaker Gain
    id: speaker_gain
    icon: "mdi:volume-plus"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 6
    min_value: 0
    max_value: 12
    step: 0.5
    unit_of_measurement: dB
    mode: slider
    on_value:
      - script.execute: apply_speaker_gain

globals:
  - id: gain_base
    type: int
    restore_value: false
    initial_value: "0"
  - id: gain_last_written
    type: int
    restore_value: false
    initial_value: "-1"
  - id: init_in_progress
    type: bool
    restore_value: false
    initial_value: "true"
  - id: voice_assistant_phase
    type: int
    restore_value: false
    initial_value: ${voice_assist_not_ready_phase_id}
  - id: global_first_active_timer
    type: voice_assistant::Timer
    restore_value: false
  - id: global_is_timer_active
    type: bool
    restore_value: false
  - id: global_first_timer
    type: voice_assistant::Timer
    restore_value: false
  - id: global_is_timer
    type: bool
    restore_value: false

