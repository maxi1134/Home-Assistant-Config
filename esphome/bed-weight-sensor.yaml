  - id: calibration_pass_count_top_right
    type: int
    restore_value: true
    initial_value: '0'
  - id: calibration_pass_count_bottom_left
    type: int
    restore_value: true
    initial_value: '0'
  - id: calibration_pass_count_bottom_right
    type: int
    restore_value: true
    initial_value: '0'

  - id: inv_tl_tl
    type: float
    restore_value: true
    initial_value: '1.0'
  - id: inv_tl_tr
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: inv_tl_bl
