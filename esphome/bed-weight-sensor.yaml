            }

  - platform: hx711
    internal: true
    accuracy_decimals: 2
    id: weight_bottom_left
    name: "HX711 Value Bottom Left"
    dout_pin: GPIO25
    clk_pin: GPIO26
    gain: 128
    update_interval: 1s
    unit_of_measurement: lb
    filters:
      - calibrate_linear:
