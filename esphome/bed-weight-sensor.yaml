  # Mattress spill-aware calibration.
  # m_<sensor>_<placement> stores the averaged observed bridge response per lb
  # for a known-weight capture centered over the named placement.
  # f_<actual_quarter>_<placement> stores the pro-rata fraction of the known
  # weight assigned to each actual bed quarter for that capture. This accounts
  # for mattress/platform spill into the other three quarters.
  # recompute_calibration_inverse solves: observed_response = physical_matrix * spill_fraction,
  # then stores inv_<quarter>_<sensor> to estimate actual quarter loads from live readings.
  - id: m_tl_tl
    type: float
    restore_value: true
    initial_value: '1.0'
  - id: m_tl_tr
    type: float
    restore_value: true
    initial_value: '0.0'
