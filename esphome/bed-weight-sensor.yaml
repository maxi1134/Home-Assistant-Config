esphome:
  name: bed-weight-sensor
  friendly_name: Bed Weight Sensor

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret encryption_key
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Bed-Weight-Sensor"
    password: !secret ap_password

captive_portal:

globals:
  - id: weigth_tare_top_left
    type: float
    restore_value: False
    initial_value: '0.0'
  - id: weigth_tare_top_right
    type: float
    restore_value: False
    initial_value: '0.0'
  - id: weigth_tare_bottom_left
    type: float
    restore_value: False
    initial_value: '0.0'
  - id: weigth_tare_bottom_right
    type: float
    restore_value: False
    initial_value: '0.0'
  - id: playing_state
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: last_movement_time
    type: unsigned long
    restore_value: false
    initial_value: '0'
  - id: movement_continuous_start
    type: unsigned long
    restore_value: false
    initial_value: '0'
  - id: no_movement_start
    type: unsigned long
    restore_value: false
    initial_value: '0'
  - id: calibration_sum_top_left
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: calibration_sum_top_right
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: calibration_sum_bottom_left
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: calibration_sum_bottom_right
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: calibration_sample_count
    type: int
    restore_value: false
    initial_value: '0'
  - id: calibration_motion_seen
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: calibration_capture_valid
    type: bool
    restore_value: false
    initial_value: 'false'
  # Mattress spill-aware calibration.
  # m_<sensor>_<placement> stores the averaged observed bridge response per lb
  # for a known-weight capture centered over the named placement.
  # f_<actual_quarter>_<placement> stores the pro-rata fraction of the known
  # weight assigned to each actual bed quarter for that capture. This accounts
  # for mattress/platform spill into the other three quarters.
  # recompute_calibration_inverse solves: observed_response = physical_matrix * spill_fraction,
  # then stores inv_<quarter>_<sensor> to estimate actual quarter loads from live readings.
  - id: m_tl_tl
    type: float
    restore_value: true
    initial_value: '1.0'
  - id: m_tl_tr
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: m_tl_bl
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: m_tl_br
    type: float
    restore_value: true
    initial_value: '0.0'

  - id: m_tr_tl
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: m_tr_tr
    type: float
    restore_value: true
    initial_value: '1.0'
  - id: m_tr_bl
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: m_tr_br
    type: float
    restore_value: true
    initial_value: '0.0'

  - id: m_bl_tl
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: m_bl_tr
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: m_bl_bl
    type: float
    restore_value: true
    initial_value: '1.0'
  - id: m_bl_br
    type: float
    restore_value: true
    initial_value: '0.0'

  - id: m_br_tl
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: m_br_tr
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: m_br_bl
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: m_br_br
    type: float
    restore_value: true
    initial_value: '1.0'

  - id: f_tl_tl
    type: float
    restore_value: true
    initial_value: '1.0'
  - id: f_tl_tr
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: f_tl_bl
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: f_tl_br
    type: float
    restore_value: true
    initial_value: '0.0'

  - id: f_tr_tl
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: f_tr_tr
    type: float
    restore_value: true
    initial_value: '1.0'
  - id: f_tr_bl
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: f_tr_br
    type: float
    restore_value: true
    initial_value: '0.0'

  - id: f_bl_tl
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: f_bl_tr
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: f_bl_bl
    type: float
    restore_value: true
    initial_value: '1.0'
  - id: f_bl_br
    type: float
    restore_value: true
    initial_value: '0.0'

  - id: f_br_tl
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: f_br_tr
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: f_br_bl
