# Bed weight sensor — 4x HX711 corner bridges under the bed platform.
#
# Design notes (2026-07 redesign):
#  - Total weight is the gain-weighted sum of the 4 tared corner channels.
#    Statics guarantees the sum of corner reactions equals the applied load
#    regardless of how the mattress spreads it, so ONLY the total (and the
#    left/right split) are calibrated. Per-quarter weight is not observable
#    from 4 corner reactions and is not attempted.
#  - Per-corner gains are solved OFF-CHIP (see bed-scale-calibrate.py in this
#    folder) and entered into the four "Gain ..." number entities. The ESP
#    does no matrix math.
#
# Calibration procedure:
#  1. Bed empty (bedding on) -> press "Tare".
#  2. Set "Calibration Known Weight" to the helper person's weight (lb).
#  3. Person gets on the bed and holds still; press "Capture Calibration
#     Sample". KNEEL directly on each corner (feet and hands OFF the floor -
#     any weight leaking to the floor corrupts the fit); add lying center /
#     left edge / right edge. 6+ positions total.
#  4. Each capture logs a CSV row (also shown in the "Calibration Sample"
#     text sensor): tl,tr,bl,br,known_lb. Collect the rows into samples.csv.
#  5. Run: python bed-scale-calibrate.py samples.csv
#     and enter the recommended gains into the Gain number entities.
#  6. Lie in the center to verify Total Weight reads the known weight.
#  7. Lie on the left, then right edge, and check the "Left Share" sensor to
#     pick a realistic "Side Share Threshold" for your mattress.

esphome:
  name: bed-weight-sensor
  friendly_name: Bed Weight Sensor

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Tare and gains persist in flash (ESPHome default cadence; the auto-tare
# slew writes at most once per minute anyway). After entering gains or
# taring, wait ~1 min before pulling power so the values are committed.
preferences:
  flash_write_interval: 1min

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret encryption_key
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Bed-Weight-Sensor"
    password: !secret ap_password

captive_portal:

globals:
  # Per-channel tare in nominal lb. Persisted so a reboot does not
  # invalidate readings mid-night.
  - id: tare_top_left
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: tare_top_right
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: tare_bottom_left
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: tare_bottom_right
    type: float
    restore_value: true
    initial_value: '0.0'

  - id: playing_state
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: last_movement_time
    type: unsigned long
    restore_value: false
    initial_value: '0'
  - id: movement_continuous_start
    type: unsigned long
    restore_value: false
    initial_value: '0'
  - id: no_movement_start
    type: unsigned long
    restore_value: false
    initial_value: '0'
  # Auto-tare interlock: last time the bed was seen occupied.
  - id: last_occupied_time
    type: unsigned long
    restore_value: false
    initial_value: '0'

  # Scratch for calibration sample capture.
  - id: cal_sum_tl
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: cal_sum_tr
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: cal_sum_bl
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: cal_sum_br
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: cal_sample_count
    type: int
    restore_value: false
    initial_value: '0'
  - id: last_capture_ok
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: last_capture_scale
    type: float
    restore_value: false
    initial_value: '0.0'

  # Guided calibration session state.
  - id: guided_attempts
    type: int
    restore_value: false
    initial_value: '0'
  - id: guided_ok_count
    type: int
    restore_value: false
    initial_value: '0'
  - id: guided_failed
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: guided_retry
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: guided_scales
    type: std::vector<float>
    restore_value: false

sensor:
  - platform: hx711
    internal: true
    accuracy_decimals: 2
    id: weight_top_left
    name: "HX711 Value Top Left"
    dout_pin: GPIO4
    clk_pin: GPIO3
    gain: 128
    update_interval: 1s
    unit_of_measurement: lb
    filters:
      # Nominal counts->lb slope (same magnitude/sign as the previous
      # calibrate_linear). Per-corner differences are corrected by the
      # "Gain ..." numbers, applied in the total/side sums.
      - multiply: -0.0000909091
      - lambda: |-
          id(no_tare_top_left).publish_state(x);
          return x - id(tare_top_left);
    on_value:
      then:
        - lambda: |-
            // Movement flag only. The playing/continuous-movement bookkeeping
            // runs once per second in the interval block, so the four corners
            // cannot overwrite each other's timers.
            static float last_val = NAN;
            if (isnan(last_val)) {
              last_val = x;
              return;
            }
            const float SWING_THRESHOLD = 2.0f;
            if (fabsf(x - last_val) > SWING_THRESHOLD) {
              id(last_movement_time) = millis();
            }
            last_val = x;

  - platform: hx711
    internal: true
    accuracy_decimals: 2
    id: weight_top_right
    name: "HX711 Value Top Right"
    dout_pin: GPIO2
    clk_pin: GPIO16
    gain: 128
    update_interval: 1s
    unit_of_measurement: lb
    filters:
      - multiply: -0.0000909091
      - lambda: |-
          id(no_tare_top_right).publish_state(x);
          return x - id(tare_top_right);
    on_value:
      then:
        - lambda: |-
            // Movement flag only. The playing/continuous-movement bookkeeping
            // runs once per second in the interval block, so the four corners
            // cannot overwrite each other's timers.
            static float last_val = NAN;
            if (isnan(last_val)) {
              last_val = x;
              return;
            }
            const float SWING_THRESHOLD = 2.0f;
            if (fabsf(x - last_val) > SWING_THRESHOLD) {
              id(last_movement_time) = millis();
            }
            last_val = x;

  - platform: hx711
    internal: true
    accuracy_decimals: 2
    id: weight_bottom_right
    name: "HX711 Value Bottom Right"
    dout_pin: GPIO32
    clk_pin: GPIO33
    gain: 128
    update_interval: 1s
    unit_of_measurement: lb
    filters:
      - multiply: -0.0000909091
      - lambda: |-
          id(no_tare_bottom_right).publish_state(x);
          return x - id(tare_bottom_right);
    on_value:
      then:
        - lambda: |-
            // Movement flag only. The playing/continuous-movement bookkeeping
            // runs once per second in the interval block, so the four corners
            // cannot overwrite each other's timers.
            static float last_val = NAN;
            if (isnan(last_val)) {
              last_val = x;
              return;
            }
            const float SWING_THRESHOLD = 2.0f;
            if (fabsf(x - last_val) > SWING_THRESHOLD) {
              id(last_movement_time) = millis();
            }
            last_val = x;

  - platform: hx711
    internal: true
    accuracy_decimals: 2
    id: weight_bottom_left
    name: "HX711 Value Bottom Left"
    dout_pin: GPIO25
    clk_pin: GPIO26
    gain: 128
    update_interval: 1s
    unit_of_measurement: lb
    filters:
      - multiply: -0.0000909091
      - lambda: |-
          id(no_tare_bottom_left).publish_state(x);
          return x - id(tare_bottom_left);
    on_value:
      then:
        - lambda: |-
            // Movement flag only. The playing/continuous-movement bookkeeping
            // runs once per second in the interval block, so the four corners
            // cannot overwrite each other's timers.
            static float last_val = NAN;
            if (isnan(last_val)) {
              last_val = x;
              return;
            }
            const float SWING_THRESHOLD = 2.0f;
            if (fabsf(x - last_val) > SWING_THRESHOLD) {
              id(last_movement_time) = millis();
            }
            last_val = x;

  # Pre-tare channel values, used by the Tare button and auto-tare.
  - platform: template
    id: no_tare_top_left
    internal: true
  - platform: template
    id: no_tare_top_right
    internal: true
  - platform: template
    id: no_tare_bottom_left
    internal: true
  - platform: template
    id: no_tare_bottom_right
    internal: true

  - platform: template
    id: left_weight
    name: "Left Side Weight"
    unit_of_measurement: lb
    device_class: weight
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      const float tl = id(weight_top_left).state;
      const float bl = id(weight_bottom_left).state;
      if (isnan(tl) || isnan(bl)) {
        return {};
      }
      return id(gain_top_left).state * tl + id(gain_bottom_left).state * bl;
    filters:
      - or:
          - delta: 0.5
          - heartbeat: 60s

  - platform: template
    id: right_weight
    name: "Right Side Weight"
    unit_of_measurement: lb
    device_class: weight
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      const float tr = id(weight_top_right).state;
      const float br = id(weight_bottom_right).state;
      if (isnan(tr) || isnan(br)) {
        return {};
      }
      return id(gain_top_right).state * tr + id(gain_bottom_right).state * br;
    filters:
      - or:
          - delta: 0.5
          - heartbeat: 60s

  # Fraction of the load on the left side. Lie on each edge and read this
  # sensor to choose a realistic "Side Share Threshold" for your mattress.
  - platform: template
    id: left_share
    name: "Left Share"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      // Computed from the raw channels (not the throttled display sensors).
      const float l =
        id(gain_top_left).state * id(weight_top_left).state +
        id(gain_bottom_left).state * id(weight_bottom_left).state;
      const float r =
        id(gain_top_right).state * id(weight_top_right).state +
        id(gain_bottom_right).state * id(weight_bottom_right).state;
      if (isnan(l) || isnan(r)) {
        return {};
      }
      const float total = l + r;
      if (total < 10.0f) {
        return NAN;
      }
      return 100.0f * l / total;
    filters:
      - or:
          - delta: 2.0
          - heartbeat: 60s

  - platform: template
    id: total_weight
    name: "Total Weight"
    unit_of_measurement: lb
    device_class: weight
    state_class: measurement
    accuracy_decimals: 1
    force_update: true
    update_interval: 1s
    lambda: |-
      const float raw_tl = id(weight_top_left).state;
      const float raw_tr = id(weight_top_right).state;
      const float raw_bl = id(weight_bottom_left).state;
      const float raw_br = id(weight_bottom_right).state;

      if (isnan(raw_tl) || isnan(raw_tr) || isnan(raw_bl) || isnan(raw_br)) {
        return {};
      }

      const float total =
        id(gain_top_left).state * raw_tl +
        id(gain_top_right).state * raw_tr +
        id(gain_bottom_left).state * raw_bl +
        id(gain_bottom_right).state * raw_br;

      if (total < -20.0f || total > 1000.0f) {
        return {};
      }

      const uint32_t now = millis();
      static uint32_t last_publish = 0;

      const bool occupied = total >= id(side_occupied_threshold_lb).state;
      const bool active_motion =
        id(last_movement_time) != 0 &&
        (now - id(last_movement_time)) < 15000UL;

      const uint32_t publish_interval_ms = active_motion
        ? 5000UL
        : (occupied ? 10000UL : 300000UL);

      if (last_publish != 0 && (now - last_publish) < publish_interval_ms) {
        return {};
      }

      last_publish = now;
      return total;
    filters:
      - round: 1

number:
  # Per-corner gains, solved off-chip by bed-scale-calibrate.py.
  - platform: template
    id: gain_top_left
    name: "Gain Top Left"
    optimistic: true
    restore_value: true
    initial_value: 1.0
    min_value: 0.2
    max_value: 3.0
    step: 0.0001
    mode: box
    entity_category: config

  - platform: template
    id: gain_top_right
    name: "Gain Top Right"
    optimistic: true
    restore_value: true
    initial_value: 1.0
    min_value: 0.2
    max_value: 3.0
    step: 0.0001
    mode: box
    entity_category: config

  - platform: template
    id: gain_bottom_left
    name: "Gain Bottom Left"
    optimistic: true
    restore_value: true
    initial_value: 1.0
    min_value: 0.2
    max_value: 3.0
    step: 0.0001
    mode: box
    entity_category: config

  - platform: template
    id: gain_bottom_right
    name: "Gain Bottom Right"
    optimistic: true
    restore_value: true
    initial_value: 1.0
    min_value: 0.2
    max_value: 3.0
    step: 0.0001
    mode: box
    entity_category: config

  - platform: template
    id: calibration_known_weight_lb
    name: "Calibration Known Weight"
    unit_of_measurement: lb
    optimistic: true
    restore_value: true
    initial_value: 150
    min_value: 1
    max_value: 400
    step: 0.5
    mode: box
    entity_category: config

  # Total weight above which the bed counts as occupied.
  - platform: template
    id: side_occupied_threshold_lb
    name: "Side Occupied Threshold"
    unit_of_measurement: lb
    optimistic: true
    restore_value: true
    initial_value: 40
    min_value: 5
    max_value: 300
    step: 1
    mode: box
    entity_category: config

  # Total weight above which both sides are considered occupied regardless
  # of the left/right split.
  - platform: template
    id: two_person_threshold_lb
    name: "Two Person Threshold"
    unit_of_measurement: lb
    optimistic: true
    restore_value: true
    initial_value: 220
    min_value: 100
    max_value: 600
    step: 5
    mode: box
    entity_category: config

  # A side counts as clearly occupied when its share exceeds this. Between
  # (100 - threshold) and threshold the sleeper is centered -> both sides
  # report occupied. Tune using the "Left Share" sensor.
  - platform: template
    id: side_share_threshold
    name: "Side Share Threshold"
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    initial_value: 58
    min_value: 50
    max_value: 90
    step: 1
    mode: box
    entity_category: config

switch:
  # Slow re-zeroing while the bed is empty, to counter HX711/load-cell
  # thermal drift and creep.
  - platform: template
    id: auto_tare_enabled
    name: "Auto Tare"
    icon: "mdi:scale-balance"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

script:
  - id: capture_calibration_sample
    mode: single
    then:
      - lambda: |-
          id(cal_sum_tl) = 0.0f;
          id(cal_sum_tr) = 0.0f;
          id(cal_sum_bl) = 0.0f;
          id(cal_sum_br) = 0.0f;
          id(cal_sample_count) = 0;
          id(last_capture_ok) = false;
          id(calibration_sample).publish_state("sampling: hold still for 12s");
          ESP_LOGI(
            "bed_scale",
            "Calibration capture started (known weight %.1f lb). Hold still for 12 seconds.",
            id(calibration_known_weight_lb).state
          );
      - repeat:
          count: 12
          then:
            - delay: 1s
            - lambda: |-
                const unsigned long STABLE_MS = 3000;
                const unsigned long now = millis();

                if (id(last_movement_time) != 0 && (now - id(last_movement_time)) < STABLE_MS) {
                  ESP_LOGW("bed_scale", "Calibration sample skipped: movement detected");
                  return;
                }

                const float s_tl = id(weight_top_left).state;
                const float s_tr = id(weight_top_right).state;
                const float s_bl = id(weight_bottom_left).state;
                const float s_br = id(weight_bottom_right).state;

                if (isnan(s_tl) || isnan(s_tr) || isnan(s_bl) || isnan(s_br)) {
                  ESP_LOGW("bed_scale", "Calibration sample skipped: invalid bridge reading");
                  return;
                }

                id(cal_sum_tl) += s_tl;
                id(cal_sum_tr) += s_tr;
                id(cal_sum_bl) += s_bl;
                id(cal_sum_br) += s_br;
                id(cal_sample_count) += 1;
      - lambda: |-
          const int n = id(cal_sample_count);

          if (n < 8) {
            char msg[96];
            snprintf(msg, sizeof(msg), "aborted: only %d stable samples, retry", n);
            id(calibration_sample).publish_state(msg);
            ESP_LOGW("bed_scale", "Calibration capture aborted: only %d stable samples. Hold still and retry.", n);
            return;
          }

          const float tl = id(cal_sum_tl) / n;
          const float tr = id(cal_sum_tr) / n;
          const float bl = id(cal_sum_bl) / n;
          const float br = id(cal_sum_br) / n;

          const float known = id(calibration_known_weight_lb).state;
          const float sum = tl + tr + bl + br;
          if (sum < 0.25f * known) {
            char msg[96];
            snprintf(msg, sizeof(msg), "ignored: load %.1f lb too small vs known %.1f lb", sum, known);
            id(calibration_sample).publish_state(msg);
            ESP_LOGW("bed_scale", "Calibration capture ignored: load %.1f lb too small vs known weight %.1f lb", sum, known);
            return;
          }
          id(last_capture_ok) = true;
          id(last_capture_scale) = known / sum;

          char msg[128];
          snprintf(
            msg, sizeof(msg), "%.3f,%.3f,%.3f,%.3f,%.1f",
            tl, tr, bl, br, known
          );
          id(calibration_sample).publish_state(msg);
          ESP_LOGI(
            "bed_scale",
            "Calibration sample from %d readings. CSV row for bed-scale-calibrate.py: %s",
            n, msg
          );

  # Guided calibration: press Start with the bed EMPTY, then just follow the
  # Calibration Progress messages (or hook an HA automation to them for TTS).
  # No laptop needed: it tares, waits for you to settle at each position
  # (movement-driven, positions are label-free so order does not matter),
  # collects 7 captures, and applies the median sum-scale to all four gains.
  # The CSV rows also land in Calibration Sample history for the finer
  # per-corner solve with bed-scale-calibrate.py later.
  - id: guided_calibration
    mode: single
    then:
      - lambda: |-
          id(guided_attempts) = 0;
          id(guided_ok_count) = 0;
          id(guided_failed) = false;
          id(guided_retry) = false;
          id(guided_scales).clear();
      - if:
          condition:
            binary_sensor.is_on: bed_occupied
          then:
            - lambda: |-
                id(calibration_progress).publish_state("aborted: bed must be empty when you press start");
            - script.stop: guided_calibration
      - lambda: |-
          char msg[160];
          snprintf(msg, sizeof(msg),
                   "known weight is %.0f lb (must be YOUR weight!) - taring once the bed settles, keep it empty",
                   id(calibration_known_weight_lb).state);
          id(calibration_progress).publish_state(msg);
      # Wait for the empty bed to be truly still (15s > bed_occupied's 10s
      # delayed_on, so a person who just got on cannot slip past the check).
      - wait_until:
          condition:
            lambda: |-
              return id(last_movement_time) == 0 || (millis() - id(last_movement_time)) > 15000UL;
          timeout: 90s
      - lambda: |-
          const bool still_ok =
            id(last_movement_time) == 0 || (millis() - id(last_movement_time)) > 15000UL;
          if (id(bed_occupied).state || !still_ok) {
            id(guided_failed) = true;
            id(calibration_progress).publish_state("aborted: bed must be empty and still for taring - press start to retry");
            return;
          }
          const float tl = id(no_tare_top_left).state;
          const float tr = id(no_tare_top_right).state;
          const float bl = id(no_tare_bottom_left).state;
          const float br = id(no_tare_bottom_right).state;
          if (isnan(tl) || isnan(tr) || isnan(bl) || isnan(br)) {
            id(guided_failed) = true;
            id(calibration_progress).publish_state("aborted: bridges not ready - try again in a minute");
            return;
          }
          id(tare_top_left) = tl;
          id(tare_top_right) = tr;
          id(tare_bottom_left) = bl;
          id(tare_bottom_right) = br;
          id(calibration_progress).publish_state(
            "tared - get on the bed. 7 positions: KNEEL on each corner, then lie center, left edge, right edge. Feet and hands OFF the floor! Hold each ~30s.");
      - if:
          condition:
            lambda: return id(guided_failed);
          then:
            - script.stop: guided_calibration
      - while:
          condition:
            lambda: |-
              return id(guided_ok_count) < 7 && id(guided_attempts) < 15 && !id(guided_failed);
          then:
            # Wait for the person to (re)position — skipped when retrying the
            # same position after a movement-spoiled capture.
            - if:
                condition:
                  lambda: return !id(guided_retry);
                then:
                  - wait_until:
                      condition:
                        lambda: |-
                          return id(last_movement_time) != 0 && (millis() - id(last_movement_time)) < 2000UL;
                      timeout: 240s
                  - lambda: |-
                      if (!(id(last_movement_time) != 0 && (millis() - id(last_movement_time)) < 5000UL)) {
                        id(guided_failed) = true;
                        id(calibration_progress).publish_state("aborted: no movement for 4 min - press start to retry");
                      }
                  - if:
                      condition:
                        lambda: return id(guided_failed);
                      then:
                        - script.stop: guided_calibration
            - lambda: id(guided_retry) = false;
            # ...then wait for them to hold still, and capture.
            - wait_until:
                condition:
                  lambda: |-
                    return id(last_movement_time) != 0 && (millis() - id(last_movement_time)) > 8000UL;
                timeout: 180s
            - lambda: |-
                if (!(id(last_movement_time) != 0 && (millis() - id(last_movement_time)) > 8000UL)) {
                  id(guided_failed) = true;
                  id(calibration_progress).publish_state("aborted: could not hold still for 8s - press start to retry");
                }
            - if:
                condition:
                  lambda: return id(guided_failed);
                then:
                  - script.stop: guided_calibration
            - lambda: id(guided_attempts) += 1;
            - script.execute: capture_calibration_sample
            - script.wait: capture_calibration_sample
            - lambda: |-
                if (id(last_capture_ok)) {
                  id(guided_ok_count) += 1;
                  id(guided_scales).push_back(id(last_capture_scale));
                  char msg[128];
                  if (id(guided_ok_count) < 7) {
                    snprintf(msg, sizeof(msg),
                             "captured %d/7 - move to the next position and hold still ~30s",
                             id(guided_ok_count));
                  } else {
                    snprintf(msg, sizeof(msg), "captured 7/7 - computing gains");
                  }
                  id(calibration_progress).publish_state(msg);
                } else if (id(cal_sample_count) < 8) {
                  // Movement spoiled it: retry the SAME position without
                  // demanding a reposition first.
                  id(guided_retry) = true;
                  id(calibration_progress).publish_state(
                    "capture spoiled by movement - hold the same position ~30s");
                } else {
                  id(calibration_progress).publish_state(
                    "no load detected - get (back) on the bed and hold still ~30s");
                }
      - lambda: |-
          if (id(guided_failed)) {
            return;
          }
          const int n = (int) id(guided_scales).size();
          if (n < 4) {
            char msg[128];
            snprintf(msg, sizeof(msg),
                     "finished with only %d good captures - gains NOT changed; press start to retry", n);
            id(calibration_progress).publish_state(msg);
            return;
          }
          std::vector<float> v = id(guided_scales);
          std::sort(v.begin(), v.end());
          const float median = v[v.size() / 2];

          // Statics: the summed reading must match the known weight at EVERY
          // position. Captures disagreeing beyond ~20% mean weight bypassed
          // the cells (feet on the floor, frame touching a wall, ...).
          const float spread = v.back() / v.front();
          if (spread > 1.20f) {
            char msg[192];
            snprintf(msg, sizeof(msg),
                     "aborted: captures disagree by %.0f%% - weight bypassed the bed (feet on floor? frame touching something?). Gains NOT changed",
                     (spread - 1.0f) * 100.0f);
            id(calibration_progress).publish_state(msg);
            return;
          }

          if (median < 0.5f || median > 2.0f) {
            char msg[128];
            snprintf(msg, sizeof(msg),
                     "aborted: solved scale %.3f outside 0.5-2.0 - check known weight and tare", median);
            id(calibration_progress).publish_state(msg);
            return;
          }
          auto c_tl = id(gain_top_left).make_call();
          c_tl.set_value(median);
          c_tl.perform();
          auto c_tr = id(gain_top_right).make_call();
          c_tr.set_value(median);
          c_tr.perform();
          auto c_bl = id(gain_bottom_left).make_call();
          c_bl.set_value(median);
          c_bl.perform();
          auto c_br = id(gain_bottom_right).make_call();
          c_br.set_value(median);
          c_br.perform();
          char msg[160];
          snprintf(msg, sizeof(msg),
                   "done: all gains set to %.4f (%d captures agree within %.0f%%). Lie in the center to verify Total Weight.",
                   median, n, (spread - 1.0f) * 100.0f);
          id(calibration_progress).publish_state(msg);
          ESP_LOGI("bed_scale", "Guided calibration done: median scale %.4f from %d captures (%d attempts)",
                   median, n, id(guided_attempts));

text_sensor:
  # Latest capture as a CSV row: tl,tr,bl,br,known_lb
  - platform: template
    id: calibration_sample
    name: "Calibration Sample"
    icon: "mdi:scale-balance"
    entity_category: diagnostic

  # Instructions/status for the guided calibration session.
  - platform: template
    id: calibration_progress
    name: "Calibration Progress"
    icon: "mdi:progress-check"
    entity_category: diagnostic

binary_sensor:
  - platform: template
    id: bed_occupied
    name: "Bed Occupied"
    device_class: occupancy
    lambda: |-
      const float raw_tl = id(weight_top_left).state;
      const float raw_tr = id(weight_top_right).state;
      const float raw_bl = id(weight_bottom_left).state;
      const float raw_br = id(weight_bottom_right).state;

      if (isnan(raw_tl) || isnan(raw_tr) || isnan(raw_bl) || isnan(raw_br)) {
        return {};
      }

      const float total =
        id(gain_top_left).state * raw_tl +
        id(gain_top_right).state * raw_tr +
        id(gain_bottom_left).state * raw_bl +
        id(gain_bottom_right).state * raw_br;

      const float thr = id(side_occupied_threshold_lb).state;

      // Hysteresis: on above the threshold, off below 80% of it.
      static bool raw_state = false;
      if (total >= thr) {
        raw_state = true;
      } else if (total < 0.8f * thr) {
        raw_state = false;
      }
      return raw_state;
    filters:
      - delayed_on: 10s
      - delayed_off: 30s

  - platform: template
    id: left_side_occupied
    name: "Left Side Occupied"
    device_class: occupancy
    lambda: |-
      const float l =
        id(gain_top_left).state * id(weight_top_left).state +
        id(gain_bottom_left).state * id(weight_bottom_left).state;
      const float r =
        id(gain_top_right).state * id(weight_top_right).state +
        id(gain_bottom_right).state * id(weight_bottom_right).state;
      if (isnan(l) || isnan(r)) {
        return {};
      }

      const float total = l + r;
      if (total < id(side_occupied_threshold_lb).state) {
        return false;
      }
      if (total >= id(two_person_threshold_lb).state) {
        return true;
      }

      // Occupied unless the load is clearly on the right side. A centered
      // sleeper therefore reports both sides occupied.
      const float share_thr = id(side_share_threshold).state / 100.0f;
      return (l / total) > (1.0f - share_thr);
    filters:
      - delayed_on: 10s
      - delayed_off: 30s

  - platform: template
    id: right_side_occupied
    name: "Right Side Occupied"
    device_class: occupancy
    lambda: |-
      const float l =
        id(gain_top_left).state * id(weight_top_left).state +
        id(gain_bottom_left).state * id(weight_bottom_left).state;
      const float r =
        id(gain_top_right).state * id(weight_top_right).state +
        id(gain_bottom_right).state * id(weight_bottom_right).state;
      if (isnan(l) || isnan(r)) {
        return {};
      }

      const float total = l + r;
      if (total < id(side_occupied_threshold_lb).state) {
        return false;
      }
      if (total >= id(two_person_threshold_lb).state) {
        return true;
      }

      const float share_thr = id(side_share_threshold).state / 100.0f;
      return (r / total) > (1.0f - share_thr);
    filters:
      - delayed_on: 10s
      - delayed_off: 30s

  - platform: template
    id: bed_moving
    name: "Bed Moving"
    device_class: moving
    lambda: |-
      const unsigned long MOVING_TIMEOUT_MS = 15000;
      if (id(last_movement_time) == 0) {
        return false;
      }
      return (millis() - id(last_movement_time)) < MOVING_TIMEOUT_MS;
    filters:
      - delayed_off: 5s

  - platform: template
    id: playing
    name: "Playing"
    lambda: |-
      return id(playing_state);

button:
  - platform: template
    id: tare_button
    name: "Tare"
    on_press:
      - lambda: |-
          const float tl = id(no_tare_top_left).state;
          const float tr = id(no_tare_top_right).state;
          const float bl = id(no_tare_bottom_left).state;
          const float br = id(no_tare_bottom_right).state;
          // Never persist NaN into the restored tare globals.
          if (isnan(tl) || isnan(tr) || isnan(bl) || isnan(br)) {
            ESP_LOGW("bed_scale", "Tare skipped: bridges not ready yet, retry in a few seconds");
            return;
          }
          id(tare_top_left) = tl;
          id(tare_top_right) = tr;
          id(tare_bottom_left) = bl;
          id(tare_bottom_right) = br;
          ESP_LOGI(
            "bed_scale",
            "Tare set: TL=%.2f TR=%.2f BL=%.2f BR=%.2f",
            id(tare_top_left), id(tare_top_right),
            id(tare_bottom_left), id(tare_bottom_right)
          );

  - platform: template
    id: capture_calibration_sample_button
    name: "Capture Calibration Sample"
    on_press:
      - script.execute: capture_calibration_sample

  - platform: template
    id: start_guided_calibration_button
    name: "Start Guided Calibration"
    icon: "mdi:play-circle"
    on_press:
      - if:
          condition:
            script.is_running: guided_calibration
          then:
            - lambda: |-
                id(calibration_progress).publish_state("already running - press Cancel first to restart");
          else:
            - script.execute: guided_calibration

  - platform: template
    id: cancel_guided_calibration_button
    name: "Cancel Guided Calibration"
    icon: "mdi:stop-circle"
    on_press:
      - script.stop: guided_calibration
      - script.stop: capture_calibration_sample
      - lambda: |-
          id(calibration_progress).publish_state("cancelled");
          id(calibration_sample).publish_state("cancelled");

  - platform: template
    id: reset_gains_button
    name: "Reset Gains"
    on_press:
      - number.set:
          id: gain_top_left
          value: 1.0
      - number.set:
          id: gain_top_right
          value: 1.0
      - number.set:
          id: gain_bottom_left
          value: 1.0
      - number.set:
          id: gain_bottom_right
          value: 1.0
      - lambda: |-
          ESP_LOGI("bed_scale", "All corner gains reset to 1.0");

interval:
  - interval: 1s
    then:
      - lambda: |-
          const unsigned long REQUIRED_MS = 45000;
          const unsigned long now = millis();

          if (id(bed_occupied).state) {
            id(last_occupied_time) = now;
          }

          // Any corner swing within the last 1.5s counts as movement this
          // cycle. 45s of continuous movement latches Playing on; 45s of
          // stillness latches it off.
          const bool moving =
            id(last_movement_time) != 0 &&
            (now - id(last_movement_time)) < 1500UL;

          if (moving) {
            id(no_movement_start) = 0;
            if (id(movement_continuous_start) == 0) id(movement_continuous_start) = now;
          } else {
            id(movement_continuous_start) = 0;
            if (id(no_movement_start) == 0) id(no_movement_start) = now;
          }

          if (id(playing_state)) {
            if (id(no_movement_start) != 0 && (now - id(no_movement_start) >= REQUIRED_MS)) {
              id(playing_state) = false;
              id(playing).publish_state(false);
            }
          } else {
            if (id(movement_continuous_start) != 0 && (now - id(movement_continuous_start) >= REQUIRED_MS)) {
              id(playing_state) = true;
              id(playing).publish_state(true);
            }
          }

  # Guarded auto-tare: only when enabled, bed empty for 15+ min, no movement
  # for 10+ min, and the total already reads near zero. Slew is capped so a
  # slowly-appearing real load cannot be tared away quickly.
  - interval: 60s
    then:
      - lambda: |-
          if (!id(auto_tare_enabled).state) {
            return;
          }
          if (id(bed_occupied).state) {
            return;
          }

          const unsigned long now = millis();
          if (id(last_occupied_time) != 0 && (now - id(last_occupied_time)) < 900000UL) {
            return;
          }
          if (id(last_movement_time) != 0 && (now - id(last_movement_time)) < 600000UL) {
            return;
          }

          const float raw_tl = id(weight_top_left).state;
          const float raw_tr = id(weight_top_right).state;
          const float raw_bl = id(weight_bottom_left).state;
          const float raw_br = id(weight_bottom_right).state;

          if (isnan(raw_tl) || isnan(raw_tr) || isnan(raw_bl) || isnan(raw_br)) {
            return;
          }

          const float total =
            id(gain_top_left).state * raw_tl +
            id(gain_top_right).state * raw_tr +
            id(gain_bottom_left).state * raw_bl +
            id(gain_bottom_right).state * raw_br;

          // Only re-zero when the bed already reads (near) empty.
          if (fabsf(total) > 3.0f) {
            return;
          }

          auto slew = [](float &tare, float raw) {
            if (isnan(raw)) {
              return;
            }
            if (isnan(tare)) {  // self-heal a corrupted tare
              tare = raw;
              return;
            }
            const float MAX_STEP = 0.05f;  // lb per minute per channel
            float d = raw - tare;
            if (d > MAX_STEP) d = MAX_STEP;
            if (d < -MAX_STEP) d = -MAX_STEP;
            tare += d;
          };

          slew(id(tare_top_left), id(no_tare_top_left).state);
          slew(id(tare_top_right), id(no_tare_top_right).state);
          slew(id(tare_bottom_left), id(no_tare_bottom_left).state);
          slew(id(tare_bottom_right), id(no_tare_bottom_right).state);
