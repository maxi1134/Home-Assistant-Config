##############################################################################
# Seeed Studio MR60BHA2 mmWave kit (XIAO ESP32-C6)
# Drop-in replacement for the stock Seeed "3.5" config + a STALE-DATA WATCHDOG.
#
# THE PROBLEM THIS FIXES
#   The radar latches "person detected" while heart rate, respiratory rate and
#   distance all freeze at their last value. Those three should drift slightly
#   all the time, so all three frozen at once means the tracker is jammed and
#   nobody is really there.
#
# WHAT THE WATCHDOG DOES
#   If heart rate, respiratory rate AND distance have all stopped CHANGING for
#   ${stale_timeout}, then:
#     * "Person Information" is forced OFF,
#     * the frozen readings revert to "unknown" in Home Assistant,
#     * the diagnostic "Radar Data Stale" turns ON so you can see why.
#   The moment any one of them genuinely moves again, everything recovers by
#   itself - no reboot, no reset button, no automation needed.
#
# AND THE THREE READINGS ALWAYS FOLLOW PRESENCE DOWN
#   Whenever "Person Information" goes OFF - because the watchdog above fired,
#   OR simply because the radar's own has_target dropped when you left the
#   room - heart rate, respiratory rate and distance all go to "unknown" in
#   the same loop iteration AS PRESENCE ITSELF, and they STAY "unknown" for as
#   long as presence is off. They are never left showing a live-looking number
#   for a room nobody is in.
#
#   ("The same loop iteration as presence" is the promise, not "the same
#   instant the radar changed its mind". On an ordinary departure presence
#   itself is held up by ${flap_filter} - see the substitutions block - so the
#   whole group, presence and all three readings together, clears about five
#   seconds after you actually walk out. They are never out of step with each
#   other, which is the thing that was broken.)
#
#   THAT TAKES TWO MECHANISMS, AND BOTH ARE LOAD-BEARING. Do not delete one
#   because the other "looks like it covers it":
#
#     (a) EDGE - the `on_release:` block on the "Person Information" entity
#         further down blanks whatever is currently on screen, once, at the
#         instant presence drops. READ THE COMMENT THERE BEFORE TOUCHING IT:
#         the two obvious ways to write it (publish_state(NAN), or a
#         `sensor.template.publish` action) both route through the filter
#         chain, are silently swallowed by `delta`, and revert the behaviour
#         with no error and no log line.
#
#     (b) LEVEL - the `lambda` gate at the HEAD of each of the three filter
#         chains drops every incoming value while the radar's own has_target
#         is false, so nothing can refill them afterwards. This is mandatory:
#         core ESPHome's seeed_mr60bha2 has NO "ignore vitals frames while
#         has_target is false" gate (the dropped limengdu fork did - see
#         DESIGN NOTE 1). The radar's presence frame and its heart / breath /
#         distance frames are separate ~1 Hz frames processed in whatever loop
#         iteration they land in, so a trailing vitals frame routinely arrives
#         AFTER presence has already gone off. Without the gate that value
#         walks into the sensor, re-arms the 10-minute `timeout`, and sits on
#         screen next to "Person Information: Clear" for up to ${stale_timeout}
#         - with no second ON->OFF edge to re-blank it. That is exactly the bug
#         this file was written to kill, so (a) alone is not enough.
#
#   During a WATCHDOG trip the radar's flag is still true, so the gate is open
#   and (a) is what does the blanking - and an actually-changing value is still
#   free to come through and recover everything. During an ORDINARY departure
#   the flag is false, so (b) holds the line. The two never overlap.
#
# HOW IT WORKS  (four stock ESPHome filters per sensor - no scripts, no timers)
#     filters:
#       - lambda: |-                  # (b) above: hard gate, nothing gets past
#           if (!id(mr_raw_has_target).state) return {};   # while presence is
#           return x;                                      # off at the radar
#       - filter_out: 0.0             # drop the component's "nobody here" flush
#       - delta: ${change_deadband}   # drop any reading equal to the last one
#       - timeout: ${stale_timeout}   # re-armed by whatever gets through;
#                                     # emits NaN -> "unknown" if nothing does
#
#   `delta` turns "the radar keeps re-sending the same number" into "nothing
#   reaches the timer", and `timeout` turns "nothing reached the timer for
#   ${stale_timeout}" into NaN.
#
#   `filter_out: 0.0` is there because the component force-publishes a literal
#   0.0 to all three sensors on EVERY frame that reports zero occupancy. A
#   single such frame in the middle of a jam (presence briefly flapping off and
#   straight back on - widely reported on this module) would otherwise look
#   like two genuine changes, 0.0 then the frozen value again, and would reset
#   the 10-minute countdown to zero. With enough flaps the watchdog could never
#   fire at all. Dropping the 0.0 before it reaches `delta` closes that hole.
#   Safe here because the component never publishes a real 0.0 on these three:
#   heart/breath frames whose payload is bit-zero are skipped outright, and a
#   distance frame is only decoded when its validity byte is non-zero.
#
#   (The gate does NOT make `filter_out: 0.0` redundant. The component
#   publishes has_target BEFORE flushing the zeros, in the same call - but the
#   `delayed_off: ${flap_filter}` on has_target means the flag is still reading
#   true at that moment, so the gate is still open and `filter_out` is what
#   catches the flush. Remove either one and fake 0 bpm / 0 cm comes back.)
#
#   THE ORDER IS LOAD-BEARING, AND THE GATE MUST STAY FIRST - a blocked value
#   must not be allowed to touch `delta`'s reference or re-arm `timeout`.
#   DeltaFilter keeps a private `last_value_` that
#   is only written by values arriving at ITS input and only when they PASS.
#   The NaN that `timeout` emits is injected DOWNSTREAM (Filter::output() ->
#   straight to the frontend, verified in sensor/filter.cpp), so it never
#   re-enters `delta`. Result: once the watchdog fires, the frozen reading X
#   keeps arriving, delta computes |X-X| = 0, the pass test `delta > min`
#   fails, and the NaN LATCHES. Reorder these and that collapses.
#
#   Recovery falls out of the same property for free: the first genuinely
#   different value Y satisfies |Y-X| > ${change_deadband}, passes `delta`,
#   re-arms `timeout`, and lands in the sensor's state - so the sensor leaves
#   NaN and presence returns on the very next loop iteration.
#
#   Read that literally, though: recovery needs a value that DIFFERS. A radar
#   that resumes re-sending the identical frozen number recovers nothing, by
#   design - that is the whole point - and the first HONEST LIMITS bullet
#   spells out when that bites a real, present person.
#
#   The presence-follows-down blanking deliberately does NOT enter this chain
#   either. It writes its NaN straight to the far end of it, which is exactly
#   where `timeout` puts its own NaN, so `delta`'s reference value and the
#   armed state of `timeout` are both left untouched and every word above
#   still holds. In particular the flap-immunity that `filter_out: 0.0` buys
#   is fully preserved: nothing about the blanking can re-arm the countdown.
#
#   The head gate is safe for the same reason `filter_out` is: a filter that
#   returns an empty optional makes Filter::input() skip output() entirely
#   (sensor/filter.cpp), so a gated value never reaches `delta` and never
#   reaches `timeout`. A vacancy therefore does not reset the countdown, and
#   `delta`'s reference survives the vacancy intact - which is also why
#   recovery needs a reading that differs from the last PRE-vacancy one. See
#   HONEST LIMITS.
#
# TUNING: everything you are likely to touch is in `substitutions:` below.
#         ${stale_timeout} is the one that matters; ${flap_filter} is the one
#         NOT to set to zero, for reasons the substitutions block and HONEST
#         LIMITS both explain. Read "HONEST LIMITS" at
#         the bottom before trusting it - there is one case (a target sitting
#         beyond 1.5 m) where the vendor's own firmware freezes heart and
#         breath on purpose, and this config will correctly report that as
#         "unknown" rather than keep showing you an hour-old number.
#
# See the "DESIGN NOTES" block at the bottom of this file for why the
# external component was dropped, why presence is a template binary_sensor,
# and what to check in Home Assistant after the first flash.
##############################################################################

substitutions:
  name: "seeedstudio-mr60bha2-kit"
  friendly_name: "Seeed Studio MR60BHA2 Kit"

  # ======================== WATCHDOG TUNING ================================

  # >>> THE MAIN KNOB <<<
  # How long all three of heart rate / respiratory rate / distance must sit
  # unchanged before presence is forced off and they revert to "unknown".
  # Any ESPHome time period: 30s, 5min, 10min, 30min, 1h ...
  #
  # Watch the "Radar Data Age" diagnostic for a few days of REAL occupancy
  # before trusting a short value: it is literally the number this is compared
  # against. If it regularly climbs past your setting while somebody is
  # genuinely in the room, raise this.
  stale_timeout: "10min"

  # Minimum change that counts as "the radar is still alive".
  # 0.001 is far below the displayed resolution (heart/breath show 0 decimals,
  # distance 2), so no real reading is ever suppressed.
  #
  # RAISE THIS if your radar latches onto a fan / air-con / swaying curtain
  # and JITTERS instead of freezing - e.g. "0.5" then means "a change smaller
  # than 0.5 is not real movement". You can also override it per sensor by
  # replacing ${change_deadband} inline further down with different numbers.
  #
  # Do NOT set it to 0: on ESPHome <= 2026.1.0 the comparison was
  # `fabsf(v - last) >= delta`, so 0 passed everything and de-duplicated
  # nothing. A small positive value behaves correctly on every version.
  change_deadband: "0.001"

  # De-flap window on the radar's OWN has_target flag (`delayed_off:` on the
  # internal mr_raw_has_target entry below). This module is widely reported to
  # blip has_target false for a single frame while somebody is sitting
  # perfectly still in the room.
  #
  # THIS IS NOT COSMETIC - DO NOT SET IT TO 0s. A one-frame blip is a real
  # presence OFF edge, and a presence OFF edge now blanks the three readings.
  # Because DeltaFilter only lets a value through when it DIFFERS from the
  # last one that passed, and a radar in its hold/repeat state re-sends
  # bit-identical values, there may then be nothing left that CAN pass - so
  # presence would stay OFF, with a person still in the room, until some
  # reading finally moves. `delayed_off` cancels the pending OFF the moment
  # the flag re-asserts, so a blip never produces an edge at all.
  #
  # Cost: a GENUINE departure clears ${flap_filter} later than the radar saw
  # it. 5s is about five radar frames - long enough to swallow any blip, short
  # enough not to be noticed by a lights-off automation. The watchdog path is
  # completely unaffected: during a jam the flag stays true throughout.
  flap_filter: "5s"

  # How often the two diagnostic "age" sensors refresh. Cosmetic only: the
  # watchdog itself is not polled, it is driven by the filter chain. Every
  # tick is a row in Home Assistant's recorder, so keep it lazy - drop it to
  # 5s temporarily while you are actively tuning ${stale_timeout}.
  diagnostic_interval: "30s"
  # =========================================================================

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: false
  project:
    name: "seeedstudio.mr60bha2_kit"
    version: "3.5"
  platformio_options:
    board_upload.maximum_size: 4194304
  # 2025.2.0 is the first ESPHome release whose BUILT-IN seeed_mr60bha2
  # component ships the has_target binary sensor and the num_targets sensor
  # (esphome#8010). 2024.12.0 had only breath/heart/distance and no
  # binary_sensor platform at all, so anything older simply will not build.
  # (The old "2024.3.2 # Fix logger compile error on ESP32-C6 esphome#6323"
  # pin predated the component entirely and was misleading.)
  min_version: "2025.2.0"

  on_boot:
    # priority -100 = as late as possible: hardware, WiFi and the API are up.
    # This only seeds the two diagnostic "age" counters so they start from
    # boot rather than from millis()==0. There is deliberately NO boot grace
    # period here: the watchdog cannot mis-fire on a fresh boot anyway,
    # because a `timeout:` filter is constructed with its loop disabled and
    # only arms once a real value has passed through it.
    - priority: -100.0
      then:
        - lambda: |-
            const uint32_t now = millis();
            id(mr_last_change_ms) = now;
            id(mr_last_frame_ms) = now;

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  flash_size: 4MB # upload.flash_size
  framework:
    type: esp-idf

# NOTE: the `external_components:` block (limengdu/MR60BHA2_ESPHome_external_
# components @ main) that used to sit here is GONE on purpose. seeed_mr60bha2
# has been part of ESPHome core since 2024.12.0 and every YAML key is
# identical, so this is a true drop-in. See DESIGN NOTES at the bottom.

# Enable logging.
# Bump to VERBOSE if you ever need to see every raw radar frame
# ("Received Frame: ID: 0x...., Type: 0x....") - that is the only way to tell
# "module silent" apart from "module talking but every payload is invalid".
logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

# Enable Home Assistant API
#
# >>> IF YOUR DEVICE HAS AN API ENCRYPTION KEY, PUT IT BACK RIGHT HERE. <<<
# This file ships without one. Pasting it over a config that HAD a key would
# silently drop the key, and Home Assistant would then refuse the connection
# ("Encryption expected"; the device goes unavailable after the next OTA).
# Uncomment the two lines below and paste your own key - the 44-character
# base64 string from the `api:` / `encryption:` / `key:` of the config you
# are replacing (or, if you keep it in secrets.yaml, carry over your existing
# `key: !secret api_encryption_key` line instead). Do NOT generate a new key:
# it must match the one Home Assistant already has for this device.
# Indentation is exactly as shown - `encryption:` two spaces in, `key:` four.
api:
  # encryption:
  #   key: "PASTE-YOUR-OWN-44-CHARACTER-BASE64-KEY-HERE="

ota:
  - platform: esphome

wifi:
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "seeedstudio-mr60bha2"

captive_portal:

# For XIAO ESP32C6 Onboard LED
# light:
#   - platform: status_led
#     name: "Switch state"
#     pin: GPIO15

light:
  - platform: esp32_rmt_led_strip
    id: led_ring
    name: "Seeed MR60BHA2 RGB Light"
    pin: GPIO1
    num_leds: 1
    channel_colors: GRB
    chipset: ws2812

i2c:
  sda: GPIO22
  scl: GPIO23
  scan: true
  id: bus_a

# Do not change any of this: seeed_mr60bha2's FINAL_VALIDATE_SCHEMA hard-
# requires 115200 / NONE / 1 stop bit and BOTH tx_pin and rx_pin. tx_pin is
# never actually written to - the component is receive-only and there is no
# software reset command for the radar module.
uart:
  id: uart_bus
  baud_rate: 115200
  rx_pin: 17
  tx_pin: 16
  parity: NONE
  stop_bits: 1

seeed_mr60bha2:
  id: my_seeed_mr60bha2

##############################################################################
# WATCHDOG STATE
#
# Two variables, and NEITHER of them is part of the trip decision - the trip
# decision lives entirely in the filter chain. Both of these exist only to
# feed the two diagnostic "age" sensors, and both are safe to delete along
# with those sensors.
##############################################################################
globals:
  # millis() when any of the three signals last actually CHANGED.
  - id: mr_last_change_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # millis() when the radar last published ANY decodable value, changed or
  # repeated. This is what separates "radar alive but frozen" from "radar or
  # UART dead". See the "Radar Frame Age" sensor for the exact caveat.
  - id: mr_last_frame_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

##############################################################################
# ENTITIES
##############################################################################
binary_sensor:
  # The radar's own presence flag. Kept internal (never sent to Home
  # Assistant) because it is the thing that gets stuck - it now feeds the
  # filtered entity below instead of going straight to HA. It is still fully
  # live inside the device: `internal:` is only consulted by the API / MQTT /
  # web_server / prometheus exporters, never by the state machinery.
  #
  # Do NOT try to force this one off from an automation or a binary_sensor
  # filter: BinarySensor::send_state_internal() only de-duplicates UNCHANGED
  # states, so the radar's very next 0x0F09 frame (~1 Hz) re-publishes `true`
  # as a genuine change and presence flaps straight back on.
  #
  # `delayed_off:` DE-FLAPS THE FLAG AND IS REQUIRED - see ${flap_filter} in
  # substitutions for why it is not optional and what it costs. It delays only
  # the OFF edge; DelayedOffFilter cancels a pending OFF as soon as the flag
  # re-asserts (binary_sensor/filter.cpp), and ON is still immediate. The
  # de-duplicator hazard described in DESIGN NOTE 2 does not apply: that
  # de-duplicator sits on the filter's INPUT and this filter sees genuine
  # alternation, never a value latched against it.
  #
  # NOTE that `.state` therefore stays TRUE for ${flap_filter} after the radar
  # reports zero occupancy. Three things read it - the presence lambda, the
  # "Radar Data Stale" lambda and the head gate on the three filter chains -
  # and all three are written to be correct with that delay in place.
  - platform: seeed_mr60bha2
    has_target:
      id: mr_raw_has_target
      internal: true
      filters:
        - delayed_off: ${flap_filter}

  # >>> The presence entity Home Assistant actually sees. <<<
  # Same name, same device_class and same icon as the stock config, so its
  # unique_id (mac + domain + name), entity_id and history carry over.
  # (The rule it implements is documented on its `lambda:` further down.)
  - platform: template
    id: mr_presence
    name: "Person Information"
    device_class: occupancy
    icon: mdi:motion-sensor

    # >>> PRESENCE-FOLLOWS-DOWN BLANKING (the EDGE half - see the header) <<<
    # Blank the watched readings the INSTANT presence drops, whatever the
    # cause: the radar's own has_target going false (the ordinary "you left
    # the room" case) or the stale watchdog firing. Derived from THIS entity
    # rather than from the raw flag so there is exactly one source of truth
    # and the two can never disagree - presence is OFF while the raw flag is
    # still true for the whole duration of a watchdog trip.
    #
    # Fires exactly ONCE per ON->OFF transition, not on every loop: the
    # template platform re-publishes its lambda's result every loop, but
    # BinarySensor::send_state_internal() returns early on an unchanged state
    # BEFORE any callback runs (binary_sensor/binary_sensor.h).
    #
    # THIS BLOCK ALONE IS NOT ENOUGH, and that is not a style point: a single
    # edge cannot hold a level. What stops a later radar frame from refilling
    # the three while presence is still off is the `lambda` gate at the head
    # of each filter chain further down. Keep both.
    #
    # internal_send_state_to_frontend() IS THE ONLY THING THAT WORKS HERE.
    # Do NOT "simplify" it to id(x).publish_state(NAN) or to a
    # `sensor.template.publish` action - both feed the filter chain, and NaN
    # dies in it: it passes `filter_out: 0.0` (roundf(NAN) == 0.0f is false),
    # then DeltaFilter computes delta = fabsf(NAN - last_value_) = NaN, the
    # pass test `NaN > min` is false, so it returns {} and the chain stops
    # dead (sensor/filter.cpp). Nothing would reach the sensor, the readings
    # would stay frozen, and nothing would tell you - no error, no log line.
    # internal_send_state_to_frontend() is public and not deprecated
    # (sensor/sensor.h) and is literally what Filter::output() calls to
    # deliver the `timeout:` NaN this file already relies on. It writes the
    # state, fires on_value and notifies the API while bypassing all filters,
    # so it cannot disturb `delta`'s reference or disarm the 10-minute
    # `timeout`. (It does sit under an "INTERNAL METHODS" banner in that
    # header, so re-check it still exists after a major ESPHome upgrade.)
    #
    # The isnan guards make the first three clauses a no-op when the watchdog
    # has already NaN'd those sensors, so their only real work is the
    # has_target-dropped case. (The fourth clause is the other way round: it
    # only ever does work on the watchdog path. See below.)
    # The sensors' own on_value lambdas do fire, with x = NAN, and their
    # `if (!std::isnan(x))` guard skips the write - so "Radar Data Age" is not
    # falsely reset. "Radar Frame Age" is untouched too, because on_raw_value
    # is not fired by this call.
    #
    # THE FOURTH CLAUSE - "Target Number" - IS GATED ON THE RAW FLAG ON
    # PURPOSE. On an ordinary departure the component itself publishes a
    # genuine 0 to that sensor (it is the one of the four whose zero-flush is
    # real and informative), so leave it alone; the guard is false there
    # because the raw flag has gone down by then. On a WATCHDOG trip the raw
    # flag is still true, no zero-flush ever happens, and the repeated count
    # is blocked by that sensor's own `delta` - so without this clause
    # "Target Number: 1" would sit next to "Person Information: Clear"
    # forever, which is the very contradiction this file exists to remove.
    # Do NOT also put the head gate on num_targets: that would block the
    # legitimate zero.
    #
    # trigger_on_initial_state is already false by default in 2026.6.4; it is
    # written out because if that default ever flipped, the boot-time
    # publish_state(false) would fire on_release and push a pointless
    # "unknown" into all four entities on every single boot.
    trigger_on_initial_state: false
    on_release:
      - lambda: |-
          if (!std::isnan(id(mr_heart_rate).state))
            id(mr_heart_rate).internal_send_state_to_frontend(NAN);
          if (!std::isnan(id(mr_breath_rate).state))
            id(mr_breath_rate).internal_send_state_to_frontend(NAN);
          if (!std::isnan(id(mr_distance).state))
            id(mr_distance).internal_send_state_to_frontend(NAN);
          if (id(mr_raw_has_target).state && !std::isnan(id(mr_num_targets).state))
            id(mr_num_targets).internal_send_state_to_frontend(NAN);

    # Presence = the radar claims a target AND at least one of the three
    # watched signals is currently fresh (not NaN). It is an OR because
    # `distance` legitimately stops publishing on its own (the component only
    # publishes it when the frame's validity byte is non-zero) and beyond
    # 1.5 m the radar firmware deliberately freezes heart and breath, so
    # requiring all three would drop real people.
    #
    # There is deliberately no boot-grace branch here. It used to mask the
    # freshness test for a couple of minutes after boot, but once the blanking
    # above exists that branch is actively wrong: Sensor::
    # internal_send_state_to_frontend() calls set_has_state(true) BEFORE it
    # stores the value (sensor.cpp), so a blanked sensor has has_state()==true
    # and state==NaN - and a branch that tested only has_state() would report
    # "Detected" while all three readings showed "unknown". On every path
    # where it was not wrong it was a no-op, because a sensor that has
    # published has a non-NaN state and the test below already returns true.
    lambda: |-
      if (!id(mr_raw_has_target).state)
        return false;                 // radar says nobody - believe it
      return !std::isnan(id(mr_heart_rate).state) ||
             !std::isnan(id(mr_breath_rate).state) ||
             !std::isnan(id(mr_distance).state);

  # Diagnostic: ON whenever the radar insists someone is there and we are
  # overriding it. Deliberately derived from the presence entity above rather
  # than re-deriving the condition, so the two can never disagree.
  # This is exactly the failure you are chasing, so it is the thing to watch
  # to confirm the watchdog works and to decide whether ${stale_timeout}
  # needs tuning.
  - platform: template
    id: mr_data_stale
    name: "Radar Data Stale"
    device_class: problem
    entity_category: diagnostic
    icon: mdi:radar
    lambda: |-
      return id(mr_raw_has_target).state && !id(mr_presence).state;
    filters:
      # Suppress the sub-second blip that happens every time somebody walks in
      # after a long vacancy: the radar asserts the target one frame before
      # the first reading arrives. Delays only the ON edge; OFF is immediate.
      - delayed_on: 30s

sensor:
  - platform: bh1750
    name: "Seeed MR60BHA2 Illuminance"
    address: 0x23
    update_interval: 1s

  - platform: seeed_mr60bha2
    # For each watched signal:
    #   on_raw_value -> fires BEFORE the filter chain, on every publish from
    #                   the component. Used only for the "Radar Frame Age"
    #                   diagnostic.
    #   on_value     -> fires AFTER the filter chain, so it only sees values
    #                   that got past `delta`, i.e. GENUINE CHANGES. The
    #                   `isnan` guard skips the watchdog's own NaN, which
    #                   would otherwise look like fresh data.
    #   filters      -> the has_target gate, then filter_out, then delta, then
    #                   timeout. Never reorder them, never insert anything
    #                   between them, and never append a value-mutating or
    #                   blocking filter (round / clamp / throttle / heartbeat)
    #                   after them.
    #
    # THE `lambda` GATE IS THE LEVEL HALF OF "readings follow presence down"
    # (the header explains the edge half). It reproduces, in YAML, the one
    # thing the dropped limengdu fork did that core ESPHome does not:
    #
    #     if (!has_target->state && frame_type != PEOPLE_EXIST) return;
    #
    # Core's process_frame_() publishes heart/breath on any frame whose
    # payload is non-zero and distance on any frame whose validity byte is
    # non-zero, with no reference to has_target at all (verified in
    # components/seeed_mr60bha2/seeed_mr60bha2.cpp). Presence and vitals are
    # separate ~1 Hz frames, so a trailing vitals frame lands in a LATER app
    # loop iteration than the zero-occupancy frame. Without this gate that
    # value passes filter_out (non-zero), passes delta (it differs from the
    # last one), lands in the sensor and re-arms `timeout` - and because
    # presence is already off there is no second ON->OFF edge to blank it
    # again. You get "Person Information: Clear" beside a live-looking heart
    # rate for up to ${stale_timeout}. Deleting this gate reintroduces exactly
    # that bug.
    #
    # `return {}` (an empty optional) makes Filter::input() skip output()
    # entirely, so a gated value touches neither delta's reference nor the
    # timeout's armed state - the same escape hatch `filter_out` uses.
    breath_rate:
      id: mr_breath_rate
      name: "Real-time respiratory rate"
      on_raw_value:
        - lambda: 'id(mr_last_frame_ms) = millis();'
      on_value:
        - lambda: 'if (!std::isnan(x)) id(mr_last_change_ms) = millis();'
      filters:
        - lambda: |-
            if (!id(mr_raw_has_target).state) return {};
            return x;
        - filter_out: 0.0
        - delta: ${change_deadband}
        - timeout: ${stale_timeout}   # emits NaN -> "unknown" in HA.
                                      # NOT tunable: every decision in this
                                      # file is a std::isnan() test, so any
                                      # other value silently disables it all.

    heart_rate:
      id: mr_heart_rate
      name: "Real-time heart rate"
      on_raw_value:
        - lambda: 'id(mr_last_frame_ms) = millis();'
      on_value:
        - lambda: 'if (!std::isnan(x)) id(mr_last_change_ms) = millis();'
      filters:
        - lambda: |-
            if (!id(mr_raw_has_target).state) return {};
            return x;
        - filter_out: 0.0
        - delta: ${change_deadband}
        - timeout: ${stale_timeout}

    distance:
      id: mr_distance
      name: "Distance to detection object"
      on_raw_value:
        - lambda: 'id(mr_last_frame_ms) = millis();'
      on_value:
        - lambda: 'if (!std::isnan(x)) id(mr_last_change_ms) = millis();'
      filters:
        - lambda: |-
            if (!id(mr_raw_has_target).state) return {};
            return x;
        - filter_out: 0.0
        - delta: ${change_deadband}
        - timeout: ${stale_timeout}

    # Target Number gets de-duplication ONLY - deliberately no `timeout:`.
    #
    # `delta` here restores the publish-on-change behaviour the old external
    # component had: core re-publishes this count on every 0x0A04 frame
    # (~1 Hz) whether it changed or not, which would otherwise spam Home
    # Assistant's recorder with identical rows forever.
    #
    # A `timeout:` would be actively wrong: an integer count legitimately
    # sits at exactly 1 for an entire occupancy, so it would revert a
    # perfectly correct reading to "unknown" ${stale_timeout} into every
    # normal visit. It is not one of the three watched signals either.
    #
    # NO has_target GATE HERE EITHER, and that is deliberate. The zero this
    # sensor receives on a zero-occupancy frame is the one flush of the four
    # that is genuinely informative ("no targets"), so it must be allowed
    # through. Instead, "Target Number" is blanked from the presence entity's
    # on_release, and only when the raw flag is still true - i.e. only on a
    # watchdog trip, where no zero-flush will ever arrive. See the comment
    # there.
    num_targets:
      id: mr_num_targets
      name: "Target Number"
      on_raw_value:
        - lambda: 'id(mr_last_frame_ms) = millis();'
      filters:
        - delta: ${change_deadband}

  # ---- diagnostic: seconds since ANY of the three last CHANGED ------------
  # This is literally the number the watchdog tests. It counts up towards
  # ${stale_timeout} and presence drops the moment it gets there, so tuning
  # ${stale_timeout} becomes an observation instead of a guess.
  # (It also climbs without limit during a genuinely empty room - harmless,
  # because the "Radar Data Stale" flag and presence are both gated on the
  # radar actually claiming a target. No `state_class:` on purpose: this is a
  # sawtooth counter and a "mean data age" statistic would be meaningless.)
  # Safe to delete along with the mr_last_change_ms global and the three
  # on_value blocks above.
  - platform: template
    id: mr_data_age
    name: "Radar Data Age"
    unit_of_measurement: "s"
    device_class: duration
    accuracy_decimals: 0
    entity_category: diagnostic
    icon: mdi:timer-sand
    update_interval: ${diagnostic_interval}
    lambda: |-
      // Unsigned wraparound subtraction - correct across the ~49.7-day
      // millis() rollover. Never write "now > last + timeout".
      return ((uint32_t) (millis() - id(mr_last_change_ms))) / 1000.0f;

  # ---- diagnostic: seconds since the radar last published ANYTHING --------
  # Near 0   = the module is transmitting decodable data, so a watchdog trip
  #            means "frozen values" and ${stale_timeout} is the knob.
  # Climbing = nothing decodable is arriving at all. Usually a dead module or
  #            dead UART - there is no software reset for this radar, that
  #            case needs a USB power cycle. BUT it can also mean the radar is
  #            sending only presence frames with no valid payload (a target
  #            tracked beyond the vitals/distance range), so confirm with
  #            `logger: level: VERBOSE` before you go unplugging things.
  # Safe to delete along with the mr_last_frame_ms global and the four
  # on_raw_value blocks above.
  - platform: template
    id: mr_frame_age
    name: "Radar Frame Age"
    unit_of_measurement: "s"
    device_class: duration
    accuracy_decimals: 0
    entity_category: diagnostic
    icon: mdi:access-point
    update_interval: ${diagnostic_interval}
    lambda: |-
      return ((uint32_t) (millis() - id(mr_last_frame_ms))) / 1000.0f;

##############################################################################
# DESIGN NOTES  (why it is built this way - safe to delete, but read once)
##############################################################################
#
# 1. WHY THE EXTERNAL COMPONENT WAS DROPPED
#    limengdu's fork de-duplicates every publish at the source
#    (`if (sensor_->state == value) break;`) and opens process_frame_() with
#
#        if (!has_target->state && frame_type != PEOPLE_EXIST) return;
#
#    which drops ALL breath/heart/distance frames while presence is false.
#    Core ESPHome has neither. The de-dup is replaced here by `delta:` and
#    the frame gate by the `lambda:` at the head of each of the three chains,
#    so nothing was actually given up - both behaviours are now visible in
#    this file instead of hidden in a vendored component. Core is also
#    null-checked on every sensor
#    pointer, bounds-checks the distance frame (`length >= 1 && data[0] != 0`,
#    then `length >= 8`), reads the UART in batches, and is still maintained -
#    the fork's last functional commit was 2025-02-05. Dropping it also
#    removes a `git clone` from every single build and stops a `ref: main`
#    from drifting under you.
#
#    The one thing core does differently: it re-publishes the SAME value on
#    every frame (~1 Hz) instead of only on change. That is precisely why the
#    `delta` filter is mandatory here - without it the `timeout` timer would
#    be re-armed every second and could never fire. (On the fork a bare
#    `timeout:` appears to work, but the NaN overwrites the fork's own de-dup
#    baseline, so the next frozen frame re-publishes ~1 s later and presence
#    only blinks off for a single loop. Adding `delta` fixes that too, which
#    means THIS CONFIG WORKS VERBATIM ON EITHER COMPONENT if you ever pin the
#    fork back - you would just also re-inherit the frame gate above.)
#
# 2. WHY PRESENCE IS A TEMPLATE BINARY_SENSOR RATHER THAN A FILTER
#    Overriding the radar's own has_target in place with a binary_sensor
#    `lambda` filter looks tidier and would guarantee the entity_id, but
#    binary_sensor::Filter::input() de-duplicates its INPUT before the lambda
#    ever runs (`if (!this->dedup_.next(value)) return;` - unlike sensor
#    filters, which do not). While presence was held off, the radar's endless
#    repeated `true` would sit latched in that de-duplicator, so on recovery
#    the next identical frame is swallowed, the lambda never runs again, and
#    presence stays stuck OFF FOREVER. Working around that needs a script
#    that flushes the de-duplicator with an opposite value plus an "this
#    write is mine" guard flag. A template facade needs none of it.
#
# 3. WHAT TO CHECK IN HOME ASSISTANT AFTER THE FIRST FLASH
#    "Person Information" moves from the seeed platform to the template
#    platform. HA's ESPHome unique_id is {mac}/{device}/{domain}/{name} (or
#    legacy {mac}-{domain}-{object_id}) - it does NOT encode which ESPHome
#    platform produced the entity - and the name, domain, device_class and
#    icon are all unchanged, so the entity_id, history and every automation
#    should carry over untouched. The old entity is never exposed alongside
#    the new one (it is `internal: true`), so there is nothing to collide
#    with. Still, glance at Settings -> Devices -> your MR60BHA2 after
#    flashing: if a `binary_sensor...._person_information_2` ever shows up, a
#    stale registry entry survived - delete the orphan and the original id
#    frees up. Nothing else changes platform: the four sensors stay on
#    seeed_mr60bha2, keeping their units, accuracy, device_class and
#    state_class, so long-term statistics stay continuous.
#    GENUINELY NEW entities: "Radar Data Stale", "Radar Data Age",
#    "Radar Frame Age" (all diagnostic). If you would rather the two age
#    counters did not touch your database at all, add to HA's
#    configuration.yaml:
#        recorder:
#          exclude:
#            entities:
#              - sensor.seeed_studio_mr60bha2_kit_radar_data_age
#              - sensor.seeed_studio_mr60bha2_kit_radar_frame_age
#
# 4. WHAT TO EXPECT IN NORMAL USE
#    * Jam (your bug): the radar keeps emitting frames at ~1 Hz while HA's
#      last_updated on the three readings stays frozen. Exactly
#      ${stale_timeout} after the last real change, all three flip to
#      "unknown", "Person Information" goes off, and "Radar Data Stale" goes
#      on 30 s later.
#      (Here it is the `timeout:` filters that blank the three readings, a
#      moment before presence itself drops; the on_release blanking then finds
#      all three already NaN and its isnan guards make those three a no-op.
#      "Target Number" is the one it does blank on this path, because the raw
#      flag is still true - see below.)
#    * Recovery: the first genuinely different reading clears everything
#      within one loop iteration. "Target Number" is the exception: it comes
#      back only when the radar reports a DIFFERENT count, so after a watchdog
#      trip it can legitimately read "unknown" for a while after presence has
#      already recovered. A gap, not a wrong number - the trade this whole
#      file makes.
#    * GENUINE empty room: ${flap_filter} after the radar's own flag drops,
#      presence goes off AND heart rate, respiratory rate and distance go
#      "unknown" in the same loop iteration - that is the on_release blanking
#      on "Person Information". They then STAY "unknown": the head gate on
#      their filter chains drops every further radar value while the flag is
#      down, so nothing can refill them. You never see a live-looking heart
#      rate attached to an empty room. You do not see stock's fake 0 bpm /
#      0 cm either: the component force-publishes a literal 0.0 to all three
#      on a presence=0 frame and `filter_out: 0.0` discards it, so those fake
#      zeros never reach the entities and never reach your long-term
#      statistics. What Home Assistant records for a vacancy is a GAP, which
#      is what a vacancy actually is.
#      ("Target Number" is different by design: its zero IS real, so it goes
#      to 0 on the departure frame itself - which, because of ${flap_filter},
#      is ~5 s BEFORE presence goes off. A brief "Detected / 0 targets" is
#      therefore normal on the way out, and if the flag was only blipping you
#      will see it go back to 1 on the next count frame while presence never
#      moved at all. That is the flag being de-flapped, working as intended.)
#    * Walking in: presence turns on within one radar frame (~1 s) of the
#      radar asserting the target, not instantly with it - it waits for the
#      first actual reading, and after the blanking there is no stale value
#      left to short-circuit that wait. The three readings repopulate on the
#      same frame that brings presence back. See HONEST LIMITS.
#    * Boot: the timeout filter is constructed with its loop DISABLED and
#      only arms once a real value has passed, so it cannot fire on an idle
#      device; presence starts off because the radar's flag starts false, and
#      the on_release blanking does not run at boot (see
#      `trigger_on_initial_state: false` on the presence entity). There is no
#      boot grace period and none is needed.
#
# 5. HONEST LIMITS  (read this one)
#    * BEYOND 1.5 m, HEART AND BREATH WILL READ "unknown". Seeed documents
#      that when the target is outside the 1.5 m vitals range the firmware
#      "stops updating and holds the last valid measurement" (and the same
#      for distance beyond 5 m). Held value = no change = this config reverts
#      it to "unknown" after ${stale_timeout}. That is the design working as
#      asked - an hour-old heart rate displayed as a live number is exactly
#      the misinformation you set out to kill - but it IS a visible change
#      from stock, and any HA template of yours reading those entities has to
#      cope with "unknown" - which, with the blanking in place, it will now
#      see on EVERY vacancy, not just ${stale_timeout} into a jam.
#      Guard on availability; do NOT paper over it with a numeric default:
#
#          {% set hr = states('sensor.seeed_studio_mr60bha2_kit_real_time_heart_rate') %}
#          {% if hr not in ['unknown', 'unavailable'] %}
#            {{ hr | float }}
#          {% endif %}
#
#      `| float(0)` is the trap: it silently turns every vacancy into a
#      recorded 0 bpm that is never "unknown" and never correct, which is the
#      exact stock behaviour this config removes - and any automation
#      thresholded on it (say `< 40`) would then fire permanently. Note the
#      entity_id prefix: it is derived from `friendly_name`, so it is
#      `sensor.seeed_studio_mr60bha2_kit_...`, matching the recorder example
#      in DESIGN NOTE 3 - not a bare `sensor.real_time_heart_rate`.
#    * CONSEQUENCE: for a target beyond 1.5 m the three-way OR in the
#      presence lambda effectively collapses to DISTANCE ALONE. A motionless
#      person at a fixed range whose reported distance never moves by more
#      than ${change_deadband} for ${stale_timeout} WILL be cleared. Use
#      "Radar Data Age" to measure your real occupied-room behaviour for a
#      week before you trust a short timeout; raise ${stale_timeout} if it
#      gets close.
#    * This catches FROZEN values. If the radar ghosts with values that keep
#      JITTERING (fan, air-con, swaying curtain - all documented by Seeed),
#      nothing goes stale and presence stays on. Raise ${change_deadband} to
#      make small jitter stop counting as "alive".
#    * >>> THE BIG ONE: PRESENCE CANNOT COME BACK UNTIL A READING CHANGES.
#      DeltaFilter only updates its reference when a value PASSES, and nothing
#      in the OFF path touches that reference - not the `timeout:` NaN, not
#      the on_release blanking (both are written past the chain) and not the
#      head gate (a gated value is dropped before delta ever sees it). So the
#      reference surviving a vacancy is the PRE-vacancy value, and presence
#      returns only once some reading differs from it by more than
#      ${change_deadband}.
#      Normally that is the very next radar frame: distance is a continuous
#      float32 range estimate and realistically never repeats bit for bit.
#      But if the module is in its hold/repeat state - re-sending bit-identical
#      heart / breath / distance, which is precisely the failure this file
#      exists to detect - then nothing can pass, and presence stays OFF for as
#      long as that lasts, with a person possibly still in the room. This is
#      NOT bounded by ${stale_timeout}; it is bounded by the radar changing
#      its mind.
#      ${flap_filter} is what keeps this from being reachable in practice: it
#      takes a presence OFF edge to get there, and a one-frame has_target blip
#      no longer produces one. That is why `delayed_off:` is shipped on by
#      default rather than offered as a footnote, and why setting it to 0s is
#      a bad idea. If you drive lights, an alarm or an HVAC schedule off
#      `binary_sensor...._person_information`, leave it alone or raise it.
#      "Radar Data Stale" turning ON 30 s into an occupied room is the symptom
#      to watch for.
#    * A has_target flap LONGER than ${flap_filter} while somebody is
#      genuinely in the room writes an "unknown" gap into the three readings'
#      history, because the blanking follows every presence OFF edge. It is a
#      gap, not a wrong value, so long-term statistics are unharmed (still
#      strictly better than stock, which wrote fake 0 bpm / 0 cm in as real
#      measurements) - but it is visible in the history graph, and per the
#      bullet above it may last longer than the flap did.
#    * The one place the blanking genuinely bites: a target beyond 1.5 m AND
#      beyond 5 m produces no live heart, no live breath and no live distance
#      at all. If has_target drops for longer than ${flap_filter} in that
#      state there is nothing left that CAN change, so presence latches OFF
#      immediately rather than waiting out the rest of ${stale_timeout}. Same
#      documented limitation as the two bullets above, reached sooner rather
#      than made deeper.
#    * "Target Number" is blanked only on a watchdog trip, and comes back only
#      when the radar reports a different count - so it can read "unknown"
#      after presence has already recovered. Deliberate: on that path the
#      component never publishes a fresh count at all, and a stale "1" beside
#      "Person Information: Clear" is the contradiction being removed.
#    * This masks the symptom; it does not fix the radar. There is no
#      software reset - neither component writes a single byte to the UART.
#      A hard-hung module still needs a USB power cycle, and "Radar Frame
#      Age" is what tells you that you are in that case. Radar firmware
#      1.6.12 (2025-09-18) is the newest available and does not claim to fix
#      ghosting.
##############################################################################
