play_item:
  fields:
    # At startup the integration narrows this picker to the cast players that can show
    # video (not device class speaker), and keeps that list up to date (see __init__.py).
    entity_id:
      required: true
      example: media_player.bedroom_chromecast
      selector:
        entity:
          filter:
            - domain: media_player
              integration: cast
    item_id:
      example: 1ffa07c043d35bab9a1c090831a41d13
      selector:
        text:
    name:
      example: Futurama
      selector:
        text:
    item_type:
      selector:
        select:
          options:
            - Episode
            - Movie
            - Series
            - Video
    library:
      example: TV Shows
      selector:
        text:
    episode:
      default: next_up
      selector:
        select:
          options:
            - next_up
            - random
    shuffle:
      default: false
      selector:
        boolean:
    audio_stream_index:
      selector:
        number:
          min: 0
          max: 200
          mode: box
    subtitle_stream_index:
      selector:
        number:
          min: -1
          max: 200
          mode: box
    start_position_ticks:
      selector:
        number:
          min: 0
          max: 1000000000000
          mode: box
    max_bitrate:
      selector:
        number:
          min: 100000
          max: 200000000
          step: 100000
          mode: box
    receiver_name:
      example: Bedroom Chromecast Jellyfin
      selector:
        text:
    timeout:
      default: 45
      selector:
        number:
          min: 5
          max: 180
          unit_of_measurement: s
          mode: box

next_track:
  fields:
    entity_id:
      required: true
      example: media_player.bedroom_chromecast
      selector:
        entity:
          filter:
            - domain: media_player
              integration: cast
    timeout:
      default: 15
      selector:
        number:
          min: 2
          max: 60
          unit_of_measurement: s
          mode: box

previous_track:
  fields:
    entity_id:
      required: true
      example: media_player.bedroom_chromecast
      selector:
        entity:
          filter:
            - domain: media_player
              integration: cast
    timeout:
      default: 15
      selector:
        number:
          min: 2
          max: 60
          unit_of_measurement: s
          mode: box
