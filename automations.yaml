- id: '1708472009602'
  alias: Play Random Music when maxi awakes at home
  description: When Maxi wakes up (asleep sensor off for 2 minutes) between 07:00
    and 11:59 while home, with not everyone asleep and the home speakers not already
    playing, starts music on the home speaker group. Before 11:00 with Myriam at Maxi's
    it plays Myriam Morning Music shuffled; otherwise it runs the Maxi playlist script,
    which plays Maxi's Smart Playlist.
  triggers:
  - alias: Maxi awake for 2 min
    entity_id:
    - sensor.is_maxi_asleep
    from:
    - 'on'
    to:
    - 'off'
    for:
      hours: 0
      minutes: 2
      seconds: 0
    trigger: state
  conditions:
  - alias: Maxi is home
    condition: state
    entity_id: person.maximiliano
    state: home
  - alias: Not all residents are sleeping
    condition: state
    entity_id: binary_sensor.all_residents_sleeping
    state: 'off'
  - alias: Home speakers are not playing
    condition: not
    conditions:
    - alias: Home speakers are playing
      condition: state
      entity_id: media_player.group_mass_home_group_speakers
      state: playing
  - alias: Between 07:00 and 11:59
    condition: time
    after: 07:00:00
    before: '11:59:00'
  actions:
  - alias: Pick music based on time and Myriam
    choose:
    - alias: Before 11:00 with Myriam here → her morning music
      conditions:
      - alias: Between 03:00 and 11:00
        condition: time
        before: '11:00:00'
        after: 03:00:00
      - alias: Myriam is at Maxi's
        condition: state
        entity_id: binary_sensor.myriam_at_maxis
        state: 'on'
      sequence:
      - alias: Turn on shuffle on home speakers
        action: media_player.shuffle_set
        metadata: {}
        data:
          shuffle: true
        target:
          entity_id: media_player.group_mass_home_group_speakers
      - alias: Start soft myriam music
        data:
          media_id: Myriam Morning Music
          enqueue: replace
          media_type: playlist
        action: music_assistant.play_media
        target:
          entity_id: media_player.group_mass_home_group_speakers
    default:
    - alias: 'Otherwise: start Maxi''s playlist on home speakers'
      action: script.start_a_random_maxi_playlist
      data:
        player_entity: media_player.group_mass_home_group_speakers
  mode: single
- id: '1708472370553'
  alias: Stop bedroom speaker when bedroom sleeper awake
  description: Clears the queue and turns off the bedroom speaker once the bedroom
    sleeper flag has been off for 6 minutes, so night music stops after the sleeper
    gets up.
  triggers:
  - alias: Bedroom sleeper off for 6 min
    entity_id:
    - input_boolean.sleeper_in_bedroom
    from: 'on'
    to: 'off'
    for:
      hours: 0
      minutes: 6
      seconds: 0
    trigger: state
  conditions: []
  actions:
  - alias: Clear the bedroom speaker queue
    action: media_player.clear_playlist
    metadata: {}
    data: {}
    target:
      entity_id: media_player.mass_bedroom_vpe_speaker
  - alias: Turn off the bedroom speaker
    metadata: {}
    data: {}
    action: media_player.turn_off
    target:
      entity_id: media_player.mass_bedroom_vpe_speaker
  mode: single
- id: '1711565389493'
  alias: Assist Restart Music Assistant
  description: Restarts the Music Assistant beta add-on when someone says 'Restart
    Music Assistant' to Assist.
  triggers:
  - alias: 'Voice command: Restart Music Assistant'
    trigger: conversation
    command: Restart Music Assistant
  conditions: []
  actions:
  - alias: Restart the Music Assistant beta add-on
    action: hassio.addon_restart
    metadata: {}
    data:
      addon: d5369777_music_assistant_beta
  mode: single
- id: '1713378517441'
  alias: Auto-lock doors when closed for 5 seconds
  description: Locks the front or back door 5 seconds after the outside contact sensor
    reports the door is shut, but only if the lock is not already in the locked state.
  triggers:
  - alias: Front door closed for 5 s
    trigger: state
    entity_id:
    - binary_sensor.sensor_front_outside_door_contact
    to: 'off'
    for:
      hours: 0
      minutes: 0
      seconds: 5
    id: front_door_closed
  - alias: Back door closed for 5 s
    trigger: state
    entity_id:
    - binary_sensor.sensor_back_outside_door_contact
    to: 'off'
    for:
      hours: 0
      minutes: 0
      seconds: 5
    id: back_door_closed
  conditions: []
  actions:
  - alias: Lock whichever door just closed
    choose:
    - alias: Front door closed and unlocked → lock it
      conditions:
      - alias: Triggered by the front door closing
        condition: trigger
        id: front_door_closed
      - alias: Front door is not locked
        condition: not
        conditions:
        - alias: Front door lock is locked
          condition: state
          entity_id: lock.lock_front_door
          state: locked
      sequence:
      - alias: Lock the front door
        action: lock.lock
        data: {}
        target:
          entity_id: lock.lock_front_door
    - alias: Back door closed and unlocked → lock it
      conditions:
      - alias: Triggered by the back door closing
        condition: trigger
        id: back_door_closed
      - alias: Back door is not locked
        condition: not
        conditions:
        - alias: Back door lock is locked
          condition: state
          entity_id: lock.back_door
          state: locked
      sequence:
      - alias: Lock the back door
        action: lock.lock
        data: {}
        target:
          entity_id: lock.back_door
  mode: parallel
  max: 2
- id: '1713378679048'
  alias: Re-lock doors 5 minutes after unlocking if door is shut
  description: Safety net that re-locks the front or back door if it has been unlocked
    for 5 minutes and the door is currently closed. Prevents doors from staying unlocked
    indefinitely.
  triggers:
  - alias: Front door unlocked for 5 min
    trigger: state
    entity_id:
    - lock.lock_front_door
    to: unlocked
    for:
      hours: 0
      minutes: 5
      seconds: 0
    id: front_door_unlocked
  - alias: Back door unlocked for 5 min
    trigger: state
    entity_id:
    - lock.back_door
    to: unlocked
    for:
      hours: 0
      minutes: 5
      seconds: 0
    id: back_door_unlocked
  conditions: []
  actions:
  - alias: Re-lock whichever door stayed unlocked
    choose:
    - alias: Front door unlocked and shut → re-lock
      conditions:
      - alias: Triggered by the front door lock
        condition: trigger
        id: front_door_unlocked
      - alias: Front door is closed
        condition: state
        entity_id: binary_sensor.sensor_front_outside_door_contact
        state: 'off'
      sequence:
      - alias: Re-lock the front door
        action: lock.lock
        data: {}
        target:
          entity_id: lock.lock_front_door
    - alias: Back door unlocked and shut → re-lock
      conditions:
      - alias: Triggered by the back door lock
        condition: trigger
        id: back_door_unlocked
      - alias: Back door is closed
        condition: state
        entity_id: binary_sensor.sensor_back_outside_door_contact
        state: 'off'
      sequence:
      - alias: Re-lock the back door
        action: lock.lock
        data: {}
        target:
          entity_id: lock.back_door
  mode: parallel
  max: 2
- id: '1713378916074'
  alias: Alert that the front door remained open
  description: When the front door has been open for 3 minutes, and the apartment
    is not being aired out or in party mode, announces 'Front door remained opened'
    as a low-priority house alert. Repeats every 5 minutes while the door stays open
    and airing mode stays off.
  triggers:
  - alias: Front door open for 3 min
    entity_id:
    - binary_sensor.sensor_front_door_contact
    to: 'on'
    for:
      hours: 0
      minutes: 3
      seconds: 0
    trigger: state
  conditions:
  - alias: Not airing out the apartment
    condition: state
    entity_id: input_boolean.aerating_apartment
    state: 'off'
  - alias: Party mode is off
    condition: state
    entity_id: input_boolean.party_mode
    state:
    - 'off'
  actions:
  - alias: Repeat while the door stays open
    repeat:
      sequence:
      - alias: 'Announce: front door remained opened'
        action: script.non_important_broadcast_alert_in_the_house
        data:
          message: Front door remained opened
      - alias: Wait 5 minutes
        delay:
          hours: 0
          minutes: 5
          seconds: 0
          milliseconds: 0
      while:
      - alias: Front door is still open
        condition: state
        entity_id: binary_sensor.sensor_front_door_contact
        state: 'on'
      - alias: Still not airing out
        condition: state
        entity_id: input_boolean.aerating_apartment
        state: 'off'
    enabled: true
  mode: restart
- id: '1713399927983'
  alias: Alert that the vacuum is stuck
  description: When the robot vacuum has been in an error state for 5 minutes, announces
    'Vacuum Stuck in <current room>' as a low-priority house alert and repeats it
    every 10 minutes until the error clears.
  triggers:
  - alias: Vacuum in error for 5 min
    entity_id:
    - vacuum.roborock_qrevo_curv_series
    to: error
    trigger: state
    for:
      hours: 0
      minutes: 5
      seconds: 0
  conditions: []
  actions:
  - alias: Repeat until the vacuum leaves error
    repeat:
      sequence:
      - alias: Announce the vacuum is stuck and where
        metadata: {}
        data:
          message: Vacuum Stuck in "{{states('sensor.roborock_qrevo_curv_series_current_room')}}"
        action: script.non_important_broadcast_alert_in_the_house
      - alias: Wait 10 minutes
        delay:
          hours: 0
          minutes: 10
          seconds: 0
          milliseconds: 0
      until:
      - alias: Vacuum is no longer in error
        condition: not
        conditions:
        - alias: Vacuum is in error
          condition: state
          entity_id: vacuum.roborock_qrevo_curv_series
          state: error
  mode: single
- id: '1713408006382'
  alias: Turn back door lights on when someone is detected
  description: Turns on the back door light at full brightness and 3724 K when any
    of the four person sensors around the back entrance (two presence sensors, the
    back door camera and the hotbox window sensor) detects someone.
  triggers:
  - alias: Person detected near the back entrance
    entity_id:
    - binary_sensor.back_entrance_presence_person_occupancy
    - binary_sensor.reolink_back_door_camera_person
    - binary_sensor.hotbox_window_presence_person_occupancy
    - binary_sensor.back_door_camera_person_occupancy
    to: 'on'
    trigger: state
  conditions: []
  actions:
  - alias: Back door light on at 100%, 3724 K
    metadata: {}
    data:
      color_temp_kelvin: 3724
      brightness: 255
    target:
      entity_id: light.back_door_light
    action: light.turn_on
  mode: single
- id: '1713451307697'
  alias: Sleep actions when "all resident sleeping" is turned on
  description: When all residents have been asleep for 5 minutes, or the alarm is
    armed for the night, and the sun is down with no kink party, Acid Time or party
    mode, turns on Adaptive Lighting sleep mode, closes the workshop, salon, kitchen
    and hotbox blinds and turns off the workshop Google TV and the salon Bravia TV.
  triggers:
  - alias: All residents asleep for 5 min
    entity_id:
    - binary_sensor.all_residents_sleeping
    to: 'on'
    for:
      hours: 0
      minutes: 5
      seconds: 0
    trigger: state
  - alias: Alarm armed for the night
    trigger: alarm_control_panel.armed_night
    target:
      entity_id: alarm_control_panel.home_alarm
    options:
      for: 00:00:00
  conditions:
  - alias: No kink party
    condition: state
    entity_id: input_boolean.kink_party
    state: 'off'
  - alias: Acid Time is off
    condition: state
    entity_id: input_boolean.acid_time
    state: 'off'
  - alias: Party mode is off
    condition: state
    entity_id: input_boolean.party_mode
    state: 'off'
  - alias: Sun is below the horizon
    condition: state
    entity_id: sun.sun
    state:
    - below_horizon
  actions:
  - alias: Turn on Adaptive Lighting sleep mode
    metadata: {}
    data: {}
    target:
      entity_id: switch.adaptive_lighting_sleep_mode_adaptive_lighting
    action: switch.turn_on
  - alias: Close workshop, salon, kitchen and hotbox blinds
    metadata: {}
    data: {}
    target:
      entity_id:
      - cover.cover_workshop_blinds
      - cover.cover_salon_blinds
      - cover.cover_kitchen_curtains
      - cover.cover_hotbox_blinds
    action: cover.close_cover
  - alias: Turn off workshop Google TV and salon Bravia
    action: remote.turn_off
    metadata: {}
    target:
      entity_id:
      - remote.salon_google_tv_2
      - remote.bravia_4k_ae2
    data: {}
  mode: single
- id: '1713451780517'
  alias: Turn off Sleeping mode for Adaptative lighting on "all resident sleeping"
    turns off
  description: Turns off Adaptive Lighting sleep mode once not all residents have
    been asleep for 3 minutes, but only between 08:00 and 22:00 on weekdays or 10:00
    and 22:00 on weekends.
  triggers:
  - alias: Not all residents asleep for 3 min
    entity_id:
    - binary_sensor.all_residents_sleeping
    to:
    - 'off'
    trigger: state
    for:
      hours: 0
      minutes: 3
      seconds: 0
  conditions:
  - alias: Within daytime hours
    condition: or
    conditions:
    - alias: Weekdays 06:30–22:00
      condition: time
      after: 06:30:00
      before: '22:00:00'
      weekday:
      - fri
      - thu
      - wed
      - tue
      - mon
    - alias: Weekends 08:45–22:00
      condition: time
      after: 08:45:00
      before: '22:00:00'
      weekday:
      - sun
      - sat
  actions:
  - alias: Turn off Adaptive Lighting sleep mode
    target:
      entity_id: switch.adaptive_lighting_sleep_mode_adaptive_lighting
    data: {}
    action: switch.turn_off
  mode: single
- id: '1713451981404'
  alias: Turn on party mode when over 5 guests are over
  description: Turns on party mode when more than 5 devices are connected to the Chilling
    hotspot Wi-Fi, unless a kink party, Acid Time or a neon UV party is on.
  triggers:
  - alias: More than 5 hotspot clients
    entity_id:
    - sensor.chilling_hotspot_client_count
    above: 5
    trigger: numeric_state
  conditions:
  - alias: No kink party
    condition: state
    entity_id: input_boolean.kink_party
    state: 'off'
  - alias: Acid Time is off
    condition: state
    entity_id: input_boolean.acid_time
    state: 'off'
  - alias: No neon UV party
    condition: state
    entity_id: input_boolean.neon_uv_party
    state:
    - 'off'
  actions:
  - alias: Turn on party mode
    target:
      entity_id: input_boolean.party_mode
    data: {}
    action: input_boolean.turn_on
  mode: single
- id: '1713452550061'
  alias: Close blinds when the house is empty
  description: Closes all blinds, including the bedroom's, when nobody has been in
    the home zone for 5 minutes.
  triggers:
  - alias: Nobody in the home zone for 5 min
    entity_id:
    - zone.home
    for:
      hours: 0
      minutes: 5
      seconds: 0
    below: 0.9
    trigger: numeric_state
  conditions: []
  actions:
  - alias: Close all blinds and bedroom blinds
    metadata: {}
    data: {}
    action: cover.close_cover
    target:
      entity_id:
      - cover.group_all_blinds
      - cover.cover_bedroom_blinds
  mode: single
- id: '1713533595890'
  alias: Disarm alarm-away when "User Home" turns on
  description: Disarms the home alarm when the Users Present sensor turns on (a resident
    arrives) while the alarm is armed away.
  triggers:
  - alias: A resident arrives home
    trigger: state
    entity_id:
    - binary_sensor.user_home
    to: 'on'
    from: 'off'
  conditions:
  - alias: Alarm is armed away
    condition: state
    entity_id: alarm_control_panel.home_alarm
    state: armed_away
  actions:
  - alias: Disarm the home alarm
    action: alarm_control_panel.alarm_disarm
    metadata: {}
    data: {}
    target:
      entity_id: alarm_control_panel.home_alarm
  mode: single
- id: '1713533768680'
  alias: Arm Alarm-Away when "User home" is off for 10 minutes
  description: Arms the alarm in away mode after nobody has been home for 10 minutes,
    providing a buffer to avoid false triggers.
  triggers:
  - alias: Users Present off for 10 min
    entity_id:
    - binary_sensor.user_home
    from: 'on'
    to: 'off'
    for:
      hours: 0
      minutes: 10
      seconds: 0
    trigger: state
  - alias: Home zone empty for 10 min
    trigger: state
    entity_id:
    - zone.home
    from:
    to: '0'
    for:
      hours: 0
      minutes: 10
      seconds: 0
  conditions: []
  actions:
  - alias: Arm the home alarm away
    metadata: {}
    data: {}
    target:
      entity_id: alarm_control_panel.home_alarm
    action: alarm_control_panel.alarm_arm_away
  mode: single
- id: '1713534223873'
  alias: Turn ACs on and Off  depending on house occupancy
  description: Sets the workshop and salon ACs to the 'away' preset when the Users
    Present sensor turns off, and back to no preset when it turns on.
  triggers:
  - alias: Users Present changes
    entity_id:
    - binary_sensor.user_home
    trigger: state
  conditions: []
  actions:
  - alias: Set AC preset by presence
    choose:
    - alias: Someone home → normal AC preset
      conditions:
      - alias: Users Present is on
        condition: state
        entity_id: binary_sensor.user_home
        state: 'on'
      sequence:
      - alias: Set workshop and salon AC preset to none
        metadata: {}
        data:
          preset_mode: none
        target:
          entity_id:
          - climate.workshop_ac
          - climate.salon_ac
        action: climate.set_preset_mode
    - alias: Nobody home → away AC preset
      conditions:
      - alias: Users Present is off
        condition: state
        entity_id: binary_sensor.user_home
        state: 'off'
      sequence:
      - alias: Set workshop and salon AC preset to away
        metadata: {}
        data:
          preset_mode: away
        target:
          entity_id:
          - climate.workshop_ac
          - climate.salon_ac
        action: climate.set_preset_mode
  mode: single
- id: '1713535684569'
  alias: Play Muzak in the bathroom when someone enters
  description: When someone enters the bathroom with its door open, and none of the
    bathroom, kitchen or workshop speakers or the workshop TV is playing, starts the
    Bathroom Muzak playlist shuffled on the bathroom speaker at 10% volume (40% if
    the door has closed by then).
  triggers:
  - alias: Bathroom occupancy detected
    entity_id:
    - binary_sensor.group_bathroom_motion_occupancy
    to:
    - 'on'
    from:
    - 'off'
    trigger: state
  conditions:
  - alias: No nearby speaker or TV is playing
    condition: not
    conditions:
    - alias: Bathroom speaker is playing
      condition: state
      entity_id: media_player.mass_bathroom_vpe_speaker
      state: playing
    - alias: Kitchen speaker is playing
      condition: state
      entity_id: media_player.mass_kitchen_wiim_speaker
      state: playing
    - alias: Workshop speaker is playing
      condition: state
      entity_id: media_player.mass_workshop_wiim_speaker
      state: playing
    - alias: Workshop Chromecast is playing
      condition: state
      entity_id: media_player.universal_workshop_chromecast
      state: playing
  - alias: Bathroom door is open
    condition: state
    entity_id: binary_sensor.sensor_bathroom_door_contact
    state:
    - 'on'
  actions:
  - alias: Turn on shuffle on the bathroom speaker
    action: media_player.shuffle_set
    metadata: {}
    data:
      shuffle: true
    target:
      entity_id: media_player.mass_bathroom_vpe_speaker
  - alias: Play Bathroom Muzak on the bathroom speaker
    action: music_assistant.play_media
    metadata: {}
    data:
      media_id: Bathroom Muzak
      media_type: playlist
      enqueue: replace
    target:
      entity_id: media_player.mass_bathroom_vpe_speaker
  - alias: Set volume by bathroom door state
    choose:
    - alias: Door open → volume 10%
      conditions:
      - alias: Bathroom door is open
        condition: state
        entity_id: binary_sensor.sensor_bathroom_door_contact
        state: 'on'
      sequence:
      - alias: Set bathroom speaker volume to 10%
        metadata: {}
        data:
          volume_level: 0.1
        target:
          entity_id:
          - media_player.mass_bathroom_vpe_speaker
        action: media_player.volume_set
    - alias: Door closed → volume 40%
      conditions:
      - alias: Bathroom door is closed
        condition: state
        entity_id: binary_sensor.sensor_bathroom_door_contact
        state: 'off'
      sequence:
      - alias: Set bathroom speaker volume to 40%
        metadata: {}
        data:
          volume_level: 0.4
        action: media_player.volume_set
        target:
          entity_id:
          - media_player.mass_bathroom_vpe_speaker
  mode: restart
- id: '1713536409397'
  alias: Raise music on the playing speaker when the Bathroom fans goes on
  description: When the bathroom fan turns on with the bathroom door closed, raises
    the bathroom speaker volume by two steps so music stays audible over the fan.
  triggers:
  - alias: Bathroom fan turns on
    entity_id:
    - switch.bathroom_fan
    from: 'off'
    to: 'on'
    trigger: state
  conditions:
  - alias: Bathroom door is closed
    condition: state
    entity_id: binary_sensor.sensor_bathroom_door_contact
    state: 'off'
  actions:
  - alias: 'Repeat twice: raise the volume'
    repeat:
      count: 2
      sequence:
      - alias: Raise bathroom speaker volume
        action: media_player.volume_up
        metadata: {}
        data: {}
        target:
          entity_id: media_player.mass_bathroom_vpe_speaker
  mode: single
- id: '1713536741103'
  alias: Start bathroom fan when Shower in Usage turns on
  description: Turns on the bathroom fan once the shower-in-use sensor has been on
    for 30 seconds.
  triggers:
  - alias: Shower in use for 30 s
    entity_id:
    - binary_sensor.shower_in_usage
    trigger: state
    to: 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 30
  conditions: []
  actions:
  - alias: Turn on the bathroom fan
    metadata: {}
    data: {}
    target:
      entity_id: switch.bathroom_fan
    action: switch.turn_on
  mode: restart
- id: '1713538197256'
  alias: Control Hallway Tablet charging
  description: 'Keeps the hallway tablet battery between 15% and 90%: turns its charging
    plug off above 90%, and on below 15% while dimming the screen to brightness 25.
    Once the tablet is charging above 20%, sets the screen brightness back to 100.'
  triggers:
  - alias: Hallway tablet battery changes
    entity_id:
    - sensor.kiosk_hallway_wall_tablet_battery
    trigger: state
  conditions: []
  actions:
  - alias: Charge or adjust by battery level
    choose:
    - alias: Above 90% → stop charging
      conditions:
      - alias: Battery above 90%
        condition: numeric_state
        entity_id: sensor.kiosk_hallway_wall_tablet_battery
        above: 90
      sequence:
      - alias: Turn off the hallway tablet charger
        metadata: {}
        data: {}
        target:
          entity_id: switch.plug_hallway_tablet
        action: switch.turn_off
    - alias: Below 15% → charge and dim screen
      conditions:
      - alias: Battery below 15%
        condition: numeric_state
        entity_id: sensor.kiosk_hallway_wall_tablet_battery
        below: 15
      sequence:
      - alias: Turn on the hallway tablet charger
        metadata: {}
        data: {}
        target:
          entity_id: switch.plug_hallway_tablet
        action: switch.turn_on
      - alias: Set tablet screen brightness to 25
        if:
        - condition: state
          entity_id: light.kiosk_hallway_wall_tablet_screen
          state: 'on'
        then:
        - action: light.turn_on
          target:
            entity_id: light.kiosk_hallway_wall_tablet_screen
          data:
            brightness: 25
    - alias: Charging above 20% → brightness 100
      conditions:
      - alias: Battery above 20%
        condition: numeric_state
        entity_id: sensor.kiosk_hallway_wall_tablet_battery
        above: 20
      - alias: Tablet is plugged in
        condition: state
        entity_id: binary_sensor.kiosk_hallway_wall_tablet_charging
        state: 'on'
      sequence:
      - alias: Set tablet screen brightness to 100
        if:
        - condition: state
          entity_id: light.kiosk_hallway_wall_tablet_screen
          state: 'on'
        then:
        - action: light.turn_on
          target:
            entity_id: light.kiosk_hallway_wall_tablet_screen
          data:
            brightness: 100
  mode: single
- id: '1713574201448'
  alias: Turn lights to white when we stop a movie
  description: When the salon or workshop TV turns off after showing something that
    is not a TV series, and no kink party, party mode, Acid Time or live concert is
    on, stops any effect on that room's lights that are on and re-applies Adaptive
    Lighting brightness and color to them.
  triggers:
  - alias: TV turns off from idle
    entity_id:
    - media_player.universal_salon_chromecast
    - media_player.universal_workshop_chromecast
    to:
    - 'off'
    trigger: state
    from:
    - idle
  - alias: TV turns off from paused
    entity_id:
    - media_player.universal_salon_chromecast
    - media_player.universal_workshop_chromecast
    to:
    - 'off'
    trigger: state
    from:
    - paused
  - alias: TV turns off from paused
    entity_id:
    - media_player.universal_salon_chromecast
    - media_player.universal_workshop_chromecast
    to:
    - 'off'
    trigger: state
    from:
    - paused
  - alias: TV turns off from playing
    entity_id:
    - media_player.universal_salon_chromecast
    - media_player.universal_workshop_chromecast
    to:
    - 'off'
    trigger: state
    from:
    - 'on'
  conditions:
  - alias: Last media was from the Movies library
    condition: template
    value_template: '{{ state_attr(state_attr(trigger.entity_id,''active_child''),''media_library_title'')
      == ''Movies''}}'
    enabled: false
  - alias: Last media was not a TV series
    condition: template
    value_template: '{{ not trigger.from_state.attributes.get(''media_series_title'')
      }}'
  - alias: No kink party
    condition: state
    entity_id: input_boolean.kink_party
    state: 'off'
  - alias: Party mode is off
    condition: state
    entity_id: input_boolean.party_mode
    state: 'off'
  - alias: Acid Time is off
    condition: state
    entity_id: input_boolean.acid_time
    state: 'off'
  - alias: No live concert
    condition: state
    entity_id: input_boolean.live_concert
    state: 'off'
  actions:
  - alias: List the lit lights in the TV's room
    variables:
      off_lights_in_room: '{{ [area_id(trigger.entity_id)] | map(''area_id'') | map(''area_entities'')
        | sum(start=[]) | select(''match'', ''^light.'') | select(''is_state'',''on'')
        | unique | list }}

        '
      entity_id: '{{ trigger.entity_id }}

        '
      trigger_full: '{{ trigger.to_state.attributes }}

        '
  - alias: 'For each lit light: reset to Adaptive Lighting'
    repeat:
      sequence:
      - alias: Stop the running effect only on lights that support effect_stop
        if:
        - alias: Light supports effect_stop
          condition: template
          value_template: '{{ ''effect_stop'' in (state_attr(repeat.item, ''effect_list'')
            or []) }}'
        then:
        - alias: Stop the light's effect
          metadata: {}
          data:
            effect: effect_stop
          target:
            entity_id: '{{ repeat.item }}'
          action: light.turn_on
        enabled: true
      - alias: Apply Adaptive Lighting to the light
        action: adaptive_lighting.apply
        metadata: {}
        data:
          lights: '{{ repeat.item }}

            '
          entity_id: switch.adaptive_lighting_adaptive_lighting
          turn_on_lights: true
          adapt_brightness: true
          adapt_color: true
          transition: '2'
      for_each: '{{off_lights_in_room}}'
    enabled: true
  mode: restart
- id: '1713630060902'
  alias: Raise lights to 60% brightness when a movie is paused and the brightness
    is below 30%
  description: When a movie from the Movies library is paused on the bedroom, workshop
    or salon TV, raises every light in that room that is on below 60% brightness to
    60% over 2 seconds.
  triggers:
  - alias: TV playback paused
    entity_id:
    - media_player.universal_bedroom_chromecast
    - media_player.universal_workshop_chromecast
    - media_player.universal_salon_chromecast
    to: paused
    trigger: state
    for:
      hours: 0
      minutes: 0
      seconds: 0
  conditions:
  - alias: Media is from the Movies library
    condition: template
    value_template: '{{ state_attr(state_attr(trigger.entity_id,''active_child''),''media_library_title'')
      == ''Movies''}}'
    enabled: true
  - alias: Media is not a TV series
    condition: template
    value_template: '{{ not trigger.from_state.attributes.get(''media_series_title'')
      }}'
    enabled: true
  actions:
  - alias: List lit room lights below 60%
    variables:
      lights_under_60_percent: '{{ [area_id(trigger.entity_id)] | map(''area_entities'')
        | sum(start=[]) | select(''match'', ''^light.'') | select(''is_state'',''on'')  |
        expand | selectattr(''attributes.brightness'', ''defined'') | rejectattr(''attributes.brightness'',
        ''none'') | selectattr(''attributes.brightness'',''<'',153) | map(attribute=''entity_id'')
        | unique | list }}

        '
      entity_id: '{{ trigger.entity_id }}

        '
      trigger_full: '{{ trigger.to_state.attributes }}

        '
  - alias: 'For each dim light: raise to 60%'
    repeat:
      sequence:
      - alias: Set the light to 60% over 2 s
        metadata: {}
        data:
          brightness: 153
          transition: 2
        target:
          entity_id: '{{ repeat.item }}'
        action: light.turn_on
      for_each: '{{lights_under_60_percent}}'
    enabled: true
  mode: parallel
  max: 6
- id: '1713631370622'
  alias: Turn off Closet fan after 5 minutes of non occupancy
  description: Turns off the closet fan once the closet has had no occupancy for 10
    minutes.
  triggers:
  - alias: Closet empty for 10 min
    entity_id:
    - binary_sensor.group_closet_motion_occupancy
    from:
    - 'on'
    to:
    - 'off'
    for:
      hours: 0
      minutes: 10
      seconds: 0
    trigger: state
  conditions: []
  actions:
  - alias: Turn off the closet fan
    metadata: {}
    data: {}
    target:
      entity_id: switch.plug_closet_fan
    action: switch.turn_off
  mode: single
- id: '1713719722990'
  alias: Conditionally Unmute Speakers when a room is occupied
  description: When motion is detected in a room (or a person on the patio camera)
    while music following is on, unmutes that room's playing Music Assistant speakers,
    unless the room has a sleeper, an unmuted TV or an active microphone. If the room
    had been empty for over 1000 seconds (about 17 minutes), also resets the speaker
    volume for the time of day.
  triggers:
  - alias: Motion detected in a room
    entity_id:
    - binary_sensor.group_closet_motion_occupancy
    - binary_sensor.group_lounge_motion_occupancy
    - binary_sensor.group_bedroom_motion_occupancy
    - binary_sensor.group_hallway_motion_occupancy
    - binary_sensor.group_kitchen_motion_occupancy
    - binary_sensor.group_entrance_motion_occupancy
    - binary_sensor.group_workshop_motion_occupancy
    - binary_sensor.group_salon_motion_occupancy
    - binary_sensor.group_hotbox_motion_occupancy
    - binary_sensor.group_patio_motion_occupancy
    - binary_sensor.patio_camera_person_occupancy
    for:
      hours: 0
      minutes: 0
      seconds: 0
    to:
    - 'on'
    trigger: state
  conditions:
  - alias: Music following is on
    condition: state
    entity_id: input_boolean.following_music
    state: 'on'
  - condition: template
    value_template: '{{ trigger.to_state.state == "on" }}'
    alias: Confirm Motion
  - alias: Make sure no sleeper is present
    condition: template
    value_template: '{{ area_id(trigger.entity_id) | string | lower not in states(''sensor.active_sleeper_rooms'')
      | string | lower }}'
  - alias: Make sure no unmuted TV is present
    condition: template
    value_template: '{{ area_id(trigger.entity_id) | string | lower not in state_attr(''sensor.active_chromecast_rooms'',
      ''unmuted_rooms'') | string | lower }}'
  - alias: Make sure no active microphone is present
    condition: template
    value_template: '{{ area_id(trigger.entity_id) | string | lower not in states(''sensor.active_microphones_rooms'')
      | string | lower }}'
  actions:
  - alias: List the room's playing speakers
    variables:
      playing_speakers: '{{ [area_id(trigger.entity_id)]   | map(''area_entities'')
        | sum(start=[]) |    select(''search'', ''mass'') |    select(''search'',
        ''speaker'') | select(''is_state'',''playing'') | unique | list }}

        '
      average_volume: '{{ states(''sensor.template_average_unmuted_speakers_volume'')}}

        '
  - metadata: {}
    data:
      is_volume_muted: false
    target:
      entity_id: '{{playing_speakers}}'
    alias: Unmute the speaker
    action: media_player.volume_mute
  - alias: Set Speaker volume to default volume  if the room is  empty for a long
      time
    if:
    - alias: Is it been empty over 1000 seconds?
      condition: template
      value_template: '{{ (now() - trigger.from_state.last_changed) > timedelta(seconds=1000)
        }}'
      enabled: true
    then:
    - alias: Set time-of-day volume on those speakers
      action: script.speaker_automatic_volume_adjustment_script
      metadata: {}
      data:
        received_speaker: '{{playing_speakers}}

          '
  mode: parallel
  max: 10
- id: '1713723493265'
  alias: Start visuals on all inactive TVs
  description: When the Start Visuals button is pressed, starts the All Visuals Plex
