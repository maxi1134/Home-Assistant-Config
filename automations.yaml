- id: '1789843175265'
  alias: Presence Simulation — Moving Random Lights
  description: When presence simulation is turned on, the alarm is armed away or the
    house becomes empty, and every 15 minutes as a recovery check, starts if presence
    simulation is on, nobody is home and the alarm is armed away. It turns off the
    12 simulation light groups, lights a random one for 5–118 minutes, then lights
    a different one, keeps both on for 15–60 seconds and turns the first off, repeating
    day and night. Someone arriving, the helper turning off or the alarm leaving armed
    away stops it and turns its lights off.
  triggers:
  - alias: Presence simulation turned on
    trigger: state
    entity_id: input_boolean.presence_simulation
    to: 'on'
    id: simulation_enabled
    note: Starts immediately when the dedicated master switch is enabled and all vacancy
      conditions are already satisfied.
  - alias: Alarm armed away
    trigger: state
    entity_id: alarm_control_panel.home_alarm
    to: armed_away
    id: alarm_armed_away
    note: Starts after the existing vacancy workflow arms the alarm away.
  - alias: House becomes empty
    trigger: state
    entity_id: binary_sensor.user_home
    to: 'off'
    id: house_became_vacant
    note: Allows a start when the established aggregate occupancy sensor clears.
  - alias: Every 15 minutes (recovery)
    trigger: time_pattern
    minutes: /15
    id: recovery
    note: Recovers an interrupted run without allowing a second concurrent simulation.
  conditions:
  - alias: Presence simulation is on
    condition: state
    entity_id: input_boolean.presence_simulation
    state: 'on'
  - alias: Nobody is home
    condition: state
    entity_id: binary_sensor.user_home
    state: 'off'
  - alias: Alarm is armed away
    condition: state
    entity_id: alarm_control_panel.home_alarm
    state: armed_away
  actions:
  - alias: Clear stale simulation lights
    action: light.turn_off
    target:
      entity_id:
      - light.group_bedroom_lights
      - light.group_bathroom_lights
      - light.group_hallway_lights
      - light.group_kitchen_lights
      - light.group_lounge_lights
      - light.group_salon_main_lights
      - light.group_workshop_lights
      - light.group_patio_lights
      - light.group_server_lights
      - light.group_hotbox_lights
      - light.group_lounge_decorative_lamp
      - light.group_salon_decorative_lights
    continue_on_error: true
    note: A new or recovered run owns this pool while the house is vacant; this clears
      any group left on by an interrupted run.
  - alias: Find available starting groups
    variables:
      available_start_groups: '{{ presence_groups | select(''has_value'') | list }}'
  - alias: Stop if no starting group is available
    if:
    - alias: No starting group is available
      condition: template
      value_template: '{{ available_start_groups | count == 0 }}'
    then:
    - alias: 'Stop: no light groups available'
      stop: No presence-simulation light groups are available
  - alias: Choose the initial occupied group
    variables:
      current_group: '{{ available_start_groups | random }}'
  - alias: Turn on the initial occupied group
    action: light.turn_on
    target:
      entity_id: '{{ current_group }}'
    continue_on_error: true
  - alias: Move continuously through the home
    repeat:
      while:
      - alias: Presence simulation is on
        condition: state
        entity_id: input_boolean.presence_simulation
        state: 'on'
      - alias: Nobody is home
        condition: state
        entity_id: binary_sensor.user_home
        state: 'off'
      - alias: Alarm is armed away
        condition: state
        entity_id: alarm_control_panel.home_alarm
        state: armed_away
      sequence:
      - alias: Choose primary dwell time
        variables:
          dwell_minutes: '{{ range(5, 119) | random }}'
      - alias: Keep the current group occupied or stop on a safety event
        wait_for_trigger:
        - alias: Presence simulation turns off
          trigger: state
          entity_id: input_boolean.presence_simulation
          from: 'on'
          id: simulation_disabled
        - alias: Home occupancy changes
          trigger: state
          entity_id: binary_sensor.user_home
          from: 'off'
          id: occupancy_changed
        - alias: Alarm leaves armed away
          trigger: state
          entity_id: alarm_control_panel.home_alarm
          from: armed_away
          id: alarm_left_away
        timeout: '{{ timedelta(minutes=dwell_minutes | int) }}'
        continue_on_timeout: true
        note: A state departure interrupts the randomized dwell immediately; a timeout
          means it is time to move.
      - alias: Clean up and stop if a safety condition changed
        if:
        - alias: Any safety condition changed
          condition: or
          conditions:
          - alias: Presence simulation is not on
            condition: not
            conditions:
            - alias: Presence simulation is on
              condition: state
              entity_id: input_boolean.presence_simulation
              state: 'on'
          - alias: Home is no longer empty
            condition: not
            conditions:
            - alias: Nobody is home
              condition: state
              entity_id: binary_sensor.user_home
              state: 'off'
          - alias: Alarm is not armed away
            condition: not
            conditions:
            - alias: Alarm is armed away
              condition: state
              entity_id: alarm_control_panel.home_alarm
              state: armed_away
        then:
        - alias: Turn off the occupied group
          action: light.turn_off
          target:
            entity_id: '{{ current_group }}'
          continue_on_error: true
        - alias: 'Stop: safety condition changed'
          stop: Presence simulation stopped by a safety condition
      - alias: Build the destination pool
        variables:
          blocked_groups: "{% set ns = namespace(groups=[current_group]) %} {% if
            current_group in ['light.group_lounge_lights', 'light.group_lounge_decorative_lamp']
            %}\n  {% set ns.groups = ns.groups + ['light.group_lounge_lights', 'light.group_lounge_decorative_lamp']
            %}\n{% endif %} {{ ns.groups | unique | list }}"
          next_candidates: '{{ presence_groups | reject(''in'', blocked_groups) |
            select(''has_value'') | list }}'
      - alias: Stop if no different destination is available
        if:
        - alias: No other destination is available
          condition: template
          value_template: '{{ next_candidates | count == 0 }}'
        then:
        - alias: Turn off the occupied group
          action: light.turn_off
          target:
            entity_id: '{{ current_group }}'
          continue_on_error: true
        - alias: 'Stop: no other group available'
          stop: No different presence-simulation destination is available
      - alias: Choose the destination and walking overlap
        variables:
          next_group: '{{ next_candidates | random }}'
          overlap_seconds: '{{ range(15, 61) | random }}'
      - alias: Turn on the destination before leaving the current group
        action: light.turn_on
        target:
          entity_id: '{{ next_group }}'
        continue_on_error: true
      - alias: Overlap both groups while walking or stop on a safety event
        wait_for_trigger:
        - alias: Presence simulation turns off
          trigger: state
          entity_id: input_boolean.presence_simulation
          from: 'on'
          id: simulation_disabled
        - alias: Home occupancy changes
          trigger: state
          entity_id: binary_sensor.user_home
          from: 'off'
          id: occupancy_changed
        - alias: Alarm leaves armed away
          trigger: state
          entity_id: alarm_control_panel.home_alarm
          from: armed_away
          id: alarm_left_away
        timeout: '{{ timedelta(seconds=overlap_seconds | int) }}'
        continue_on_timeout: true
        note: Both groups remain on for 15–60 seconds to create a visible walking
          transition.
      - alias: Clean up both groups if a safety condition changed during movement
        if:
        - alias: Any safety condition changed
          condition: or
          conditions:
          - alias: Presence simulation is not on
            condition: not
            conditions:
            - alias: Presence simulation is on
              condition: state
              entity_id: input_boolean.presence_simulation
              state: 'on'
          - alias: Home is no longer empty
            condition: not
            conditions:
            - alias: Nobody is home
              condition: state
              entity_id: binary_sensor.user_home
              state: 'off'
          - alias: Alarm is not armed away
            condition: not
            conditions:
            - alias: Alarm is armed away
              condition: state
              entity_id: alarm_control_panel.home_alarm
              state: armed_away
        then:
        - alias: Turn off the previous group
          action: light.turn_off
          target:
            entity_id: '{{ current_group }}'
          continue_on_error: true
        - alias: Turn off the destination group
          action: light.turn_off
          target:
            entity_id: '{{ next_group }}'
          continue_on_error: true
        - alias: 'Stop: safety condition changed'
          stop: Presence simulation stopped during a movement transition
      - alias: Leave the previous group
        action: light.turn_off
        target:
          entity_id: '{{ current_group }}'
        continue_on_error: true
      - alias: Make the destination the occupied group
        variables:
          current_group: '{{ next_group }}'
  - alias: Final safety cleanup
    action: light.turn_off
    target:
      entity_id: '{{ current_group }}'
    continue_on_error: true
  variables:
    presence_groups:
    - light.group_bedroom_lights
    - light.group_bathroom_lights
    - light.group_hallway_lights
    - light.group_kitchen_lights
    - light.group_lounge_lights
    - light.group_salon_main_lights
    - light.group_workshop_lights
    - light.group_patio_lights
    - light.group_server_lights
    - light.group_hotbox_lights
    - light.group_lounge_decorative_lamp
    - light.group_salon_decorative_lights
    current_group: ''
  mode: single
  max_exceeded: silent
- id: '1790484221121'
  alias: Trigger Update of the Eink Day Brief display
  description: At 06:00 redraws the screen with the 7-day agenda only. Holding button
    1 on the OpenDisplay for 5 seconds draws the full 3-day briefing with news; releasing
    the button returns to the 7-day agenda.
  triggers:
  - alias: Button 1 held for 5 s
    trigger: state
    entity_id:
    - event.od2734e0_button_1
    to:
    - button_down
    for:
      hours: 0
      minutes: 0
      seconds: 5
    id: hold_down
    attribute: event_type
  - alias: Button 1 released
    trigger: state
    entity_id:
    - event.od2734e0_button_1
    id: button_up
    attribute: event_type
