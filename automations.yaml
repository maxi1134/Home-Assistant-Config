- id: '1752638710619'
  alias: Dial Salon Automation New
  description: Maps the IKEA SYMFONISK dial in the salon to control volume, play/pause,
    skip, and stop on either the Chromecast or WiiM speaker depending on which is
    actively playing non-visual content.
  use_blueprint:
    path: EPMatt/ikea_e1744.yaml
    input:
      integration: ZHA
      controller_device: 831533d4a785b083659bce6d5ecd1f81
      helper_last_controller_event: input_text.dial_salon_helper
      action_rotate_left:
      - sequence:
        - if:
          - alias: If the TV is in use
            condition: and
            conditions:
            - alias: Playing or paused
              condition: state
              entity_id: media_player.salon_chromecast
              state:
              - playing
              - paused
            - alias: TV not off or showing Plex Visuals
              condition: not
              conditions:
              - alias: TV off
                condition: state
                entity_id: media_player.universal_salon_chromecast
                state: 'off'
              - alias: TV showing Plex Visuals
                condition: state
                entity_id: media_player.universal_salon_chromecast
                attribute: media_library_title
                state: Visuals
            - alias: TV not muted, or the speaker is silent too
              condition: or
              conditions:
              - alias: TV not muted
                condition: not
                conditions:
                - condition: state
                  entity_id: media_player.universal_salon_chromecast
                  attribute: is_volume_muted
                  state: true
              - alias: Speaker muted, paused or idle
