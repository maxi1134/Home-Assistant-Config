                  state:
                  - paused
                  - idle
                - condition: state
                  entity_id: media_player.mass_hotbox_wiim_speaker
                  attribute: is_volume_muted
                  state: true
          then:
          - action: media_player.volume_up
            metadata: {}
            data: {}
            target:
              entity_id: media_player.universal_hotbox_top_chromecast
          else:
          - alias: Only while the speaker is on
