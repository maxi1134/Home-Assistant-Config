- id: '1772205343426'
  alias: Alert when Dishwasher finishes and no one is in the kitchen
  description: When the dishwasher starts drawing over 100 W while Maxi is awake and
    not everyone is asleep, waits up to 1 hour for it to stay below 5 W for a minute,
    then announces 'The Dishwasher has finished' as a low-priority house alert. Despite
    its name, it does not check whether the kitchen is empty.
  triggers:
  - alias: Dishwasher power rises above 100 W
    entity_id:
    - sensor.plug_kitchen_dishwasher_electric_consumption_w
    above: 100
    trigger: numeric_state
  conditions:
  - alias: Maxi is not asleep
    condition: state
    entity_id: sensor.is_maxi_asleep
    state: 'off'
  - alias: Not everyone present is sleeping
    condition: state
    entity_id: binary_sensor.all_present_sleeping
    state: 'off'
  actions:
  - alias: Wait up to 1 h for dishwasher below 5 W for 1 min (abort on timeout)
    wait_for_trigger:
    - alias: Dishwasher power below 5 W for 1 min
      entity_id:
      - sensor.plug_kitchen_dishwasher_electric_consumption_w
      for:
        hours: 0
        minutes: 2
        seconds: 0
      below: 5
      trigger: numeric_state
    continue_on_timeout: false
    timeout:
      hours: 1
      minutes: 0
      seconds: 0
      milliseconds: 0
    enabled: true
  - alias: Announce 'The Dishwasher has finished' house-wide (non-important alert)
    action: script.non_important_broadcast_alert_in_the_house
    data:
      message: The Dishwasher has finished
  mode: restart
- id: '1772205443339'
  alias: Alert when Toaster finishes
  description: When the toaster starts drawing over 50 W while Maxi is awake, not
    everyone is asleep and cooking mode is off, waits up to 20 minutes for it to stay
    below 2 W for 5 seconds. If the kitchen is empty, or Maxi is alone and not in
    the kitchen, it announces 'The Toaster has finished'. The toaster power sensor
    no longer exists, so this never runs.
  triggers:
  - alias: Toaster power rises above 50 W
    entity_id:
    - sensor.plug_kitchen_toaster_electric_consumption_w
    above: 50
    trigger: numeric_state
  conditions:
  - alias: Maxi is not asleep
    condition: state
    entity_id: sensor.is_maxi_asleep
    state: 'off'
  - alias: Not everyone present is sleeping
    condition: state
    entity_id: binary_sensor.all_present_sleeping
    state: 'off'
  - alias: Cooking mode is off
    condition: state
    entity_id: input_boolean.cooking_mode
    state: 'off'
  actions:
  - alias: Wait up to 20 min for toaster below 2 W for 5 s (abort on timeout)
    wait_for_trigger:
    - alias: Toaster power below 2 W for 5 s
      entity_id:
      - sensor.plug_kitchen_toaster_electric_consumption_w
      for:
        hours: 0
        minutes: 0
        seconds: 5
      below: 2
      trigger: numeric_state
    continue_on_timeout: false
    timeout:
      hours: 0
      minutes: 20
      seconds: 0
      milliseconds: 0
    enabled: true
  - alias: If nobody is in the kitchen
    if:
    - alias: 'Any of: kitchen unoccupied, Maxi alone and away from kitchen'
      condition: or
      conditions:
      - alias: Kitchen occupancy is off
        condition: state
        entity_id: binary_sensor.group_kitchen_motion_occupancy
        state: 'off'
      - alias: 'All of: Maxi alone, Maxi not in the kitchen'
        condition: and
        conditions:
        - alias: Maxi is alone
          condition: state
          entity_id: binary_sensor.maxi_alone
          state:
          - 'on'
        - alias: 'Not: Maxi located in the kitchen'
          condition: not
          conditions:
          - alias: Maxi's location (petro v2) is kitchen
            condition: state
            entity_id: sensor.maxi_location_by_petro_v2
            state:
            - kitchen
    then:
    - alias: Announce 'The Toaster has finished' house-wide (non-important alert)
      action: script.non_important_broadcast_alert_in_the_house
      data:
        message: The Toaster has finished
  mode: restart
- id: '1772565586854'
  alias: Dial hallway automation new
  description: Handles an IKEA SYMFONISK dial in the hallway, providing volume, play/pause,
    next track, and stop controls for the hallway WiiM speaker.
  use_blueprint:
    path: EPMatt/ikea_e1744.yaml
    input:
      integration: ZHA
      controller_device: 34c4c14c6366fffe8155f3de87abf170
      helper_last_controller_event: input_text.dial_hallway_helper
      action_rotate_left:
      - sequence:
        - alias: Only while the speaker is on
          if:
          - alias: Speaker is not off or unavailable
            condition: not
            conditions:
            - condition: state
              entity_id: media_player.mass_hallway_wiim_speaker
              state:
              - 'off'
              - unavailable
              - unknown
          then:
          - action: media_player.volume_set
            data:
              volume_level: '{{ [(state_attr(''media_player.mass_hallway_wiim_speaker'',
                ''volume_level'') | float(0)) - 0.09, 0] | max }}'
            target:
              entity_id: media_player.mass_hallway_wiim_speaker
          note: An off speaker reports no volume, so this step used to compute from
            0 and set it to 6% (turn right) or 0% (turn left). The turn is ignored
            while the speaker is off.
        - delay:
            hours: 0
            minutes: 0
            seconds: 0
            milliseconds: 150
      action_rotate_left_stop: []
      rotate_right_loop: true
      rotate_left_loop: true
      rotate_left_max_loop_repeats: 60
      rotate_right_max_loop_repeats: 60
      action_rotate_right:
      - sequence:
        - alias: Only while the speaker is on
          if:
          - alias: Speaker is not off or unavailable
            condition: not
            conditions:
            - condition: state
              entity_id: media_player.mass_hallway_wiim_speaker
              state:
              - 'off'
              - unavailable
              - unknown
          then:
          - action: media_player.volume_set
            data:
              volume_level: '{{ [(state_attr(''media_player.mass_hallway_wiim_speaker'',
                ''volume_level'') | float(0)) + 0.06, 1] | min | round(2) }}'
            target:
              entity_id: media_player.mass_hallway_wiim_speaker
          note: An off speaker reports no volume, so this step used to compute from
            0 and set it to 6% (turn right) or 0% (turn left). The turn is ignored
            while the speaker is off.
        - delay:
            hours: 0
            minutes: 0
            seconds: 0
            milliseconds: 150
      helper_debounce_delay: 0
      action_click_triple:
      - action: media_player.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: media_player.mass_hallway_wiim_speaker
      action_click_double:
      - action: media_player.media_next_track
        metadata: {}
        data: {}
        target:
          entity_id: media_player.mass_hallway_wiim_speaker
      action_click_short:
      - action: media_player.media_play_pause
        metadata: {}
        data: {}
        target:
          entity_id: media_player.mass_hallway_wiim_speaker
