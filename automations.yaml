        entity_id: binary_sensor.workshop_radarr_occupancy_sensor_radar_zone_2_occupancy
        state:
        - 'off'
    - alias: Workshop TV is off
      condition: state
      entity_id: media_player.universal_workshop_chromecast
      state: 'off'
  - alias: No neon UV party
    condition: switch.is_off
    target:
      entity_id: input_boolean.neon_uv_party
    options:
      behavior: any
      for: 00:00:00
  actions:
  - alias: Set wall light to half the group's brightness
    action: light.turn_on
    metadata: {}
    data:
      transition: 5
      brightness: '{{ state_attr("light.group_workshop_lights", ''brightness'') /
        2 }}

        '
    target:
      entity_id: light.workshop_wall_light
