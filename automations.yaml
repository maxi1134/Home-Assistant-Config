- id: '1734911416848'
  alias: Mute bathroom speaker when door opens
  description: 'When the bathroom door has been open for 5 seconds: if nobody is in
    the bathroom, mutes the bathroom speaker. If someone is there, lowers it to 20%
    when no TV is active, mutes it when a TV is active and the bathroom is the only
    room with music, and otherwise waits up to 70 minutes for the bathroom to be empty
    for 15 seconds and then mutes it.'
  triggers:
  - alias: Bathroom door open for 5 s
    entity_id:
    - binary_sensor.sensor_bathroom_door_contact
    to: 'on'
    from: 'off'
    trigger: state
    for:
      hours: 0
      minutes: 0
      seconds: 5
  conditions:
  - alias: Not all residents are sleeping
    condition: state
    entity_id: binary_sensor.all_residents_sleeping
    state: 'off'
    enabled: false
  actions:
  - alias: Mute or lower by bathroom occupancy
    choose:
    - alias: Bathroom empty → mute the speaker
      conditions:
      - alias: Bathroom has no occupancy
        condition: state
        entity_id: binary_sensor.group_bathroom_motion_occupancy
        state: 'off'
      sequence:
      - alias: Mute the bathroom speaker
        action: media_player.volume_mute
        metadata: {}
        data:
          is_volume_muted: true
        target:
          entity_id: media_player.mass_bathroom_vpe_speaker
    - alias: Bathroom occupied → adjust by TV and music
      conditions:
      - alias: Bathroom is occupied
        condition: state
        entity_id: binary_sensor.group_bathroom_motion_occupancy
        state: 'on'
      sequence:
      - alias: Adjust by active TVs and speakers
        choose:
        - alias: No TV active → volume 20%
          conditions:
          - alias: No active chromecast rooms
            condition: state
            entity_id: sensor.active_chromecast_rooms
            state: '[]'
          sequence:
          - alias: Set bathroom speaker to 20%
            action: media_player.volume_set
            metadata: {}
            data:
              volume_level: 0.2
            target:
              entity_id: media_player.mass_bathroom_vpe_speaker
        - alias: TV active, only bathroom music → mute
          conditions:
          - alias: TV active and only bathroom music
            condition: not
            conditions:
            - alias: No active chromecast rooms
              condition: state
              entity_id: sensor.active_chromecast_rooms
              state: '[]'
            - alias: Not only the bathroom has music
              condition: not
              conditions:
              - alias: Only the bathroom speaker is active
                condition: state
                entity_id: sensor.active_speakers_rooms
                state: '[''bathroom'']'
          sequence:
          - alias: Mute the bathroom speaker
            action: media_player.volume_mute
            metadata: {}
            data:
              is_volume_muted: true
            target:
              entity_id: media_player.mass_bathroom_vpe_speaker
        default:
        - alias: 'Otherwise: mute once the bathroom empties'
          sequence:
          - alias: Wait until bathroom occupancy is off
            wait_for_trigger:
            - alias: Bathroom empty for 15 s
              trigger: state
              entity_id:
              - binary_sensor.group_bathroom_motion_occupancy
              to:
              - 'off'
              from:
              - 'on'
              for:
                hours: 0
                minutes: 0
                seconds: 15
            continue_on_timeout: false
            timeout:
              hours: 1
              minutes: 10
              seconds: 0
              milliseconds: 0
          - alias: Mute the bathroom speaker
            action: media_player.volume_mute
            metadata: {}
            data:
              is_volume_muted: true
            target:
              entity_id: media_player.mass_bathroom_vpe_speaker
  mode: restart
