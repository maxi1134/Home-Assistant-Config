    on which is actively playing.
  use_blueprint:
    path: EPMatt/ikea_e1744.yaml
    input:
      integration: ZHA
      controller_device: 360e22d2c7aadf1a857e8cb54d2bd198
      helper_last_controller_event: input_text.dial_hotbox_tablet_helper
      action_rotate_left:
      - sequence:
        - if:
          - alias: If the TV is in use
            condition: and
            conditions:
            - alias: Playing or paused
              condition: state
              entity_id: media_player.hotbox_top_chromecast
              state:
              - playing
              - paused
            - alias: TV not off or showing Plex Visuals
              condition: not
              conditions:
              - alias: TV off
                condition: state
                entity_id: media_player.universal_hotbox_top_chromecast
                state: 'off'
              - alias: TV showing Plex Visuals
                condition: state
                entity_id: media_player.universal_hotbox_top_chromecast
                attribute: media_library_title
                state: Visuals
            - alias: TV not muted, or the speaker is silent too
              condition: or
              conditions:
              - alias: TV not muted
                condition: not
                conditions:
                - condition: state
                  entity_id: media_player.universal_hotbox_top_chromecast
                  attribute: is_volume_muted
                  state: true
              - alias: Speaker muted, paused or idle
                condition: or
                conditions:
                - condition: state
                  entity_id: media_player.mass_hotbox_wiim_speaker
                  state:
                  - paused
                  - idle
                - condition: state
                  entity_id: media_player.mass_hotbox_wiim_speaker
                  attribute: is_volume_muted
                  state: true
          then:
          - action: media_player.volume_down
            metadata: {}
            data: {}
            target:
              entity_id: media_player.hotbox_top_chromecast
          else:
          - alias: Only while the speaker is on
            if:
            - alias: Speaker is not off or unavailable
              condition: not
              conditions:
              - condition: state
                entity_id: media_player.mass_hotbox_wiim_speaker
                state:
                - 'off'
                - unavailable
                - unknown
            then:
            - action: media_player.volume_set
              data:
                volume_level: '{{ [(state_attr(''media_player.mass_hotbox_wiim_speaker'',
                  ''volume_level'') | float(0)) - 0.09, 0] | max }}'
              target:
                entity_id: media_player.mass_hotbox_wiim_speaker
            note: An off speaker reports no volume, so this step used to compute from
              0 and set it to 6% (turn right) or 0% (turn left). The turn is ignored
