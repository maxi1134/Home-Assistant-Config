    - assist_satellite.desktop_assistant_assist_satellite
    - assist_satellite.home_assistant_voice_09e4a7_assist_satellite
    - assist_satellite.lounge_assistant_assist_satellite
    - assist_satellite.bedroom_assistant_assist_satellite
    - assist_satellite.home_assistant_voice_09ee99_assist_satellite
    - assist_satellite.patio_assistant_assist_satellite
    - assist_satellite.server_assistant_assist_satellite
    - assist_satellite.workshop_window_assistant_assist_satellite
    from:
    trigger: state
    to:
    - listening
  conditions: []
  actions:
  - alias: Find the room's playing speaker and TV
    variables:
      playing_speakers: "{% set entity_id = [area_id(trigger.entity_id)]  | map('area_entities')
        | sum(start=[]) | select('search', 'speaker') | select('is_state','playing')
        | unique | list %} {% if entity_id %}\n  {{ [entity_id | first | string] +
        [state_attr(entity_id | first | string, 'volume_level') | string] }}\n{% else
        %}\n  {{ [] }}\n{% endif %}\n"
      playing_chromecasts: "{% set entity_id = [area_id(trigger.entity_id)]    | map('area_entities')
        | sum(start=[]) | select('search', 'chromecast') | select('is_state','playing')
        | unique | list %} {% if entity_id %}\n  {{ [entity_id | first | string] +
        [state_attr(entity_id | first | string, 'volume_level') | string] }}\n{% else
        %}\n  {{ [] }}\n{% endif %}\n"
  - alias: Lower speaker and TV in parallel
    parallel:
    - alias: If a speaker is playing in the room
      if:
      - alias: Speaker present
        condition: template
        value_template: '{{ playing_speakers | length > 0 and playing_speakers[0]
          != ""}}'
      then:
      - alias: Lower the speaker, then restore it
        sequence:
        - alias: Compute original and lowered volume
          variables:
            original_volume: '{{ state_attr(playing_speakers.0, ''volume_level'')
              | round(2, ''floor'')| string  }}

              '
            desired_volume: '{{ (original_volume | float / 1.55 ) | round(2, ''floor'')|
              string }}

              '
        - action: media_player.volume_set
          metadata: {}
          data:
            volume_level: '{{ desired_volume }}

              '
          target:
            entity_id: '{{playing_speakers.0}}'
          alias: Lower Music
        - alias: Wait up to 60 s for the assistant to finish
          wait_template: '{{ states(trigger.entity_id) == "idle" }}'
          continue_on_timeout: true
          timeout: '60'
        - alias: Continue only if volume is unchanged
          condition: template
          value_template: '{{ (state_attr(playing_speakers.0, ''volume_level'') |
            float | round(2, ''floor'') | float) == desired_volume  | round(2, ''floor'')
            }}'
        - alias: Restore the speaker's original volume
          action: media_player.volume_set
          metadata: {}
          data:
            volume_level: '{{ original_volume }}

              '
          target:
            entity_id: '{{playing_speakers.0}}'
    - alias: If a TV is playing in the room
      if:
      - alias: A TV is playing in the room
        condition: template
        value_template: '{{ playing_chromecasts | length > 0 and playing_chromecasts[0]
          != ""}}'
      then:
      - alias: Lower the TV, then restore it
        sequence:
        - alias: Compute original and halved volume
          variables:
            original_volume: '{{ state_attr(playing_chromecasts.0, ''volume_level'')  |
              round(2, ''floor'')|  string  }}

              '
            desired_volume: '{{ (original_volume | float / 2 ) | round(2, ''floor'')|
              string }}

              '
        - action: media_player.volume_set
          metadata: {}
          data:
            volume_level: '{{ desired_volume }}

              '
          target:
            entity_id: '{{playing_chromecasts.0}}'
          alias: Lower Music
        - alias: Wait up to 60 s for the assistant to finish
          wait_template: '{{ states(trigger.entity_id) == "idle" }}'
          continue_on_timeout: true
          timeout: '60'
        - alias: Continue only if volume is unchanged
          condition: template
          value_template: '{{ (state_attr(playing_chromecasts.0, ''volume_level'')
            | float | round(2, ''floor'') | float) == desired_volume  | round(2, ''floor'')
            }}'
        - alias: Restore the TV's original volume
          action: media_player.volume_set
          metadata: {}
          data:
            volume_level: '{{ original_volume }}

              '
          target:
            entity_id: '{{playing_chromecasts.0}}'
  mode: single
- id: '1728309825943'
  alias: Sleep actions when "sleeper in workshop" is turned on
  description: When someone goes to sleep in the workshop, mutes the workshop and
    hallway speakers, closes the workshop blinds, turns off the workshop TV and lights
    (including the assistant screens), and dims and turns off both workshop tablets
    and their motion detection. It also asks Google Assistant to power off the workshop
    TV.
  triggers:
  - alias: Workshop sleeper flag turns on
    entity_id:
    - input_boolean.sleeper_in_workshop
    to: 'on'
    from: 'off'
    trigger: state
  conditions: []
  actions:
  - alias: Mute workshop and hallway speakers
    action: media_player.volume_mute
    metadata: {}
    data:
      is_volume_muted: true
    target:
      entity_id:
      - media_player.mass_workshop_wiim_speaker
      - media_player.mass_hallway_wiim_speaker
  - alias: Close the workshop blinds
    action: cover.close_cover
    metadata: {}
    data: {}
    target:
      entity_id: cover.cover_workshop_blinds
  - alias: Turn off the LG workshop TV
    action: media_player.turn_off
    metadata: {}
    data: {}
    target:
      entity_id: media_player.lg_workshop_tv
  - alias: Turn off workshop lights and assistant screens
    action: light.turn_off
    metadata: {}
    data: {}
    target:
      area_id: workshop
      entity_id:
      - light.group_workshop_lights
      - light.workshop_table_assistant_04dc50_screen
      - light.workshop_window_assistant_screen
  - alias: Dim both workshop tablets to 1
    sequence:
    - if:
      - condition: state
        entity_id: light.kiosk_workshop_wall_tablet_screen
        state: 'on'
      then:
      - action: light.turn_on
        target:
          entity_id: light.kiosk_workshop_wall_tablet_screen
        data:
          brightness: 1
    - if:
      - condition: state
        entity_id: light.kiosk_workshop_tv_tablet_screen
        state: 'on'
      then:
      - action: light.turn_on
        target:
          entity_id: light.kiosk_workshop_tv_tablet_screen
        data:
          brightness: 1
  - alias: Turn off workshop tablet screens and motion
    action: homeassistant.turn_off
    metadata: {}
    data: {}
    target:
      entity_id:
      - light.kiosk_workshop_wall_tablet_screen
      - switch.kiosk_workshop_wall_tablet_screensaver_motion_detection
      - light.kiosk_workshop_tv_tablet_screen
      - switch.kiosk_workshop_tv_tablet_screensaver_motion_detection
  - alias: Ask Google Assistant to power off workshop TV
    action: google_assistant_sdk.send_text_command
    metadata: {}
    data:
      command: Power off workshop TV
  mode: single
- id: '1728310438747'
  alias: Undo Sleep actions when "sleeper in workshop" is turned off
  description: When the workshop sleeper flag turns off, fades the workshop lights
    that are off (except high-intensity ones) to warm white over 2 minutes, unmutes
    the workshop and hallway speakers and both workshop voice assistants, and turns
    the workshop tablets' screens and motion detection back on.
  triggers:
  - alias: Workshop sleeper flag turns off
    entity_id:
    - input_boolean.sleeper_in_workshop
    to: 'off'
    from: 'on'
    trigger: state
  conditions: []
  actions:
  - alias: List the workshop lights that are off
    variables:
      off_lights_in_room: "{{ [area_id(trigger.entity_id)]\n  | map('area_entities')
        | sum(start=[])\n  | select('match', '^light.')\n  | select('is_state', 'off')\n
        \ | reject('in', label_entities('High Intensity Light'))\n  | unique | list
        }}"
  - alias: Fade those lights to warm white over 2 min
    action: light.turn_on
    data:
      transition: 120
      color_name: warm_white
    target:
      entity_id: '{{off_lights_in_room}}'
  - alias: Unmute workshop and hallway speakers
    action: media_player.volume_mute
    metadata: {}
    data:
      is_volume_muted: false
    target:
      entity_id:
      - media_player.mass_workshop_wiim_speaker
      - media_player.mass_hallway_wiim_speaker
  - alias: Turn workshop tablet screens and motion on
    action: homeassistant.turn_on
    metadata: {}
    data: {}
    target:
      entity_id:
      - light.kiosk_workshop_wall_tablet_screen
      - switch.kiosk_workshop_wall_tablet_screensaver_motion_detection
      - light.kiosk_workshop_tv_tablet_screen
      - switch.kiosk_workshop_tv_tablet_screensaver_motion_detection
  - alias: Unmute the two workshop voice assistants
    action: switch.turn_off
    metadata: {}
    data: {}
    target:
      entity_id:
      - switch.bedroom_assistant_mute
      - switch.workshop_window_assistant_mute
  mode: single
- id: '1728311156670'
  alias: Dim Wall lights when workshop TV is playing and Beige couch or matress is
    occupied
  description: When someone sits on the workshop couch or mattress (radar zone 2)
    or the workshop TV starts playing, dims the workshop wall light to 1% if it is
    on, the TV is not off, the couch zone is occupied and no neon UV party is on.
  triggers:
  - alias: Couch/mattress zone occupied
    trigger: state
    entity_id:
    - binary_sensor.workshop_radarr_occupancy_sensor_radar_zone_2_occupancy
    to:
    - 'on'
  - alias: Workshop TV starts playing
    trigger: state
    entity_id:
    - media_player.universal_workshop_chromecast
    from:
    to: playing
  conditions:
  - alias: Workshop wall light is on
    condition: state
    entity_id: light.workshop_wall_light
    state: 'on'
  - alias: Workshop TV is not off
    condition: not
    conditions:
    - alias: Workshop TV is off
      condition: state
      entity_id: media_player.universal_workshop_chromecast
      state: 'off'
  - alias: Couch/mattress zone is occupied
    condition: or
    conditions:
    - alias: Couch zone 2 occupied
      condition: state
      state:
      - 'on'
      entity_id: binary_sensor.workshop_radarr_occupancy_sensor_radar_zone_2_occupancy
  - alias: No neon UV party
    condition: switch.is_off
    target:
      entity_id: input_boolean.neon_uv_party
    options:
      behavior: any
      for: 00:00:00
  actions:
  - alias: Dim the wall light to 1%
    action: light.turn_on
    metadata: {}
    data:
      transition: 2
      brightness_pct: 1
    target:
      entity_id: light.workshop_wall_light
  mode: single
- id: '1728311332778'
