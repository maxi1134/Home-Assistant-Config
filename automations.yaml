  triggers:
  - alias: Bathroom door closes
    entity_id:
    - binary_sensor.sensor_bathroom_door_contact
    to: 'off'
    from: 'on'
    trigger: state
  conditions: []
  actions:
  - alias: Unmute bathroom speaker (continue on error)
    action: media_player.volume_mute
    metadata: {}
    target:
      entity_id: media_player.mass_bathroom_vpe_speaker
    data:
      is_volume_muted: false
    enabled: true
    continue_on_error: true
  - alias: Set bathroom speaker volume to 40%
    metadata: {}
    data:
      volume_level: 0.4
