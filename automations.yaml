    repeat:
      sequence:
      - alias: Turn off the mute switch
        metadata: {}
        data: {}
        target:
          entity_id: '{{esp32_mute_entities[repeat.index - 1]    }}'
        action: switch.turn_off
      for_each: '{{esp32_mute_entities}}'
