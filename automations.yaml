- id: '1714688757969'
  alias: Turn light on when someone is detected in the front
  description: When the front door camera sees a person, sets the front door light
    to bright white (4628 K, full brightness). Once nobody has been seen for 3 minutes,
    or after 1 hour, restores its previous color and brightness, or turns it off if
    it was off.
  triggers:
  - alias: Person seen by the front door camera
    entity_id:
    - sensor.front_door_camera_person_count
    above: 0
    trigger: numeric_state
  conditions: []
  actions:
  - alias: Choose by front door light state
    choose:
    - alias: Light already on → brighten, then restore
      conditions:
      - condition: state
        entity_id: light.front_door_light
        state: 'on'
        alias: If Front door light is already on
      sequence:
      - alias: Save the light's color and brightness
        variables:
          light_rgb_color: '{{ state_attr(''light.front_door_light'',''rgb_color'')}}

            '
          light_brightness: '{{ state_attr(''light.front_door_light'',''brightness'')}}

            '
      - alias: 'Set the front door light to bright white '
        metadata: {}
        data:
          transition: 2
          color_temp_kelvin: 4628
          brightness: 255
        target:
          entity_id: light.front_door_light
        action: light.turn_on
      - alias: Wait up to 1 h for 3 min with nobody
        wait_for_trigger:
        - alias: Nobody seen for 3 min
          entity_id:
          - sensor.front_door_camera_person_count
          for:
            hours: 0
            minutes: 3
            seconds: 0
          below: 1
          trigger: numeric_state
        timeout:
          hours: 1
          minutes: 0
          seconds: 0
          milliseconds: 0
      - alias: Restore the saved color and brightness
        metadata: {}
        data:
          brightness: '{{ light_brightness }}

            '
          rgb_color: '{{ light_rgb_color }}

            '
        target:
          entity_id: light.front_door_light
        action: light.turn_on
    - conditions:
      - alias: If Front door light is off
        condition: state
        entity_id: light.front_door_light
        state: 'off'
      sequence:
      - alias: 'Set the front door light to bright white '
        metadata: {}
        data:
          transition: 2
          color_temp_kelvin: 4628
          brightness: 255
        target:
          entity_id: light.front_door_light
        action: light.turn_on
      - alias: Wait up to 1 h for 3 min with nobody
        wait_for_trigger:
        - alias: Nobody seen for 3 min
          entity_id:
          - sensor.front_door_camera_person_count
          for:
            hours: 0
            minutes: 3
            seconds: 0
          below: 1
          trigger: numeric_state
        timeout:
          hours: 1
          minutes: 0
          seconds: 0
          milliseconds: 0
      - alias: Turn off the front door light
        metadata: {}
        data: {}
        target:
          entity_id: light.front_door_light
        action: light.turn_off
      alias: If the front door light is off
  mode: restart
- id: '1715103309573'
  alias: Control workshop Tablet charging
  description: Keeps the workshop tablet battery between about 30% and 90%. Above
    91% it turns the charging plug off, waiting until 09:05 if that happens overnight
    (23:00–09:00); when the battery drops below 29% (or 25%, 15%, 10%) it turns the
    plug on and dims the screen to brightness 25.
  triggers:
  - alias: Battery rises above 91%
    trigger: numeric_state
    entity_id:
    - sensor.kiosk_workshop_wall_tablet_battery
    above: 91
  - alias: Battery drops below 29%
    trigger: numeric_state
    entity_id:
    - sensor.kiosk_workshop_wall_tablet_battery
    below: 29
  - alias: Battery drops below 25%
    trigger: numeric_state
    entity_id:
    - sensor.kiosk_workshop_wall_tablet_battery
    below: 25
  - alias: Battery drops below 10%
    trigger: numeric_state
    entity_id:
    - sensor.kiosk_workshop_wall_tablet_battery
    below: 10
  - alias: Battery drops below 15%
    trigger: numeric_state
    entity_id:
    - sensor.kiosk_workshop_wall_tablet_battery
    below: 15
  conditions:
  - alias: Battery above 90% or below 30%
    condition: or
    conditions:
    - alias: Battery above 90%
      condition: numeric_state
      entity_id: sensor.kiosk_workshop_wall_tablet_battery
      above: 90
    - alias: Battery below 30%
      condition: numeric_state
      entity_id: sensor.kiosk_workshop_wall_tablet_battery
      below: 30
  actions:
  - alias: Charge or stop by battery level
    choose:
    - alias: Full during the day → stop charging
      conditions:
      - alias: Battery above 90%
        condition: numeric_state
        entity_id: sensor.kiosk_workshop_wall_tablet_battery
        above: 90
      - alias: Between 09:00 and 23:00
        condition: time
        after: 09:00:00
        before: '23:00:00'
      sequence:
      - alias: Turn off the workshop tablet charger
        metadata: {}
        data: {}
        target:
          entity_id: switch.plug_workshop_tablet
        action: switch.turn_off
    - alias: Full overnight → stop charging at 09:05
      conditions:
      - alias: Battery above 90%
        condition: numeric_state
        entity_id: sensor.kiosk_workshop_wall_tablet_battery
        above: 90
      - alias: Between 23:00 and 09:00
        condition: time
        after: '23:00:00'
        before: 09:00:00
      sequence:
      - alias: Wait until 09:05 (or 09:10)
        wait_for_trigger:
        - alias: At 09:05
          trigger: time
          at: 09:05:00
        - alias: At 09:10
          trigger: time
          at: 09:10:00
      - alias: Turn off the workshop tablet charger
        metadata: {}
        data: {}
        target:
          entity_id: switch.plug_workshop_tablet
        action: switch.turn_off
    - alias: Low → charge and dim the screen
      conditions:
      - alias: Battery below 30%
        condition: numeric_state
        entity_id: sensor.kiosk_workshop_wall_tablet_battery
        below: 30
      sequence:
      - alias: Turn on the workshop tablet charger
        metadata: {}
        data: {}
        target:
          entity_id: switch.plug_workshop_tablet
        action: switch.turn_on
      - alias: Set tablet screen brightness to 25
        if:
        - condition: state
          entity_id: light.kiosk_workshop_wall_tablet_screen
          state: 'on'
        then:
        - action: light.turn_on
          target:
            entity_id: light.kiosk_workshop_wall_tablet_screen
          data:
            brightness: 25
    - alias: Very low → charge and turn screen off
      conditions:
      - alias: Battery below 16%
        condition: numeric_state
        entity_id: sensor.kiosk_workshop_wall_tablet_battery
        below: 16
      sequence:
      - alias: Turn on the workshop tablet charger
        metadata: {}
        data: {}
        target:
          entity_id: switch.plug_workshop_tablet
        action: switch.turn_on
      - alias: Turn off the workshop tablet screen
        metadata: {}
        data: {}
        action: light.turn_off
        target:
          entity_id: light.kiosk_workshop_wall_tablet_screen
      - alias: Set tablet screen brightness to 25
        if:
        - condition: state
          entity_id: light.kiosk_workshop_wall_tablet_screen
          state: 'on'
        then:
        - action: light.turn_on
          target:
            entity_id: light.kiosk_workshop_wall_tablet_screen
          data:
            brightness: 25
  mode: single
- id: '1715664801848'
