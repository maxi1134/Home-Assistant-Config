  max: 10
- id: '1754680196397'
  alias: Turn lights back to normal when UV lamps are turned off
  description: Restores lights in a room to their appropriate color scheme when UV
    lamps are turned off, choosing between party pastel colors, warm kink colors,
    psychedelic random colors, or adaptive lighting based on the current house mode.
  triggers:
  - alias: A room's UV lamps turn off
    trigger: state
    entity_id:
    - switch.group_hallway_uv_lamps
    - switch.group_kitchen_uv_lamps
    - switch.group_lounge_uv_lamps
    - switch.group_patio_uv_lamps
    - switch.group_workshop_uv_lamps
    - switch.group_salon_uv_lamps
    to:
    - 'off'
    from:
    - 'on'
  conditions: []
  actions:
  - alias: Get the room
    variables:
      room: '{{ area_id(trigger.entity_id) }}'
  - alias: Pick colors by house mode
    choose:
    - conditions:
      - alias: Party mode is on
        condition: or
        conditions:
        - alias: Party mode is on
          condition: state
          entity_id: input_boolean.party_mode
          state: 'on'
      sequence:
      - alias: Pastel colors on the room's lit lights
        action: script.change_received_lights_to_random_pastel_colors
        metadata: {}
        data:
          area: '{{ room }}'
          only_on: true
      alias: Pastel on party mode on
    - conditions:
      - alias: Kink party is on
        condition: or
        conditions:
        - alias: Kink party is on
          condition: state
          entity_id: input_boolean.kink_party
          state: 'on'
      sequence:
      - alias: Warm pale colors on the room's lit lights
        action: script.change_received_lights_to_warm_pale_colors
        metadata: {}
        data:
          area: '{{ room }}'
          only_on: true
      alias: Warm pale on kink party on
    - conditions:
      - alias: Acid Time is on
        condition: or
        conditions:
        - alias: Acid Time is on
          condition: state
          entity_id: input_boolean.acid_time
          state: 'on'
      sequence:
      - alias: Random colors on the room's lit lights
        action: script.change_received_lights_to_random_colors
        metadata: {}
        data:
          area: '{{ room }}'
          only_on: true
          saturation: 100
      alias: Random colors on acid time on
    default:
    - alias: 'Otherwise: reapply Adaptive Lighting to the room'
      action: adaptive_lighting.apply
      metadata: {}
      data:
        lights: '{{ area_entities(room) | select(''match'', ''light.group_'') | list
          }}'
        transition: '1'
  mode: parallel
  max: 10
- id: '1754715205053'
