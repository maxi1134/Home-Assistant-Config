- id: '1716329212232'
  alias: Notify on potential package
  description: While waiting for a package, when the front door camera sees a person
    or a package, points the PTZ camera at the package zone and asks LLM Vision whether
    a package or delivery person is visible. As long as the answer is yes, it broadcasts
    'A package has been delivered! Go pick it up!' with blue lights and re-checks
    every 5 minutes, turning the camera back to the doorway between checks.
  triggers:
  - entity_id:
    - binary_sensor.front_door_camera_person_occupancy
    to: 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 2
    trigger: state
    alias: Trigger when someone is detected by frigate
  - entity_id:
    - binary_sensor.front_door_camera_package_occupancy
    to:
    - 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 1
    trigger: state
    alias: Trigger when a package is detected by Frigate
  conditions:
  - condition: state
    entity_id: input_boolean.waiting_package
    state: 'on'
    alias: Continue only if I am waiting a package.
  actions:
  - action: select.select_option
    metadata: {}
    target:
      entity_id: select.front_door_ptz_camera_ptz_preset
    data:
      option: package
    alias: Set Camera focus on the package zone
  - delay:
      hours: 0
      minutes: 0
      seconds: 3
      milliseconds: 0
    alias: Give 3 seconds to the stream to catch up before looking for a package
  - alias: Perform LLM vision lookup to analyze the image and see if a Package or
      Postman is present
    action: llmvision.image_analyzer
    data:
      include_filename: false
      target_width: 1280
      response_format: text
      title_field: title
      description_field: description
      provider: 01KPNMJBE3FPHY7TEGKG6K7MVM
      store_in_timeline: false
      message: 'Answer with ONLY ''''yes'' or ''no'', is there a package or a deliveryman
        in this picture?

        '
      image_entity:
      - camera.front_door_ptz_camera_clear
      generate_title: false
      expose_images: false
    response_variable: answer
  - repeat:
      while:
      - condition: template
        value_template: '{{ "YES" in answer.response_text | upper }}'
        alias: 'Continue if a delivery man or a package is present '
      sequence:
      - alias: Set Camera focus on the doorway zone
        action: select.select_option
        metadata: {}
        target:
          entity_id: select.front_door_ptz_camera_ptz_preset
        data:
          option: doorway
      - metadata: {}
        data:
          message: A package has been delivered! Go pick it up!
          color: Blue
          phone_data:
            title: A Package is at the door!
            message: Go pick it up.
        action: script.broadcast_alert_in_the_house
        alias: Announce that there is a package at the door
      - alias: Wait 5 minutes
        delay:
          hours: 0
          minutes: 5
          seconds: 0
          milliseconds: 0
      - action: select.select_option
        metadata: {}
        target:
          entity_id:
          - select.front_door_ptz_camera_ptz_preset
        data:
          option: package
        alias: Set Camera focus on the package zone
      - delay:
          hours: 0
          minutes: 0
          seconds: 3
          milliseconds: 0
        alias: Give 3 seconds to the stream to catch up before looking for a package
      - alias: Perform LLM vision lookup to analyze the image and see if a Package
          or Postman is present
        action: llmvision.image_analyzer
        data:
          include_filename: false
          target_width: 1280
          response_format: text
          title_field: title
          description_field: description
          provider: 01KPNMJBE3FPHY7TEGKG6K7MVM
          store_in_timeline: false
          message: 'Answer with ONLY ''''yes'' or ''no'', is there a package or a
            deliveryman in this picture?

            '
          image_entity:
          - camera.front_door_ptz_camera_clear
          generate_title: false
          expose_images: false
        response_variable: answer
      - alias: Set Camera focus on the doorway zone
        action: select.select_option
        metadata: {}
        target:
          entity_id: select.front_door_ptz_camera_ptz_preset
        data:
          option: doorway
    alias: Repeat the following actions as long as there is a package present
  mode: single
