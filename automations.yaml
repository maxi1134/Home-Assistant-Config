- id: '1792440152922'
  alias: assist Broadcast a spoken message
  description: 'Voice command: "broadcast <message>", "announce <message>" or "tell
    everyone <message>" from any Assist pipeline speaks the message on every house
    speaker with the Maxi voice via script.assist_broadcast. A leading "that" is dropped,
    the broadcast starts without waiting, and the satellite replies "Broadcasting."'
  triggers:
  - alias: 'Voice command: broadcast a message'
    trigger: conversation
    command:
    - broadcast {message}
    - announce {message}
    - tell everyone {message}
  conditions: []
  actions:
  - alias: Clean up the spoken message
    variables:
      message: '{{ trigger.slots.message | trim | regex_replace(''^that +'', '''',
        ignorecase=True) }}'
  - alias: Start the broadcast without waiting for it
    action: script.turn_on
    target:
      entity_id: script.assist_broadcast
    data:
      variables:
        message: '{{ message }}'
  - alias: Reply to the speaker
    set_conversation_response: Broadcasting.
  mode: parallel
  max: 10
