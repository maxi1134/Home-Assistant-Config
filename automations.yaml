- id: '1760286041191'
  alias: Turn parking horn on
  description: Handles the horn button on parking alerts (turn_parking_horn_on, or
    the older blow_parking_horn). If someone is still detected in the parking or back
    yard, or the horn is already sounding, it rings right away; otherwise it asks
    Maxi to confirm and rings only if confirmed within 2 minutes. It turns on the
    parking horn plug and the parking exit camera siren, then turns both off once
    the parking has been clear for 7 seconds, or after 5 minutes.
  triggers:
  - alias: Parking horn button tapped
    trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: turn_parking_horn_on
  - alias: Legacy button on alerts sent before the switch to turn_parking_horn_on
    trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: blow_parking_horn
  conditions: []
  actions:
  - alias: Unique confirmation actions for this run, so a stale tap can't ring later
    variables:
      action_confirm: '{{ ''CONFIRM_PARKING_HORN_'' ~ context.id }}'
      action_cancel: '{{ ''CANCEL_PARKING_HORN_'' ~ context.id }}'
  - alias: Ask for confirmation if nobody is in the parking or the back yard anymore
    if:
    - alias: Nobody detected (is_state, so a missing or unavailable sensor also asks)
      condition: template
      value_template: '{{ not (is_state(''binary_sensor.group_parking_occupancy'',
        ''on'') or is_state(''binary_sensor.reolink_parking_camera_person'', ''on'')
        or is_state(''binary_sensor.reolink_parking_exit_camera_person'', ''on'')
        or is_state(''binary_sensor.back_yard_camera_person_occupancy'', ''on''))
        }}'
    - alias: Horn isn't already sounding, so a re-tap while it rings just keeps it
        going
      condition: not
      conditions:
      - alias: Parking horn is on
        condition: state
        entity_id: switch.plug_parking_horn
        state: 'on'
    then:
    - alias: Ask Maxi to confirm the parking horn
      action: notify.maxi_notification_group
      metadata: {}
      data:
        title: Confirm the parking horn
        message: '{% if states(''binary_sensor.group_parking_occupancy'') in [''unavailable'',
          ''unknown''] or states(''binary_sensor.back_yard_camera_person_occupancy'')
          in [''unavailable'', ''unknown''] %}Person detection is unavailable right
          now.{% else %}Nobody is detected in the parking or the back yard anymore.{%
          endif %} Ring the parking horn anyway?'
        data:
          tag: parking_horn_confirmation
          timeout: 110
          ttl: 0
          priority: high
          channel: security_alerts_notifications
          image: /api/camera_proxy/camera.reolink_parking_exit_camera_fluent
          actions:
          - action: '{{ action_confirm }}'
            title: Ring the horn!
          - action: '{{ action_cancel }}'
            title: Cancel
    - alias: Wait up to 2 min for an answer
      wait_for_trigger:
      - alias: Confirm tapped
        trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: '{{ action_confirm }}'
      - alias: Cancel tapped
        trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: '{{ action_cancel }}'
      - alias: Confirmation swiped away
        trigger: event
        event_type: mobile_app_notification_cleared
        event_data:
          action_1_key: '{{ action_confirm }}'
      timeout:
        hours: 0
        minutes: 2
        seconds: 0
        milliseconds: 0
      continue_on_timeout: true
    - alias: Clear the confirmation if it was not confirmed
      if:
      - alias: Answer was not a confirmation
        condition: template
        value_template: '{{ wait.trigger is none or wait.trigger.event.data.get(''action'')
          != action_confirm }}'
      then:
      - alias: Clear the confirmation notification
        action: notify.maxi_notification_group
        metadata: {}
        data:
          message: clear_notification
          data:
            tag: parking_horn_confirmation
    - alias: Only continue if the horn was explicitly confirmed
      condition: template
      value_template: '{{ wait.trigger is not none and wait.trigger.event.data.get(''action'')
        == action_confirm }}'
  - alias: Turn on the parking horn
    action: switch.turn_on
    metadata: {}
    data: {}
    target:
      entity_id: switch.plug_parking_horn
    continue_on_error: true
  - alias: Camera siren too (continue_on_error, so a flaky camera can't block turning
      the horn off)
    action: siren.turn_on
    continue_on_error: true
    metadata: {}
    data: {}
    target:
      entity_id: siren.parking_exit_camera_siren
  - alias: Wait up to 5 min for the parking clear 7 s
    wait_for_trigger:
    - alias: Parking clear for 7 s
      trigger: state
      entity_id:
      - binary_sensor.group_parking_occupancy
      from: 'on'
      to: 'off'
      for:
        hours: 0
        minutes: 0
        seconds: 7
    timeout:
      hours: 0
      minutes: 5
      seconds: 0
      milliseconds: 0
  - alias: Turn off the parking horn
    action: switch.turn_off
    metadata: {}
    data: {}
    target:
      entity_id: switch.plug_parking_horn
    continue_on_error: true
  - alias: Turn off the parking exit camera siren
    action: siren.turn_off
    continue_on_error: true
    metadata: {}
    data: {}
    target:
      entity_id: siren.parking_exit_camera_siren
  mode: restart
