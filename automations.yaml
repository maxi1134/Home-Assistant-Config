    detected
  description: When the back door horn has been on for a minute and someone is still
    detected at the back entrance, turns on the parking horn as well.
  triggers:
  - alias: Back door horn on for 1 min
    trigger: state
    entity_id:
    - switch.plug_back_door_horn
    from:
    - 'off'
    to:
    - 'on'
    for:
      hours: 0
      minutes: 1
      seconds: 0
  conditions:
  - alias: Someone still at the back entrance
    condition: state
    entity_id: binary_sensor.back_entrance_presence_person_occupancy
    state:
    - 'on'
  actions:
  - alias: Turn on the parking horn
    action: switch.turn_on
    metadata: {}
    target:
      entity_id: switch.plug_parking_horn
    data: {}
  mode: single
- id: '1780770158884'
  alias: ikea Dial kitchen sink automation
  description: Handles an IKEA SYMFONISK dial in the kitchen, routing volume, play/pause,
    next track, and stop commands to either the kitchen Chromecast or the WiiM speaker
    depending on which is actively playing.
  use_blueprint:
    path: EPMatt/ikea_e1744.yaml
    input:
      integration: ZHA
      controller_device: 90e066a8ec47945f7d388b40c062898a
      helper_last_controller_event: input_text.dial_kitchen_sink_helper
      action_rotate_left:
      - sequence:
        - if:
          - alias: If the TV is in use
            condition: and
            conditions:
            - alias: Playing or paused
              condition: state
              entity_id: media_player.universal_kitchen_chromecast
              state:
              - playing
              - paused
            - alias: TV not showing Plex Visuals
              condition: not
              conditions:
              - alias: TV showing Plex Visuals
                condition: state
                entity_id: media_player.universal_kitchen_chromecast
                attribute: media_library_title
                state: Visuals
            - alias: TV not muted, or the speaker is silent too
              condition: or
              conditions:
              - alias: TV not muted
                condition: not
                conditions:
                - condition: state
                  entity_id: media_player.universal_kitchen_chromecast
                  attribute: is_volume_muted
                  state: true
              - alias: Speaker muted, paused or idle
                condition: or
                conditions:
                - condition: state
                  entity_id: media_player.mass_kitchen_wiim_speaker
                  state:
                  - paused
                  - idle
                - condition: state
                  entity_id: media_player.mass_kitchen_wiim_speaker
                  attribute: is_volume_muted
                  state: true
          then:
          - action: media_player.volume_down
            metadata: {}
            data: {}
            target:
              entity_id: media_player.universal_kitchen_chromecast
          else:
          - alias: Only while the speaker is on
            if:
            - alias: Speaker is not off or unavailable
              condition: not
              conditions:
              - condition: state
                entity_id: media_player.mass_kitchen_wiim_speaker
                state:
                - 'off'
                - unavailable
                - unknown
            then:
            - action: media_player.volume_set
              data:
                volume_level: '{{ [(state_attr(''media_player.mass_kitchen_wiim_speaker'',
                  ''volume_level'') | float(0)) - 0.09, 0] | max }}'
              target:
                entity_id: media_player.mass_kitchen_wiim_speaker
            note: An off speaker reports no volume, so this step used to compute from
              0 and set it to 6% (turn right) or 0% (turn left). The turn is ignored
              while the speaker is off.
        - delay:
            hours: 0
            minutes: 0
            seconds: 0
            milliseconds: 150
      action_rotate_left_stop: []
      rotate_right_loop: true
      rotate_left_loop: true
      rotate_left_max_loop_repeats: 60
      rotate_right_max_loop_repeats: 60
      action_rotate_right:
      - sequence:
        - if:
          - alias: If the TV is in use
            condition: and
            conditions:
            - alias: Playing or paused
              condition: state
              entity_id: media_player.universal_kitchen_chromecast
              state:
              - playing
              - paused
            - alias: TV not showing Plex Visuals
              condition: not
              conditions:
              - alias: TV showing Plex Visuals
                condition: state
                entity_id: media_player.universal_kitchen_chromecast
                attribute: media_library_title
                state: Visuals
            - alias: TV not muted, or the speaker is silent too
              condition: or
              conditions:
              - alias: TV not muted
                condition: not
                conditions:
                - condition: state
                  entity_id: media_player.universal_kitchen_chromecast
                  attribute: is_volume_muted
                  state: true
              - alias: Speaker muted, paused or idle
                condition: or
                conditions:
                - condition: state
                  entity_id: media_player.mass_kitchen_wiim_speaker
                  state:
                  - paused
                  - idle
                - condition: state
                  entity_id: media_player.mass_kitchen_wiim_speaker
                  attribute: is_volume_muted
                  state: true
          then:
          - action: media_player.volume_up
            metadata: {}
            data: {}
            target:
              entity_id: media_player.universal_kitchen_chromecast
          else:
          - alias: Only while the speaker is on
            if:
            - alias: Speaker is not off or unavailable
              condition: not
              conditions:
              - condition: state
                entity_id: media_player.mass_kitchen_wiim_speaker
                state:
                - 'off'
                - unavailable
                - unknown
            then:
            - action: media_player.volume_set
              data:
                volume_level: '{{ [(state_attr(''media_player.mass_kitchen_wiim_speaker'',
                  ''volume_level'') | float(0)) + 0.06, 1] | min | round(2) }}'
              target:
                entity_id: media_player.mass_kitchen_wiim_speaker
            note: An off speaker reports no volume, so this step used to compute from
              0 and set it to 6% (turn right) or 0% (turn left). The turn is ignored
              while the speaker is off.
        - delay:
            hours: 0
            minutes: 0
            seconds: 0
            milliseconds: 150
      helper_debounce_delay: 0
      action_click_triple:
      - if:
        - alias: If the TV is in use
          condition: and
          conditions:
          - alias: Playing or paused
            condition: state
            entity_id: media_player.universal_kitchen_chromecast
            state:
            - playing
            - paused
          - alias: TV not showing Plex Visuals or showing a Home Assistant dashboard
            condition: not
            conditions:
            - alias: TV showing Plex Visuals
              condition: state
              entity_id: media_player.universal_kitchen_chromecast
              attribute: media_library_title
              state: Visuals
            - alias: TV showing a Home Assistant dashboard
              condition: state
              entity_id: media_player.universal_kitchen_chromecast
              attribute: app_id
              state: A078F6B0
        then:
        - action: media_player.turn_off
          metadata: {}
          data: {}
          target:
            entity_id: media_player.universal_kitchen_chromecast
          enabled: true
        else:
        - action: media_player.turn_off
          metadata: {}
          data: {}
          target:
            entity_id: media_player.mass_kitchen_wiim_speaker
      action_click_double:
      - if:
        - alias: If the TV is in use
          condition: and
          conditions:
          - alias: Playing or paused
            condition: state
            entity_id: media_player.universal_kitchen_chromecast
            state:
            - playing
            - paused
          - alias: TV not showing Plex Visuals or showing a Home Assistant dashboard
            condition: not
            conditions:
            - alias: TV showing Plex Visuals
              condition: state
              entity_id: media_player.universal_kitchen_chromecast
              attribute: media_library_title
              state: Visuals
            - alias: TV showing a Home Assistant dashboard
              condition: state
              entity_id: media_player.universal_kitchen_chromecast
              attribute: app_id
              state: A078F6B0
        then:
        - action: media_player.media_next_track
          metadata: {}
          data: {}
          target:
            entity_id: media_player.universal_kitchen_chromecast
          enabled: true
        else:
        - action: media_player.media_next_track
          metadata: {}
          data: {}
          target:
            entity_id: media_player.mass_kitchen_wiim_speaker
      action_click_short:
      - if:
        - alias: If the TV is in use
          condition: and
          conditions:
          - alias: Playing or paused
            condition: state
            entity_id: media_player.universal_kitchen_chromecast
            state:
            - playing
            - paused
          - alias: TV not showing Plex Visuals or showing a Home Assistant dashboard
            condition: not
            conditions:
            - alias: TV showing Plex Visuals
              condition: state
              entity_id: media_player.universal_kitchen_chromecast
              attribute: media_library_title
              state: Visuals
            - alias: TV showing a Home Assistant dashboard
              condition: state
              entity_id: media_player.universal_kitchen_chromecast
              attribute: app_id
              state: A078F6B0
        then:
        - action: media_player.media_play_pause
          metadata: {}
          data: {}
          target:
            entity_id: media_player.universal_kitchen_chromecast
          enabled: true
        else:
        - action: media_player.media_play_pause
          metadata: {}
          data: {}
          target:
            entity_id: media_player.mass_kitchen_wiim_speaker
- id: '1780853812788'
  alias: workshop tv hue dial automation
  description: 'Hue dial for the workshop lights (custom blueprint): button 1 toggles
    them (hold: toggle at 100%, 4922 K; five presses: LIFX morph effect), button 2
    sets 100% white at 5238 K and turns off the room''s UV lamps and light effects
    (hold: random pastel colors; five presses: toggle the UV lamps), button 3 gives
    random colors (hold: warm saturated colors) and button 4 dims to 1% (hold: 1%
    in warm saturated colors). Turning the dial changes brightness by +10% or −15%;
    at full brightness it adjusts color saturation instead.'
  use_blueprint:
    path: maxi/hue_dial_automation_blueprint.yaml
    input:
      dial_device: 11fd71e151b84536a8d2ba74234103f2
      target_light: light.group_workshop_lights
