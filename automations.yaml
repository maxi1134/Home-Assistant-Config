            - alias: TV off
              condition: state
              entity_id: media_player.universal_workshop_chromecast
              state: 'off'
            - alias: TV showing Plex Visuals
              condition: state
              entity_id: media_player.universal_workshop_chromecast
              attribute: media_library_title
              state: Visuals
        then:
        - action: media_player.media_next_track
          metadata: {}
          data: {}
          target:
            entity_id: media_player.workshop_chromecast
        else:
        - action: media_player.media_next_track
          metadata: {}
          data: {}
          target:
            entity_id: media_player.mass_workshop_wiim_speaker
      action_click_short:
