- id: '1791226670651'
  alias: 'Alarm: disarm rules'
  description: 'Every way the home alarm gets disarmed, in one place. AWAY: someone
    comes home. NIGHT: the sun is up and someone is awake (checked when someone wakes,
    and again at sunrise). KEYPAD: a main code unlocks the front door (any mode),
    then snapshot + announce who arrived. Replaces four older disarm automations (Oct
    2026).'
  triggers:
  - trigger: state
    entity_id: binary_sensor.user_home
    from: 'off'
    to: 'on'
    id: arrival
    alias: Someone came home
  - trigger: state
    entity_id: binary_sensor.all_residents_sleeping
    from: 'on'
    to: 'off'
    id: woke_up
    alias: Household no longer all asleep
  - trigger: state
    entity_id: sensor.is_maxi_asleep
    from: 'on'
    to: 'off'
    id: woke_up
    alias: Maxi woke up
    note: This sensor reports on/off. The old automation listened for asleep→awake,
      which never happens.
  - trigger: sun.sunrise
    id: sunrise
    alias: Sunrise (catch-up for early risers)
    note: Someone who woke before sunrise was blocked by sun.is_up; this re-checks
      at sunrise. sun.is_up is guaranteed true at this instant.
  - trigger: event
    event_type: zha_event
    event_data:
      device_ieee: 90:fd:9f:ff:fe:64:47:36
      command: operation_event_notification
      args:
        operation: Unlock
        code_slot: 3
    id: keypad
    alias: Maxi's code (slot 3)
    variables:
      who: Maxi
  - trigger: event
    event_type: zha_event
    event_data:
      device_ieee: 90:fd:9f:ff:fe:64:47:36
      command: operation_event_notification
      args:
        operation: Unlock
        code_slot: 4
    id: keypad
    alias: Myriam's code (slot 4)
    variables:
      who: Myriam
  - trigger: event
    event_type: zha_event
    event_data:
      device_ieee: 90:fd:9f:ff:fe:64:47:36
      command: operation_event_notification
      args:
        operation: Unlock
        code_slot: 5
    id: keypad
    alias: Lylou's code (slot 5)
    variables:
      who: Lylou
  - trigger: event
    event_type: zha_event
    event_data:
      device_ieee: 90:fd:9f:ff:fe:64:47:36
      command: operation_event_notification
      args:
        operation: Unlock
        code_slot: 28
    id: keypad
    alias: Felix's code (slot 28)
    variables:
      who: Felix
  conditions:
  - condition: or
    alias: Any disarm rule matches
    conditions:
    - alias: 'AWAY: someone came home'
      condition: and
      conditions:
      - alias: Triggered by an arrival
        condition: trigger
        id: arrival
      - alias: Alarm is armed away
        condition: alarm_control_panel.is_armed_away
        target:
          entity_id: alarm_control_panel.home_alarm
    - alias: 'NIGHT: sun is up and someone is awake'
      condition: and
      conditions:
      - alias: Triggered by waking or sunrise
        condition: trigger
        id:
        - woke_up
        - sunrise
      - alias: Alarm is armed night
        condition: alarm_control_panel.is_armed_night
        target:
          entity_id: alarm_control_panel.home_alarm
      - alias: Sun is up
        condition: sun.is_up
      - condition: or
        alias: Someone just woke up, or (at sunrise) Maxi is already up
        conditions:
        - alias: Triggered by someone waking
          condition: trigger
          id: woke_up
        - alias: Maxi is awake
          condition: state
          entity_id: sensor.is_maxi_asleep
          state: 'off'
    - alias: 'KEYPAD: main code at the front door (any mode)'
      condition: trigger
      id: keypad
  actions:
  - alias: Disarm
    action: alarm_control_panel.alarm_disarm
    target:
      entity_id: alarm_control_panel.home_alarm
  - alias: 'KEYPAD only: snapshot + announce who arrived'
    if:
    - alias: Triggered by a keypad code
      condition: trigger
      id: keypad
    then:
    - alias: Snapshot the front door camera
      action: camera.snapshot
      target:
        entity_id: camera.front_door_ptz_camera_fluent
      data:
        filename: /media/front_door_capture_on_opening.png
      continue_on_error: true
      note: Don't let an offline camera block the announcement.
    - alias: Announce who arrived and notify Maxi
      action: script.broadcast_alert_in_the_house
      data:
        message: '{{ who }} is in the place'
        color: cyan
        phone_data:
          message: '{{ who }} has arrived'
          data:
            ttl: 0
            priority: high
            channel: doorbell_notifications
            image: /media/local/front_door_capture_on_opening.png
  mode: queued
  max: 5
