    - alias: Stop-parking-horn button tapped
      event_type: mobile_app_notification_action
      context: {}
      event_data:
        action: stop_parking_horn
      trigger: event
    continue_on_timeout: false
    timeout:
      hours: 0
      minutes: 40
      seconds: 0
      milliseconds: 0
  - alias: Turn off the parking horn
    data: {}
    action: switch.turn_off
    target:
      entity_id:
      - switch.plug_parking_horn
