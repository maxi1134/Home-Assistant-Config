      minutes: 1
      seconds: 0
      milliseconds: 0
  - alias: Turn the projector plug back on
    action: switch.turn_on
    metadata: {}
    target:
      entity_id: switch.plug_patio_projector_override_switch
    data: {}
  - alias: Wait 1 minute
    delay:
      hours: 0
      minutes: 1
      seconds: 0
      milliseconds: 0
  - alias: Reload the Matter integration
    action: homeassistant.reload_config_entry
    metadata: {}
