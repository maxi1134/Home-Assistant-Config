- id: '1742998769189'
  alias: Analyze person in the parking when car is present to detect burglary
  description: When a person has been in the parking for 15, 30, 60 or 90 seconds
    while a car is detected there and there is no back-yard party, asks LLM Vision
    whether the person is interacting with the car (6 seconds of the parking exit
    camera). If yes, rings Maxi's phone and sends a 'Car break-in attempt' notification
    with a 'Ring the siren!' button, which the parking horn automation handles.
  triggers:
  - alias: Person in the parking for 1 min 30 s
    trigger: state
    entity_id:
    - binary_sensor.parking_exit_camera_person_occupancy
    - binary_sensor.parking_camera_person_occupancy
    for:
      hours: 0
      minutes: 1
      seconds: 30
    to:
    - 'on'
  - alias: Person in the parking for 30 s
    trigger: state
    entity_id:
    - binary_sensor.parking_exit_camera_person_occupancy
    - binary_sensor.parking_camera_person_occupancy
    for:
      hours: 0
      minutes: 0
      seconds: 30
    to:
    - 'on'
  - alias: Person in the parking for 1 min
    trigger: state
    entity_id:
    - binary_sensor.parking_exit_camera_person_occupancy
    - binary_sensor.parking_camera_person_occupancy
    for:
      hours: 0
      minutes: 1
      seconds: 0
    to:
    - 'on'
  - alias: Person in the parking for 15 s
    trigger: state
    entity_id:
    - binary_sensor.parking_exit_camera_person_occupancy
    - binary_sensor.parking_camera_person_occupancy
    for:
      hours: 0
      minutes: 0
      seconds: 15
    to:
    - 'on'
  conditions:
  - alias: A car is in the parking
    condition: or
    conditions:
    - alias: Car detected by the parking camera
      condition: state
      entity_id: binary_sensor.parking_camera_car_occupancy
      state:
      - 'on'
  - alias: No back-yard party
    condition: switch.is_off
    target:
      entity_id: input_boolean.party_in_the_back_yard
    options:
      behavior: any
      for: 00:00:00
  actions:
  - alias: Ask LLM Vision if the person touches the car
    action: llmvision.stream_analyzer
    metadata: {}
    data:
      duration: 6
      max_frames: 6
      include_filename: false
      target_width: 1280
      max_tokens: 100
      temperature: 0.1
      provider: 01KPNMJBE3FPHY7TEGKG6K7MVM
      model: Qwen3.5_4B
      message: Answer only with yes or no; Is this person trying to interact with
        the car?
      image_entity:
      - camera.parking_exit_camera
    response_variable: answer
  - alias: Stop if no one is trying to break in
    condition: template
    value_template: '{{ "YES" in answer.response_text | upper }}'
  - alias: Ring Maxi's phone
    action: script.find_phone
    metadata: {}
    data: {}
  - alias: 'Notify Maxi: car break-in attempt'
    metadata: {}
    data:
      title: Car break-in attempt
      message: AI detected a  potential car break-in in the parking
      data:
        ttl: 0
        priority: high
        image: /api/camera_proxy/camera.parking_exit_camera
        actions:
        - action: turn_parking_horn_on
          title: Ring the siren!
    action: notify.maxi_notification_group
  mode: single
