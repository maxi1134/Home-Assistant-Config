- id: '1729462034192'
  alias: Display room color  on TVs when mimiclights mode is triggered
  description: Casts a color-matching dashboard view to all Chromecast TVs when mimic-lights
    mode is enabled, and stops casting when disabled.
  triggers:
  - alias: Mimic lights toggle changes
    trigger: state
    entity_id:
    - input_boolean.mimic_lights_on_screens
    from:
    to:
  conditions: []
  actions:
  - alias: Start or stop casting by toggle state
    choose:
    - alias: Toggle on → cast room color views
      conditions:
      - alias: Mimic lights is on
        condition: state
        entity_id: input_boolean.mimic_lights_on_screens
        state: 'on'
      sequence:
      - alias: List all chromecasts
        variables:
          off_chromecasts: '{{integration_entities(''cast'')  |  select(''search'',
            ''chromecast'') | list}}

            '
      - alias: 'For each chromecast: cast its room view'
        repeat:
          sequence:
          - alias: Derive the room from the entity id
            variables:
              room: '{{ repeat.item | replace("media_player.","") | replace("_chromecast","")
                }}

                '
          - alias: Cast the Color Hubs view for the room
            action: cast.show_lovelace_view
            metadata: {}
            data:
              entity_id: '{{repeat.item}}'
              dashboard_path: color-hubs
              view_path: '{{room}}'
          for_each: '{{ off_chromecasts }}'
    - alias: Toggle off → stop Color Hubs casts
      conditions:
      - alias: Mimic lights is off
        condition: state
        entity_id: input_boolean.mimic_lights_on_screens
        state: 'off'
      sequence:
      - alias: List chromecasts showing Color Hubs
        variables:
          off_chromecasts: '{{integration_entities(''cast'')  |  select(''search'',
            ''chromecast'') |

            select(''is_state'',''playing'')| list |  expand |  select(''search'',
            ''Color Hubs'')  | map(attribute=''entity_id'') |list }}

            '
      - alias: 'For each one: turn it off'
        repeat:
          sequence:
          - alias: Turn off the chromecast
            action: media_player.turn_off
            metadata: {}
            data: {}
            target:
              entity_id: '{{repeat.item}}'
          for_each: '{{ off_chromecasts }}'
  mode: single
- id: '1729518874101'
  alias: Turn off the front door light in relation to the sun position
