      and is_state(''script.non_important_broadcast_alert_in_the_house'', ''off'')
      }}'
  - alias: Only continue if the previous state lasted long enough (300s for idle-to-play,
      30s for unmute/off transitions - prevents announcement state churn)
    condition: template
    value_template: '{{ (trigger.id == ''from_idle_to_play'' and (now() - trigger.from_state.last_changed)
      > timedelta(seconds=300)) or (trigger.id != ''from_idle_to_play'' and (now()
      - trigger.from_state.last_changed) > timedelta(seconds=30)) }}'
    enabled: true
  actions:
  - alias: Remember the triggering speaker
    variables:
      trigger_speaker: '{{ trigger.entity_id }}

        '
  - alias: Set the time-of-day volume for the speaker
    action: script.speaker_automatic_volume_adjustment_script
    metadata: {}
    data:
      received_speaker: '{{trigger_speaker}}

        '
  mode: parallel
  trace:
    stored_traces: 30
  max: 10
