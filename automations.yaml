- id: vibe_arc_phase_controller
  alias: Vibe Arc - Phase Controller
  description: 'Picks the Vibe Arc party phase from the number of people home, the
    time and the patio noise, while the arc is enabled and not paused. It re-evaluates
    when the arc is enabled, at 01:00, 02:00 and 03:00, and 3 minutes after the head
    count changes or the patio gets loud: up to 2 people after 01:00 → After Party;
    3–4 after 02:00 → Wind Down; 9+ people, or 5+ with a noisy patio → Peak Party;
    5–8 → Late Night after 01:00, otherwise Warming Up; anyone else home → Gathering.'
  triggers:
  - alias: Vibe Arc enabled
    trigger: state
    entity_id: input_boolean.vibe_arc_enabled
    to: 'on'
    id: enabled
  - alias: Number of persons in the apartment changes
    trigger: state
    entity_id:
    - sensor.total_of_persons_in_the_appartment
    id: people_change
  - alias: Every day at 01:00
    trigger: time
    at: 01:00:00
    id: time_1am
  - alias: Every day at 02:00
    trigger: time
    at: 02:00:00
    id: time_2am
  - alias: Every day at 03:00
    trigger: time
    at: 03:00:00
    id: time_3am
  - alias: Patio sound level above -40 dB for 2 min
    trigger: numeric_state
    entity_id:
    - sensor.patio_camera_sound_level
    above: -40
    for:
      minutes: 2
    id: noise_high
  - alias: Patio camera crowd sound on for 1 min
    trigger: state
    entity_id: binary_sensor.patio_camera_crowd_sound
    to: 'on'
    for:
      minutes: 1
    id: crowd
  - alias: Patio camera yell sound on for 1 min
    trigger: state
    entity_id: binary_sensor.patio_camera_yell_sound
    to: 'on'
    for:
      minutes: 1
    id: yell
  conditions:
  - alias: Vibe Arc is enabled
    condition: state
    entity_id: input_boolean.vibe_arc_enabled
    state: 'on'
  - alias: Vibe Arc is not paused
    condition: state
    entity_id: input_boolean.vibe_arc_paused
    state: 'off'
  actions:
  - alias: If triggered by person count or noise
    if:
    - alias: Triggered by people_change, noise_high, crowd or yell
      condition: trigger
      id:
      - people_change
      - noise_high
      - crowd
      - yell
    then:
    - alias: Wait 3 minutes
      delay:
        minutes: 3
  - alias: Compute guests, hour, late/very-late flags, noisy flag, current phase
    variables:
      guests: '{{ states(''sensor.total_of_persons_in_the_appartment'') | int(0) }}'
      hour: '{{ now().hour }}'
      is_late: '{{ hour >= 1 and hour < 6 }}'
      is_very_late: '{{ hour >= 2 and hour < 6 }}'
      is_noisy: '{{ states(''sensor.patio_camera_sound_level'') | float(-100) > -30
        or is_state(''binary_sensor.patio_camera_crowd_sound'', ''on'') or is_state(''binary_sensor.patio_camera_yell_sound'',
        ''on'') }}'
      current_phase: '{{ states(''input_select.vibe_arc_phase'') }}'
  - alias: Pick party phase from guest count, hour and noise
    choose:
    - alias: At most 2 guests from 01:00 → After Party
      conditions:
      - alias: At most 2 guests and 01:00–05:59
        condition: template
        value_template: '{{ guests <= 2 and is_late }}'
      sequence:
      - alias: Continue only if phase is not already After Party
        condition: '{{ current_phase != ''After Party'' }}'
      - alias: Set Vibe Arc phase to After Party
        action: input_select.select_option
        target:
          entity_id: input_select.vibe_arc_phase
        data:
          option: After Party
    - alias: 3–4 guests from 02:00 → Wind Down
      conditions:
      - alias: 3 or 4 guests and 02:00–05:59
        condition: template
        value_template: '{{ guests <= 4 and guests > 2 and is_very_late }}'
      sequence:
      - alias: Continue only if phase is not already Wind Down
        condition: '{{ current_phase != ''Wind Down'' }}'
      - alias: Set Vibe Arc phase to Wind Down
        action: input_select.select_option
        target:
          entity_id: input_select.vibe_arc_phase
        data:
          option: Wind Down
    - alias: 9+ guests → Peak Party
      conditions:
      - alias: At least 9 guests
        condition: template
        value_template: '{{ guests >= 9 }}'
      sequence:
      - alias: Continue only if phase is not already Peak Party
        condition: '{{ current_phase != ''Peak Party'' }}'
      - alias: Set Vibe Arc phase to Peak Party
        action: input_select.select_option
        target:
          entity_id: input_select.vibe_arc_phase
        data:
          option: Peak Party
    - alias: 5+ guests and noisy patio → Peak Party
      conditions:
      - alias: At least 5 guests and patio noisy (>-30 dB, crowd or yell)
        condition: template
        value_template: '{{ guests >= 5 and is_noisy }}'
      sequence:
      - alias: Continue only if phase is not already Peak Party
        condition: '{{ current_phase != ''Peak Party'' }}'
      - alias: Set Vibe Arc phase to Peak Party
        action: input_select.select_option
        target:
          entity_id: input_select.vibe_arc_phase
        data:
          option: Peak Party
    - alias: 5–8 guests from 01:00 → Late Night
      conditions:
      - alias: 5 to 8 guests and 01:00–05:59
        condition: template
        value_template: '{{ guests >= 5 and guests <= 8 and is_late }}'
      sequence:
      - alias: Continue only if phase is not already Late Night
        condition: '{{ current_phase != ''Late Night'' }}'
      - alias: Set Vibe Arc phase to Late Night
        action: input_select.select_option
        target:
          entity_id: input_select.vibe_arc_phase
        data:
          option: Late Night
    - alias: 5–8 guests → Warming Up
      conditions:
      - alias: 5 to 8 guests
        condition: template
        value_template: '{{ guests >= 5 and guests <= 8 }}'
      sequence:
      - alias: Continue only if phase is not already Warming Up
        condition: '{{ current_phase != ''Warming Up'' }}'
      - alias: Set Vibe Arc phase to Warming Up
        action: input_select.select_option
        target:
          entity_id: input_select.vibe_arc_phase
        data:
          option: Warming Up
    default:
    - alias: 'Otherwise: continue only if phase not Gathering and guests > 0'
      condition: '{{ current_phase != ''Gathering'' and guests > 0 }}'
    - alias: Set Vibe Arc phase to Gathering
      action: input_select.select_option
      target:
        entity_id: input_select.vibe_arc_phase
      data:
        option: Gathering
  mode: restart
- id: vibe_arc_phase_executor
  alias: Vibe Arc - Phase Executor
  description: 'When the Vibe Arc phase changes (arc enabled, phase not Off), runs
    the matching phase script: Gathering, Warming Up, Peak Party, Late Night, Wind
    Down or After Party.'
  triggers:
  - alias: Vibe Arc phase changes
    trigger: state
    entity_id: input_select.vibe_arc_phase
  conditions:
  - alias: Vibe Arc is enabled
    condition: state
    entity_id: input_boolean.vibe_arc_enabled
    state: 'on'
  - alias: 'Not: phase is Off'
    condition: not
    conditions:
    - alias: Vibe Arc phase is Off
      condition: state
      entity_id: input_select.vibe_arc_phase
      state: 'Off'
  actions:
  - alias: Run the script for the new phase
    choose:
    - alias: Gathering → run Gathering phase script
      conditions:
      - alias: Phase is Gathering
        condition: state
        entity_id: input_select.vibe_arc_phase
        state: Gathering
      sequence:
      - alias: 'Run Vibe Arc Gathering: cozy ambiance, UV off, effects off'
        action: script.vibe_arc_gathering
    - alias: Warming Up → run Warming Up phase script
      conditions:
      - alias: Phase is Warming Up
        condition: state
        entity_id: input_select.vibe_arc_phase
        state: Warming Up
      sequence:
      - alias: 'Run Vibe Arc Warming Up: brighten lights, warm colors, flame effects'
        action: script.vibe_arc_warming_up
    - alias: Peak Party → run Peak Party phase script
      conditions:
      - alias: Phase is Peak Party
        condition: state
        entity_id: input_select.vibe_arc_phase
        state: Peak Party
      sequence:
      - alias: 'Run Vibe Arc Peak Party: party mode on + party ambiance'
        action: script.vibe_arc_peak_party
    - alias: Late Night → run Late Night phase script
      conditions:
      - alias: Phase is Late Night
        condition: state
        entity_id: input_select.vibe_arc_phase
        state: Late Night
      sequence:
      - alias: 'Run Vibe Arc Late Night: acid time, psychedelic ambiance, warm trippy
          colors'
        action: script.vibe_arc_late_night
    - alias: Wind Down → run Wind Down phase script
      conditions:
      - alias: Phase is Wind Down
        condition: state
        entity_id: input_select.vibe_arc_phase
        state: Wind Down
      sequence:
      - alias: 'Run Vibe Arc Wind Down: modes off, cozy ambiance, dim warm lights'
        action: script.vibe_arc_wind_down
    - alias: After Party → run After Party phase script
      conditions:
      - alias: Phase is After Party
        condition: state
        entity_id: input_select.vibe_arc_phase
        state: After Party
      sequence:
      - alias: 'Run Vibe Arc After Party: modes off + sexy ambiance'
        action: script.vibe_arc_after_party
  mode: restart
- id: vibe_arc_override_detection
  alias: Vibe Arc - Override Detection
  description: When party mode, Kink Party or Acid Time changes while the Vibe Arc
    is enabled and not applying a phase itself, pauses the arc and starts its 15-minute
    override timer so the manual choice stands.
  triggers:
  - alias: Party mode, kink party or acid time toggle changes
    trigger: state
    entity_id:
    - input_boolean.party_mode
    - input_boolean.kink_party
    - input_boolean.acid_time
  conditions:
  - alias: Vibe Arc is enabled
    condition: state
    entity_id: input_boolean.vibe_arc_enabled
    state: 'on'
  - alias: Vibe Arc is not currently acting
    condition: state
    entity_id: input_boolean.vibe_arc_acting
    state: 'off'
  actions:
  - alias: Set Vibe Arc paused flag on
    action: input_boolean.turn_on
    target:
      entity_id: input_boolean.vibe_arc_paused
  - alias: Start 15-min Vibe Arc override timer
    action: timer.start
    target:
      entity_id: timer.vibe_arc_override
    data:
      duration: 00:15:00
  mode: single
- id: vibe_arc_override_release
  alias: Vibe Arc - Override Release
  description: When the 15-minute Vibe Arc override timer finishes and the arc is
    still enabled, clears the paused flag so the phase controller may act again on
    its next trigger.
  triggers:
  - alias: Vibe Arc override timer finishes
    trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.vibe_arc_override
  conditions:
  - alias: Vibe Arc is enabled
    condition: state
    entity_id: input_boolean.vibe_arc_enabled
    state: 'on'
  actions:
  - alias: Clear Vibe Arc paused flag
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.vibe_arc_paused
  mode: single
- id: vibe_arc_enable_disable
  alias: Vibe Arc - Enable/Disable Handler
  description: When the Vibe Arc master toggle is turned off, sets the phase select
    to Off, clears the paused and acting flags and cancels the override timer. No
    ambiance change is made; the current lighting and modes stay as they are.
  triggers:
  - alias: Vibe Arc disabled
    trigger: state
    entity_id: input_boolean.vibe_arc_enabled
    to: 'off'
    id: disabled
  conditions: []
  actions:
  - alias: Set Vibe Arc phase to Off
    action: input_select.select_option
    target:
      entity_id: input_select.vibe_arc_phase
    data:
      option: 'Off'
  - alias: Turn off Vibe Arc paused and acting flags
    action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.vibe_arc_paused
      - input_boolean.vibe_arc_acting
  - alias: Cancel Vibe Arc override timer
    action: timer.cancel
    target:
      entity_id: timer.vibe_arc_override
  mode: single
- id: '1711648800000'
  alias: Control workshop secondary tablet screen to avoid full discharge
  description: 'Manages the workshop secondary tablet''s screen from its battery level:
    when the battery drops below 15% and the screen is on, sets brightness to 1 and
    turns the screen off; when it rises above 70% with the screen on, sets brightness
    to 99. The intended 25%-brightness step below 50% never runs because its only
    trigger fires when the battery is between 50 and 55%, where the ''below 50'' condition
    is false.'
  triggers:
  - alias: Workshop secondary tablet battery enters 50–55%
    trigger: numeric_state
    entity_id:
    - sensor.kiosk_workshop_tv_tablet_battery
    above: 50
    below: 55
  - alias: Workshop secondary tablet battery drops below 15%
    trigger: numeric_state
    entity_id:
    - sensor.kiosk_workshop_tv_tablet_battery
    below: 15
  - alias: Workshop secondary tablet battery rises above 70%
    trigger: numeric_state
    entity_id:
    - sensor.kiosk_workshop_tv_tablet_battery
    above: 70
  conditions: []
  actions:
  - alias: Pick screen action based on battery level
    choose:
    - alias: Battery below 15% with screen on → brightness 1, screen off
      conditions:
      - alias: Battery below 15%
        condition: numeric_state
        entity_id: sensor.kiosk_workshop_tv_tablet_battery
        below: 15
      - alias: Secondary tablet screen is on
        condition: state
        entity_id: light.kiosk_workshop_tv_tablet_screen
        state: 'on'
      sequence:
      - alias: Set secondary tablet brightness to 1
        if:
        - condition: state
          entity_id: light.kiosk_workshop_tv_tablet_screen
          state: 'on'
        then:
        - action: light.turn_on
          target:
            entity_id: light.kiosk_workshop_tv_tablet_screen
          data:
            brightness: 1
      - alias: Turn off secondary tablet screen
        action: light.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: light.kiosk_workshop_tv_tablet_screen
        enabled: true
    - alias: Battery below 50% with screen on → brightness 25 (unreachable)
      conditions:
      - alias: Battery below 50%
        condition: numeric_state
        entity_id: sensor.kiosk_workshop_tv_tablet_battery
        below: 50
      - alias: Secondary tablet screen is on
        condition: state
        entity_id: light.kiosk_workshop_tv_tablet_screen
        state: 'on'
      sequence:
      - alias: Set secondary tablet brightness to 25
        if:
        - condition: state
          entity_id: light.kiosk_workshop_tv_tablet_screen
          state: 'on'
        then:
        - action: light.turn_on
          target:
            entity_id: light.kiosk_workshop_tv_tablet_screen
          data:
            brightness: 25
    - alias: Battery above 70% with screen on → brightness 99
      conditions:
      - alias: Battery above 70%
        condition: numeric_state
        entity_id: sensor.kiosk_workshop_tv_tablet_battery
        above: 70
      - alias: Secondary tablet screen is on
        condition: state
        entity_id: light.kiosk_workshop_tv_tablet_screen
        state: 'on'
      sequence:
      - alias: Set secondary tablet brightness to 99
        if:
        - condition: state
          entity_id: light.kiosk_workshop_tv_tablet_screen
          state: 'on'
        then:
        - action: light.turn_on
          target:
            entity_id: light.kiosk_workshop_tv_tablet_screen
          data:
            brightness: 99
  mode: single
- id: '1774748550086'
  alias: Workshop Tablet dial automation
  description: Handles an IKEA SYMFONISK dial in the workshop, routing volume, play/pause,
    next track, and stop commands to either the Chromecast or the WiiM speaker depending
    on which is actively playing.
  use_blueprint:
    path: EPMatt/ikea_e1744.yaml
    input:
      integration: ZHA
      controller_device: 360e22d2c7aadf1a857e8cb54d2bd198
      helper_last_controller_event: input_text.dial_workshop_tablet_helper
      action_rotate_left:
      - sequence:
        - if:
          - alias: If the TV is in use
            condition: and
            conditions:
            - alias: Playing or paused
              condition: state
              entity_id: media_player.workshop_chromecast
              state:
              - playing
              - paused
            - alias: TV not off or showing Plex Visuals
              condition: not
              conditions:
              - alias: TV off
                condition: state
                entity_id: media_player.universal_workshop_chromecast
                state: 'off'
              - alias: TV showing Plex Visuals
                condition: state
                entity_id: media_player.universal_workshop_chromecast
                attribute: media_library_title
                state: Visuals
            - alias: TV not muted, or the speaker is silent too
              condition: or
              conditions:
              - alias: TV not muted
                condition: not
                conditions:
                - condition: state
                  entity_id: media_player.universal_workshop_chromecast
                  attribute: is_volume_muted
                  state: true
              - alias: Speaker muted, paused or idle
                condition: or
                conditions:
                - condition: state
                  entity_id: media_player.mass_workshop_wiim_speaker
                  state:
                  - paused
                  - idle
                - condition: state
                  entity_id: media_player.mass_workshop_wiim_speaker
                  attribute: is_volume_muted
                  state: true
          then:
          - action: media_player.volume_down
            metadata: {}
            data: {}
            target:
              entity_id: media_player.workshop_chromecast
          else:
          - alias: Only while the speaker is on
            if:
            - alias: Speaker is not off or unavailable
              condition: not
              conditions:
              - condition: state
                entity_id: media_player.mass_workshop_wiim_speaker
                state:
                - 'off'
                - unavailable
                - unknown
            then:
            - action: media_player.volume_set
              data:
                volume_level: '{{ [(state_attr(''media_player.mass_workshop_wiim_speaker'',
                  ''volume_level'') | float(0)) - 0.09, 0] | max }}'
              target:
                entity_id: media_player.mass_workshop_wiim_speaker
            note: An off speaker reports no volume, so this step used to compute from
              0 and set it to 6% (turn right) or 0% (turn left). The turn is ignored
              while the speaker is off.
        - delay:
            hours: 0
            minutes: 0
            seconds: 0
            milliseconds: 150
      action_rotate_left_stop: []
      rotate_right_loop: true
      rotate_left_loop: true
      rotate_left_max_loop_repeats: 60
      rotate_right_max_loop_repeats: 60
      action_rotate_right:
      - sequence:
        - if:
          - alias: If the TV is in use
            condition: and
            conditions:
            - alias: Playing or paused
              condition: state
              entity_id: media_player.universal_workshop_chromecast
              state:
              - playing
              - paused
            - alias: TV not showing Plex Visuals
              condition: not
              conditions:
              - alias: TV showing Plex Visuals
                condition: state
                entity_id: media_player.universal_workshop_chromecast
                attribute: media_library_title
                state: Visuals
            - alias: TV not muted, or the speaker is silent too
              condition: or
              conditions:
              - alias: TV not muted
                condition: not
                conditions:
                - condition: state
                  entity_id: media_player.universal_workshop_chromecast
                  attribute: is_volume_muted
                  state: true
              - alias: Speaker muted, paused or idle
                condition: or
                conditions:
                - condition: state
                  entity_id: media_player.mass_workshop_wiim_speaker
                  state:
                  - paused
                  - idle
                - condition: state
                  entity_id: media_player.mass_workshop_wiim_speaker
                  attribute: is_volume_muted
                  state: true
          then:
          - action: media_player.volume_up
            metadata: {}
            data: {}
            target:
              entity_id: media_player.universal_workshop_chromecast
          else:
          - alias: Only while the speaker is on
            if:
            - alias: Speaker is not off or unavailable
              condition: not
              conditions:
              - condition: state
                entity_id: media_player.mass_workshop_wiim_speaker
                state:
                - 'off'
                - unavailable
                - unknown
            then:
            - action: media_player.volume_set
              data:
                volume_level: '{{ [(state_attr(''media_player.mass_workshop_wiim_speaker'',
                  ''volume_level'') | float(0)) + 0.06, 1] | min | round(2) }}'
              target:
                entity_id: media_player.mass_workshop_wiim_speaker
            note: An off speaker reports no volume, so this step used to compute from
              0 and set it to 6% (turn right) or 0% (turn left). The turn is ignored
              while the speaker is off.
        - delay:
            hours: 0
            minutes: 0
            seconds: 0
            milliseconds: 150
      helper_debounce_delay: 0
      action_click_triple:
      - if:
        - alias: If the TV is in use
          condition: and
          conditions:
          - alias: Playing or paused
            condition: state
            entity_id: media_player.workshop_chromecast
            state:
            - playing
            - paused
          - alias: TV not off or showing Plex Visuals
            condition: not
            conditions:
            - alias: TV off
              condition: state
              entity_id: media_player.universal_workshop_chromecast
              state: 'off'
            - alias: TV showing Plex Visuals
              condition: state
              entity_id: media_player.universal_workshop_chromecast
              attribute: media_library_title
              state: Visuals
        then:
        - action: media_player.turn_off
          metadata: {}
          data: {}
          target:
            entity_id: media_player.workshop_chromecast
        else:
        - action: media_player.turn_off
          metadata: {}
          data: {}
          target:
            entity_id: media_player.mass_workshop_wiim_speaker
      action_click_double:
