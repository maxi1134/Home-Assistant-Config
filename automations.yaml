- id: '1788666949771'
  alias: Alert when Kitchen asssistant timer finishes
  description: 5 seconds after the kitchen assistant's timer starts or stops ringing,
    if the cooking timer's last transition was 'finished' and the kitchen has no motion,
    announces 'Kitchen Assistant Timer Finished!' as a low-priority house alert, then
    repeats it every 5 minutes for as long as the kitchen has had no motion for 5
    minutes.
  triggers:
  - alias: Assistant timer ringing changes (5 s)
    trigger: state
    entity_id:
    - binary_sensor.kitchen_kitchen_assistant_timer_ringing
    for:
      hours: 0
      minutes: 0
      seconds: 5
    from:
    - 'off'
    - 'on'
  conditions:
  - alias: Kitchen radar shows no occupancy
    condition: state
    entity_id: binary_sensor.kitchen_radar_occupancy_occupancy
    state:
    - 'off'
    enabled: false
  - alias: Cooking timer last finished
    condition: state
    entity_id: timer.cooking
    state:
    - finished
    attribute: last_transition
  actions:
  - alias: If the kitchen is empty, alert and repeat
    if:
    - alias: Kitchen has no motion
      condition: state
      entity_id: binary_sensor.group_kitchen_motion_occupancy
      state: 'off'
    then:
    - alias: Announce the timer finished
      action: script.non_important_broadcast_alert_in_the_house
      data:
        message: Kitchen Assistant Timer Finished!
    - alias: Wait 5 minutes
      delay:
        minutes: 5
    - alias: Repeat while the kitchen stays empty
      repeat:
        while:
        - alias: Kitchen empty for 5 min
          condition: state
          entity_id: binary_sensor.group_kitchen_motion_occupancy
          state: 'off'
          for:
            minutes: 5
        sequence:
        - alias: Announce the timer finished again
          action: script.non_important_broadcast_alert_in_the_house
          data:
            message: Kitchen Assistant Timer Finished!
        - alias: Wait 5 minutes
          delay:
            minutes: 5
  mode: single
- id: '1788672731694'
  alias: Copy Kitchen Assistant timer length on Cooking timer
  description: When the kitchen assistant's timer starts (its remaining time leaves
    0.0 seconds) and the cooking timer is not running, starts the cooking timer for
    the same number of seconds.
  triggers:
  - alias: Assistant timer remaining leaves 0.0
    trigger: state
    entity_id:
    - sensor.kitchen_kitchen_assistant_timer_remaining
    from:
    - '0.0'
  conditions:
  - alias: Remaining time has a value
    condition: template
    value_template: '{{ has_value(trigger.entity_id) }}'
  - alias: Cooking timer is not running
    condition: not
    conditions:
    - alias: Cooking timer is active
      condition: timer.is_active
      target:
        entity_id: timer.cooking
      options:
        behavior: any
  actions:
  - alias: Set the cooking timer duration
    action: timer.set_duration
    metadata: {}
    target:
      entity_id: timer.cooking
    data:
      duration: '{% set t = trigger.to_state.state if trigger.state not in [''unknown'',
        ''unavailable''] else ''00:00:00'' %}

        {{ t | string }}'
    enabled: false
  - alias: Start the cooking timer with that time
    action: timer.start
    metadata: {}
    target:
      entity_id: timer.cooking
    data:
      duration: '{% set t = trigger.to_state.state if trigger.state not in [''unknown'',
        ''unavailable''] else ''00:00:00'' %}

        {{ t | string }}'
  mode: single
