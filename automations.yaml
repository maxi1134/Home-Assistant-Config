    value_template: '{{ (now() - trigger.from_state.last_changed) > timedelta(seconds=30)
      }}'
  actions:
  - alias: Remember the bathroom speaker
    variables:
      trigger_speaker: '{{ trigger.entity_id }}

        '
  - alias: Set the time-of-day volume
    action: script.speaker_automatic_volume_adjustment_script
    metadata: {}
    data:
      received_speaker: '{{trigger_speaker}}

        '
  mode: parallel
  trace:
    stored_traces: 30
  max: 10
- id: '1768062570998'
  alias: Turn on Waiting Pakidge when Intelcom emails me and off when it arrives
  description: Monitors incoming IMAP emails for Intelcom delivery notifications,
    turning on a waiting-package indicator when a package is en route and turning
    it off 10 minutes after delivery confirmation.
  triggers:
  - alias: IMAP email received
    trigger: event
    event_type: imap_content
    event_data: {}
  conditions: []
  actions:
  - alias: Act on the email subject
    choose:
    - conditions:
      - condition: template
        value_template: '{{ ''ici une heure'' in trigger.event.data.subject }}'
        alias: When 'ici une heure' ('In an hour' in French) is present in the Subject
          of the email. As to only trigger when the package is nearby
      sequence:
      - action: input_boolean.turn_on
        metadata: {}
        target:
          entity_id: input_boolean.waiting_package
        data: {}
        alias: Turn on the boolean toggle called 'Waiting Package'
      alias: When package is nearing
    - conditions:
      - condition: template
        value_template: '{{ ''Votre colis est arriv'' in trigger.event.data.subject
          }}'
        alias: When 'Votre colis est arriv' ('Your package has arrived' in French)
          is in the Subject
      sequence:
      - delay:
          hours: 0
          minutes: 10
          seconds: 0
          milliseconds: 0
        alias: Delay for 10 minutes, as sometimes they trigger that second email in
          advance.
      - action: input_boolean.turn_off
        metadata: {}
        target:
          entity_id: input_boolean.waiting_package
        data: {}
        alias: Turn off the boolean toggle called 'Waiting Package'
      alias: When package arrives
  mode: single
- id: '1768863734220'
