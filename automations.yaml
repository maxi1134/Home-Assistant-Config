  mode: restart
- id: '1753418041554'
  alias: Turn off lights automatically when room is empty and sleep mode is on
  description: While Adaptive Lighting sleep mode is on and no party, kink, Acid Time
    event or depressive episode is active, fades out all lights in a room over 60
    seconds once it has had no motion for 1 minute.
  triggers:
  - alias: Room empty for 1 min
    entity_id:
    - binary_sensor.group_patio_motion_occupancy
    - binary_sensor.group_closet_motion_occupancy
    - binary_sensor.group_lounge_motion_occupancy
    - binary_sensor.group_server_motion_occupancy
    - binary_sensor.group_hallway_motion_occupancy
    - binary_sensor.group_kitchen_motion_occupancy
    - binary_sensor.group_entrance_motion_occupancy
    - binary_sensor.group_workshop_motion_occupancy
    - binary_sensor.group_workstation_motion_occupancy
    - binary_sensor.group_salon_motion_occupancy
    for:
      hours: 0
      minutes: 1
      seconds: 0
    to: 'off'
    trigger: state
  conditions:
  - alias: Maxi is not in this room
    condition: template
    value_template: '{% if states(''sensor.maxi_location_by_petro_v2'') != ''unknown''
      %}

      {{ states(''sensor.maxi_location_by_petro_v2'') | lower not in [area_id(trigger.entity_id)]
      | lower }}

      {% else %}

      false

      {% endif %}'
    enabled: false
  - alias: Myriam is not in this room
    condition: template
    value_template: '{{ states(''sensor.myriam_location_by_petro'') | lower not in
      [area_id(trigger.entity_id)] | lower }}'
    enabled: false
  - alias: Stop if myriam's tablet is active in the room
    condition: template
    value_template: '{% if (states(''binary_sensor.tablet_myriam_interactive'') ==
      on and states(''sensor.myriam_tablet_location_compounded'') | lower in [area_id(trigger.entity_id)]
      | lower) %} false {% else %} true {%endif%}'
    enabled: false
  - alias: No kink party
    condition: state
    entity_id: input_boolean.kink_party
    state: 'off'
  - alias: Party mode is off
    condition: state
    entity_id: input_boolean.party_mode
    state: 'off'
  - alias: Acid Time is off
    condition: state
    entity_id: input_boolean.acid_time
    state: 'off'
  - alias: Depressive episode is off
    condition: state
    entity_id: input_boolean.depressive_episode
    state: 'off'
  - alias: Adaptive Lighting sleep mode is on
    condition: state
    entity_id: switch.adaptive_lighting_sleep_mode_adaptive_lighting
    state: 'on'
  actions:
  - alias: Fade out the room's lights over 60 s
    metadata: {}
    data:
      transition: 60
    action: light.turn_off
    target:
      area_id: '{{ area_id(trigger.entity_id) }}'
  mode: parallel
  max: 10
