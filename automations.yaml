    - media_player.mass_bedroom_vpe_speaker
    - media_player.mass_salon_wiim_speaker
    - media_player.mass_closet_vpe_speaker
    - media_player.mass_hallway_wiim_speaker
    - media_player.mass_kitchen_wiim_speaker
    - media_player.mass_lounge_wiim_speaker
    - media_player.mass_workshop_wiim_speaker
    - media_player.mass_hotbox_wiim_speaker
    trigger: state
    attribute: is_volume_muted
    to: 'false'
    from: 'true'
    enabled: 'true'
  conditions:
  - alias: Not playing the thunderstorm sound
    condition: template
    value_template: '{{ ''thunderstorm'' not in state_attr(trigger.entity_id,''media_title'')
      | string }}

      '
  - alias: Music following is on
    condition: state
    entity_id: input_boolean.following_music
    state: 'on'
  - alias: Not during an active broadcast announcement
    condition: template
