        image: /media/local/parking_horn_check.png
        actions:
        - action: stop_parking_horn
          title: Stop the horn?
        channel: security_alerts_notifications
        ttl: 0
        priority: high
      title: Security breach
      message: Parking horn started
  - alias: Wait up to 40 min for a stop tap
