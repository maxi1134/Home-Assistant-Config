- id: '1785451195460'
  alias: Confirm unlock front door on doorbell action
  description: When Maxi taps the unlock action on a doorbell notification, saves
    a front door camera snapshot and sends Maxi a confirmation notification with it.
    If Maxi confirms within 7.5 minutes, unlocks the front door if it is locked and
    sends 'Door Unlocked!' once it reports unlocked, or sends 'Door Already Unlocked!'
    if it already was.
  triggers:
  - alias: Maxi taps unlock on a doorbell alert
    trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: UNLOCK_FRONT_DOOR
      channel: doorbell_notifications
    context:
      user_id:
      - 7f1de31122574f6fa2215e519d6083ea
  conditions: []
  actions:
  - alias: Snapshot the front door camera
    metadata: {}
    data:
      filename: /media/front_door_capture_on_ringing_confirmation.png
    action: camera.snapshot
    target:
      entity_id: camera.front_door_ptz_camera_fluent
  - alias: Ask Maxi to confirm the unlock
    action: notify.maxi_notification_group
    data:
      message: Unlock Front Door?
      data:
        channel: security_alerts_notifications
        image: /media/local/front_door_capture_on_ringing_confirmation.png
        actions:
        - title: Unlock Front Door!
          action: UNLOCK_FRONT_DOOR_CONFIRMED
  - alias: Wait up to 7.5 min for confirmation
    wait_for_trigger:
    - alias: Maxi confirms the unlock
      trigger: event
      event_type: mobile_app_notification_action
      event_data:
        action: UNLOCK_FRONT_DOOR_CONFIRMED
        channel: security_alerts_notifications
      context:
        user_id:
        - 7f1de31122574f6fa2215e519d6083ea
    continue_on_timeout: false
    timeout:
      hours: 0
      minutes: 7
      seconds: 30
      milliseconds: 0
  - alias: Unlock or report the lock state
    choose:
    - alias: Door locked → unlock it
      conditions:
      - alias: Front door is locked
        condition: state
        entity_id: lock.lock_front_door
        state:
        - locked
      sequence:
      - alias: Unlock the front door
        action: lock.unlock
        metadata: {}
        target:
          entity_id: lock.lock_front_door
        data: {}
      - alias: Wait up to 7.5 min for the unlock
        wait_for_trigger:
        - alias: Front door becomes unlocked
          trigger: state
          entity_id:
          - lock.lock_front_door
          to:
          - unlocked
        continue_on_timeout: false
        timeout:
          hours: 0
          minutes: 7
          seconds: 30
          milliseconds: 0
      - alias: 'Notify Maxi: Door Unlocked!'
        action: notify.maxi_notification_group
        data:
          message: Door Unlocked!
          data:
            channel: security_alerts_notifications
    - alias: Already unlocked → tell Maxi
      conditions:
      - alias: Front door is unlocked
        condition: state
        entity_id: lock.lock_front_door
        state:
        - unlocked
      sequence:
      - alias: 'Notify Maxi: Door Already Unlocked!'
        action: notify.maxi_notification_group
        data:
          message: Door Already Unlocked!
          data:
            channel: security_alerts_notifications
  mode: single
