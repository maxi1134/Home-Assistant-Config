  actions:
  - alias: List the room's mute switches
    variables:
      esp32_mute_entities: '{{([area_id(trigger.entity_id)]  | map(''area_entities'')
        | sum(start=[]) |select(''match'', ''switch.*mute$'') | reject(''eq'', ''switch.salon_sony_tv_mute'')
        | select(''has_value'') |  unique | list ) }}

        '
