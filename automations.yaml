- id: '1752801417034'
  alias: Lower lights to 30% when a movie is played
  description: When a movie from the Movies library (not a TV series) starts playing
    on the bedroom, workshop or salon TV, dims every light in that room that is on
    above about 31% brightness to 30% at 3308 K over 3 seconds.
  triggers:
  - alias: TV media type becomes movie (4 s)
    entity_id:
    - media_player.universal_bedroom_chromecast
    - media_player.universal_workshop_chromecast
    - media_player.universal_salon_chromecast
    to:
    - Movies
    trigger: state
    attribute: media_library_title
    for:
      hours: 0
      minutes: 0
      seconds: 4
  - alias: TV starts playing (2 s)
    entity_id:
    - media_player.universal_bedroom_chromecast
    - media_player.universal_workshop_chromecast
    - media_player.universal_salon_chromecast
    to: playing
    trigger: state
    for:
      hours: 0
      minutes: 0
      seconds: 2
  conditions:
  - alias: Media is from the Movies library
    condition: template
    value_template: '{{ state_attr(state_attr(trigger.entity_id,''active_child''),''media_library_title'')
      == ''Movies''}}'
    enabled: true
  - alias: Media is not a TV series
    condition: template
    value_template: '{{ not trigger.to_state.attributes.get(''media_series_title'')
      }}'
    enabled: true
  actions:
  - alias: List lit room lights above 31%
    variables:
      entity_id: '{{ trigger.entity_id }}

        '
      lights_over_30_percent: '{{ area_entities(area_id(trigger.entity_id))  | select(''match'',
        ''^light.'')  | select(''is_state'', ''on'')  | expand  | selectattr(''attributes.brightness'',
        ''defined'')  | selectattr(''attributes.brightness'', ''>'', 80)  | map(attribute=''entity_id'')  |
        list }}

        '
      trigger_full: '{{ trigger.to_state.attributes }}

        '
  - alias: 'For each bright light: dim it'
    repeat:
      sequence:
      - alias: Set the light to 30%, 3308 K over 3 s
        metadata: {}
        data:
          brightness_pct: 30
          color_temp_kelvin: 3308
          transition: 3
        target:
          entity_id: '{{ lights_over_30_percent[repeat.index - 1 ] }}'
        action: light.turn_on
      for_each: '{{lights_over_30_percent}}'
    enabled: true
  mode: parallel
  max: 6
