- id: '1781183357210'
  alias: Turn off Workshop sleeper when lights are bright
  description: Turns off the workshop sleeper flag when the workshop lights have been
    above brightness 70 (about 27%) for 2 minutes.
  triggers:
  - alias: Workshop lights above 27% for 2 min
    trigger: numeric_state
    entity_id:
    - light.group_workshop_lights
    for:
      hours: 0
      minutes: 2
      seconds: 0
    attribute: brightness
    above: 70
  conditions: []
  actions:
  - alias: Turn off the workshop sleeper flag
    metadata: {}
    data: {}
    target:
      entity_id: input_boolean.sleeper_in_workshop
    action: input_boolean.turn_off
  mode: single
- id: '1781210475077'
  alias: Boost assist answers when answering with music
  description: When an Assist satellite starts listening while music plays on that
    room's Music Assistant speaker (or on the following-media player if the room has
    none) and nobody sleeps in the room, sets the room's speaker gain to 12, waits
    up to 1 minute for the satellite to go idle, then sets the gain back to 4. The
    gain lookup currently finds no entity, so nothing changes.
  triggers:
  - alias: An Assist satellite starts listening
    entity_id:
    - assist_satellite.kitchen_assistant_assist_satellite
    - assist_satellite.saloon_assistant_assist_satellite
    - assist_satellite.lv_assistant_assist_satellite
    - assist_satellite.bedroom_assistant_assist_satellite
    - assist_satellite.desktop_assistant_assist_satellite
    - assist_satellite.lounge_assistant_assist_satellite
    - assist_satellite.bathroom_assistant_assist_satellite
    - assist_satellite.patio_assistant_assist_satellite
    - assist_satellite.server_assistant_assist_satellite
    from:
    trigger: state
    to:
    - listening
  conditions:
  - alias: Make sure no sleeper is present
    condition: template
    value_template: '{{ area_id(trigger.entity_id) | lower | replace(''_top'','''')|
      replace(''_down'','''') not in states(''sensor.active_sleeper_rooms'') | string
      | lower }}'
  - alias: Room's music player is playing
    condition: template
    value_template: '{{ states(area_entities(area_id(trigger.entity_id)) | select(''search'',
      ''mass'') | first | default(''media_player.universal_following_media'')) ==
      ''playing'' }}

      '
  actions:
  - alias: Find the room's speaker gain entity
    variables:
      speaker_gain_entity: '{{ area_entities(area_id(trigger.entity_id) | select(''match'',''.*speaker_gain''))
        | list }}

        '
  - alias: Raise the speaker gain to 12
    action: input_number.set_value
    metadata: {}
    target:
      entity_id: '{{ speaker_gain_entity }}

        '
    data:
      value: 12
  - alias: Wait up to 1 min for the satellite to idle
    wait_for_trigger:
    - alias: Satellite is idle
      trigger: template
      value_template: '{{ states(trigger.entity_id) == ''idle''}}'
    continue_on_timeout: true
    timeout:
      hours: 0
      minutes: 1
      seconds: 0
      milliseconds: 0
  - alias: Set the speaker gain back to 4
    action: input_number.set_value
    metadata: {}
    target:
      entity_id: '{{ speaker_gain_entity }}

        '
    data:
      value: 4
  mode: single
- id: '1781915583649'
  alias: Turn off Salon Tv when no one is in front of it for 20 minutes
  description: When salon radar zone 2 (in front of the TV) has been empty for 20
    minutes and the salon TV (Universal salon chromecast) is not playing, turns off
    the salon Sony TV through its remote. Batocera left on HDMI 1 with no controller
    connected counts as not playing.
  triggers:
  - alias: Salon radar zone 2 empty for 20 min
    trigger: state
    entity_id:
    - binary_sensor.salon_radar_occupancy_zone_2_occupancy
    to:
    - 'off'
    for:
      hours: 0
      minutes: 20
      seconds: 0
  conditions:
  - alias: Salon TV is not playing (Batocera with no controller counts as not playing)
    condition: media_player.is_not_playing
    target:
      entity_id: media_player.universal_salon_chromecast
  actions:
  - alias: Turn off the salon Sony TV
    action: remote.turn_off
    metadata: {}
    target:
      entity_id: remote.bravia_4k_ae2
    data: {}
  mode: single
- id: '1781971761795'
  alias: Set Salon TV to Retro gaming station when a paired controller turns on
  description: When the paired Batocera game controller turns on and the salon Chromecast
    is not playing, starts a retro gaming session, which turns on the salon TV and
    switches it to the retro console input (HDMI 1).
  triggers:
  - alias: Batocera controller turns on
    trigger: state
    entity_id:
    - binary_sensor.batocera_controller
    from:
    - 'off'
    to:
    - 'on'
  conditions:
  - alias: Salon Chromecast is not playing
    condition: not
    conditions:
    - alias: Salon Chromecast is playing
      condition: state
      entity_id: media_player.universal_salon_chromecast
      state:
      - playing
  actions:
  - alias: Start a retro gaming session
    action: script.start_retro_gaming_session
    metadata: {}
    data: {}
  mode: single
- id: '1782512393787'
  alias: Alert house-wide when water leakage is detected in the kitchen
  description: 'When the kitchen water sensor detects a leak, repeats every 4 minutes
    while it stays wet: broadcasts a house alert (white lights and a spoken leak warning)
    and sends Maxi a high-priority phone notification about the kitchen leak.'
  triggers:
  - alias: Kitchen water sensor detects a leak
    trigger: state
    entity_id:
    - binary_sensor.kitchen_water_sensor
    from:
    - 'off'
    to:
    - 'on'
  conditions: []
  actions:
  - alias: Repeat while the leak persists
    repeat:
      while:
      - alias: Kitchen water sensor is wet
        condition: state
        entity_id: binary_sensor.kitchen_water_sensor
        state:
        - 'on'
      sequence:
      - alias: Broadcast the kitchen leak alert
        action: script.broadcast_alert_in_the_house
        data:
          color: white
          message: Attention, water leakage detected in the kitchen, Please investigate.
      - alias: Notify Maxi of the kitchen leak
        metadata: {}
        data:
          title: A leak has been detected in the kitchen! Investigate!
          data:
            image: /api/camera_proxy/camera.kiosk_kitchen_tablet_camera
            ttl: 0
            priority: high
            channel: security_alerts_notifications
          message: Water leakage detected in the kitchen
        action: notify.maxi_notification_group
      - alias: Wait 4 minutes
        delay:
          hours: 0
          minutes: 4
          seconds: 0
          milliseconds: 0
  mode: single
- id: '1782525331182'
  alias: Turn patio lights to dim colors when projector goes on
  description: When the patio projector light has been on for 3 seconds or its color
    or color temperature changes, copies the projector's RGB color to the patio lights
    over 2 seconds. During a neon UV party it instead sets the patio lights, server
    lights and projector to full blue.
  triggers:
  - alias: Projector light on for 3 s
    trigger: state
    entity_id:
    - light.patio_projector_light
    from:
    - 'off'
    to:
    - 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 3
  - alias: Projector color changes (1 s)
    trigger: state
    entity_id:
    - light.patio_projector_light
    for:
      hours: 0
      minutes: 0
      seconds: 1
    attribute: rgb_color
  - alias: Projector color temperature changes (1 s)
    trigger: state
    entity_id:
    - light.patio_projector_light
    for:
      hours: 0
      minutes: 0
      seconds: 1
    attribute: color_temp_kelvin
  conditions: []
  actions:
  - alias: Pick colors by UV party
    choose:
    - alias: Neon UV party → everything blue
      conditions:
      - alias: Neon UV party is on
        condition: switch.is_on
        target:
          entity_id: input_boolean.neon_uv_party
        options:
          behavior: any
          for: 00:00:00
      sequence:
      - alias: Set patio, server and projector to blue
        action: light.turn_on
        metadata: {}
        target:
          entity_id:
          - light.group_patio_lights
          - light.group_server_lights
          - light.patio_projector_light
        data:
          brightness_pct: 100
          rgb_color:
          - 0
          - 0
          - 255
    default:
    - alias: 'Otherwise: copy projector color to patio'
      action: light.turn_on
      metadata: {}
      target:
        entity_id: light.group_patio_lights
      data:
        rgb_color: '{{ state_attr(''light.patio_projector_light'', ''rgb_color'')
          }}'
        transition: 2
  mode: restart
- id: '1782525664476'
  alias: Restore patio lights when projector turns off
  description: 'When the patio projector light has been off for 2 seconds, recolors
    the patio lights that are on by house mode: random pastel colors in party mode,
    warm pale colors during a kink party and fully saturated random colors during
    Acid Time. Otherwise it re-applies Adaptive Lighting to them with a 1-second transition.'
  triggers:
  - alias: Projector light off for 2 s
    trigger: state
    entity_id:
    - light.patio_projector_light
    from:
    - 'on'
    to:
    - 'off'
    for:
      hours: 0
      minutes: 0
      seconds: 2
  conditions: []
  actions:
  - alias: Recolor patio lights by house mode
    choose:
    - conditions:
      - alias: Party mode is on
        condition: or
        conditions:
        - alias: Party mode is on
          condition: state
          entity_id: input_boolean.party_mode
          state: 'on'
      sequence:
      - alias: Pastel colors on lit patio lights
        action: script.change_received_lights_to_random_pastel_colors
        metadata: {}
        data:
          light: light.group_patio_lights
          only_on: true
      alias: Pastel on party mode on
    - conditions:
      - alias: Kink party is on
        condition: or
        conditions:
        - alias: Kink party is on
          condition: state
          entity_id: input_boolean.kink_party
          state: 'on'
      sequence:
      - alias: Warm pale colors on lit patio lights
        action: script.change_received_lights_to_warm_pale_colors
        metadata: {}
        data:
          light: light.group_patio_lights
          only_on: true
      alias: Warm pale on kink party on
    - conditions:
      - alias: Acid Time is on
        condition: or
        conditions:
        - alias: Acid Time is on
          condition: state
          entity_id: input_boolean.acid_time
          state: 'on'
      sequence:
      - alias: Random colors on lit patio lights
        action: script.change_received_lights_to_random_colors
        metadata: {}
        data:
