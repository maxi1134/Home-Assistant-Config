    action: cast.show_lovelace_view
    metadata: {}
    data:
      entity_id: media_player.kitchen_google_hub
      dashboard_path: lovelace-hub
      view_path: kitchen-google-hub
    enabled: true
  - alias: Load the hub dashboard via DashCast
    action: dash_cast.load_url
    metadata: {}
    data:
      entity_id: media_player.kitchen_google_hub
      url: http://192.168.0.15:8099/lovelace-hub/kitchen-google-hub?kiosk
      force: false
    enabled: false
  - alias: Set kitchen hub volume to 0
    action: media_player.volume_set
    metadata: {}
    data:
      volume_level: 0
    target:
      entity_id: media_player.kitchen_google_hub
