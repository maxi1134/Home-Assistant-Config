- id: '1714321256821'
  alias: Mute speakers in the room if maxi uses a microphone
  description: While music following is on and Maxi is talking into a microphone,
    mutes the playing speakers in Maxi's current room. When Maxi changes rooms during
    the call, it mutes the new room and unmutes the previous one.
  triggers:
  - alias: Maxi starts talking
    entity_id:
    - binary_sensor.maxi_is_talking
    to: 'on'
    trigger: state
    from: 'off'
  - alias: Maxi's location changes
    trigger: state
    entity_id:
    - sensor.maxi_location_by_petro_v2
    to:
  conditions:
  - alias: Music following is on
    condition: state
    entity_id: input_boolean.following_music
    state: 'on'
  - alias: Maxi is talking
    condition: state
    entity_id: binary_sensor.maxi_is_talking
    state: 'on'
  actions:
  - alias: Find playing speakers in current and previous room
    variables:
      current_playing_speakers: '{{ [area_id(states(''sensor.maxi_location_by_petro_v2''))]   |
        map(''area_entities'') | sum(start=[]) |    select(''search'', ''speaker'')
        | select(''is_state'',''playing'') | unique | list }}

        '
      previous_room_playing_speaker: '{% if trigger.from_state.state != trigger.to_state.state
        %}  {{ [area_id(trigger.from_state.state)]   | map(''area_entities'') | sum(start=[])
        |    select(''search'', ''speaker'') | select(''is_state'',''playing'') |
        unique | list }}  {% endif %}

        '
  - metadata: {}
    data:
      is_volume_muted: true
    target:
      entity_id: '{{current_playing_speakers}}

        '
    action: media_player.volume_mute
    alias: Mute current Room
  - alias: 'Always: unmute the previous room'
    if: []
    then:
    - metadata: {}
      data:
        is_volume_muted: false
      target:
        entity_id: '{{previous_room_playing_speaker}}

          '
      action: media_player.volume_mute
      alias: Unmute Previous Room
  mode: parallel
  max: 10
