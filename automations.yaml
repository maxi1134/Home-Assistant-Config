- id: merged_speaker_chromecast_mute
  alias: Speaker/Chromecast Mutual Mute Management
  description: 'While music following is on, keeps only one audio source audible in
    each room when a Music Assistant speaker and a TV are both active, with the newest
    one winning: a TV that starts playing or is unmuted mutes the room''s playing
    speakers, and a speaker that starts playing or is unmuted mutes the room''s TVs
    (the salon TV only while it is on). When one source stops, goes idle or off, or
    is muted, the other is unmuted again, but only if the room has motion and no sleeper
    and, for play/idle/off changes, the previous state lasted over 10 minutes. Runs
    are queued, and each mute or unmute waits up to 4 s for the device to report it,
    so the next run decides from the real state. In parallel mode, a TV and a speaker
    changing mute together kept flipping each other every second (salon, 2026-10-25).
    A room includes its _top/_down sibling areas, so the hotbox_top TV pairs with
    the Hotbox WiiM in hotbox.'
  triggers:
  - alias: Chromecasts → playing
    trigger: state
    id: cc_to_playing
    to: playing
    entity_id:
    - media_player.universal_workshop_chromecast
    - media_player.universal_hotbox_top_chromecast
    - media_player.universal_patio_chromecast
    - media_player.universal_salon_chromecast
    - media_player.universal_bedroom_chromecast
    - media_player.universal_kitchen_chromecast
    - media_player.universal_tablet_myriam_s8
  - alias: Chromecasts from off
    trigger: state
    id: cc_from_off
    from: 'off'
    entity_id:
    - media_player.universal_workshop_chromecast
    - media_player.universal_hotbox_top_chromecast
    - media_player.universal_patio_chromecast
    - media_player.universal_salon_chromecast
    - media_player.universal_bedroom_chromecast
  - alias: Chromecasts → idle
    trigger: state
    id: cc_to_idle
    to: idle
    entity_id:
    - media_player.universal_workshop_chromecast
    - media_player.universal_hotbox_top_chromecast
    - media_player.universal_patio_chromecast
    - media_player.universal_salon_chromecast
    - media_player.universal_bedroom_chromecast
  - alias: Chromecasts from playing (1 s)
    trigger: state
    id: cc_from_playing
    from:
    - playing
    for:
      hours: 0
      minutes: 0
      seconds: 1
    entity_id:
    - media_player.universal_workshop_chromecast
    - media_player.universal_hotbox_top_chromecast
    - media_player.universal_patio_chromecast
    - media_player.universal_salon_chromecast
    - media_player.universal_bedroom_chromecast
    - media_player.universal_kitchen_chromecast
    - media_player.universal_tablet_myriam_s8
  - alias: Chromecast mute status
    trigger: state
    id: cc_mute_status
    attribute: is_volume_muted
    entity_id:
    - media_player.universal_workshop_chromecast
    - media_player.universal_hotbox_top_chromecast
    - media_player.universal_patio_chromecast
    - media_player.universal_salon_chromecast
    - media_player.universal_bedroom_chromecast
    - media_player.universal_kitchen_chromecast
    for:
      hours: 0
      minutes: 0
      seconds: 1
  - alias: Speakers → playing (1 s)
    trigger: state
    id: spk_to_playing
    to:
    - playing
    for:
      hours: 0
      minutes: 0
      seconds: 1
    entity_id:
    - media_player.mass_workshop_wiim_speaker
    - media_player.mass_salon_wiim_speaker
    - media_player.mass_bedroom_vpe_speaker
    - media_player.mass_kitchen_wiim_speaker
    - media_player.mass_closet_vpe_speaker
    - media_player.mass_hallway_wiim_speaker
    - media_player.mass_lounge_wiim_speaker
    - media_player.mass_hotbox_wiim_speaker
  - alias: Speakers from playing (1 s)
    trigger: state
    id: spk_from_playing
    from:
    - playing
    for:
      hours: 0
      minutes: 0
      seconds: 1
    entity_id:
    - media_player.mass_workshop_wiim_speaker
    - media_player.mass_salon_wiim_speaker
    - media_player.mass_bedroom_vpe_speaker
    - media_player.mass_kitchen_wiim_speaker
    - media_player.mass_closet_vpe_speaker
    - media_player.mass_hallway_wiim_speaker
    - media_player.mass_lounge_wiim_speaker
    - media_player.mass_hotbox_wiim_speaker
  - alias: Speakers mute status (1 s)
    trigger: state
    id: spk_mute_status
    attribute: is_volume_muted
    for:
      seconds: 1
    entity_id:
    - media_player.mass_workshop_wiim_speaker
    - media_player.mass_salon_wiim_speaker
    - media_player.mass_bedroom_vpe_speaker
    - media_player.mass_kitchen_wiim_speaker
    - media_player.mass_closet_vpe_speaker
    - media_player.mass_hallway_wiim_speaker
    - media_player.mass_lounge_wiim_speaker
    - media_player.mass_hotbox_wiim_speaker
  - alias: Salon Chromecast → off
    trigger: state
    id: cc_to_off
    from:
    - playing
    - idle
    to: 'off'
    for:
      seconds: 1
    entity_id:
    - media_player.universal_salon_chromecast
  conditions:
  - alias: Trigger's new state is not unavailable
    condition: template
    value_template: '{{ trigger.to_state.state != ''unavailable'' }}'
  - alias: Following music is on
    condition: state
    entity_id: input_boolean.following_music
    state:
    - 'on'
  actions:
  - alias: Room = the trigger's area plus its _top/_down siblings (hotbox, hotbox_top,
      hotbox_down)
    variables:
      rooms: '{% set base = area_id(trigger.entity_id) | replace(''_top'', '''') |
        replace(''_down'', '''') %}{{ [base, base ~ ''_top'', base ~ ''_down''] |
        select(''in'', areas()) | list }}'
  - alias: If a chromecast started playing or was unmuted
    if:
    - alias: Trigger is cc_to_playing, or chromecast unmuted
      condition: template
      value_template: "{{ trigger.id == 'cc_to_playing'\n   or (trigger.id == 'cc_mute_status'\n
        \      and trigger.to_state.attributes.is_volume_muted == false) }}\n"
    then:
    - alias: Compute room's unmuted playing speakers and unmuted active chromecasts
      variables:
        speakers_to_mute: "{{ rooms\n  | map('area_entities')\n  | sum(start=[])\n
          \ | select('search', 'speaker')\n  | select('is_state', 'playing')\n  |
          expand\n  | selectattr('attributes.is_volume_muted', 'eq', false)\n  | map(attribute='entity_id')\n
          \ | unique\n  | list }}\n"
        unmuted_player_chromecasts: "{{ rooms\n  | map('area_entities')\n  | sum(start=[])\n
          \ | select('search', 'chromecast')\n  | select('search', 'universal')\n
          \ | expand\n  | rejectattr('state', 'eq', 'off')\n  | rejectattr('state',
          'eq', 'unavailable')\n  | selectattr('attributes.is_volume_muted', 'eq',
          false)\n  | map(attribute='entity_id')\n  | unique\n  | list }}\n"
    - alias: If an unmuted chromecast and an unmuted playing speaker coexist
      if:
      - alias: Both lists non-empty
        condition: template
        value_template: '{{ unmuted_player_chromecasts != [] and speakers_to_mute
          != [] }}'
      then:
      - alias: Mute the room's playing speakers
        action: media_player.volume_mute
        data:
          is_volume_muted: true
        target:
          entity_id: '{{ speakers_to_mute | list }}'
      - alias: Wait until the speakers report muted (4 s)
        wait_template: '{{ speakers_to_mute | select(''is_state_attr'', ''is_volume_muted'',
          true) | list | count == speakers_to_mute | count }}'
        timeout:
          seconds: 4
        continue_on_timeout: true
  - alias: If a speaker started playing or was unmuted
    if:
    - alias: Trigger is spk_to_playing, or speaker unmuted
      condition: template
      value_template: "{{ trigger.id == 'spk_to_playing'\n   or (trigger.id == 'spk_mute_status'\n
        \      and trigger.to_state.attributes.is_volume_muted == false) }}\n"
    then:
    - alias: Compute room's unmuted playing speakers and unmuted active chromecasts
      variables:
        unmuted_playing_speakers: "{{ rooms\n  | map('area_entities')\n  | sum(start=[])\n
          \ | select('search', 'speaker')\n  | select('is_state', 'playing')\n  |
          expand\n  | selectattr('attributes.is_volume_muted', 'eq', false)\n  | map(attribute='entity_id')\n
          \ | unique\n  | list }}\n"
        chromecasts_to_mute: "{{ rooms\n  | map('area_entities')\n  | sum(start=[])\n
          \ | select('search', 'chromecast')\n  | select('search', 'universal')\n
          \ | expand\n  | rejectattr('state', 'eq', 'off')\n  | rejectattr('state',
          'eq', 'unavailable')\n  | selectattr('attributes.is_volume_muted', 'eq',
          false)\n  | map(attribute='entity_id')\n  | unique\n  | list }}\n"
    - alias: If both coexist and the salon TV guard passes
      if:
      - alias: Both lists non-empty
        condition: template
        value_template: '{{ unmuted_playing_speakers != [] and chromecasts_to_mute
          != [] }}'
      - alias: Salon TV - only mute when the TV is on (RS-232 commands fail in standby)
        condition: or
        conditions:
        - alias: Salon chromecast not among chromecasts to mute
          condition: template
          value_template: '{{ ''media_player.universal_salon_chromecast'' not in chromecasts_to_mute
            }}'
        - alias: Salon Sony TV is on
          condition: state
          entity_id: media_player.bravia_4k_ae2
          state: 'on'
      then:
      - alias: Mute the room's active chromecasts
        action: media_player.volume_mute
        data:
          is_volume_muted: true
        target:
          entity_id: '{{ chromecasts_to_mute | list }}'
      - alias: Wait until the chromecasts report muted (4 s)
        wait_template: '{{ chromecasts_to_mute | select(''is_state_attr'', ''is_volume_muted'',
          true) | list | count == chromecasts_to_mute | count }}'
        timeout:
          seconds: 4
        continue_on_timeout: true
  - alias: If chromecast became active or speaker stopped/muted, room awake and occupied
    if:
    - alias: Trigger is cc_from_off/spk_from_playing/cc_to_playing/cc_to_idle, or
        speaker muted
      condition: template
      value_template: "{{ trigger.id in ['cc_from_off', 'spk_from_playing', 'cc_to_playing',\n
        \                 'cc_to_idle']\n   or (trigger.id == 'spk_mute_status'\n
        \      and trigger.to_state.attributes.is_volume_muted == true) }}\n"
    - alias: 10-min anti-flap gate (cc_to_playing / cc_to_idle / cc_from_off)
      condition: template
      value_template: "{% if trigger.id in ['cc_to_playing', 'cc_to_idle', 'cc_from_off']
        %}\n  {{ trigger.from_state is not none\n     and (now() - trigger.from_state.last_changed)
        > timedelta(minutes=10) }}\n{% elif trigger.id == 'spk_from_playing' %}\n
        \ {{ trigger.to_state.state != 'unavailable' }}\n{% else %}\n  true\n{% endif
        %}\n"
      enabled: true
    - alias: No sleeper present
      condition: template
      value_template: "{{ area_id(trigger.entity_id)\n   | replace('_top','') | replace('_down','')\n
        \  | lower not in states('sensor.active_sleeper_rooms') | string | lower }}\n"
    - alias: Motion present
      condition: template
      value_template: "{{ area_id(trigger.entity_id)\n   | replace('_top','') | replace('_down','')\n
        \  | lower in states('sensor.active_motion_rooms') | string | lower }}\n"
    then:
    - alias: Compute room's unmuted playing MA speakers and muted active chromecasts
      variables:
        unmuted_playing_speakers: "{{ rooms\n  | map('area_entities')\n  | sum(start=[])\n
          \ | select('search', 'speaker')\n  | select('search', 'mass')\n  | select('is_state',
          'playing')\n  | expand\n  | selectattr('attributes.is_volume_muted', 'eq',
          false)\n  | map(attribute='entity_id')\n  | unique\n  | list }}\n"
        playing_chromecasts: "{{ rooms\n  | map('area_entities')\n  | sum(start=[])\n
          \ | select('search', 'chromecast')\n  | select('search', 'universal')\n
          \ | select('is_state', ['playing', 'idle'])\n  | unique\n  | list }}\n"
        chromecasts_to_unmute: "{{ rooms\n  | map('area_entities')\n  | sum(start=[])\n
          \ | select('search', 'chromecast')\n  | select('search', 'universal')\n
          \ | select('is_state', ['playing', 'idle'])\n  | expand\n  | selectattr('attributes.is_volume_muted',
          'eq', true)\n  | map(attribute='entity_id')\n  | unique\n  | list }}\n"
    - alias: If no speaker is audibly playing in the room
      if:
      - alias: No unmuted playing speakers in the room
        condition: template
        value_template: '{{ unmuted_playing_speakers == [] }}'
      then:
      - alias: If there are muted active chromecasts
        if:
        - alias: Muted active chromecasts list not empty
          condition: template
          value_template: '{{ chromecasts_to_unmute != [] }}'
        then:
        - alias: Unmute the room's chromecasts
          action: media_player.volume_mute
          data:
            is_volume_muted: false
          target:
            entity_id: '{{ chromecasts_to_unmute | list }}'
        - alias: Wait until the chromecasts report unmuted (4 s)
          wait_template: '{{ chromecasts_to_unmute | select(''is_state_attr'', ''is_volume_muted'',
            false) | list | count == chromecasts_to_unmute | count }}'
          timeout:
            seconds: 4
          continue_on_timeout: true
  - alias: If chromecast stopped/off/muted or speaker started, room awake and occupied
    if:
    - alias: Trigger is cc_from_playing/cc_to_off/spk_to_playing, or chromecast muted
      condition: template
      value_template: "{{ trigger.id in ['cc_from_playing', 'cc_to_off', 'spk_to_playing']\n
        \  or (trigger.id == 'cc_mute_status'\n       and trigger.to_state.attributes.is_volume_muted
        == true) }}\n"
    - alias: 10-min anti-flap gate (spk_to_playing / cc_from_playing)
      condition: template
      value_template: "{% if trigger.id in ['spk_to_playing', 'cc_from_playing'] %}\n
        \ {{ trigger.from_state is not none\n     and (now() - trigger.from_state.last_changed)
        > timedelta(minutes=10) }}\n{% else %}\n  true\n{% endif %}\n"
      enabled: true
    - alias: No sleeper present
      condition: template
      value_template: "{{ area_id(trigger.entity_id)\n   | replace('_top','') | replace('_down','')\n
        \  | lower not in states('sensor.active_sleeper_rooms') | string | lower }}\n"
    - alias: Motion present
      condition: template
      value_template: "{{ area_id(trigger.entity_id)\n   | replace('_top','') | replace('_down','')\n
        \  | lower in states('sensor.active_motion_rooms') | string | lower }}\n"
    then:
    - alias: Compute room's muted playing MA speakers and unmuted active chromecasts
      variables:
        speakers_to_unmute: "{{ rooms\n  | map('area_entities')\n  | sum(start=[])\n
          \ | select('search', 'speaker')\n  | select('search', 'mass')\n  | select('is_state',
          'playing')\n  | expand\n  | selectattr('attributes.is_volume_muted', 'eq',
          true)\n  | map(attribute='entity_id')\n  | unique\n  | list }}\n"
        unmuted_player_chromecasts: "{{ rooms\n  | map('area_entities')\n  | sum(start=[])\n
          \ | select('search', 'chromecast')\n  | select('search', 'universal')\n
          \ | select('is_state', ['playing', 'idle'])\n  | expand\n  | selectattr('attributes.is_volume_muted',
          'eq', false)\n  | map(attribute='entity_id')\n  | unique\n  | list }}\n"
    - alias: If no chromecast is audibly active and a muted speaker is playing
      if:
      - alias: No unmuted chromecasts and muted playing speakers exist
        condition: template
        value_template: '{{ unmuted_player_chromecasts == [] and speakers_to_unmute
          != [] }}'
      then:
      - alias: Unmute the room's playing speakers
        action: media_player.volume_mute
        data:
          is_volume_muted: false
        target:
          entity_id: '{{ speakers_to_unmute | list }}'
      - alias: Wait until the speakers report unmuted (4 s)
        wait_template: '{{ speakers_to_unmute | select(''is_state_attr'', ''is_volume_muted'',
          false) | list | count == speakers_to_unmute | count }}'
        timeout:
          seconds: 4
        continue_on_timeout: true
  mode: queued
  max: 30
- id: '1773975525008'
  alias: Lounge Nanoleaf actions control automation
  description: When someone swipes in any direction on the lounge Nanoleaf panel,
    applies a random effect from its effect list, different from the current one.
  triggers:
  - alias: 'Lounge Nanoleaf touch gesture: swipe up/down/left/right'
    trigger: event.received
    target:
      entity_id:
      - event.kitchen_nanoleaf_light_touch_gesture
    options:
      event_type:
      - swipe_up
      - swipe_down
      - swipe_left
      - swipe_right
  conditions: []
  actions:
  - alias: Apply a random different effect to the lounge Nanoleaf
    action: script.apply_random_existing_effect_to_a_light_entity
    metadata: {}
    data:
      light:
      - light.lounge_nanoleaf_light
  mode: single
- id: '1774297006546'
  alias: ' Trippy Light Random Colors Effect automation (Script call)'
  description: While the trippy lights toggle is on (and the warm variant is off),
    keeps giving every lit color light of the all-lights group a new random color
    at the configured saturation and fade speed, holding each round for twice the
    fade time. When the toggle turns off it re-applies Adaptive Lighting to those
    lights; changing the speed restarts the loop.
  triggers:
  - alias: Trippy lights effect toggle changes
    trigger: state
    entity_id:
    - input_boolean.trippy_lights_effect
    from:
    - 'off'
    - 'on'
  - alias: Trippy lights effect speed changed, stable for 2 s
    trigger: state
    entity_id:
    - input_number.trippy_lights_effect_speed
    for:
      hours: 0
      minutes: 0
      seconds: 2
  conditions:
  - alias: Trippy lights effect is on
    condition: state
    entity_id: input_boolean.trippy_lights_effect
    state:
    - 'on'
  - alias: Trippy warm colors effect is off
    condition: state
    entity_id: input_boolean.trippy_warm_colors_effect
    state:
    - 'off'
  actions:
  - alias: Trippy Lights Effect Sequence
    sequence:
    - alias: 'Repeat while trippy effect on: randomize colors, then hold'
      repeat:
        while:
        - alias: Trippy lights effect is on
          condition: state
          entity_id: input_boolean.trippy_lights_effect
          state:
          - 'on'
        sequence:
        - alias: List lit color-mode lights with transition support
          variables:
            lights: '{{ integration_entities(''group'')| select(''search'', ''light.group_all_lights'')   |
              expand | selectattr("attributes.hs_color", "defined") | selectattr("attributes.supported_features",
              ">", 33)| rejectattr("attributes.color_mode", "eq", ''color_temp'')
              | selectattr("state", "eq", "on") | map(attribute=''entity_id'')  |
              list }}

              '
        - alias: Set those lights to random hues at set saturation and fade speed
          action: script.change_received_lights_to_random_colors
          metadata: {}
          data:
            light: '{{ lights }}'
            saturation: '{{ states(''input_number.trippy_lights_color_saturation'')
              }}'
            transition_speed: '{{ states(''input_number.trippy_lights_effect_speed'')
              }}'
        - alias: Hold the new colors as long as the fade took
          delay:
            seconds: '{{ (states(''input_number.trippy_lights_effect_speed'') | float(4))
              * 2 }}'
  - alias: Continue only if trippy warm colors effect is off
    condition: state
    state:
    - 'off'
    entity_id: input_boolean.trippy_warm_colors_effect
  - alias: Restore Lights Sequence
    sequence:
    - alias: List lit color-mode lights with transition support
      variables:
        lights: '{{ integration_entities(''group'')| select(''search'', ''light.group_all_lights'')   |
          expand | selectattr("attributes.hs_color", "defined") | selectattr("attributes.supported_features",
          ">", 33)| rejectattr("attributes.color_mode", "eq", ''color_temp'') | selectattr("state",
          "eq", "on") | map(attribute=''entity_id'')  | list }}

          '
    - alias: Re-apply adaptive lighting to those lights over 3 s
      action: adaptive_lighting.apply
      metadata: {}
      data:
        lights: '{{ lights }}

          '
        transition: '3'
        adapt_brightness: true
        adapt_color: true
        turn_on_lights: true
  mode: restart
