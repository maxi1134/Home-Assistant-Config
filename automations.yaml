- id: '1756568623181'
  alias: Dial Lounge Tree Automation New
  description: Handles an IKEA SYMFONISK dial near the lounge tree, providing volume,
    play/pause, next track, and stop controls for the lounge WiiM speaker.
  use_blueprint:
    path: EPMatt/ikea_e1744.yaml
    input:
      integration: ZHA
      controller_device: 8ad87a4264381c039e71ebf8ded05895
      helper_last_controller_event: input_text.dial_lounge_desk_helper
      action_rotate_left: []
      action_rotate_left_stop:
      - sequence:
        - alias: Only while the speaker is on
          if:
          - alias: Speaker is not off or unavailable
            condition: not
            conditions:
            - condition: state
              entity_id: media_player.mass_lounge_wiim_speaker
              state:
              - 'off'
              - unavailable
              - unknown
          then:
          - action: media_player.volume_set
            data:
              volume_level: '{{ [(state_attr(''media_player.mass_lounge_wiim_speaker'',
                ''volume_level'') | float(0)) - 0.09, 0] | max }}'
            target:
              entity_id: media_player.mass_lounge_wiim_speaker
          note: An off speaker reports no volume, so this step used to compute from
            0 and set it to 6% (turn right) or 0% (turn left). The turn is ignored
            while the speaker is off.
        - delay:
            hours: 0
            minutes: 0
            seconds: 0
            milliseconds: 150
      rotate_right_loop: true
      rotate_left_loop: true
      rotate_left_max_loop_repeats: 60
      rotate_right_max_loop_repeats: 60
      action_rotate_right:
      - sequence:
        - alias: Only while the speaker is on
          if:
          - alias: Speaker is not off or unavailable
            condition: not
            conditions:
            - condition: state
              entity_id: media_player.mass_lounge_wiim_speaker
              state:
              - 'off'
              - unavailable
              - unknown
          then:
          - action: media_player.volume_set
            data:
              volume_level: '{{ [(state_attr(''media_player.mass_lounge_wiim_speaker'',
                ''volume_level'') | float(0)) + 0.06, 1] | min | round(2) }}'
            target:
              entity_id: media_player.mass_lounge_wiim_speaker
          note: An off speaker reports no volume, so this step used to compute from
            0 and set it to 6% (turn right) or 0% (turn left). The turn is ignored
            while the speaker is off.
        - delay:
            hours: 0
            minutes: 0
            seconds: 0
            milliseconds: 150
      helper_debounce_delay: 0
      action_click_triple:
      - action: media_player.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: media_player.mass_lounge_wiim_speaker
      action_click_double:
      - action: media_player.media_next_track
        metadata: {}
        data: {}
        target:
          entity_id: media_player.mass_lounge_wiim_speaker
      action_click_short:
      - action: media_player.media_play_pause
        metadata: {}
        data: {}
        target:
          entity_id: media_player.mass_lounge_wiim_speaker
- id: '1757350225543'
