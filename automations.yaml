- id: '1748845278340'
  alias: execute Sleep actions when "sleeper in bedroom" is turned on
  description: When someone goes to sleep in the bedroom, closes the bedroom blinds,
    turns off the bedroom tablet, lights and assistant LED ring, asks Google Assistant
    to power off the bedroom TV, and starts the thunderstorm sound on the bedroom
    speaker at 40% (unless it is already playing, house sitting is on or the voice
    speaker is busy). It also turns off the workshop TV and lights, the hallway lights
    and the entrance lights in whichever of those rooms is empty.
  triggers:
  - alias: Bedroom sleeper on for 3 s
    entity_id:
    - input_boolean.sleeper_in_bedroom
    to:
    - 'on'
    from:
    - 'off'
    trigger: state
    for:
      hours: 0
      minutes: 0
      seconds: 3
  conditions: []
  actions:
  - alias: Run bedtime actions in parallel
    parallel:
    - alias: Close the bedroom blinds
      action: cover.close_cover
      metadata: {}
      target:
        entity_id: cover.cover_bedroom_blinds
      data: {}
    - alias: Turn off bedroom tablet screen and motion
      action: homeassistant.turn_off
      metadata: {}
      data: {}
      target:
        entity_id:
        - light.kiosk_bedroom_tablet_screen
        - switch.kiosk_bedroom_tablet_screensaver_motion_detection
    - alias: Fade out bedroom lights over 10 s
      action: light.turn_off
      metadata: {}
      data:
        transition: 10
      target:
        area_id: bedroom
    - alias: Turn off the voice assistant LED ring
      action: light.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: light.home_assistant_voice_09e4a7_led_ring
    - alias: If the thunderstorm should start
      if:
      - alias: Thunderstorm not already playing
        condition: or
        conditions:
        - alias: Bedroom speaker not showing the thunderstorm
          condition: template
          value_template: '{{ ''thunderstorm'' not in (state_attr(''media_player.mass_bedroom_vpe_speaker'',''media_title'')
            | default('''', true)) }}

            '
        - alias: Bedroom speaker is not playing
          condition: not
          conditions:
          - alias: Bedroom speaker is playing
            condition: state
            entity_id: media_player.mass_bedroom_vpe_speaker
            state:
            - playing
      - alias: House sitting mode is off
        condition: state
        entity_id: input_boolean.house_sitting_mode
        state:
        - 'off'
      - alias: Voice speaker is not playing
        condition: not
        conditions:
        - alias: Voice speaker is playing
          condition: state
          entity_id: media_player.esphome_bedroom_vpe_speaker
          state:
          - playing
      then:
      - alias: Unjoin the bedroom speaker from groups
        action: media_player.unjoin
        metadata: {}
        data: {}
        target:
          entity_id: media_player.mass_bedroom_vpe_speaker
        continue_on_error: true
      - alias: Wait 1 second
        delay:
          hours: 0
          minutes: 0
          seconds: 1
          milliseconds: 0
      - alias: Set bedroom speaker volume to 36%
        action: media_player.volume_set
        metadata: {}
        data:
          volume_level: 0.36
        target:
          entity_id: media_player.mass_bedroom_vpe_speaker
      - alias: Play the thunderstorm sound
        data:
          media:
            media_content_id: http://192.168.0.15:8123/local/sounds/thunderstorm.mp3/
            media_content_type: audio
            metadata: {}
        target:
          entity_id: media_player.mass_bedroom_vpe_speaker
        action: media_player.play_media
      - alias: Mute the bedroom speaker
        metadata: {}
        data:
          is_volume_muted: true
        action: media_player.volume_mute
        target:
          entity_id: media_player.mass_bedroom_vpe_speaker
      - alias: Set bedroom speaker volume to 40%
        action: media_player.volume_set
        metadata: {}
        data:
          volume_level: 0.4
        target:
          entity_id: media_player.mass_bedroom_vpe_speaker
      - alias: Wait 5 seconds
        delay:
          hours: 0
          minutes: 0
          seconds: 5
          milliseconds: 0
      - alias: Unmute the bedroom speaker
        metadata: {}
        data:
          is_volume_muted: false
        target:
          entity_id: media_player.mass_bedroom_vpe_speaker
        action: media_player.volume_mute
    - alias: Ask Google Assistant to power off bedroom TV
      action: google_assistant_sdk.send_text_command
      metadata: {}
      data:
        command: Power off bedroom TV
    - alias: If the workshop is empty
      if:
      - alias: Workshop has no occupancy
        condition: state
        entity_id: binary_sensor.group_workshop_motion_occupancy
        state:
        - 'off'
      then:
      - alias: Turn off the workshop Google TV
        action: remote.turn_off
        metadata: {}
        target:
          entity_id: remote.salon_google_tv_2
        data: {}
      - alias: Turn off the workshop lights
        action: light.turn_off
        metadata: {}
        target:
          area_id: workshop
          entity_id: light.group_workshop_lights
        data: {}
    - alias: If the hallway is empty
      if:
      - alias: Hallway radar sees nobody
        condition: state
        entity_id: binary_sensor.hallway_radar_occupancy_occupancy
        state:
        - 'off'
      then:
      - alias: Turn off the hallway lights
        action: light.turn_off
        metadata: {}
        target:
          entity_id: light.group_hallway_lights
          area_id: hallway
        data: {}
    - alias: If the entrance is empty
      if:
      - alias: Entrance has no occupancy
        condition: state
        entity_id: binary_sensor.group_entrance_motion_occupancy
        state:
        - 'off'
      then:
      - alias: Turn off the entrance lights
        action: light.turn_off
        metadata: {}
        target:
          entity_id: light.group_entrance_lights
          area_id: entrance
        data: {}
  mode: single
