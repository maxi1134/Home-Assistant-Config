  - alias: Read the bedroom light brightness
    variables:
      brightness: '{{ trigger.to_state.attributes.brightness | default(''0'', true)  }}

        '
  - alias: Set the bedroom tablet screen brightness
    if:
    - condition: state
      entity_id: light.kiosk_bedroom_tablet_screen
      state: 'on'
    then:
    - action: light.turn_on
      target:
        entity_id: light.kiosk_bedroom_tablet_screen
      data:
        brightness: '{{ [ (brightness) | int(0), 1 ] | max }}'
  mode: restart
- id: '1763775560173'
  alias: Workshop Desk Hue Dial automation
  description: 'Maps the workshop table Hue dial to the workshop lights: button 1
    toggles them (a long press toggles at 100%, 4922 K), button 2 sets 100% at 5238
    K, button 3 gives each light a random color and button 4 dims to 1%. Turning the
    dial raises brightness by 10% or lowers it by 15%; at full brightness, turning
    up lowers color saturation instead.'
  triggers:
  - alias: Dial turned up
    device_id: d9ffda94d5b5c9729c483a025268f6c8
    domain: zha
    type: remote_button_short_press
    subtype: dim_up
    trigger: device
    id: brightness_step_up
  - alias: Dial turned down
    device_id: d9ffda94d5b5c9729c483a025268f6c8
    domain: zha
    type: remote_button_short_press
    subtype: dim_down
    trigger: device
    id: brightness_step_down
  - alias: Button 1 pressed
    device_id: d9ffda94d5b5c9729c483a025268f6c8
    domain: zha
    type: remote_button_short_press
    subtype: button_1
    trigger: device
    id: button_1_press
  - alias: Button 2 pressed
    device_id: d9ffda94d5b5c9729c483a025268f6c8
    domain: zha
    type: remote_button_short_press
    subtype: button_2
    trigger: device
    id: button_2_press
  - alias: Button 3 pressed
    device_id: d9ffda94d5b5c9729c483a025268f6c8
    domain: zha
    type: remote_button_short_press
    subtype: button_3
    trigger: device
    id: button_3_press
  - alias: Button 4 pressed
    device_id: d9ffda94d5b5c9729c483a025268f6c8
    domain: zha
    type: remote_button_short_press
    subtype: button_4
    trigger: device
    id: button_4_press
  - alias: Button 2 held
    device_id: d9ffda94d5b5c9729c483a025268f6c8
    domain: zha
    type: remote_button_long_press
    subtype: button_2
    trigger: device
    id: button_2_hold
  - alias: Button 1 held
    device_id: d9ffda94d5b5c9729c483a025268f6c8
    domain: zha
    type: remote_button_long_press
    subtype: button_1
    trigger: device
    id: button_1_hold
  conditions: []
  actions:
  - alias: Act on the pressed button
    choose:
    - alias: Button 1 → toggle workshop lights
      conditions:
      - alias: Triggered by button 1
        condition: trigger
        id:
        - button_1_press
      sequence:
      - alias: Toggle workshop lights over 2 s
        action: light.toggle
        metadata: {}
        data:
          transition: 2
        target:
          entity_id: light.group_workshop_lights
    - alias: Button 1 held → toggle at 100%, 4922 K
      conditions:
      - alias: Triggered by button 1 hold
        condition: trigger
        id:
        - button_1_hold
      sequence:
      - alias: Toggle workshop lights at 100%, 4922 K
        action: light.toggle
        metadata: {}
        data:
          transition: 2
          brightness_pct: 100
          color_temp_kelvin: 4922
        target:
          entity_id: light.group_workshop_lights
      - alias: Empty first option blocks the rest
        choose:
        - alias: Empty option (always matches)
          conditions: []
          sequence: []
        - alias: Below full brightness → 100%
          conditions:
          - alias: Brightness attribute is empty
            condition: state
            entity_id: light.group_workshop_lights
            attribute: brightness
            state: ''
          - alias: Brightness below 99
            condition: numeric_state
            entity_id: light.group_workshop_lights
            attribute: brightness
            below: 99
          sequence:
          - alias: Set workshop lights to 100%
            action: light.turn_on
            metadata: {}
            data:
              transition: 1
              brightness_pct: 100
            target:
              entity_id: light.group_workshop_lights
    - alias: Button 2 → 100% at 5238 K
      conditions:
      - alias: Triggered by button 2
        condition: trigger
        id:
        - button_2_press
      sequence:
      - alias: Set workshop lights to 100%, 5238 K
        action: light.turn_on
        metadata: {}
        data:
          transition: 1
          color_temp_kelvin: 5238
          brightness_pct: 100
        target:
          entity_id: light.group_workshop_lights
    - alias: Button 3 → random colors
      conditions:
      - alias: Triggered by button 3
        condition: trigger
        id:
        - button_3_press
      sequence:
      - alias: Random colors on workshop lights
        action: script.change_received_lights_to_random_colors
        metadata: {}
        data:
          light:
          - light.group_workshop_lights
          saturation: 100
    - alias: Button 4 → dim to 1%
      conditions:
      - alias: Triggered by button 4
        condition: trigger
        id:
        - button_4_press
      sequence:
      - alias: Dim workshop lights to 1%
        action: light.turn_on
        metadata: {}
        data:
          brightness_pct: 1
        target:
          entity_id: light.group_workshop_lights
    - alias: Button 2 held → nothing
      conditions:
      - alias: Triggered by button 2 hold
        condition: trigger
        id:
        - button_2_hold
      sequence: []
    - alias: Dial up → brighten or desaturate
      conditions:
      - alias: Triggered by dial up
        condition: trigger
        id:
        - brightness_step_up
      sequence:
      - alias: At full brightness → desaturate
        choose:
        - alias: Full brightness → lower saturation
          conditions:
          - alias: Brightness above 253
            condition: numeric_state
            entity_id: light.group_workshop_lights
            attribute: brightness
            enabled: true
            above: 253
          sequence:
          - alias: List workshop lights with a color
            variables:
              lights_saturated: "{{ expand('light.group_workshop_lights')    | selectattr('attributes.hs_color',
                'defined') | map(attribute='entity_id') | list }} \n"
          - alias: For each colored light
            repeat:
              for_each: '{{lights_saturated}}'
              sequence:
              - alias: Lower its saturation by 7
                action: light.turn_on
                metadata: {}
                data:
                  hs_color: '{% set sat = ((state_attr(repeat.item,''hs_color'') ).1
                    - 7) %}

                    {{[state_attr(repeat.item,''hs_color'').0] +  [([0, sat, 100]|sort)[1]]
                    }}

                    '
                  transition: 1
                target:
                  entity_id: '{{ repeat.item }}

                    '
        default:
        - alias: 'Otherwise: brighten workshop lights by 10%'
          action: light.turn_on
          metadata: {}
          data:
            brightness_step_pct: 10
            transition: 1
          target:
            entity_id: light.group_workshop_lights
    - alias: Dial down → dim by 15%
      conditions:
      - alias: Triggered by dial down
        condition: trigger
        id:
        - brightness_step_down
      sequence:
      - alias: Dim workshop lights by 15%
        action: light.turn_on
        metadata: {}
        data:
          transition: 1
          brightness_step_pct: -15
        target:
          entity_id: light.group_workshop_lights
  - alias: Wait 50 ms
    delay:
      hours: 0
      minutes: 0
      seconds: 0
      milliseconds: 50
    enabled: false
  mode: single
- id: '1764362706933'
  alias: Close Kitchen curtains when sun sets
  description: Automatically closes the kitchen curtains 10 minutes after sunset to
    provide privacy and insulation in the evening.
  triggers:
  - alias: Sun set 10 min ago
    trigger: state
    entity_id:
    - sun.sun
    from: above_horizon
    to: below_horizon
    for:
      hours: 0
      minutes: 10
      seconds: 0
  conditions: []
  actions:
  - alias: Close the kitchen curtains
    action: cover.close_cover
    metadata: {}
    data: {}
    target:
      entity_id: cover.cover_kitchen_curtains
  mode: single
- id: '1764891085092'
  alias: Alert when Airfryer has finished
  description: When the air fryer starts (over 100 W) while Maxi is awake, not everyone
    is asleep and cooking mode is off, waits up to 20 minutes for it to stay below
    4 W for a minute. If the kitchen is empty then, announces 'AirFryer finished'
    and repeats every 5 minutes while the kitchen stays empty.
  triggers:
  - alias: Air fryer draws over 100 W
    entity_id:
    - sensor.plug_kitchen_airfryer_electric_consumption_w
    above: 100
    trigger: numeric_state
  conditions:
  - alias: Maxi is awake
    condition: state
    entity_id: sensor.is_maxi_asleep
    state: 'off'
  - alias: Not everyone present is asleep
    condition: state
    entity_id: binary_sensor.all_present_sleeping
    state: 'off'
  - alias: Cooking mode is off
    condition: state
    entity_id: input_boolean.cooking_mode
    state: 'off'
  actions:
  - alias: Wait up to 20 min for the air fryer to stop
    wait_for_trigger:
    - alias: Air fryer below 4 W for 1 min
      entity_id:
      - sensor.plug_kitchen_airfryer_electric_consumption_w
      for:
        hours: 0
        minutes: 0
        seconds: 30
      below: 4
      trigger: numeric_state
    continue_on_timeout: false
    timeout:
      hours: 0
      minutes: 20
      seconds: 0
      milliseconds: 0
    enabled: true
  - alias: If nobody is in the kitchen
    if:
    - alias: Kitchen has no occupancy
      condition: state
      entity_id: binary_sensor.group_kitchen_motion_occupancy
      state: 'off'
    then:
    - alias: 'Announce: air fryer finished'
      action: script.non_important_broadcast_alert_in_the_house
      data:
        message: AirFryer finished
    - alias: Wait 5 minutes
      delay:
        minutes: 5
    - alias: Repeat while the kitchen stays empty
      repeat:
        while:
        - alias: Kitchen empty for 5 min
          condition: state
          entity_id: binary_sensor.group_kitchen_motion_occupancy
          state: 'off'
          for:
            minutes: 5
        sequence:
        - alias: 'Announce: air fryer finished again'
          action: script.non_important_broadcast_alert_in_the_house
          data:
            message: AirFryer finished
        - alias: Wait 5 minutes
          delay:
            minutes: 5
  mode: restart
- id: '1765730839407'
  alias: Control closet tablet screen to avoid full discharge
  description: When the closet tablet battery drops below 30% while its screen is
    on, sets the screen brightness to 1 and turns the screen off. A second branch
    would dim the screen to 25 below 50%, but the triggers (battery entering 50–55%,
    or dropping below 30%) never reach it.
  triggers:
  - alias: Battery enters 50–55%
    trigger: numeric_state
    entity_id:
    - sensor.kiosk_satellite_battery
    above: 50
    below: 55
  - alias: Battery drops below 30%
    trigger: numeric_state
    entity_id:
    - sensor.kiosk_satellite_battery
    below: 30
  conditions: []
  actions:
  - alias: Dim or turn off by battery level
    choose:
    - alias: Below 30% → screen off
      conditions:
      - alias: Battery below 30%
        condition: numeric_state
        entity_id: sensor.kiosk_satellite_battery
        below: 30
      - alias: Closet tablet screen is on
        condition: state
        entity_id: light.kiosk_satellite_screen
        state: 'on'
      sequence:
      - alias: Set screen brightness to 1
        if:
        - condition: state
          entity_id: light.kiosk_satellite_screen
          state: 'on'
        then:
        - action: light.turn_on
          target:
            entity_id: light.kiosk_satellite_screen
          data:
            brightness: 1
      - alias: Turn off the closet tablet screen
        action: light.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: light.kiosk_satellite_screen
        enabled: true
    - alias: Below 50% → dim the screen
      conditions:
      - alias: Battery below 50%
        condition: numeric_state
        entity_id: sensor.kiosk_satellite_battery
        below: 50
      - alias: Closet tablet screen is on
        condition: state
        entity_id: light.kiosk_satellite_screen
        state: 'on'
      sequence:
      - alias: Set screen brightness to 25
        if:
        - condition: state
          entity_id: light.kiosk_satellite_screen
          state: 'on'
        then:
        - action: light.turn_on
          target:
            entity_id: light.kiosk_satellite_screen
          data:
            brightness: 25
  mode: single
- id: '1765731514294'
  alias: Control bedroom tablet screen to avoid full discharge
  description: When the bedroom tablet battery drops below 50% while its screen is
