    - sensor.kiosk_bedroom_tablet_battery
    above: 95
  - alias: Battery drops below 50%
    trigger: numeric_state
    entity_id:
    - sensor.kiosk_bedroom_tablet_battery
    below: 50
  conditions: []
  actions:
  - alias: Dim or turn off by battery level
    choose:
    - alias: Below 15% → screen off
      conditions:
      - alias: Battery below 15%
        condition: numeric_state
        entity_id: sensor.kiosk_bedroom_tablet_battery
        below: 15
      - alias: Bedroom tablet screen is on
        condition: state
        entity_id: light.kiosk_bedroom_tablet_screen
        state: 'on'
      sequence:
      - alias: Set screen brightness to 1
        if:
        - condition: state
          entity_id: light.kiosk_bedroom_tablet_screen
          state: 'on'
        then:
        - action: light.turn_on
          target:
            entity_id: light.kiosk_bedroom_tablet_screen
          data:
            brightness: 1
      - alias: Turn off the bedroom tablet screen
        action: light.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: light.kiosk_bedroom_tablet_screen
        enabled: true
    - alias: Below 50% → dim the screen
      conditions:
      - alias: Battery below 50%
        condition: numeric_state
        entity_id: sensor.kiosk_bedroom_tablet_battery
        below: 50
      - alias: Bedroom tablet screen is on
        condition: state
        entity_id: light.kiosk_bedroom_tablet_screen
        state: 'on'
      sequence:
      - alias: Set screen brightness to 25
        if:
        - condition: state
          entity_id: light.kiosk_bedroom_tablet_screen
          state: 'on'
        then:
        - action: light.turn_on
          target:
            entity_id: light.kiosk_bedroom_tablet_screen
          data:
            brightness: 25
  mode: single
- id: '1766609371758'
  alias: Start turning lights on before maxi's alarm rings on week days for work
  description: Two minutes before Maxi's next phone alarm on a weekday, if that falls
    between 07:30 and 09:30, fades the light groups in the room where Maxi is to 51%
    at 3311 K over 10 minutes, then waits 45 minutes so it cannot run again in the
    meantime.
  triggers:
  - alias: 2 min before Maxi's weekday alarm
    trigger: time
    at:
      entity_id: sensor.phone_maxi_next_alarm
      offset: -00:02:00
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  conditions:
  - alias: Weekdays between 07:30 and 09:30
    condition: time
    after: 07:30:00
    before: 09:30:00
    weekday:
    - fri
    - thu
    - wed
    - tue
    - mon
  actions:
  - alias: Fade Maxi's room lights to 51%, 3311 K
    action: light.turn_on
    metadata: {}
    target:
      entity_id: '{{ area_entities(states(''sensor.maxi_location_by_petro_v2'')) |
        select(''search'',''^light.group'')| reject(''search'', ''uv_lamp'') | list  }}

        '
    data:
      transition: 600
      color_temp_kelvin: 3311
      brightness_pct: 51
  - alias: Wait 45 minutes
    delay:
      hours: 0
      minutes: 45
      seconds: 0
      milliseconds: 0
  mode: single
- id: '1766790345547'
  alias: Avoid trippy lights dual activation
  description: Prevents both trippy light effects from running simultaneously by turning
    off the other effect whenever one is activated.
  triggers:
  - alias: Trippy lights effect turns on
    trigger: state
    entity_id:
    - input_boolean.trippy_lights_effect
    from:
    - 'off'
    to:
    - 'on'
    id: random_effect_on
  - alias: Trippy warm colors effect turns on
    trigger: state
    entity_id:
    - input_boolean.trippy_warm_colors_effect
    from:
    - 'off'
    to:
    - 'on'
    id: warm_effect_on
  conditions: []
  actions:
  - alias: Turn off the other effect
    choose:
    - alias: Trippy lights on → stop warm effect
      conditions:
      - alias: Triggered by trippy lights
        condition: trigger
        id:
        - random_effect_on
      sequence:
      - alias: Turn off trippy warm colors
        action: input_boolean.turn_off
        metadata: {}
        target:
          entity_id: input_boolean.trippy_warm_colors_effect
        data: {}
    - alias: Warm effect on → stop trippy lights
      conditions:
      - alias: Triggered by trippy warm colors
        condition: trigger
        id:
        - warm_effect_on
      sequence:
      - alias: Turn off trippy lights
        action: input_boolean.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: input_boolean.trippy_lights_effect
  mode: single
- id: '1766792030896'
  alias: Turn off trippy lights after 16 continous hours
  description: Turns off the trippy lights effect after it has been on for 16 hours,
    and the trippy warm colors effect after 16 hours 16 minutes.
  triggers:
  - alias: Trippy lights on for 16 h
    trigger: state
    entity_id:
    - input_boolean.trippy_lights_effect
    from:
    - 'off'
    to:
    - 'on'
    id: random_effect_on
    for:
      hours: 16
      minutes: 0
      seconds: 0
  - alias: Trippy warm colors on for 16 h 16 min
    trigger: state
    entity_id:
    - input_boolean.trippy_warm_colors_effect
    from:
    - 'off'
    to:
    - 'on'
    id: warm_effect_on
    for:
      hours: 16
      minutes: 16
      seconds: 0
  conditions: []
  actions:
  - alias: Turn off the effect that timed out
    choose:
    - alias: Trippy lights timed out → turn off
      conditions:
      - alias: Triggered by trippy lights
        condition: trigger
        id:
        - random_effect_on
      sequence:
      - alias: Turn off trippy lights
        action: input_boolean.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: input_boolean.trippy_lights_effect
    - alias: Warm colors timed out → turn off
      conditions:
      - alias: Triggered by trippy warm colors
        condition: trigger
        id:
        - warm_effect_on
      sequence:
      - alias: Turn off trippy warm colors
        action: input_boolean.turn_off
        metadata: {}
        target:
          entity_id: input_boolean.trippy_warm_colors_effect
        data: {}
  mode: single
- id: '1766817510039'
  alias: Vibrating color effect automation
  description: When the vibrating colors toggle turns on (and neither trippy effect
    is on), restarts the vibrating color effect on every light of the all-lights group
    that is on in xy color mode. When the toggle turns off, stops all vibrating runs
    and re-applies Adaptive Lighting to those lights.
  triggers:
  - alias: Vibrating colors toggle changes
    trigger: state
    entity_id:
    - input_boolean.vibrating_colors_effect
    from:
    - 'off'
    - 'on'
  conditions:
  - alias: Trippy warm colors is off
    condition: state
    entity_id: input_boolean.trippy_warm_colors_effect
    state: 'off'
  - alias: Trippy lights is off
    condition: state
    entity_id: input_boolean.trippy_lights_effect
    state: 'off'
  actions:
  - alias: Start or stop by toggle state
    choose:
    - alias: Effect ON — start the effect on every eligible light
      conditions:
      - alias: Vibrating colors toggle is on
        condition: state
        entity_id: input_boolean.vibrating_colors_effect
        state: 'on'
      sequence:
      - alias: Stop running vibrate scripts
        action: script.turn_off
        target:
          entity_id: script.set_one_light_to_vibrating_colors
        data: {}
      - alias: List lit color lights in xy mode
        variables:
          lights: "{{ integration_entities('group') | select('search', 'light.group_all_lights')\n
            \  | expand | selectattr(\"attributes.hs_color\", \"defined\")\n   | selectattr(\"attributes.supported_features\",
            \">\", 33)\n   | selectattr(\"attributes.color_mode\", \"eq\", 'xy')\n
            \  | selectattr(\"state\", \"eq\", \"on\") | map(attribute='entity_id')
            | list | shuffle }}\n"
      - alias: Start vibrating colors on those lights
        action: script.change_received_lights_to_vibrating_colors
        metadata: {}
        data:
          light: '{{ lights }}'
    default:
    - alias: Stop all vibrate subscripts
      action: script.turn_off
      target:
        entity_id: script.set_one_light_to_vibrating_colors
    - alias: List lit color lights in xy mode
      variables:
        lights: "{{ integration_entities('group') | select('search', 'light.group_all_lights')\n
          \  | expand | selectattr(\"attributes.hs_color\", \"defined\")\n   | selectattr(\"attributes.supported_features\",
          \">\", 33)\n   | selectattr(\"attributes.color_mode\", \"eq\", 'xy')\n   |
          selectattr(\"state\", \"eq\", \"on\") | map(attribute='entity_id') | list
          }}\n"
    - alias: Re-apply Adaptive Lighting to them
      action: adaptive_lighting.apply
      data:
        lights: '{{ lights }}'
        transition: 3
        adapt_brightness: true
        adapt_color: true
        turn_on_lights: true
  mode: restart
- id: '1767743397238'
  alias: Mute Bathroom Speaker Muzak v3
  description: 'Whenever the bathroom door is open and someone leaves the bathroom
    or the door opens, mutes the bathroom speaker: right away if the bathroom is empty,
    a TV is active, or the kitchen, workshop and hallway speakers are all playing;
    otherwise once the bathroom has been empty for 1 minute (or 15 seconds).'
  triggers:
  - alias: Bathroom empty for 5 s
    trigger: state
    entity_id:
    - binary_sensor.group_bathroom_motion_occupancy
    from:
    - 'on'
    to:
    - 'off'
    for:
      hours: 0
      minutes: 0
      seconds: 5
  - alias: Bathroom door changes
    trigger: state
    entity_id:
    - binary_sensor.sensor_bathroom_door_contact
    from:
    - 'off'
    - 'on'
  conditions:
  - alias: Bathroom door is open
    condition: state
    entity_id: binary_sensor.sensor_bathroom_door_contact
    state:
    - 'on'
  actions:
  - alias: Mute now or after the room empties
    choose:
    - alias: Someone in the bathroom → decide
      conditions:
      - alias: Bathroom is occupied
        condition: state
        entity_id: binary_sensor.group_bathroom_motion_occupancy
        state: 'on'
      sequence:
      - alias: Choose when to mute
        choose:
        - conditions:
          - alias: A TV is active somewhere
            condition: not
            conditions:
            - condition: state
              entity_id: sensor.active_chromecast_rooms
              state: '[]'
              alias: If there is no active chromecast
          sequence:
          - alias: Mute the bathroom speaker
            action: media_player.volume_mute
            metadata: {}
            target:
              entity_id: media_player.mass_bathroom_vpe_speaker
            data:
              is_volume_muted: true
          alias: If any chromecast is playing
        - conditions:
          - alias: Kitchen speaker is playing
            condition: state
            entity_id: media_player.mass_kitchen_wiim_speaker
            state:
            - playing
            - 'on'
            - buffering
          - alias: Workshop speaker is playing
            condition: state
            entity_id: media_player.mass_workshop_wiim_speaker
            state:
            - playing
            - 'on'
            - buffering
            enabled: true
          - alias: Hallway speaker is playing
            condition: state
            entity_id: media_player.mass_hallway_wiim_speaker
            state:
            - playing
            - 'on'
            - buffering
            enabled: true
          sequence:
          - alias: Mute the bathroom speaker
            action: media_player.volume_mute
            metadata: {}
            target:
              entity_id: media_player.mass_bathroom_vpe_speaker
            data:
              is_volume_muted: true
          alias: Kitchen, workshop and hallway all playing → mute
        - conditions:
          - condition: state
            entity_id: sensor.active_chromecast_rooms
            state: '[]'
            alias: If there is no active chromecast
          - condition: state
            entity_id: sensor.active_speakers_rooms
            state:
            - '[''bathroom'']'
            alias: If only the bathroom is an active speaker
          sequence:
          - alias: Wait for the bathroom empty 1 min
            wait_for_trigger:
            - alias: Bathroom empty for 1 min
              trigger: state
              entity_id:
              - binary_sensor.group_bathroom_motion_occupancy
              to:
              - 'off'
              for:
                hours: 0
                minutes: 1
                seconds: 0
          - alias: Mute the bathroom speaker
            action: media_player.volume_mute
            metadata: {}
            target:
              entity_id: media_player.mass_bathroom_vpe_speaker
            data:
              is_volume_muted: true
          alias: If only the bathroom speaker is playing
        default:
        - alias: 'Otherwise: mute once the bathroom empties'
          sequence:
          - alias: Wait until bathroom occupancy is off
            wait_for_trigger:
            - alias: Bathroom empty for 15 s
              trigger: state
              entity_id:
              - binary_sensor.group_bathroom_motion_occupancy
              to:
              - 'off'
              from:
              - 'on'
              for:
                hours: 0
                minutes: 0
                seconds: 15
            continue_on_timeout: false
          - alias: Mute the bathroom speaker
            action: media_player.volume_mute
            metadata: {}
            data:
              is_volume_muted: true
            target:
              entity_id: media_player.mass_bathroom_vpe_speaker
    - alias: Bathroom empty → mute now
      conditions:
      - alias: Bathroom has no occupancy
        condition: state
        entity_id: binary_sensor.group_bathroom_motion_occupancy
        state: 'off'
      sequence:
      - alias: Mute the bathroom speaker
        action: media_player.volume_mute
        metadata: {}
        data:
          is_volume_muted: true
        target:
          entity_id: media_player.mass_bathroom_vpe_speaker
  mode: parallel
  max: 2
- id: '1767744894962'
  alias: Automatically adjust bathroom volume on unmute
  description: When the bathroom speaker is unmuted after being muted for over 30
    seconds, and no broadcast announcement is running, sets its volume for the time
    of day with the speaker volume script.
  triggers:
  - alias: Bathroom speaker gets unmuted
