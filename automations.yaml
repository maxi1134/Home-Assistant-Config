      average_volume: '{{ states(''sensor.template_average_unmuted_speakers_volume'')}}'
      unmuted_speakers: '{{ state_attr(''sensor.active_speakers_rooms'',''unmuted_rooms'')}}'
  - alias: Choose by music-following mode
    choose:
    - alias: Following off → set five speakers
      conditions:
      - alias: Music following is off
        condition: state
        entity_id: input_boolean.following_music
        state: 'off'
      sequence:
      - alias: Set five WiiM speakers to the average
        action: media_player.volume_set
        metadata: {}
        data:
          volume_level: '{{average_volume}}'
        target:
          entity_id:
          - media_player.mass_hallway_wiim_speaker
          - media_player.mass_kitchen_wiim_speaker
          - media_player.mass_salon_wiim_speaker
          - media_player.mass_lounge_wiim_speaker
          - media_player.mass_workshop_wiim_speaker
    - alias: Following on → set each unmuted room
      conditions:
      - alias: Music following is on
        condition: state
        entity_id: input_boolean.following_music
        state: 'on'
      sequence:
      - alias: For each unmuted room
        repeat:
          sequence:
          - alias: Set the room's universal speaker to the average
            action: media_player.volume_set
            metadata: {}
            data:
              volume_level: '{{average_volume}}'
            target:
              entity_id: '{{ "media_player.universal_" + unmuted_speakers[repeat.index
                - 1] + "_speakers" }}

                '
          for_each: '{{ unmuted_speakers }}'
  mode: single
- id: '1733597890338'
  alias: kitchen google display automation
  description: When the kitchen Google Hub has switched app for a minute, or been
    paused for 10 minutes, and it is not in one of two excluded apps or playing in
    a third, turns it off, casts the kitchen hub dashboard view to it and sets its
    volume to 0.
