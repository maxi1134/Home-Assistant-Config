- id: '1732406375683'
  alias: Lower volume if police is detected in the front during a party
  description: During a party, when the front door camera sees a person and the average
    speaker volume is above 0.4, asks LLM Vision whether a police officer or security
    guard is in the picture. If yes, notifies Maxi and lowers five house speakers
    to 30% and the home speaker group to 28%.
  triggers:
  - alias: Person seen by the front door camera
    trigger: numeric_state
    entity_id:
    - sensor.front_door_camera_person_count
    above: 0
  conditions:
  - alias: Party mode is on
    condition: state
    entity_id: input_boolean.party_mode
    state: 'on'
  - alias: Average speaker volume above 0.4
    condition: numeric_state
    entity_id: sensor.template_average_unmuted_speakers_volume
    above: 0.4
  actions:
  - action: llmvision.image_analyzer
    metadata: {}
    data:
      store_in_timeline: false
      use_memory: false
      include_filename: false
      target_width: 1280
      max_tokens: 3000
      generate_title: false
      expose_images: false
      response_format: text
      title_field: title
      description_field: description
      provider: 01KPNMJBE3FPHY7TEGKG6K7MVM
      message: '  Answer only with ''yes'' or ''no'', is there a police officer or
        a security guard  on this image? Only use one word to answer'
      image_entity:
      - camera.front_door_camera
    response_variable: answer
  - alias: Lower volume if a cop is present and notify maxi
    if:
    - alias: LLM Vision answered yes
      condition: template
      value_template: '{{ "YES" in answer.response_text | upper }}'
    then:
    - alias: 'Notify Maxi: police at the front door'
      metadata: {}
      data:
        data:
          image: 'https://hass.purgatoire.ca/local/llmvision/front_door_camera.jpg

            '
        message: Police detected at the front door
        title: Police Alert
      action: notify.maxi_notification_group
    - alias: Set five speakers to 30%
      action: media_player.volume_set
      metadata: {}
      data:
        volume_level: 0.3
      target:
        entity_id:
        - media_player.mass_hallway_wiim_speaker
        - media_player.mass_workshop_wiim_speaker
        - media_player.mass_kitchen_wiim_speaker
        - media_player.mass_salon_wiim_speaker
        - media_player.mass_lounge_wiim_speaker
    - alias: Set the home speaker group to 28%
      action: media_player.volume_set
      metadata: {}
      data:
        volume_level: 0.28
      target:
        entity_id: media_player.group_mass_home_group_speakers
  mode: single
