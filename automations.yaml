          actions:
          - action: stop_parking_horn
            title: Stop the horn?
          channel: security_alerts_notifications
          ttl: 0
          priority: high
        title: Security breach
      action: notify.mobile_app_phone_myriam
  - alias: 'Notify Maxi: parking horn started'
    metadata: {}
    data:
