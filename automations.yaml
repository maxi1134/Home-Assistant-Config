      - button.kiosk_satellite_reload_page
      - button.kiosk_kitchen_tablet_reload_page
      - button.kiosk_bedroom_tablet_reload_page
      - button.front_door_phone_load_start_url
      - button.kiosk_salon_tablet_reload_page
      - button.kiosk_serrver_tablet_reload_page
    action: button.press
  mode: single
- id: '1713824382107'
  alias: Turn on lights automatically
  description: When motion is detected in a room, turns on that room's lights that
    are off (except those labelled High Intensity Light), unless someone is sleeping
    there or the alarm is armed away or triggered.
  triggers:
  - alias: Motion detected in a room
    entity_id:
    - binary_sensor.group_lounge_motion_occupancy
    - binary_sensor.group_hallway_motion_occupancy
    - binary_sensor.group_kitchen_motion_occupancy
    - binary_sensor.group_workshop_motion_occupancy
    - binary_sensor.group_patio_motion_occupancy
    - binary_sensor.group_closet_motion_occupancy
    - binary_sensor.group_server_motion_occupancy
    - binary_sensor.group_entrance_motion_occupancy
    - binary_sensor.group_workstation_motion_occupancy
    - binary_sensor.group_salon_motion_occupancy
    - binary_sensor.group_bathroom_motion_occupancy
    - binary_sensor.hallway_radar_occupancy_zone_3_occupancy
    - binary_sensor.group_hotbox_motion_occupancy
    for:
      hours: 0
      minutes: 0
      seconds: 0
    trigger: state
    to:
    - 'on'
  conditions:
  - alias: Make sure no sleeper is present
    condition: template
    value_template: '{{ area_id(trigger.entity_id) | lower | replace(''_top'','''')|
      replace(''_down'','''') not in states(''sensor.active_sleeper_rooms'') | string
      | lower }}'
  - alias: Alarm is not triggered
    condition: not
    conditions:
    - alias: Alarm is triggered
      condition: state
      entity_id: alarm_control_panel.home_alarm
      state: triggered
  - alias: Alarm is not armed away
    condition: not
    conditions:
    - alias: Alarm is armed away
      condition: state
      entity_id: alarm_control_panel.home_alarm
      state: armed_away
  actions:
  - alias: List the room's lights that are off
    variables:
      off_lights_in_room: "{{ [area_id(trigger.entity_id)]\n  | map('area_entities')
        | sum(start=[])\n  | select('match', '^light.')\n  | select('is_state', 'off')\n
        \ | reject('in', label_entities('High Intensity Light'))\n  | unique | list
        }}"
  - alias: 'For each off light: turn it on'
    repeat:
      sequence:
      - alias: Turn on the light
        metadata: {}
        data: {}
        target:
          entity_id: '{{off_lights_in_room[repeat.index - 1]    }}'
        action: light.turn_on
        continue_on_error: true
      for_each: '{{off_lights_in_room}}'
  mode: parallel
  max: 25
- id: '1713826329670'
  alias: Mute speakers when the room is empty
  description: When a room has had no motion for 5 minutes while music following is
    on and Maxi is not in that room, mutes the room's playing Music Assistant speakers.
  triggers:
  - alias: Room empty for 5 min
    entity_id:
    - binary_sensor.group_closet_motion_occupancy
    - binary_sensor.group_lounge_motion_occupancy
    - binary_sensor.group_hallway_motion_occupancy
    - binary_sensor.group_kitchen_motion_occupancy
    - binary_sensor.group_workshop_motion_occupancy
    - binary_sensor.group_workstation_motion_occupancy
    - binary_sensor.group_salon_motion_occupancy
    - binary_sensor.group_hotbox_motion_occupancy
    for:
      hours: 0
      minutes: 5
      seconds: 0
    trigger: state
    to:
    - 'off'
  conditions:
  - alias: Music following is on
    condition: state
    entity_id: input_boolean.following_music
    state: 'on'
  - alias: Maxi is not in that room
    condition: template
    value_template: '{{ states(''sensor.maxi_location_by_petro_v2'') not in [area_id(trigger.entity_id)]
      | string  }}'
  actions:
  - alias: List the room's playing speakers
    variables:
      playing_speakers: '{{ [area_id(trigger.entity_id)]   | map(''area_entities'')
        | sum(start=[]) |    select(''search'', ''mass'') | select(''is_state'',''playing'')
        | unique | list }}

        '
  - alias: Mute only when motion is off
    choose:
    - conditions:
      - alias: Triggered state is off
        condition: template
        value_template: '{{ trigger.to_state.state == "off" }}'
      sequence:
      - alias: Mute the room's playing speakers
        metadata: {}
        data:
          is_volume_muted: true
        target:
          entity_id: '{{playing_speakers}}

            '
        action: media_player.volume_mute
      alias: Motion is OFF
  mode: parallel
  max: 10
- id: '1714054125770'
  alias: Alert when dryer finishes!
  description: When the dryer's status changes to 'end' while Maxi is awake and not
    everyone present is asleep, announces 'Dryer has finished' as a low-priority house
    alert.
  triggers:
  - alias: Dryer status changes to end
    entity_id:
    - sensor.dryer_current_status
    to:
    - end
    trigger: state
  conditions:
  - alias: Maxi is awake
    condition: state
    entity_id: sensor.is_maxi_asleep
    state: 'off'
  - alias: Not everyone present is asleep
    condition: state
    entity_id: binary_sensor.all_present_sleeping
    state: 'off'
  actions:
  - alias: 'Announce: dryer has finished'
    action: script.non_important_broadcast_alert_in_the_house
    data:
      message: Dryer has finished
  - alias: Repeat while the kitchen is empty
    repeat:
      sequence:
      - alias: Wait 30 minutes
        delay:
          hours: 0
          minutes: 30
          seconds: 0
          milliseconds: 0
      - alias: Continue if kitchen empty for 29 min
        condition: state
        entity_id: binary_sensor.group_kitchen_motion_occupancy
        state: 'off'
        for:
          hours: 0
          minutes: 29
          seconds: 0
      while:
      - alias: Kitchen has no occupancy
        condition: state
        entity_id: binary_sensor.group_kitchen_motion_occupancy
        state: 'off'
    enabled: false
  mode: restart
- id: '1714058481200'
  alias: Alert when Microwave finishes
  description: When the microwave starts (over 100 W) while Maxi is awake, not everyone
    is asleep and cooking mode is off, waits up to 30 minutes for it to drop below
    5 W. If the kitchen is empty at that point, announces 'Microwave finished' and
    repeats every 5 minutes while the kitchen stays empty.
  triggers:
  - alias: Microwave draws over 100 W
    entity_id:
    - sensor.plug_kitchen_microwave_electric_consumption_w
    above: 100
    trigger: numeric_state
  conditions:
  - alias: Maxi is awake
    condition: state
    entity_id: sensor.is_maxi_asleep
    state: 'off'
  - alias: Not everyone present is asleep
    condition: state
    entity_id: binary_sensor.all_present_sleeping
    state: 'off'
  - alias: Cooking mode is off
    condition: state
    entity_id: input_boolean.cooking_mode
    state: 'off'
  actions:
  - alias: Wait up to 30 min for the microwave to stop
    wait_for_trigger:
    - alias: Microwave below 5 W for 5 s
      entity_id:
      - sensor.plug_kitchen_microwave_electric_consumption_w
      for:
        hours: 0
        minutes: 0
        seconds: 5
      below: 5
      trigger: numeric_state
    continue_on_timeout: false
    timeout:
      hours: 0
      minutes: 30
      seconds: 2
      milliseconds: 0
    enabled: true
  - alias: If nobody is in the kitchen
    if:
    - alias: Kitchen has no occupancy
      condition: state
      entity_id: binary_sensor.group_kitchen_motion_occupancy
      state: 'off'
    then:
    - alias: 'Announce: microwave finished'
      action: script.non_important_broadcast_alert_in_the_house
      data:
        message: Microwave finished
    - alias: Wait 5 minutes
      delay:
        minutes: 5
    - alias: Repeat while the kitchen stays empty
      repeat:
        while:
        - alias: Kitchen empty for 5 min
          condition: state
          entity_id: binary_sensor.group_kitchen_motion_occupancy
          state: 'off'
          for:
            minutes: 5
        sequence:
        - alias: 'Announce: microwave finished again'
          action: script.non_important_broadcast_alert_in_the_house
          data:
            message: Microwave finished
        - alias: Wait 5 minutes
          delay:
            minutes: 5
  mode: restart
- id: '1714058675432'
  alias: Alert when Washer finishes
  description: When the washer starts drawing over 1 A while Maxi is awake and not
    everyone is asleep, waits with no time limit until it draws under 0.01 A for a
    minute, then announces 'Washer finished' as a low-priority house alert.
  triggers:
  - alias: Washer draws over 1 A
    entity_id:
    - sensor.plug_kitchen_washer_electric_consumption_a
    above: 1
    trigger: numeric_state
  conditions:
  - alias: Maxi is awake
    condition: state
    entity_id: sensor.is_maxi_asleep
    state: 'off'
  - alias: Not everyone present is asleep
    condition: state
    entity_id: binary_sensor.all_present_sleeping
    state: 'off'
  actions:
  - alias: Wait for the washer to stop
    wait_for_trigger:
    - alias: Washer below 0.01 A for 1 min
      entity_id:
      - sensor.plug_kitchen_washer_electric_consumption_a
      for:
        hours: 0
        minutes: 1
        seconds: 0
      below: 0.01
      trigger: numeric_state
    continue_on_timeout: false
  - alias: 'Announce: washer finished'
    metadata: {}
    data:
      message: Washer finished
    action: script.non_important_broadcast_alert_in_the_house
  mode: restart
- id: '1714077180427'
  alias: Change light to random colors on press
