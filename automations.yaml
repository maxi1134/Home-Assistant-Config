    - switch.group_lounge_uv_lamps
    - switch.group_patio_uv_lamps
    - switch.group_workshop_uv_lamps
    - switch.group_salon_uv_lamps
    to:
    - 'on'
    from:
    - 'off'
  conditions:
  - alias: No live concert
    condition: state
    entity_id: input_boolean.live_concert
    state: 'off'
  actions:
  - alias: Set the room's lights to blue
    action: script.change_received_lights_to_blue
    metadata: {}
    data:
