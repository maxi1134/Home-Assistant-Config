- id: '1791578731468'
  alias: Emotional regulation
  description: 'Emotional regulation routine driven by Depressive episode. When it
    turns on: a 55-minute release phase with Maxi Smart Depressing Playlist on the
    home group (replacing the current music right away) and the cozy ambiance (no
    TV visuals) dimmed to 70% over 60 seconds. When the release time is up, Maxi''s
    phone offers 20 more minutes: ''Another 20 minutes'' extends the release phase
    (the offer comes back at the end, so it is repeatable), while ''Start recovery
    now'' or 5 minutes without an answer moves on to a 35-minute recovery phase with
    Maxi Smart Emotional Recovery Playlist and the lights fading to white (4000 K,
    60%). After recovery comes Maxi''s regular playlist (Maxi''s Smart Playlist) and
    a check-in notification: ''I''m OK'' ends the episode, ''Another round'' repeats
    a 20-minute release phase. The lights are the inside and patio lights plus the
    hotbox desk tube. Later playlist changes, including ''Another round'', use ''play
    next and clear queue'', so the current song finishes before the new playlist starts
    (if nothing is playing, the playlist starts right away), and the cozy and white
    light changes wait for the song title to change so they land with the new playlist
    (at most until the current song should have ended, 15 minutes max). The episode
    also ends 3 hours after the regular phase starts, or once Maxi has been asleep
    for 10 minutes. Turning it off ends the routine immediately: the timers stop,
    the inside lights and the hotbox desk tube fade to bright neutral white (4000
    K, 100%) over 75 seconds, the patio lights go back to Adaptive Lighting, and one
    of Maxi''s playlists starts at random right away. If Maxi is asleep, the music
    stops instead and all the lights go back to Adaptive Lighting. Phase timers survive
    restarts: a phase that ended during a restart catches up to the regular phase,
    and a restart before the shutdown finished completes it.'
  triggers:
  - alias: Depressive episode turns on
    trigger: state
    entity_id: input_boolean.depressive_episode
    from: 'off'
    to: 'on'
    id: start
  - alias: Release phase ends
    trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.emotional_release
    id: recovery
  - alias: Recovery phase ends
    trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.emotional_recovery
    id: regular
  - alias: '''Another round'' tapped on the check-in'
    trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: EMOTIONAL_REGULATION_ANOTHER_ROUND
    id: another_round
  - alias: '''I''m OK'' tapped on the check-in'
    trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: EMOTIONAL_REGULATION_OK
    id: im_ok
  - alias: 'Safety net: 3 h since the regular playlist started'
    trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.emotional_regulation_safety
    id: safety
  - alias: Maxi asleep for 10 min
    trigger: state
    entity_id:
    - sensor.is_maxi_asleep
    to:
    - 'on'
    for:
      hours: 0
      minutes: 10
      seconds: 0
    id: asleep
  - alias: Home Assistant starts
    trigger: homeassistant
    event: start
    id: ha_start
  - alias: Depressive episode turns off
    trigger: state
    entity_id:
    - input_boolean.depressive_episode
    from:
    - 'on'
    to:
    - 'off'
    id: end
  conditions: []
  actions:
  - alias: Run the step for this trigger
    choose:
    - alias: 'Start or another round: release phase'
      conditions:
      - alias: Started or another round tapped
        condition: trigger
        id:
        - start
        - another_round
      - alias: Depressive episode is on
        condition: state
        entity_id: input_boolean.depressive_episode
        state: 'on'
      - alias: Fresh start (no routine timer running) or another round
        condition: or
        conditions:
        - alias: Another round was tapped
          condition: trigger
          id: another_round
        - alias: No routine timer is running
          condition: state
          entity_id:
          - timer.emotional_release
          - timer.emotional_recovery
          - timer.emotional_regulation_safety
          state: idle
      sequence:
      - alias: Cancel the recovery and safety timers
        action: timer.cancel
        target:
          entity_id:
          - timer.emotional_recovery
          - timer.emotional_regulation_safety
      - alias: Clear the check-in notification
        action: notify.mobile_app_phone_maxi
        data:
          message: clear_notification
          data:
            tag: emotional_regulation_checkin
        continue_on_error: true
      - alias: Start the release timer (20 min for another round, 55 min otherwise)
        if:
        - alias: Another round was tapped
          condition: trigger
          id: another_round
        then:
        - alias: Start a 20-minute release timer
          action: timer.start
          target:
            entity_id: timer.emotional_release
          data:
            duration: 00:20:00
        else:
        - alias: Start a 55-minute release timer
          action: timer.start
          target:
            entity_id: timer.emotional_release
          data:
            duration: 00:55:00
      - alias: 'Switch to the depressive playlist (if music is playing: right away
          when the episode starts, after the current song for another round, then
          wait for the song to change; otherwise start it now)'
        if:
        - alias: Home speaker group is playing
          condition: state
          entity_id: media_player.group_mass_home_group_speakers
          state: playing
        then:
        - alias: Remember the current song title
          variables:
            old_title: '{{ state_attr(''media_player.group_mass_home_group_speakers'',
              ''media_title'') }}'
        - alias: Make sure shuffle is on
          action: media_player.shuffle_set
          target:
            entity_id: media_player.group_mass_home_group_speakers
          data:
            shuffle: true
          continue_on_error: true
        - alias: 'Episode just started: switch right away; another round: queue it
            after the current song'
          if:
          - alias: The episode just started
            condition: trigger
            id: start
          then:
          - alias: Play Maxi Smart Depressing Playlist right away (play now and clear
              queue)
            action: music_assistant.play_media
            target:
              entity_id: media_player.group_mass_home_group_speakers
            data:
              media_id: Maxi Smart Depressing Playlist
              media_type: playlist
              enqueue: replace
            continue_on_error: true
          else:
          - alias: Queue Maxi Smart Depressing Playlist after the current song (play
              next and clear queue)
            action: music_assistant.play_media
            target:
              entity_id: media_player.group_mass_home_group_speakers
            data:
              media_id: Maxi Smart Depressing Playlist
              media_type: playlist
              enqueue: replace_next
            continue_on_error: true
        - alias: Wait for the song to change (new playlist starting) or the episode
            to be turned off, at most until the current song should end (15 min max)
          wait_template: '{{ state_attr(''media_player.group_mass_home_group_speakers'',
            ''media_title'') != old_title or is_state(''input_boolean.depressive_episode'',
            ''off'') }}'
          timeout: '{% set e = ''media_player.group_mass_home_group_speakers'' %}{%
            set d = state_attr(e, ''media_duration'') | float(0) %}{% set p = state_attr(e,
            ''media_position'') | float(0) %}{% set u = state_attr(e, ''media_position_updated_at'')
            %}{% set since = (as_timestamp(now()) - as_timestamp(u, as_timestamp(now())))
            if is_state(e, ''playing'') else 0 %}{% set left = [d - p - since, 0]
            | max %}{{ ([left + 30, 900] | min) | int if d > 0 else 600 }}'
          continue_on_timeout: true
        else:
        - alias: Clear the home speaker group queue
          action: media_player.clear_playlist
          target:
            entity_id: media_player.group_mass_home_group_speakers
          continue_on_error: true
        - alias: Start Maxi Smart Depressing Playlist on the home group now
          action: script.start_a_random_maxi_playlist
          data:
            player_entity: media_player.group_mass_home_group_speakers
            requested_playlist: Maxi Smart Depressing Playlist
          continue_on_error: true
      - alias: Stop here if the episode was turned off
        condition: state
        entity_id: input_boolean.depressive_episode
        state: 'on'
      - alias: Cozy ambiance without TV visuals, then dim to 70% (as the new playlist
          starts)
        sequence:
        - alias: Start the cozy ambiance script without TV visuals (runs on its own,
            so a light error cannot stop the music)
          action: script.turn_on
          target:
            entity_id: script.set_whole_house_to_cozy_ambiance_2
          data:
            variables:
              include_visuals: false
        - alias: Wait 1 second for the script to start
          delay:
            seconds: 1
        - alias: Wait up to 90 s for the cozy script to finish (or the episode to
            be turned off)
          wait_template: '{{ is_state(''script.set_whole_house_to_cozy_ambiance_2'',
            ''off'') or is_state(''input_boolean.depressive_episode'', ''off'') }}'
          timeout: 00:01:30
          continue_on_timeout: true
        - alias: Wait 2 seconds for the effects to settle
          delay:
            seconds: 2
        - alias: Stop here if the episode was turned off
          condition: state
          entity_id: input_boolean.depressive_episode
          state: 'on'
        - alias: Dim the cozy lights to 70% over 60 s (brightness only, keeps the
            effects)
          action: light.turn_on
          target:
            entity_id:
            - light.group_all_inside_lights
            - light.group_patio_lights
            - light.hotbox_desk_tube_light
          data:
            brightness_pct: 70
            transition: 60
          continue_on_error: true
    - alias: 'Release timer finished: offer 20 more minutes, then the recovery phase'
      conditions:
      - alias: Release phase ended
        condition: trigger
        id: recovery
      - alias: Depressive episode is on
        condition: state
        entity_id: input_boolean.depressive_episode
        state: 'on'
      sequence:
      - alias: Start the 35-minute recovery timer (keeps the routine marked as running
          during the offer)
        action: timer.start
        target:
          entity_id: timer.emotional_recovery
        data:
          duration: 00:35:00
      - alias: Offer 20 more minutes and wait up to 5 minutes for an answer (only
          while the episode is on)
        if:
        - alias: Depressive episode is on
          condition: state
          entity_id: input_boolean.depressive_episode
          state: 'on'
        then:
        - alias: Send the 20-minute extension offer to Maxi's phone
          action: notify.mobile_app_phone_maxi
          data:
            title: Recovery music in 5 minutes
            message: Your release time is up. Need another 20 minutes before the recovery
              playlist starts?
            data:
              tag: emotional_regulation_checkin
              channel: emotional_regulation
              priority: high
              ttl: 0
              actions:
              - action: EMOTIONAL_REGULATION_EXTEND
                title: Another 20 minutes
              - action: EMOTIONAL_REGULATION_MOVE_ON
                title: Start recovery now
          continue_on_error: true
        - alias: Wait up to 5 minutes for an answer (or the episode to be turned off)
          wait_for_trigger:
          - alias: '''Another 20 minutes'' tapped'
            trigger: event
            event_type: mobile_app_notification_action
            event_data:
              action: EMOTIONAL_REGULATION_EXTEND
            id: extend
          - alias: '''Start recovery now'' tapped'
            trigger: event
            event_type: mobile_app_notification_action
            event_data:
              action: EMOTIONAL_REGULATION_MOVE_ON
            id: move_on
          - alias: Episode turned off
            trigger: state
            entity_id: input_boolean.depressive_episode
            to: 'off'
            id: 'off'
          timeout: 00:05:00
          continue_on_timeout: true
        - alias: 'If ''Another 20 minutes'' was tapped: extend the release phase and
            stop here'
          if:
          - alias: '''Another 20 minutes'' was tapped'
            condition: template
            value_template: '{{ wait.trigger is not none and wait.trigger.id == ''extend''
              }}'
          then:
          - alias: Start a 20-minute release timer
            action: timer.start
            target:
              entity_id: timer.emotional_release
            data:
              duration: 00:20:00
          - alias: Cancel the recovery timer
            action: timer.cancel
            target:
              entity_id: timer.emotional_recovery
          - alias: Clear the extension offer
            action: notify.mobile_app_phone_maxi
            data:
              message: clear_notification
              data:
                tag: emotional_regulation_checkin
            continue_on_error: true
          - alias: 'Stop here: the depressive playlist and cozy lights carry on'
            stop: Release phase extended by 20 minutes
        - alias: Clear the extension offer
          action: notify.mobile_app_phone_maxi
          data:
            message: clear_notification
            data:
              tag: emotional_regulation_checkin
          continue_on_error: true
        - alias: Restart the 35-minute recovery timer so recovery counts from now
          action: timer.start
          target:
            entity_id: timer.emotional_recovery
          data:
            duration: 00:35:00
      - alias: Stop here if the episode was turned off
        condition: state
        entity_id: input_boolean.depressive_episode
        state: 'on'
      - alias: 'Switch to the recovery playlist (if music is playing: play next and
          clear queue, then wait for the song to change; otherwise start it now)'
        if:
        - alias: Home speaker group is playing
          condition: state
          entity_id: media_player.group_mass_home_group_speakers
          state: playing
        then:
        - alias: Remember the current song title
          variables:
            old_title: '{{ state_attr(''media_player.group_mass_home_group_speakers'',
              ''media_title'') }}'
        - alias: Make sure shuffle is on
          action: media_player.shuffle_set
          target:
            entity_id: media_player.group_mass_home_group_speakers
          data:
            shuffle: true
          continue_on_error: true
        - alias: Queue Maxi Smart Emotional Recovery Playlist after the current song
            (play next and clear queue)
          action: music_assistant.play_media
          target:
            entity_id: media_player.group_mass_home_group_speakers
          data:
            media_id: Maxi Smart Emotional Recovery Playlist
            media_type: playlist
            enqueue: replace_next
          continue_on_error: true
        - alias: Wait for the song to change (new playlist starting) or the episode
            to be turned off, at most until the current song should end (15 min max)
          wait_template: '{{ state_attr(''media_player.group_mass_home_group_speakers'',
            ''media_title'') != old_title or is_state(''input_boolean.depressive_episode'',
            ''off'') }}'
          timeout: '{% set e = ''media_player.group_mass_home_group_speakers'' %}{%
            set d = state_attr(e, ''media_duration'') | float(0) %}{% set p = state_attr(e,
            ''media_position'') | float(0) %}{% set u = state_attr(e, ''media_position_updated_at'')
            %}{% set since = (as_timestamp(now()) - as_timestamp(u, as_timestamp(now())))
            if is_state(e, ''playing'') else 0 %}{% set left = [d - p - since, 0]
            | max %}{{ ([left + 30, 900] | min) | int if d > 0 else 600 }}'
          continue_on_timeout: true
        else:
        - alias: Clear the home speaker group queue
          action: media_player.clear_playlist
          target:
            entity_id: media_player.group_mass_home_group_speakers
          continue_on_error: true
        - alias: Start Maxi Smart Emotional Recovery Playlist on the home group now
          action: script.start_a_random_maxi_playlist
          data:
            player_entity: media_player.group_mass_home_group_speakers
            requested_playlist: Maxi Smart Emotional Recovery Playlist
          continue_on_error: true
      - alias: Stop here if the episode was turned off
        condition: state
        entity_id: input_boolean.depressive_episode
        state: 'on'
      - alias: Fade the cozy lights to white, 4000 K at 60%, as the recovery playlist
          starts (stops the effects first)
        action: script.change_received_lights_to_white
        data:
          light:
          - light.group_all_inside_lights
          - light.group_patio_lights
          - light.hotbox_desk_tube_light
          color_temp_kelvin: 4000
          brightness_pct: 60
          transition_speed: 30
          only_on: true
          turn_off_uv: false
        continue_on_error: true
    - alias: 'Recovery timer finished (or a phase ended during a restart): regular
        playlist and check-in'
      conditions:
      - alias: Recovery ended, or Home Assistant started
        condition: trigger
        id:
        - regular
        - ha_start
      - alias: Recovery ended while the episode is on, or a phase ended during a restart
        condition: or
        conditions:
        - alias: Recovery ended while the episode is on
          condition: and
          conditions:
          - alias: Recovery phase ended
            condition: trigger
            id: regular
          - alias: Depressive episode is on
            condition: state
            entity_id: input_boolean.depressive_episode
            state: 'on'
        - alias: Home Assistant started with the episode on and no phase timer running
          condition: and
          conditions:
          - alias: Home Assistant just started
            condition: trigger
            id: ha_start
          - alias: Depressive episode is on
            condition: state
            entity_id: input_boolean.depressive_episode
            state: 'on'
          - alias: All phase timers are idle
            condition: state
            entity_id:
            - timer.emotional_release
            - timer.emotional_recovery
            - timer.emotional_regulation_safety
            state: idle
      sequence:
      - alias: Start the 3-hour safety timer
        action: timer.start
        target:
          entity_id: timer.emotional_regulation_safety
        data:
          duration: 03:00:00
      - alias: Set the regular playlist and send the check-in in parallel
        parallel:
        - alias: Switch to Maxi's regular playlist (play next and clear queue if music
            is playing, otherwise start it now)
          if:
          - alias: Home speaker group is playing
            condition: state
            entity_id: media_player.group_mass_home_group_speakers
            state: playing
          then:
          - alias: Make sure shuffle is on
            action: media_player.shuffle_set
            target:
              entity_id: media_player.group_mass_home_group_speakers
            data:
              shuffle: true
            continue_on_error: true
          - alias: Queue Maxi's Smart Playlist after the current song (play next and
              clear queue)
            action: music_assistant.play_media
            target:
              entity_id: media_player.group_mass_home_group_speakers
            data:
              media_id: Maxi's Smart Playlist
              media_type: playlist
              enqueue: replace_next
            continue_on_error: true
          else:
          - alias: Clear the home speaker group queue
            action: media_player.clear_playlist
            target:
              entity_id: media_player.group_mass_home_group_speakers
            continue_on_error: true
          - alias: Start Maxi's regular playlist now
            action: script.start_a_random_maxi_playlist
            continue_on_error: true
        - alias: After a restart catch-up, make sure the lights are white
          if:
          - alias: Home Assistant just started
            condition: trigger
            id: ha_start
          then:
          - alias: Set the cozy lights to white, 4000 K at 60%
            action: script.change_received_lights_to_white
            data:
              light:
              - light.group_all_inside_lights
              - light.group_patio_lights
              - light.hotbox_desk_tube_light
              color_temp_kelvin: 4000
              brightness_pct: 60
              transition_speed: 5
              only_on: true
              turn_off_uv: false
            continue_on_error: true
        - alias: Send the check-in notification to Maxi's phone (only while the episode
            is on)
          if:
          - alias: Depressive episode is on
            condition: state
            entity_id: input_boolean.depressive_episode
            state: 'on'
          then:
          - alias: Send the check-in notification to Maxi's phone
            action: notify.mobile_app_phone_maxi
            data:
              title: How are you doing?
              message: Your regular music is up next. Feeling OK, or do you need another
                20 minutes?
              data:
                tag: emotional_regulation_checkin
                channel: emotional_regulation
                priority: high
                ttl: 0
                actions:
                - action: EMOTIONAL_REGULATION_OK
                  title: I'm OK
                - action: EMOTIONAL_REGULATION_ANOTHER_ROUND
                  title: Another round (20 min)
            continue_on_error: true
    - alias: 'I''m OK, safety net or asleep: end the episode'
      conditions:
      - alias: I'm OK tapped, safety timer ended or Maxi asleep
        condition: trigger
        id:
        - im_ok
        - safety
        - asleep
      - alias: Depressive episode is on
        condition: state
        entity_id: input_boolean.depressive_episode
        state: 'on'
      sequence:
      - alias: Turn off Depressive episode
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.depressive_episode
    - alias: 'Episode turned off: stop the routine, bright neutral white and a random
        playlist'
      conditions:
      - alias: Episode turned off, or Home Assistant restarted before the shutdown
          finished
        condition: or
        conditions:
        - alias: Depressive episode turned off
          condition: trigger
          id: end
        - alias: Home Assistant started with the episode off but a routine timer still
            running
          condition: and
          conditions:
          - alias: Home Assistant just started
            condition: trigger
            id: ha_start
          - alias: Depressive episode is off
            condition: state
            entity_id: input_boolean.depressive_episode
            state: 'off'
          - alias: A routine timer is still running
            condition: or
            conditions:
            - alias: Release timer running
              condition: state
              entity_id: timer.emotional_release
              state: active
            - alias: Recovery timer running
              condition: state
              entity_id: timer.emotional_recovery
              state: active
            - alias: Safety timer running
              condition: state
              entity_id: timer.emotional_regulation_safety
              state: active
      sequence:
      - alias: Cancel all the routine timers
        action: timer.cancel
        target:
          entity_id:
          - timer.emotional_release
          - timer.emotional_recovery
          - timer.emotional_regulation_safety
      - alias: Clear the check-in notification
        action: notify.mobile_app_phone_maxi
        data:
          message: clear_notification
          data:
            tag: emotional_regulation_checkin
        continue_on_error: true
      - alias: 'If Maxi is asleep: stop the music and hand the lights back gently;
          otherwise: bright neutral white and a random playlist'
        if:
        - alias: Maxi is asleep
          condition: state
          entity_id: sensor.is_maxi_asleep
          state: 'on'
        then:
        - alias: 'Asleep: stop the music and hand the lights back to Adaptive Lighting,
            in parallel'
          parallel:
          - alias: Stop the effects with a dim warm white, then hand the lights back
              to Adaptive Lighting
            sequence:
            - alias: Stop the effects with a dim warm white (3000 K, 20%)
              action: script.change_received_lights_to_white
              data:
                light:
                - light.group_all_inside_lights
                - light.group_patio_lights
                - light.hotbox_desk_tube_light
                color_temp_kelvin: 3000
                brightness_pct: 20
                transition_speed: 1
                only_on: true
                turn_off_uv: false
              continue_on_error: true
            - alias: Wait 3 seconds for the per-light scripts
              delay:
                seconds: 3
            - alias: Release Adaptive Lighting manual control on the routine lights
              action: adaptive_lighting.set_manual_control
              data:
                entity_id: switch.adaptive_lighting_adaptive_lighting
                lights:
                - light.group_all_inside_lights
                - light.group_patio_lights
                - light.hotbox_desk_tube_light
                manual_control: false
              continue_on_error: true
            - alias: Reapply Adaptive Lighting to the lit routine lights over 30 s
              action: adaptive_lighting.apply
              data:
                entity_id: switch.adaptive_lighting_adaptive_lighting
                lights:
                - light.group_all_inside_lights
                - light.group_patio_lights
                - light.hotbox_desk_tube_light
                adapt_brightness: true
                adapt_color: true
                turn_on_lights: false
                transition: 30
              continue_on_error: true
          - alias: Stop the music
            sequence:
            - alias: Clear the home speaker group queue
              action: media_player.clear_playlist
              target:
                entity_id: media_player.group_mass_home_group_speakers
              continue_on_error: true
            - alias: Stop the home speaker group
              action: media_player.media_stop
              target:
                entity_id: media_player.group_mass_home_group_speakers
              continue_on_error: true
        else:
        - alias: 'Awake: bright neutral white, the patio back to Adaptive Lighting
            and a random playlist, all at once'
          parallel:
          - alias: Fade the inside lights and the hotbox desk tube to bright neutral
              white (4000 K, 100%) over 75 s (stops the effects first)
            action: script.change_received_lights_to_white
            data:
              light:
              - light.group_all_inside_lights
              - light.hotbox_desk_tube_light
              color_temp_kelvin: 4000
              brightness_pct: 100
              transition_speed: 75
              only_on: true
              turn_off_uv: false
            continue_on_error: true
          - alias: Hand the patio lights back to Adaptive Lighting over 75 s
            sequence:
            - alias: Release Adaptive Lighting manual control on the patio lights
              action: adaptive_lighting.set_manual_control
              data:
                entity_id: switch.adaptive_lighting_adaptive_lighting
                lights:
                - light.group_patio_lights
                manual_control: false
              continue_on_error: true
            - alias: Reapply Adaptive Lighting to the lit patio lights over 75 s
              action: adaptive_lighting.apply
              data:
                entity_id: switch.adaptive_lighting_adaptive_lighting
                lights:
                - light.group_patio_lights
                adapt_brightness: true
                adapt_color: true
                turn_on_lights: false
                transition: 75
              continue_on_error: true
          - alias: Play one of Maxi's playlists at random right away
            sequence:
            - alias: Clear the home speaker group queue
              action: media_player.clear_playlist
              target:
                entity_id: media_player.group_mass_home_group_speakers
              continue_on_error: true
            - alias: Start a random Maxi playlist on the home group now
              action: script.start_a_random_maxi_playlist
              data:
                player_entity: media_player.group_mass_home_group_speakers
                requested_playlist: none
              continue_on_error: true
  mode: queued
  max: 10
