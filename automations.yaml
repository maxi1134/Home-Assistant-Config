      seconds: 0
  conditions: []
  actions:
  - alias: Fade out the front door light over 5 min
    action: light.turn_off
    metadata: {}
    data:
      transition: 300
    target:
      entity_id: light.front_door_light
  mode: single
- id: '1729519649402'
  alias: Front door automation on unlock for conditional codes
  description: 'When guest code 6 is entered on the front door keypad while Maxi is
    home: if guest entry is enabled and party mode is on, snapshots the door, unlocks
    it, shows a multilingual welcome on the front door phone and announces that a
    guest is being let in, clearing the text once the door relocks. Otherwise it makes
    a doorbell-style ''Someone is at the front door!'' announcement. Its trigger and
    keypad sensors no longer exist, so it currently never runs.'
  triggers:
  - alias: Guest code 6 used on the front door lock
    trigger: state
    entity_id:
    - sensor.lock_front_door_action_user
    to: '6'
    id: A Guest
  conditions:
  - alias: Was the door unlocked with the keypad?
    condition: template
    value_template: '{{  states(''sensor.lock_front_door_action_source_name'') ==
      ''keypad'' }}'
  - alias: Maxi is home
    condition: state
    entity_id: person.maximiliano
    state: home
  actions:
  - alias: Handle the guest code
    choose:
    - alias: Triggered by the guest code
      conditions:
      - alias: Triggered by guest code 6
        condition: trigger
        id:
        - A Guest
      sequence:
      - alias: Let in or announce, by guest settings
        choose:
        - alias: Guest entry on in party mode → let in
          conditions:
          - alias: Guest code entry is enabled
            condition: state
            entity_id: input_boolean.front_door_event_unlocking_code_automation_condition
            state:
            - 'on'
          - alias: Party mode is on
            condition: state
            entity_id: input_boolean.party_mode
            state:
            - 'on'
          sequence:
          - alias: Snapshot the front door camera
            metadata: {}
            data:
              filename: /media/front_door_guest_let_in.png
            target:
              entity_id: camera.front_door_ptz_camera_clear
            action: camera.snapshot
          - alias: Unlock the front door
            action: lock.unlock
            target:
              entity_id: lock.lock_front_door
            data:
              code: '2487'
          - alias: Wait up to 2 min for the door to unlock
            wait_for_trigger:
            - alias: Front door unlocks
              trigger: state
              entity_id:
              - lock.lock_front_door
              to:
              - unlocked
            continue_on_timeout: true
            timeout:
              hours: 0
              minutes: 2
              seconds: 0
              milliseconds: 0
            enabled: true
          - alias: Show the welcome text on the front door phone
            action: input_text.set_value
            metadata: {}
            target:
              entity_id: input_text.front_door_phone_text
            data:
              value: Welcome; Enter! Bienvenu, Entrez! Bienvenido, Entra!
          - alias: Announce a guest is being let in
            metadata: {}
            data:
              url: 'http://192.168.0.11:1984/stream.html?&src=front_door_camera_sub&mode=webrtc

                '
              message: A guest is being let in through the front door
              color: Blue
              phone_data:
                message: A guest is being let in through the front door
                data:
                  channel: doorbell_notifications
                  image: /media/local/front_door_guest_let_in.png
                  actions:
                  - action: URI
                    title: Security Tab
                    uri: /maxi-mobile/main-view#security_popup
                  - action: REPLY
                    title: Enter Text
                  - action: URI
                    title: Open Cameras
                    uri: /maxi-mobile/main-view#cameras
            action: script.broadcast_alert_in_the_house
            continue_on_error: true
          - alias: Show the welcome text again
            action: input_text.set_value
            metadata: {}
            target:
              entity_id: input_text.front_door_phone_text
            data:
              value: Welcome; Enter! Bienvenu, Entrez! Bienvenido, Entra!
          - alias: Wait up to 2 min for the door to relock
            wait_for_trigger:
            - alias: Front door locked for 10 s
              trigger: state
              entity_id:
              - lock.lock_front_door
              to:
              - locked
              for:
                hours: 0
                minutes: 0
                seconds: 10
              from:
              - unlocked
            continue_on_timeout: true
            timeout:
              hours: 0
              minutes: 2
              seconds: 0
              milliseconds: 0
            enabled: true
          - alias: Reset front door phone text to Empty
            action: input_text.set_value
            metadata: {}
            target:
              entity_id: input_text.front_door_phone_text
            data:
              value: Empty
        default:
        - metadata: {}
          data:
            url: 'http://192.168.0.11:1984/stream.html?&src=front_door_camera_sub&mode=webrtc

              '
            message: Someone is at the front door!
            color: Blue
            phone_data:
              message: Someone is at the door!
              data:
                channel: doorbell_notifications
                image: 'https://hass.purgatoire.ca/api/frigate/notifications/{{states("sensor.latest_frigate_event_id")}}/snapshot.jpg

                  '
                actions:
                - action: URI
                  title: Security Tab
                  uri: /maxi-mobile/main-view#security_popup
                - action: REPLY
                  title: Enter Text
                - action: URI
                  title: Open Cameras
                  uri: /maxi-mobile/main-view#cameras
          action: script.broadcast_alert_in_the_house
          alias: 'Otherwise: doorbell-style announcement'
  mode: restart
- id: '1729698675763'
  alias: Notify when someone leaves through front door
  description: When the front door lock reports unlocked while the front outside door
    is open, briefly flashes the lit notification lights green as a low-priority alert,
    with no announcement.
  triggers:
  - alias: Front door lock unlocks
    device_id: ee2552d06c36532d24970f8168e9af7e
    domain: lock
    entity_id: aa803e0ef9750defe48030e184ec2360
    type: unlocked
    trigger: device
  conditions:
  - alias: Front outside door is open
    condition: state
    entity_id: binary_sensor.sensor_front_outside_door_contact
    state:
    - 'on'
  actions:
  - alias: Flash notification lights green
