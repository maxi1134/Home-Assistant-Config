  alias: Dial Bedroom automation
  description: 'Maps the bedroom dial (IKEA SYMFONISK, blueprint) to the bedroom Chromecast
    while it plays or is paused on non-Visuals content and is unmuted, and otherwise
    to the bedroom Voice PE speaker: rotating changes the volume, a single press plays
    or pauses, a double press skips to the next track and a triple press turns the
    device off.'
  use_blueprint:
    path: EPMatt/ikea_e1744.yaml
    input:
      integration: ZHA
      controller_device: aff5e17204a91c14de15d339182b0d7e
      helper_last_controller_event: input_text.dial_bedroom_helper
      action_rotate_left:
      - sequence:
        - if:
          - alias: If the TV is in use
            condition: and
            conditions:
            - alias: Playing or paused
              condition: state
              entity_id: media_player.bedroom_chromecast
              state:
              - playing
              - paused
            - alias: TV not off or showing Plex Visuals
              condition: not
              conditions:
              - alias: TV off
                condition: state
                entity_id: media_player.universal_bedroom_chromecast
                state: 'off'
              - alias: TV showing Plex Visuals
                condition: state
                entity_id: media_player.universal_bedroom_chromecast
                attribute: media_library_title
                state: Visuals
            - alias: TV not muted, or the speaker is silent too
