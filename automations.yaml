    metadata: {}
    data:
      color: green
  mode: single
- id: '1729698938654'
  alias: Alert maxi if someone enters his room while alarm is set to armed home
  description: When the bedroom door opens or bedroom motion starts while the alarm
    is armed home, notifies Maxi and repeats 'Please leave this room immediately.'
    at full volume on the bedroom speaker every few seconds while the door stays open
    or motion continues and the alarm stays armed home.
  triggers:
  - alias: Bedroom door opens
    trigger: state
    entity_id:
    - binary_sensor.sensor_bedroom_door_contact
    from: 'off'
    to: 'on'
  - alias: Bedroom motion starts
    trigger: state
    entity_id:
    - binary_sensor.group_bedroom_motion_occupancy
    from: 'off'
    to: 'on'
  conditions:
  - alias: Alarm is armed home
    condition: state
    entity_id: alarm_control_panel.home_alarm
    state: armed_home
  actions:
  - alias: 'Notify Maxi: someone entered the bedroom'
    action: notify.maxi_notification_group
    data:
      message: Someone has entered the bedroom
      title: Security Alert
      data:
        ttl: 0
        priority: high
        channel: security_alerts_notifications
  - alias: Set bedroom speaker to full volume
    action: media_player.volume_set
    metadata: {}
    data:
      volume_level: 1
    target:
      entity_id: media_player.mass_bedroom_vpe_speaker
  - alias: Repeat the warning while someone is there
    repeat:
      while:
      - alias: Bedroom door open or motion on
        condition: or
        conditions:
        - alias: Bedroom door is open
          condition: state
          entity_id: binary_sensor.sensor_bedroom_door_contact
          state: 'on'
        - alias: Bedroom motion is on
          condition: state
          entity_id: binary_sensor.group_bedroom_motion_occupancy
          state:
          - 'on'
      - alias: Alarm is still armed home
        condition: state
        entity_id: alarm_control_panel.home_alarm
        state: armed_home
      sequence:
      - alias: Say 'Please leave this room immediately'
        action: tts.speak
        metadata: {}
        data:
          cache: true
          media_player_entity_id: media_player.mass_bedroom_vpe_speaker
          message: Please leave this room immediately.
        target:
          entity_id:
          - tts.piper_2
      - alias: Set bedroom speaker to full volume
        action: media_player.volume_set
        metadata: {}
        data:
          volume_level: 1
        target:
          entity_id: media_player.mass_bedroom_vpe_speaker
      - alias: Wait 5 seconds
        delay:
          hours: 0
          minutes: 0
          seconds: 5
          milliseconds: 0
  - alias: Wait for bedroom motion to clear 5 min
    wait_for_trigger:
    - alias: Bedroom motion clear for 5 min
      trigger: state
      entity_id:
      - binary_sensor.group_bedroom_motion_occupancy
      from: 'on'
      to: 'off'
      for:
        hours: 0
        minutes: 5
        seconds: 0
    continue_on_timeout: false
  mode: restart
- id: '1730428380200'
