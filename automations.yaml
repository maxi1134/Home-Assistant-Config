- id: '1753302685762'
  alias: Adjust Kitchen Tablet brightness to match the lights
  description: Keeps the hotbox bed tablet's screen brightness equal to the hotbox
    bed lights' brightness (0 when they are off), updating 1 second after the lights
    change.
  triggers:
  - alias: Hotbox bed lights change (1 s)
    trigger: state
    entity_id:
    - light.hotbox_hotbox_bed_lights
    for:
      hours: 0
      minutes: 0
      seconds: 1
  conditions: []
  actions:
  - alias: Read the bed lights' brightness
    variables:
      brightness: '{{ trigger.to_state.attributes.brightness | default(''0'', true)  }}

        '
  - alias: Set the hotbox bed tablet screen brightness
    action: number.set_value
    metadata: {}
    data:
