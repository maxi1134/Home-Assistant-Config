- id: '1745468097447'
  alias: 'Frigate front Doors Notifications '
  description: 'Frigate notifications for the front door camera (SgtBatten blueprint):
    when Frigate detects a person in the front door loitering zone and the neighbours
    are not having a party, sends Maxi''s phone a sticky red security notification
    (''Front Door Presence Detected'') with a snapshot, preview video, clip link and
    buttons to view the stream or blare the front horn. A new notification follows
    if the person stays put for more than 12 seconds; it runs even while Maxi sleeps.'
  use_blueprint:
    path: SgtBatten/Stable.yaml
    input:
      presence_filter:
      - ''
      camera:
      - camera.front_door_camera
      notify_device: 351e8ae8a89482b8a4b05785f651bf91
      title: Front Door Presence Detected
      message: '{{ label }} detected - {{ camera_name }} at {{event[''after''][''start_time'']|timestamp_custom(''%H:%M'')}}'
      update_sub_label: false
      subtitle: '{{ camera_name }}  presence triggered'
      critical: 'false'
      tts: false
      tts_helper: input_text.frigate_alerted_ids
      video: '{{base_url}}/api/frigate{{client_id}}/notifications/{{id}}/event_preview.gif?format=ts'
      attachment_2: '{{base_url}}/api/frigate{{client_id}}/notifications/{{review_id}}/review_preview.gif'
      final_update: false
      color: '#f44336'
      icon: mdi:cctv
      sticky: true
      channel: security_alerts_notifications
      url_1: '{{base_url}}/api/frigate{{client_id}}/notifications/{{id}}/{{camera}}/clip.mp4'
      button_2: View Stream
      url_2: '{{base_url}}/api/camera_proxy_stream/camera.{{trigger.payload_json[''after''][''camera'']
        | lower | replace(''-'',''_'')}}?token={{state_attr( ''camera.'' ~ camera,
        ''access_token'')}}'
      cooldown: 0
      attachment: '{{base_url}}/api/frigate{{client_id}}/notifications/{{id}}/snapshot.jpg?bbox=1'
      alert_once: true
      labels:
      - package
      - person
      review_severity:
      - alert
      - detection
      sound: default
      custom_action_manual:
      - action: switch.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: switch.plug_front_door_horn
      button_3: Blare the Front horn
      url_3: custom-{{ this.entity_id }}
      zones:
      - front_door_loitering
      zone_filter: true
      master_condition:
      - condition: state
        entity_id: input_boolean.neighbours_having_a_party
        state: 'off'
      - condition: switch.is_on
        target:
          entity_id: input_boolean.waiting_package
        options:
          behavior: any
          for: 00:00:00
      loiter_timer: 20
      custom_filter: 'true'
      zone_order_enforced: false
