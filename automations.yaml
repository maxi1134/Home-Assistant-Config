- id: '1715717946486'
  alias: Doorbell Main automation
  description: 'When the doorbell button is pressed (any press type) or the doorbell
    camera sees a visitor, and the door has not already rung, marks the door as rung
    and snapshots the front door camera. It then shows the camera on the QuickBars
    TVs and sends an important house alert: blue light flash, ''Someone is at the
    front door!'', the camera stream on idle TVs and a phone notification with unlock,
    reply and security buttons. During a neon UV party a second, red alert is sent
    as well.'
  triggers:
  - alias: Doorbell button long press
    device_id: bfcdf595a35cd8a0565307760602cc7d
    domain: zha
    type: remote_button_long_press
    subtype: button
    trigger: device
  - alias: Doorbell button double press
    device_id: bfcdf595a35cd8a0565307760602cc7d
    domain: zha
    type: remote_button_double_press
    subtype: remote_button_double_press
    trigger: device
  - alias: Doorbell button short press
    device_id: bfcdf595a35cd8a0565307760602cc7d
    domain: zha
    type: remote_button_short_press
    subtype: remote_button_short_press
    trigger: device
  - alias: Doorbell button triple press
    device_id: bfcdf595a35cd8a0565307760602cc7d
    domain: zha
    type: remote_button_triple_press
    subtype: remote_button_triple_press
    trigger: device
  - alias: Doorbell button long release
    device_id: bfcdf595a35cd8a0565307760602cc7d
    domain: zha
    type: remote_button_long_release
    subtype: button
    trigger: device
  - alias: Doorbell camera sees a visitor
    trigger: state
    entity_id:
    - binary_sensor.front_doorbell_camera_visitor
    to:
    - 'on'
  conditions:
  - alias: Front outside door is not open
    condition: not
    conditions:
    - alias: Front outside door is open
      condition: state
      entity_id: binary_sensor.sensor_front_outside_door_contact
      state: 'on'
    enabled: false
  - alias: Door has not already rung
    condition: state
    entity_id: input_boolean.door_rang
    state:
    - 'off'
  actions:
  - alias: Mark the door as rung
    target:
      entity_id: input_boolean.door_rang
    data: {}
    action: input_boolean.turn_on
  - alias: Refresh the latest Frigate event id
    metadata: {}
    data: {}
    target:
      entity_id: sensor.latest_frigate_event_id
    action: homeassistant.update_entity
  - alias: Snapshot the front door camera
    metadata: {}
    data:
      filename: /media/front_door_capture_on_ringing.png
    action: camera.snapshot
    target:
      entity_id: camera.front_door_ptz_camera_fluent
  - alias: Show camera and send alerts in parallel
    parallel:
    - alias: Show front door camera on QuickBars TVs
      action: script.quickbars_display_camera_pip_on_all_android_tv
      metadata: {}
      data: {}
    - alias: Empty placeholder (does nothing)
      if: []
      then: []
    - alias: Extra red alert during a UV party
      choose:
      - alias: Neon UV party → red alert
        conditions:
        - alias: Neon UV party is on
          condition: state
          entity_id: input_boolean.neon_uv_party
          state:
          - 'on'
        sequence:
        - alias: Broadcast doorbell alert with red lights
          metadata: {}
          data:
            url: 'http://192.168.0.11:1984/stream.html?&src=front_door_camera_sub&mode=webrtc

              '
            message: Someone is at the front door!
            color: Red
            phone_data:
              message: Someone is at the door!
              data:
                channel: doorbell_notifications
                image: /media/local/front_door_capture_on_ringing.png
                actions:
                - title: Unlock Front Door
                  action: UNLOCK_FRONT_DOOR
                - action: REPLY
                  title: Enter Text
                - action: URI
                  title: Security Tab
                  uri: /maxi-mobile/main-view#security_popup
          action: script.broadcast_alert_in_the_house
    - alias: Broadcast doorbell alert with blue lights
      metadata: {}
      data:
        url: 'http://192.168.0.11:1984/stream.html?&src=front_door_camera_sub&mode=webrtc

          '
        message: Someone is at the front door!
        color: Blue
        phone_data:
          message: Someone is at the door!
          data:
            channel: doorbell_notifications
            image: /media/local/front_door_capture_on_ringing.png
            actions:
            - title: Unlock Front Door
              action: UNLOCK_FRONT_DOOR
            - action: REPLY
              title: Enter Text
            - action: URI
              title: Security Tab
              uri: /maxi-mobile/main-view#security_popup
      action: script.broadcast_alert_in_the_house
  - alias: Wait 1 minute
    delay:
      hours: 0
      minutes: 1
      seconds: 0
      milliseconds: 0
  mode: single
