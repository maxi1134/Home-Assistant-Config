- id: '1717285150530'
  alias: Start rain sounds where maxi is sleeping
  description: When Maxi's sleeping location changes while Maxi is home and alone,
    plays the thunderstorm rain sound on the Music Assistant speaker in that room
    at 42% volume, first unjoining it from any group. If the thunderstorm is already
    playing there, it only resets the volume to 42%.
  triggers:
  - alias: Maxi's sleeping location changes
    entity_id:
    - sensor.where_is_maxi_sleeping
    trigger: state
  conditions:
  - alias: Maxi is home
    condition: state
    entity_id: person.maximiliano
    state: home
  - alias: Sleeping location is known
    condition: not
    conditions:
    - alias: Location is unavailable, unknown or empty
      condition: state
      entity_id: sensor.where_is_maxi_sleeping
      state:
      - unavailable
      - unknown
      - ''
  - alias: Maxi is alone
    condition: state
    entity_id: binary_sensor.maxi_alone
    state:
    - 'on'
  actions:
  - alias: Find the speaker in Maxi's sleeping room
    variables:
      maxi_location: '{% set fallback = states(''sensor.where_is_maxi_sleeping'')
        %}

        {% set ts = trigger.get(''to_state'') if trigger is defined and trigger is
        mapping else none %}

        {{ ts.state | default(fallback, true) if ts is not none else fallback }}'
      sleeper_speaker_mass: "{{ [maxi_location] | map('area_entities') | sum(start=[])\n
        \  | select('match', '^media_player.mass.*speaker[s]?$')\n   | unique | list
        | first | default('') }}"
  - alias: Continue only if a speaker was found
    condition: template
    value_template: '{{ sleeper_speaker_mass != '''' }}'
  - alias: If the thunderstorm is not already playing
    if:
    - alias: Speaker is not playing the thunderstorm
      condition: template
      value_template: '{{ state_attr(sleeper_speaker_mass, ''media_title'') != ''thunderstorm''
        }}'
    then:
    - alias: Unjoin the speaker from its group
      action: media_player.unjoin
      metadata: {}
      data: {}
      target:
        entity_id: '{{ sleeper_speaker_mass }}'
    - alias: Wait 5 seconds
      delay:
        hours: 0
        minutes: 0
        seconds: 5
        milliseconds: 0
    - alias: Play the thunderstorm sound
      data:
        media:
          media_content_id: http://192.168.0.15:8123/local/thunderstorm.mp4
          media_content_type: music
          metadata: {}
      target:
        entity_id: '{{ sleeper_speaker_mass }}'
      action: media_player.play_media
    - alias: Unmute the speaker
      metadata: {}
      data:
        is_volume_muted: false
      target:
        entity_id: '{{ sleeper_speaker_mass }}'
      action: media_player.volume_mute
    - alias: Raise the speaker volume
      metadata: {}
      target:
        entity_id: '{{ sleeper_speaker_mass }}'
      action: media_player.volume_up
    - alias: Wait 0.75 seconds
      delay:
        hours: 0
        minutes: 0
        seconds: 0
        milliseconds: 750
    - alias: Set speaker volume to 42%
      action: media_player.volume_set
      metadata: {}
      data:
        volume_level: 0.42
      target:
        entity_id: '{{ sleeper_speaker_mass }}'
    else:
    - alias: Set speaker volume to 42%
      action: media_player.volume_set
      metadata: {}
      data:
        volume_level: 0.42
      target:
        entity_id: '{{ sleeper_speaker_mass }}'
  mode: single
