- id: '1759251745280'
  alias: Notify maxi when myriam arrives at home
  description: Sends a mobile notification to Maxi when Myriam arrives home after
    being away for over 4000 s (~67 min), but only once her phone joins the home Wi-Fi
    (Chilling Family or Chilling Hotspot) within 15 minutes of entering the home zone.
    She lives a street away, so the GPS zone alone gives false alerts.
  triggers:
  - alias: Myriam's GPS arrives home
    trigger: state
    entity_id:
    - person.myriam
    from: not_home
    to: home
    id: myriam_arrives
  conditions:
  - alias: Myriam was away for over 4000 s
    condition: template
    value_template: '{{  ((as_timestamp((now()) )   - (as_timestamp(trigger.from_state.last_changed))))
      | float > 4000 and trigger.from_state.state == ''not_home'' }}'
  actions:
  - alias: Only notify once Myriam's phone is on the home Wi-Fi
    if:
    - alias: Phone not yet on home Wi-Fi
      condition: not
      conditions:
      - alias: Phone on Chilling Family or Hotspot
        condition: state
        entity_id: sensor.phone_myriam_s26_wi_fi_connection
        state:
        - Chilling Family
        - Chilling Hotspot
    then:
    - alias: Wait up to 15 min for home Wi-Fi
      wait_for_trigger:
      - alias: Phone joins home Wi-Fi
        trigger: state
        entity_id: sensor.phone_myriam_s26_wi_fi_connection
        to:
        - Chilling Family
        - Chilling Hotspot
      timeout:
        minutes: 15
      continue_on_timeout: false
  - alias: 'Notify Maxi: Myriam is nearing home'
    metadata: {}
    data:
      data:
        image:
      message: Myriam is nearing home!
      title: Myriam is nearing home!
    action: notify.maxi_notification_group
  mode: restart
- id: '1759251903732'
  alias: Alert myriam when lylou nears home
  description: Sends a mobile notification to Myriam when Lylou arrives home, but
    only if Lylou has been away for at least 4 minutes and Myriam is not currently
    home.
  triggers:
  - alias: Lylou arrives home
    trigger: state
    entity_id:
    - person.lylou
    from: not_home
    to: home
    id: lylou_arrives
  conditions:
  - alias: Lylou was away for over 240 s
    condition: template
    value_template: '{{  ((as_timestamp((now()) )   - (as_timestamp(trigger.from_state.last_changed))))
      | float > 240 and trigger.from_state.state == ''not_home'' }}'
  - alias: Myriam is not at Maxi's
    condition: not
    conditions:
    - alias: Myriam is at Maxi's
      condition: state
      entity_id: binary_sensor.myriam_at_maxis
      state: 'on'
  actions:
  - alias: 'Notify Myriam: Lylou is nearing home'
