- id: '1740690697244'
  alias: Control brightness of Front door Phone to avoid discharge
  description: When the front door phone battery drops below 50%, dims its screen
    to brightness 50 (or to 5 and turns the screen off if it is already below 15%).
    When the battery rises above 90% with the screen off, turns the screen back on
    at brightness 100.
  triggers:
  - alias: Front door phone battery changes
    entity_id:
    - sensor.front_door_phone_battery
    trigger: state
    enabled: false
  - alias: Battery drops below 50%
    trigger: numeric_state
    entity_id:
    - sensor.front_door_phone_battery
    below: 50
  - alias: Battery rises above 90%
    trigger: numeric_state
    entity_id:
    - sensor.front_door_phone_battery
    above: 90
  conditions: []
  actions:
  - alias: Adjust the screen by battery level
    choose:
    - alias: Below 15% → dim and turn screen off
      conditions:
      - alias: Battery below 15%
        condition: numeric_state
        entity_id: sensor.front_door_phone_battery
        below: 15
      - alias: Screen is on
        condition: state
        entity_id: switch.front_door_phone_screen
        state: 'on'
      sequence:
      - alias: Set screen brightness to 5
        action: number.set_value
        metadata: {}
        data:
          value: '5'
        target:
          entity_id: number.front_door_phone_screen_brightness
      - alias: Turn off the front door phone screen
        action: switch.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: switch.front_door_phone_screen
    - alias: Below 50% → dim the screen
      conditions:
      - alias: Battery below 50%
        condition: numeric_state
        entity_id: sensor.front_door_phone_battery
        below: 50
      - alias: Screen is on
        condition: state
        entity_id: switch.front_door_phone_screen
        state: 'on'
      sequence:
      - alias: Set screen brightness to 50
        action: number.set_value
        metadata: {}
        data:
          value: '50'
        target:
          entity_id: number.front_door_phone_screen_brightness
    - alias: Above 90% → screen on at full
      conditions:
      - alias: Battery above 90%
        condition: numeric_state
        entity_id: sensor.front_door_phone_battery
        above: 90
      - alias: Screen is off
        condition: state
        entity_id: switch.front_door_phone_screen
        state: 'off'
      sequence:
      - alias: Turn on the front door phone screen
        action: switch.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: switch.front_door_phone_screen
      - alias: Set screen brightness to 100
        action: number.set_value
        metadata: {}
        data:
          value: '100'
        target:
          entity_id: number.front_door_phone_screen_brightness
  mode: single
