- id: '1743281098829'
  alias: Alert when back horns rings and offer to turn it off
  description: When the back door horn turns on, snapshots the back door camera and
    sends a 'Back horn started' notification with a 'Stop the horn?' button to Maxi
    (twice), to Myriam when she is at Maxi's, and to Lylou when Lylou is home without
    Maxi or Myriam, after raising the volumes on Lylou's phone. If someone taps the
    button within 3 minutes, the horn turns off.
  triggers:
  - alias: Back horn turns on
    entity_id:
    - switch.plug_back_door_horn
    to: 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 0
    trigger: state
  conditions: []
  actions:
  - alias: Snapshot the back door camera
    metadata: {}
    data:
      filename: /media/back_horn_check.png
    action: camera.snapshot
    target:
      entity_id: camera.back_door_camera
  - alias: If Myriam is at Maxi's
    if:
    - alias: Myriam is at Maxi's
      condition: state
      entity_id: binary_sensor.myriam_at_maxis
      state: 'on'
    then:
    - alias: 'Notify Myriam: back horn started'
      metadata: {}
      data:
        message: Back horn started
        data:
          image: /media/local/back_horn_check.png
          actions:
          - action: stop_horn
            title: Stop the horn?
          channel: security_alerts_notifications
          ttl: 0
          priority: high
        title: Security breach
      action: notify.mobile_app_phone_myriam
  - alias: Empty parallel block (does nothing)
    parallel: []
  - alias: If only Lylou is home
    if:
    - alias: Myriam is not at Maxi's
      condition: not
      conditions:
      - alias: Myriam is at Maxi's
        condition: state
        entity_id: binary_sensor.myriam_at_maxis
        state: 'on'
    - alias: Maxi is away
      condition: state
      entity_id: person.maximiliano
      state:
      - not_home
    - alias: Lylou is home
      condition: state
      entity_id: person.lylou
      state:
      - home
    then:
    - alias: Raise Lylou's phone volumes to 20
      parallel:
      - alias: Set Lylou's call volume to 20
        metadata: {}
        data:
          message: command_volume_level
          data:
            media_stream: call_stream
            command: 20
        action: notify.mobile_app_phone_lylou
      - alias: Set Lylou's call volume to 20 again
        metadata: {}
        data:
          message: command_volume_level
          data:
            media_stream: call_stream
            command: 20
        action: notify.mobile_app_phone_lylou
      - alias: Set Lylou's alarm volume to 20
        metadata: {}
        data:
          message: command_volume_level
          data:
            media_stream: alarm_stream
            command: 20
        action: notify.mobile_app_phone_lylou
      - alias: Set Lylou's notification volume to 20
        metadata: {}
        data:
          message: command_volume_level
          data:
            media_stream: notification_stream
            command: 20
        action: notify.mobile_app_phone_lylou
      - alias: Set Lylou's notification volume to 20 again
        metadata: {}
        data:
          message: command_volume_level
          data:
            media_stream: notification_stream
            command: 20
        action: notify.mobile_app_phone_lylou
      - alias: Set Lylou's DTMF volume to 20
        metadata: {}
        data:
          message: command_volume_level
          data:
            media_stream: dtmf_stream
            command: 20
        action: notify.mobile_app_phone_lylou
      - alias: Set Lylou's music volume to 20
        metadata: {}
        data:
          message: command_volume_level
          data:
            media_stream: music_stream
            command: 20
        action: notify.mobile_app_phone_lylou
    - alias: 'Notify Lylou: back horn started'
      metadata: {}
      data:
        message: Back horn started
        data:
          image: /media/local/back_horn_check.png
          actions:
          - action: stop_horn
            title: Stop the horn?
          channel: security_alerts_notifications
          ttl: 0
          priority: high
        title: Security breach
      action: notify.mobile_app_phone_lylou
  - alias: 'Notify Maxi: back horn started'
    metadata: {}
    data:
      message: Back horn started
      data:
        image: /media/local/back_horn_check.png
        actions:
        - action: stop_horn
          title: Stop the horn?
        channel: security_alerts_notifications
        ttl: 0
        priority: high
