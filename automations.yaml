- id: '1754679794287'
  alias: Turn on Blue Light with UV Lamps in Same Area
  description: When a room's UV lamp group (hallway, kitchen, lounge, patio, salon
    or workshop) turns on and no live concert is on, sets that room's color lights
    to bright blue (RGB 0,0,255) at full brightness.
  triggers:
