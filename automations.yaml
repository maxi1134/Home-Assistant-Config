- id: '1792624803839'
  alias: Mute the salon TV while Batocera sits idle on HDMI 1
  description: 'Batocera (the retro console) is on the salon TV''s HDMI 1. Once Salon
    TV Batocera idle (the TV shows Batocera with no controller connected) has been
    on for 2 minutes, mutes the TV over RS-232, and mutes it again if anything unmutes
    it while Batocera still sits idle (the Assist occupancy automations turn off every
    ''…mute'' switch on motion, the TV''s HomeKit mute included). When the TV is in
    use again (Universal salon chromecast leaves off: a controller connects, or anything
    starts playing), unmutes it.'
  triggers:
  - alias: Batocera idle on the salon TV for 2 min
    trigger: state
    entity_id: binary_sensor.salon_tv_batocera_idle
    to: 'on'
    for:
      hours: 0
      minutes: 2
      seconds: 0
    id: idle
  - alias: Bravia unmuted (mute it again if Batocera still sits idle)
    trigger: media_player.unmuted
    target:
      entity_id: media_player.bravia_4k_ae2
    id: idle
  - alias: Salon TV in use again (controller connected, or something started)
    trigger: media_player.turned_on
    target:
      entity_id: media_player.universal_salon_chromecast
    id: in_use
  conditions: []
  actions:
  - choose:
    - alias: 'Batocera idle on HDMI 1 for 2 min: mute the TV'
      conditions:
      - condition: trigger
        id: idle
      - alias: Batocera idle for 2 min
        condition: state
        entity_id: binary_sensor.salon_tv_batocera_idle
        state: 'on'
        for:
          hours: 0
          minutes: 2
          seconds: 0
      - alias: TV not muted yet
        condition: media_player.is_unmuted
        target:
          entity_id: media_player.bravia_4k_ae2
      sequence:
      - alias: Mute the salon TV over RS-232
        action: media_player.volume_mute
        target:
          entity_id: media_player.sony_tv
        data:
          is_volume_muted: true
    - alias: 'Salon TV in use again: unmute it'
      conditions:
      - condition: trigger
        id: in_use
      sequence:
      - alias: A TV that just woke reports its retained mute a few seconds late, so
          let it settle
        if:
        - condition: not
          conditions:
          - condition: media_player.is_on
            target:
              entity_id: media_player.bravia_4k_ae2
            options:
              for: 00:00:15
        then:
        - delay: 00:00:12
      - alias: Salon TV still in use
        condition: media_player.is_on
        target:
          entity_id: media_player.universal_salon_chromecast
      - alias: TV is muted
        condition: media_player.is_muted
        target:
          entity_id: media_player.bravia_4k_ae2
      - alias: Unmute the salon TV over RS-232
        action: media_player.volume_mute
        target:
          entity_id: media_player.sony_tv
        data:
          is_volume_muted: false
  mode: queued
  max: 5
- id: '1792873302706'
  alias: Turn on sleeper in bedroom when Maxi is inferred asleep
  description: 'When Maxi has been inferred asleep in the bedroom for 30 minutes (binary_sensor.maxi_asleep_inferred:
    phone unused for 20 min and the phone''s sleep confidence high) between 22:00
    and 07:00 while he is home alone, turns on the bedroom sleeper flag as if the
    sleeper button had been double-pressed, which runs the usual bedtime actions.
    Covers nights he falls asleep without the CPAP or the button. Backtest 2026-10-13
    to 10-24: on 2026-10-24 it fires at 00:56 instead of the 03:18 button press; one
    early fire on 2026-10-18 at 00:57, 19 min before he pressed the button himself
    while watching TV in bed. A wrong fire is undone by turning the chandelier up
    (sleeper auto-off after 2 min) or double-pressing the button.'
  triggers:
  - alias: Maxi inferred asleep for 30 min
    trigger: state
    entity_id:
    - binary_sensor.maxi_asleep_inferred
    to: 'on'
    for:
      hours: 0
      minutes: 30
      seconds: 0
  conditions:
  - alias: Bedroom sleeper is not already on
    condition: state
    entity_id: input_boolean.sleeper_in_bedroom
    state: 'off'
  - alias: Between 22:00 and 07:00
    condition: time
    after: '22:00:00'
    before: 07:00:00
  - alias: Maxi is home alone
    condition: state
    entity_id: binary_sensor.maxi_alone
    state: 'on'
  actions:
  - alias: Turn on the bedroom sleeper flag
    action: input_boolean.turn_on
    metadata: {}
    data: {}
    target:
      entity_id: input_boolean.sleeper_in_bedroom
  mode: single
