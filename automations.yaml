              - alias: TV not muted
                condition: not
                conditions:
                - condition: state
                  entity_id: media_player.universal_bedroom_chromecast
                  attribute: is_volume_muted
                  state: true
              - alias: Speaker muted, paused or idle
                condition: or
                conditions:
                - condition: state
                  entity_id: media_player.mass_bedroom_vpe_speaker
                  state:
                  - paused
                  - idle
                - condition: state
                  entity_id: media_player.mass_bedroom_vpe_speaker
                  attribute: is_volume_muted
                  state: true
          then:
          - action: media_player.volume_down
            metadata: {}
            data: {}
            target:
              entity_id: media_player.bedroom_chromecast
          else:
          - alias: Only while the speaker is on
            if:
            - alias: Speaker is not off or unavailable
              condition: not
              conditions:
              - condition: state
                entity_id: media_player.mass_bedroom_vpe_speaker
