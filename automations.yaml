- id: '1733789430500'
  alias: Turn on the front door light in relation to the sun position
  description: A minute after sunset, turns the front door light on at full brightness
    (4628 K, 20-second fade) if it is off or dim. It checks again every 30 minutes,
    but the loop ends as soon as the light is found on and bright.
  triggers:
  - alias: Sun set 1 min ago
    trigger: state
    entity_id:
    - sun.sun
    from:
    to: below_horizon
    for:
      hours: 0
      minutes: 1
      seconds: 0
  conditions: []
  actions:
  - alias: Repeat while dark and the light is off or dim
    repeat:
      sequence:
      - alias: Turn on front door light 100%, 4628 K
        action: light.turn_on
        metadata: {}
        data:
          transition: 20
          color_temp_kelvin: 4628
          brightness_pct: 100
        target:
          entity_id: light.front_door_light
      - alias: Wait 30 minutes
        delay:
          hours: 0
          minutes: 30
          seconds: 0
          milliseconds: 0
      while:
      - alias: Sun is below the horizon
        condition: state
        entity_id: sun.sun
        state: below_horizon
      - alias: Light is off or dim
        condition: or
        conditions:
        - alias: Light brightness below 50
          condition: numeric_state
          entity_id: light.front_door_light
          attribute: brightness
          below: 50
        - alias: Light is off
          condition: state
          entity_id: light.front_door_light
          state: 'off'
