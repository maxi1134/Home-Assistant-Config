      hours: 0
      minutes: 1
      seconds: 0
    attribute: app_id
  - alias: Kitchen hub paused for 10 min
    trigger: state
    entity_id:
    - media_player.kitchen_google_hub
    from: playing
    to: paused
    for:
      hours: 0
      minutes: 10
      seconds: 0
  conditions:
  - alias: Hub is not in an excluded app
    condition: not
    conditions:
    - alias: App is A078F6B0
      condition: state
      entity_id: media_player.kitchen_google_hub
      attribute: app_id
      state: A078F6B0
    - alias: App is 84912283
      condition: state
      entity_id: media_player.kitchen_google_hub
      attribute: app_id
      state:
      - '84912283'
  - alias: Hub is not playing app 9AC194DC
    condition: not
    conditions:
    - alias: App 9AC194DC and playing
      condition: and
      conditions:
      - alias: App is 9AC194DC
        condition: state
        entity_id: media_player.kitchen_google_hub
        attribute: app_id
        state: 9AC194DC
      - alias: Kitchen hub is playing
        condition: state
        entity_id: media_player.kitchen_google_hub
        state: playing
        enabled: true
  actions:
  - alias: Turn off the kitchen hub
    metadata: {}
    data: {}
