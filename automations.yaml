- id: '1757437097586'
  alias: 'Mute speakers in rooms if myriam enters while talking '
  description: Meant to mute the playing speakers in the room Myriam's phone enters
    while she is on a call (and music following is on), unmuting them when she leaves
    the room for 20 seconds or stops talking. Its trigger is a Bermuda zone sensor
    that no longer exists, so it never runs.
  triggers:
  - alias: Myriam's phone changes room
    entity_id:
    - sensor.bermuda_myriam_phone_bps_zone
    trigger: state
  conditions:
  - alias: Music following is on
    condition: state
    entity_id: input_boolean.following_music
    state: 'on'
  - alias: Myriam is talking
    condition: state
    entity_id: binary_sensor.myriam_is_talking
    state: 'on'
  actions:
  - alias: Find playing speakers in Myriam's room
    variables:
      playing_speakers: '{{ [area_id(states(''sensor.bermuda_myriam_phone_bps_zone''))]   |
        map(''area_entities'') | sum(start=[]) |    select(''search'', ''speakers'')
        | select(''is_state'',''playing'') | unique | list }}

        '
  - alias: Mute those speakers
    metadata: {}
    data:
      is_volume_muted: true
    target:
      entity_id: '{{playing_speakers}}

        '
    action: media_player.volume_mute
  - alias: Wait until Myriam leaves or hangs up
    wait_for_trigger:
    - alias: Myriam's phone in a new room for 20 s
      trigger: state
      entity_id:
      - sensor.bermuda_myriam_phone_bps_zone
      for:
        hours: 0
        minutes: 0
        seconds: 20
    - alias: Myriam stops talking
      trigger: state
      entity_id:
      - binary_sensor.myriam_is_talking
      to: 'off'
    continue_on_timeout: false
  - alias: Unmute those speakers
    metadata: {}
    data:
      is_volume_muted: false
    target:
      entity_id: '{{playing_speakers}}

        '
    action: media_player.volume_mute
  mode: parallel
  max: 10
- id: '1757814887686'
  alias: Add playing Spotify or tidal artist to Lidarr
  description: Automatically adds the currently playing Spotify or Tidal artist to
    Lidarr for library monitoring by querying MusicBrainz for the artist ID and then
    submitting it to Lidarr.
  triggers:
  - alias: Home speakers' artist changes
    trigger: state
    entity_id:
    - media_player.group_mass_home_group_speakers
    attribute: media_artist
  conditions:
  - alias: Playing from Spotify or Tidal
    condition: template
    value_template: "  {{ 'spotify' in (trigger.to_state.attributes.media_content_id
      | default(''))\n     or 'tidal' in (trigger.to_state.attributes.media_content_id
      | default('')) }}"
  actions:
  - alias: Look up the artist on MusicBrainz
    action: rest_command.music_brainz_artist_query
    metadata: {}
    data:
      artist: '{{ trigger.to_state.attributes.media_artist }}'
    response_variable: return
  - alias: Take the first matching artist
    variables:
      artist_ids: '{{ return.content.artists | map(attribute=''id'') | first | default('''')
        }}'
      artist_names: '{{ return.content.artists | map(attribute=''name'') | first |
        default('''') }}'
  - alias: Continue only if an artist was found
    condition: template
    value_template: '{{ artist_ids != '''' and artist_names != '''' }}'
  - alias: Add the artist to Lidarr
    action: rest_command.lidarr_add_artist
    metadata: {}
    data:
      artist_name: '{{ artist_names }}'
      artist_id: '{{ artist_ids }}'
    response_variable: return
  mode: queued
  max: 4
- id: '1757892274893'
  alias: Lower loud volume when someone exits the shower
  description: Lowers the bathroom speaker volume to 67% when someone exits the shower
