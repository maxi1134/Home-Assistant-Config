        - light.workshop_wall_light
        - light.lounge_ceiling_light
        - light.kitchen_ceiling
        - light.workshop_center_light
        - light.hotbox_desk_tube_light
        - light.salon_ceiling_light
        - light.bathroom_bathroom_mirror_light
      continue_on_error: true
    - alias: 'Patio lights: breathe, 2668 K, 75%'
      action: light.turn_on
      metadata: {}
      data:
        brightness_pct: 75
        effect: breathe
        color_temp_kelvin: 2668
      target:
        entity_id: light.group_patio_lights
      continue_on_error: true
    - alias: 'Lounge Christmas tree: ''1 Vintage'' effect, 2668 K, 100%'
      action: light.turn_on
      metadata: {}
      data:
        brightness_pct: 100
        effect: 1 Vintage
        color_temp_kelvin: 2668
      target:
        entity_id: light.lounge_christmas_tree_light
