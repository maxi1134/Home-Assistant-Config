  alias: Find myriam phone
  description: 'Makes Myriam''s S26 phone ring so it can be found: sets its ring volume
    to level 100, turns off Do Not Disturb and sends a high-priority ''Phone Lost?
    / Phone Found!'' alert on the alarm channel. Written as an LLM tool to help Myriam
    find her phone.'
patio_drinking_game_light_effect:
  sequence:
  - alias: Snapshot the patio lights
    action: scene.create
    data:
      scene_id: patio_game_snapshot
      snapshot_entities: '{{ state_attr(''light.group_patio_lights'', ''entity_id'')
        }}'
  - alias: Pick a random drinking-game light
    variables:
      all_lights: '{{ state_attr(''light.patio_drinking_game_lights'', ''entity_id'')
        }}'
      picked_light: '{{ all_lights | random }}'
      remaining_lights: '{{ all_lights | reject(''eq'', picked_light) | list }}'
  - alias: Set the Zigbee patio group to 1% red
    action: light.turn_on
    data:
      brightness_pct: 1
      rgb_color:
      - 255
      - 0
      - 0
    target:
      entity_id: light.workshop_ziggurat_coordinator_zogbee_group_patio_lights
  - alias: Set the other game lights to 1% red
    target:
      entity_id: '{{ remaining_lights }}'
    action: light.turn_on
    data:
      brightness_pct: 1
      rgb_color:
      - 255
      - 0
      - 0
    enabled: false
  - alias: Turn the picked light bright green
    target:
      entity_id: '{{ picked_light }}'
    action: light.turn_on
    data:
      brightness_pct: 100
      rgb_color:
      - 0
      - 255
      - 0
  - alias: Wait 10 seconds
    delay:
      hours: 0
      minutes: 0
