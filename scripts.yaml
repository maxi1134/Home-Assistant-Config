broadcast_alert_in_the_house:
  alias: important broadcast alert in the house
  description: Broadcasts an important alert. Depending on which inputs are given,
    it flashes the notification lights in a color, speaks a message, plays an audio
    URL, sends a notification to Maxi's phone, shows an image or web page on idle
    Chromecasts, and pauses Chromecasts that are playing. Speech, audio and pausing
    are skipped in party mode, the hotbox speaker joins the audio when Lylou is alone,
    and each run ends with a 5-second pause (runs are queued, max 5).
  fields:
    color:
      description: Optional color name used to flash the notification lights.
      example: red
      required: false
      selector:
        text: {}
    message:
      description: Text-to-speech message to announce on speakers.
      required: false
      selector:
        text:
          multiline: true
    broadcast_url:
      description: Audio URL to broadcast on speakers via Music Assistant.
      required: false
      selector:
        text: {}
    phone_data:
      description: Notification data (title, message, data) sent to Maxi's phone through
        the Maxi notification group.
      required: false
      selector:
        object: {}
    image:
      description: Image URL to display on idle Chromecast TVs.
      required: false
      selector:
        text: {}
    url:
      description: Web URL to display on idle Chromecast TVs (takes priority over
        image).
      required: false
      selector:
        text: {}
  sequence:
  - alias: Capture chromecast states and input flags
    variables:
      cast_entities: "{{ integration_entities('cast')\n   | select('search', 'chromecast')\n
        \  | expand | list }}"
      playing_chromecasts: "{{ cast_entities\n   | selectattr('state', 'eq', 'playing')\n
        \  | map(attribute='entity_id') | list }}"
      non_playing_chromecasts: "{{ cast_entities\n   | rejectattr('state', 'eq', 'playing')\n
        \  | map(attribute='entity_id') | list }}"
      lylou_alone: '{{ is_state(''binary_sensor.lylou_alone'', ''on'') }}'
      has_color: '{{ color is defined and color is not none and (color | string |
        trim) != '''' }}'
      has_message: '{{ message is defined and message is not none and (message | string
        | trim) != '''' }}'
      has_broadcast_url: '{{ broadcast_url is defined and broadcast_url is not none
        and (broadcast_url | string | trim) != '''' }}'
      has_phone_data: '{{ phone_data is defined and phone_data is not none }}'
      has_image: '{{ image is defined and image is not none and (image | string |
        trim) != '''' }}'
      has_url: '{{ url is defined and url is not none and (url | string | trim) !=
        '''' }}'
  - alias: Run all alert channels in parallel
    parallel:
    - alias: Flash whole-house notification lights
      if:
      - alias: A color was given
        condition: template
        value_template: '{{ has_color }}'
      then:
      - alias: Flash notification lights in the given color
        action: script.broadcast_alert_flash_notification_lights
        data:
          color: '{{ color }}'
        continue_on_error: true
    - alias: TTS announcement on speakers
      if:
      - alias: A message was given
        condition: template
        value_template: '{{ has_message }}'
      - alias: Party mode is off
        condition: state
        entity_id: input_boolean.party_mode
        state:
        - 'off'
      then:
      - alias: Speak the message on the speakers
        action: script.broadcast_alert_tts_announce
        data:
          message: '{{ message }}'
        continue_on_error: true
    - alias: Audio URL broadcast on speakers
      if:
      - alias: An audio URL was given
        condition: template
        value_template: '{{ has_broadcast_url }}'
      - alias: Party mode is off
        condition: state
        entity_id: input_boolean.party_mode
        state:
        - 'off'
      then:
      - alias: Play the audio URL (hotbox too if Lylou alone)
        action: script.broadcast_alert_play_audio_url
        data:
          broadcast_url: '{{ broadcast_url }}'
          include_hotbox: '{{ lylou_alone }}'
        continue_on_error: true
    - alias: Phone notifications
      if:
      - alias: Phone notification data was given
        condition: template
        value_template: '{{ has_phone_data }}'
      then:
      - alias: Send notification to Maxi's phone
        action: script.broadcast_alert_send_phone_notification
        data:
          phone_data: '{{ phone_data }}'
        continue_on_error: true
    - alias: TV display - image (only when url is not provided)
      if:
      - alias: An image was given and no URL
        condition: template
        value_template: '{{ has_image and not has_url }}'
      - alias: Party mode is off
        condition: state
        entity_id: input_boolean.party_mode
        state:
        - 'off'
        enabled: false
      then:
      - alias: Show the image on idle chromecasts
        action: script.broadcast_alert_display_image_on_tvs
        data:
          image: '{{ image }}'
          non_playing_chromecasts: '{{ non_playing_chromecasts }}'
        continue_on_error: true
    - alias: TV display - URL
      if:
      - alias: A URL was given
        condition: template
        value_template: '{{ has_url }}'
      - alias: Party mode is off
        condition: state
        entity_id: input_boolean.party_mode
        state:
        - 'off'
        enabled: false
      then:
      - alias: Show the web page on idle chromecasts
        action: script.broadcast_alert_display_url_on_tvs
        data:
          url: '{{ url }}'
          non_playing_chromecasts: '{{ non_playing_chromecasts }}'
        continue_on_error: true
    - alias: Pause playing chromecasts (skip during party mode)
      if:
      - alias: Party mode is off
        condition: state
        entity_id: input_boolean.party_mode
        state: 'off'
      - alias: At least one chromecast is playing
        condition: template
        value_template: '{{ playing_chromecasts | length > 0 }}'
      then:
      - alias: Pause the playing chromecasts
        action: script.broadcast_alert_pause_chromecasts
        data:
          playing_chromecasts: '{{ playing_chromecasts }}'
        continue_on_error: true
  - alias: Wait 5 seconds
    delay:
      seconds: 5
  mode: queued
  icon: mdi:speaker-message
  max: 5
broadcast_alert_flash_lights:
  alias: Broadcast alert - flash light group (internal impl)
  description: Flashes every available light in a light group to the given color,
    holds it for duration_ms (2250 ms if omitted), then restores each light's previous
    on/off state and RGB color. Runs are queued (up to 3 waiting), so overlapping
    flashes happen one after another.
  fields:
    light_group:
      description: Group light entity whose members will be flashed.
      required: true
      selector:
        entity:
          domain: light
    color:
      description: Color name to flash the lights to.
      required: true
      selector:
        text: {}
    duration_ms:
      description: How long to hold the flash colour before restoring (milliseconds).
      required: false
      default: 2250
      selector:
        number:
          min: 100
          max: 10000
          unit_of_measurement: ms
  sequence:
  - alias: Snapshot each member's on/off state and rgb_color
    variables:
      lights_state: "{%- set members = state_attr(light_group, 'entity_id') or []
        -%} {%- set ns = namespace(items=[]) -%} {%- for entity_id in members -%}\n
        \ {%- set s = states(entity_id) -%}\n  {%- if s != 'unavailable' -%}\n    {%-
        set rgb = state_attr(entity_id, 'rgb_color') -%}\n    {%- set rgb_list = (rgb
        | list) if rgb else [0, 0, 0] -%}\n    {%- set ns.items = ns.items + [{'entity_id':
        entity_id, 'rgb': rgb_list, 'state': s}] -%}\n  {%- endif -%}\n{%- endfor
        -%} {{ ns.items }}"
      light_ids: "{%- set members = state_attr(light_group, 'entity_id') or [] -%}
        \n{%- set ns  = namespace(items=[]) -%} {%- for entity_id in members -%}\n{%-
        set s = states(entity_id) -%}\n{%- if s != 'unavailable' -%}\n  {%- set rgb
        = state_attr(entity_id, 'rgb_color') -%}\n  {%- set rgb_list = (rgb | list)
        if rgb else [0, 0, 0] -%}\n  {%- set ns.items = ns.items +  [entity_id] -%}\n{%-
        endif -%}\n{%- endfor -%} {{ ns.items }}\n"
  - alias: Turn the group's lights to the flash color
    action: light.turn_on
    target:
      entity_id: '{{ light_ids }}'
    data:
      color_name: '{{ color }}'
    continue_on_error: true
  - alias: Flash all snapshotted lights to the requested colour
    repeat:
      for_each: '{{ lights_state }}'
      sequence:
      - alias: Turn this light to the flash color
        action: light.turn_on
        target:
          entity_id: '{{ repeat.item.entity_id }}'
        data:
          color_name: '{{ color }}'
        continue_on_error: true
    enabled: false
  - alias: Hold the flash for duration_ms (default 2250 ms)
    delay:
      milliseconds: '{{ duration_ms | default(2250) | int }}'
  - alias: Restore each light to its captured state
    repeat:
      for_each: '{{ lights_state }}'
      sequence:
      - alias: Restore on or off based on captured state
        choose:
        - alias: Was on → turn back on with its color
          conditions:
          - alias: Light was on before the flash
            condition: template
            value_template: '{{ repeat.item.state == ''on'' }}'
          sequence:
          - alias: Turn light on with its captured RGB color
            action: light.turn_on
            target:
              entity_id: '{{ repeat.item.entity_id }}'
            data:
              rgb_color: '{{ repeat.item.rgb }}'
            continue_on_error: true
        default:
        - alias: 'Otherwise: turn the light off'
          action: light.turn_off
          target:
            entity_id: '{{ repeat.item.entity_id }}'
          continue_on_error: true
  mode: queued
  max: 3
  icon: mdi:lightbulb-alert
broadcast_alert_flash_hotbox_lights:
  alias: Broadcast alert - flash hotbox lights (queued)
  description: Flashes the hotbox lights in the given color and then restores them,
    using the shared flash script. Holds the color for duration_ms, 2250 ms when omitted.
    Calls are queued (up to 10) so each flash starts from the lights' real state.
  fields:
    color:
      description: Color name to flash the hotbox lights to.
      required: true
      selector:
        text: {}
    duration_ms:
      description: How long to hold the flash colour before restoring (milliseconds).
      required: false
      default: 2250
      selector:
        number:
          min: 100
          max: 10000
          unit_of_measurement: ms
  sequence:
  - alias: Flash hotbox lights via shared flash script
    action: script.broadcast_alert_flash_lights
    data:
      light_group: light.group_hotbox_lights
      color: '{{ color }}'
      duration_ms: '{{ duration_ms | default(2250) | int }}'
  mode: queued
  max: 10
  icon: mdi:lightbulb-alert
broadcast_alert_flash_notification_lights:
  alias: Broadcast alert - flash notification lights (queued)
  description: Flashes the house-wide notification lights in the given color and then
    restores them, using the shared flash script. Holds the color for duration_ms,
    or 2250 ms when the caller omits it (the 1000 ms field default only pre-fills
    the UI). Calls are queued, up to 10.
  fields:
    color:
      description: Color name to flash the notification lights to.
      required: true
      selector:
        text: {}
    duration_ms:
      description: How long to hold the flash color, in milliseconds (2250 if omitted).
      selector:
        number:
          min: 100
          max: 10000
          unit_of_measurement: ms
      default: 1000
  sequence:
  - alias: Flash notification lights via shared flash script
    action: script.broadcast_alert_flash_lights
    data:
      light_group: light.group_notifications_light
      color: '{{ color }}'
      duration_ms: '{{ duration_ms | default(2250) | int }}'
  mode: queued
  max: 10
  icon: mdi:lightbulb-alert
broadcast_alert_tts_announce:
  alias: Broadcast alert - TTS announcement
  description: Speaks the message on the home speaker group, the bathroom speaker
    and the bedroom speaker with the NabuDemon voice, or with Piper when NabuDemon
    is unavailable. The bedroom speaker is skipped while someone sleeps in the bedroom;
    in the Piper fallback it still speaks there when Maxi's sleep location is the
    bedroom.
  fields:
    message:
      description: Text-to-speech message.
      required: true
      selector:
        text:
          multiline: true
  sequence:
  - alias: 'Old: speak via Piper on three speakers'
    parallel:
    - alias: Speak on home speaker group (Piper)
      action: tts.speak
      target:
        entity_id: tts.piper_2
      data:
        cache: true
        media_player_entity_id: media_player.group_mass_home_group_speakers
        message: '{{ message }}'
      continue_on_error: true
    - alias: Speak on bathroom speaker (Piper)
      action: tts.speak
      target:
        entity_id: tts.piper_2
      data:
        cache: true
        media_player_entity_id: media_player.mass_bathroom_vpe_speaker
        message: '{{ message }}'
      continue_on_error: true
    - alias: Speak on bedroom speaker (Piper)
      action: tts.speak
      target:
        entity_id: tts.piper_2
      data:
        cache: true
        media_player_entity_id: media_player.mass_bedroom_vpe_speaker
        message: '{{ message }}'
      continue_on_error: true
    - alias: Empty check for bedroom sleeper
      if:
      - alias: Nobody sleeping in the bedroom
        condition: state
        entity_id: input_boolean.sleeper_in_bedroom
        state: 'off'
        enabled: false
      then: []
    enabled: false
  - alias: If NabuDemon voice is available
    if:
    - alias: NabuDemon voice is available
      condition: not
      conditions:
      - alias: NabuDemon TTS is unavailable
        condition: state
        entity_id: tts.openai_tts_nabudemon
        state:
        - unavailable
    then:
    - alias: Announcements via Music Assistant with Nabu Demon Voice
      parallel:
      - alias: Speak on home speaker group (NabuDemon)
        action: tts.speak
        metadata: {}
        target:
          entity_id:
          - tts.openai_tts_nabudemon
        data:
          cache: true
          media_player_entity_id: media_player.group_mass_home_group_speakers
          message: '{{ message }}'
        continue_on_error: true
      - alias: If nobody sleeps in the bedroom
        if:
        - alias: Nobody sleeping in the bedroom
          condition: state
          entity_id: input_boolean.sleeper_in_bedroom
          state: 'off'
        then:
        - alias: Speak on bedroom speaker (NabuDemon)
          action: tts.speak
          metadata: {}
          target:
            entity_id: tts.openai_tts_nabudemon
          data:
            cache: true
            media_player_entity_id: media_player.mass_bedroom_vpe_speaker
            message: '{{ message }}'
          continue_on_error: true
      - alias: Speak on bathroom speaker (NabuDemon)
        action: tts.speak
        metadata: {}
        target:
          entity_id: tts.openai_tts_nabudemon
        data:
          cache: true
          media_player_entity_id: media_player.mass_bathroom_vpe_speaker
          message: '{{ message }}'
        continue_on_error: true
    enabled: true
    else:
    - alias: 'Fallback: always run Piper announcements'
      if: []
      then:
      - alias: Announce via Piper voice in parallel
        parallel:
        - alias: Speak on home speaker group (Piper)
          action: tts.speak
          metadata: {}
          target:
            entity_id: tts.piper_2
          data:
            cache: true
            media_player_entity_id: media_player.group_mass_home_group_speakers
            message: '{{ message }}'
          continue_on_error: true
        - alias: If bedroom announcement is allowed
          if:
          - alias: Maxi sleeps in bedroom or no bedroom sleeper
            condition: or
            conditions:
            - alias: Maxi's sleep location is the bedroom
              condition: state
              entity_id: sensor.where_is_maxi_sleeping
              state:
              - bedroom
            - alias: Nobody sleeping in the bedroom
              condition: state
              entity_id: input_boolean.sleeper_in_bedroom
              state: 'off'
          then:
          - alias: Speak on bedroom speaker (Piper)
            action: tts.speak
            metadata: {}
            target:
              entity_id: tts.piper_2
            data:
              cache: true
              media_player_entity_id: media_player.mass_bedroom_vpe_speaker
              message: '{{ message }}'
            continue_on_error: true
        - alias: Speak on bathroom speaker (Piper)
          action: tts.speak
          metadata: {}
          target:
            entity_id: tts.piper_2
          data:
            cache: true
            media_player_entity_id: media_player.mass_bathroom_vpe_speaker
            message: '{{ message }}'
          continue_on_error: true
  mode: parallel
  max: 10
  icon: mdi:bullhorn
broadcast_alert_play_audio_url:
  alias: Broadcast alert - play audio URL
  description: Plays an audio URL as a Music Assistant announcement on the home speaker
    group plus the bedroom, closet, and bathroom speakers. The hotbox speaker is also
    included when `include_hotbox` is true (Lylou-alone mode).
  fields:
    broadcast_url:
      description: Audio URL to play as an announcement.
      required: true
      selector:
        text: {}
    include_hotbox:
      description: Also announce on the hotbox speaker.
      required: false
      default: false
      selector:
        boolean: {}
    announce_volume:
      description: Announcement volume (Music Assistant scale).
      required: false
      default: 35
      selector:
        number:
          min: 1
          max: 100
  sequence:
  - alias: Announce on all speakers in parallel
    parallel:
    - alias: Announce URL on home speaker group
      action: music_assistant.play_announcement
      data:
        url: '{{ broadcast_url }}'
        announce_volume: '{{ announce_volume | default(35) | int }}'
      target:
        entity_id: media_player.group_mass_home_group_speakers
      continue_on_error: true
    - alias: Announce URL on bedroom speaker
      action: music_assistant.play_announcement
      data:
        url: '{{ broadcast_url }}'
        announce_volume: '{{ announce_volume | default(35) | int }}'
      target:
        entity_id: media_player.mass_bedroom_vpe_speaker
      continue_on_error: true
    - alias: Announce URL on closet speaker
      action: music_assistant.play_announcement
      data:
        url: '{{ broadcast_url }}'
        announce_volume: '{{ announce_volume | default(35) | int }}'
      target:
        entity_id: media_player.mass_closet_vpe_speaker
      continue_on_error: true
    - alias: Announce URL on bathroom speaker
      action: music_assistant.play_announcement
      data:
        url: '{{ broadcast_url }}'
        announce_volume: '{{ announce_volume | default(35) | int }}'
      target:
        entity_id: media_player.mass_bathroom_vpe_speaker
      continue_on_error: true
    - alias: If the hotbox should be included
      if:
      - alias: include_hotbox is true
        condition: template
        value_template: '{{ include_hotbox | default(false) | bool }}'
      then:
      - alias: Announce URL on hotbox speaker
        action: music_assistant.play_announcement
        data:
          url: '{{ broadcast_url }}'
          announce_volume: '{{ announce_volume | default(35) | int }}'
        target:
          entity_id: media_player.mass_hotbox_wiim_speaker
        continue_on_error: true
  mode: parallel
  max: 10
  icon: mdi:speaker-wireless
broadcast_alert_send_phone_notification:
  alias: Broadcast alert - send phone notification
  description: Sends the given notification data (title, message, data) to the Maxi
    notification group, which currently reaches only Maxi's phone.
  fields:
    phone_data:
      description: Notification data object (title, message, data, etc.).
      required: true
      selector:
        object: {}
  sequence:
  - alias: Send notification to Maxi's phone
    action: notify.maxi_notification_group
    data: '{{ phone_data }}'
    continue_on_error: true
  mode: parallel
  max: 10
  icon: mdi:cellphone-message
broadcast_alert_display_image_on_tvs:
  alias: Broadcast alert - display image on idle TVs
  description: Casts a static image to all idle Chromecasts and the kitchen Google
    Hub. Waits until the front door is locked (already-locked is treated as success)
    before turning the casted TVs off, with a 3-minute safety timeout.
  fields:
    image:
      description: Image URL to cast.
      required: true
      selector:
        text: {}
    non_playing_chromecasts:
      description: Idle chromecasts to receive the image.
      required: true
      selector:
        object: {}
    lock_entity:
      description: Lock entity whose `locked` state ends the display.
      required: false
      default: lock.lock_front_door
      selector:
        entity:
          domain: lock
    hub_entity:
      description: Auxiliary screen (e.g. Google Hub) loaded via dash_cast.
      required: false
      default: media_player.kitchen_google_hub
      selector:
        entity:
          domain: media_player
    timeout_minutes:
      description: Max wait before forcing the display to stop.
      required: false
      default: 3
      selector:
        number:
          min: 1
          max: 10
  sequence:
  - alias: Cast the image to each idle chromecast
    repeat:
      for_each: '{{ non_playing_chromecasts }}'
      sequence:
      - alias: Cast the image to this chromecast
        action: media_player.play_media
        data:
          entity_id: '{{ repeat.item }}'
          media_content_id: '{{ image }}'
          media_content_type: image
        continue_on_error: true
  - alias: Mirror the image on the kitchen hub via dash_cast
    action: dash_cast.load_url
    data:
      force: false
      reload_seconds: 0
      entity_id: '{{ hub_entity | default(''media_player.kitchen_google_hub'') }}'
      url: '{{ image }}'
    continue_on_error: true
  - alias: Wait up to 3 min for the front door to lock
    wait_template: '{{ is_state(lock_entity | default(''lock.lock_front_door''), ''locked'')
      }}'
    continue_on_timeout: true
    timeout:
      minutes: '{{ timeout_minutes | default(3) | int }}'
  - alias: Power off every chromecast we cast to
    repeat:
      for_each: '{{ non_playing_chromecasts }}'
      sequence:
      - alias: Turn off this chromecast
        action: media_player.turn_off
        target:
          entity_id: '{{ repeat.item }}'
        continue_on_error: true
  mode: parallel
  max: 5
  icon: mdi:image-broken-variant
broadcast_alert_display_url_on_tvs:
  alias: Broadcast alert - display URL on idle TVs
  description: Loads a web page with DashCast on each idle Chromecast and on the kitchen
    Google Hub. Waits up to 3 minutes for the front door to be locked (already locked
    counts), then turns those Chromecasts off.
  fields:
    url:
      description: Web URL to load on the TVs.
      required: true
      selector:
        text: {}
    non_playing_chromecasts:
      description: Idle chromecasts to load the URL on.
      required: true
      selector:
        object: {}
    lock_entity:
      description: Lock entity whose `locked` state ends the display.
      required: false
      default: lock.lock_front_door
      selector:
        entity:
          domain: lock
    hub_entity:
      description: Auxiliary screen (e.g. Google Hub) loaded via dash_cast.
      required: false
      default: media_player.kitchen_google_hub
      selector:
        entity:
          domain: media_player
    timeout_minutes:
      description: Max wait before forcing the display to stop.
      required: false
      default: 3
      selector:
        number:
          min: 1
          max: 10
  sequence:
  - alias: Load the URL on each idle chromecast
    repeat:
      for_each: '{{ non_playing_chromecasts }}'
      sequence:
      - alias: Load the URL on this chromecast
        action: dash_cast.load_url
        data:
          force: true
          reload_seconds: 0
          entity_id: '{{ repeat.item }}'
          url: '{{ url }}'
        continue_on_error: true
  - alias: Mirror the URL on the kitchen hub via dash_cast
    action: dash_cast.load_url
    data:
      force: true
      reload_seconds: 0
      entity_id: '{{ hub_entity | default(''media_player.kitchen_google_hub'') }}'
      url: '{{ url }}'
    continue_on_error: true
  - alias: Wait up to 3 min for the front door to lock
    wait_template: '{{ is_state(lock_entity | default(''lock.lock_front_door''), ''locked'')
      }}'
    continue_on_timeout: true
    timeout:
      minutes: '{{ timeout_minutes | default(3) | int }}'
  - alias: Power off every chromecast we loaded the URL on
    repeat:
      for_each: '{{ non_playing_chromecasts }}'
      sequence:
      - alias: Turn off this chromecast
        action: media_player.turn_off
        target:
          entity_id: '{{ repeat.item }}'
        continue_on_error: true
  mode: parallel
  max: 5
  icon: mdi:link-box-variant
broadcast_alert_pause_chromecasts:
  alias: Broadcast alert - pause playing chromecasts
  description: Sends a media_pause command to each chromecast in the supplied list.
  fields:
    playing_chromecasts:
      description: Chromecasts currently in the `playing` state.
      required: true
      selector:
        object: {}
  sequence:
  - alias: Pause each chromecast in the list
    repeat:
      for_each: '{{ playing_chromecasts }}'
      sequence:
      - alias: Pause this chromecast
        action: media_player.media_pause
        target:
          entity_id: '{{ repeat.item }}'
        continue_on_error: true
  mode: parallel
  max: 10
  icon: mdi:pause-circle
change_received_lights_to_random_colors:
  alias: Change received lights to random colors
  description: Changes lights to random colors. Each light gets its own hue, at least
    25 degrees away from its current one, and all lights change at the same time.
    Target lights with area and/or light (groups are expanded, lights that cannot
    show colors are skipped). With neither area nor light, every light that is currently
    on changes.
  mode: parallel
  max: 10
  icon: mdi:palette-swatch
  fields:
    area:
      name: Area
      description: Area(s) whose lights should change. Uses the room's light groups
        when it has any, otherwise every light in the room. Leave both area and light
        out to change every light that is currently on.
      selector:
        area:
          multiple: true
    light:
      name: Light
      description: Light(s) or light groups to change. Groups are expanded to their
        member lights.
      selector:
        entity:
          multiple: true
          domain: light
    only_on:
      name: Only lights that are on
      description: Only change lights that are already on.
      default: false
      selector:
        boolean: {}
    saturation:
      name: Saturation
      description: Color saturation in percent.
      default: 100
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: '%'
    transition_speed:
      name: Transition
      description: Fade time in seconds.
      default: 1
      selector:
        number:
          min: 0
          max: 30
          step: 0.5
          unit_of_measurement: s
  sequence:
  - alias: Resolve target lights that support color
    variables:
      targets: "{%- if area is not defined and light is not defined -%}\n  {{ ['light.group_all_lights']
        }}\n{%- else -%}\n  {%- set areas = area if area is defined and area else
        [] -%}\n  {%- set areas = [areas] if areas is string else areas -%}\n  {%-
        set picked = light if light is defined and light else [] -%}\n  {%- set picked
        = [picked] if picked is string else picked -%}\n  {%- set ns = namespace(roots=[])
        -%}\n  {%- for a in areas -%}\n    {%- set in_area = area_entities(a) | select('match',
        'light[.]') | list -%}\n    {%- set room_groups = in_area | select('match',
        'light[.]group_') | list -%}\n    {%- set ns.roots = ns.roots + (room_groups
        if room_groups else in_area) -%}\n  {%- endfor -%}\n  {{ (ns.roots + picked
        | list) | unique | list }}\n{%- endif -%}"
      on_only: '{{ (area is not defined and light is not defined) or (only_on | default(false)
        | bool) }}'
      lights: "{{ expand(targets)\n   | selectattr('domain', 'eq', 'light')\n   |
        rejectattr('attributes.entity_id', 'defined')\n   | selectattr('attributes.supported_color_modes',
        'defined')\n   | selectattr('attributes.supported_color_modes', 'search',
        'hs|rgb|xy')\n   | selectattr('state', 'in', ['on'] if on_only else ['on',
        'off'])\n   | map(attribute='entity_id') | unique | list }}"
  - alias: 'For each light: start random-color script'
    repeat:
      for_each: '{{ lights }}'
      sequence:
      - alias: Start random-color script for this light
        action: script.turn_on
        target:
          entity_id: script.set_one_light_to_a_random_color
        data:
          variables:
            target_light: '{{ repeat.item }}'
            saturation: '{{ saturation | default(100) }}'
            transition_speed: '{{ transition_speed | default(1) }}'
  - alias: Build result with the changed lights
    variables:
      result:
        changed: '{{ lights | count }}'
        lights: '{{ lights }}'
  - alias: Stop and return the changed lights
    stop: Lights changed
    response_variable: result
start_visual_playlist_on_plex:
  alias: Start requsted Playlist on plex for all unplaying chromecasts
  description: Starts the requested Plex playlist, shuffled and muted, on every Chromecast
    and Google Hub that is off, except bedroom Chromecasts and devices in rooms where
    someone is sleeping. Handles the devices one at a time, waiting up to 1 minute
    for each to start playing.
  sequence:
  - alias: List chromecasts (except bedroom) and hubs
    variables:
      chromecasts: '{{(integration_entities(''cast'')  |  select(''search'', ''chromecast'')|
        reject(''search'', ''bedroom'') | list ) + (integration_entities(''cast'')  |  select(''search'',
        ''hub'') | list ) }}

        '
  - alias: For each chromecast or hub
    repeat:
      sequence:
      - alias: If device is off and its room has no sleeper
        if:
        - alias: Device's room has no active sleeper
          condition: template
          value_template: '{{ area_id(chromecasts[repeat.index - 1 ] | string) | replace(''_top'','''')
            | replace(''_down'','''') not in states(''sensor.active_sleeper_rooms'')
            | string  }}'
        - condition: and
          conditions:
          - alias: Device is off
            condition: template
            value_template: '{% set entity = chromecasts[repeat.index - 1] %}{% set
              is_only = start_on_off_only | bool(false) %} {{ (states(entity) == ''off''
              and is_only) or (states(entity) != ''unavailable'' and not is_only)
              }}'
        then:
        - alias: Build shuffled Plex playlist URI
          variables:
            playlist: 'plex://{"playlist_name":"{{requested_playlist}}","shuffle":"1"}

              '
        - alias: Play the playlist on this device
          data:
            media:
              media_content_id: '{{playlist}}'
              media_content_type: playlist
              metadata: {}
          target:
            entity_id: '{{chromecasts[repeat.index -1]}}'
          action: media_player.play_media
          continue_on_error: true
        - alias: Mute this device
          data:
            is_volume_muted: true
          target:
            entity_id: '{{chromecasts[repeat.index -1]}}'
          action: media_player.volume_mute
        - alias: Wait 15 seconds
          delay:
            hours: 0
            minutes: 0
            seconds: 15
            milliseconds: 0
          enabled: false
        - alias: Wait up to 1 min for playback to start
          wait_for_trigger:
          - alias: Device starts playing
            trigger: template
            value_template: '{{states(chromecasts[repeat.index - 1 ]) == "playing"}}'
          timeout:
            hours: 0
            minutes: 1
            seconds: 0
            milliseconds: 0
      for_each: '{{ chromecasts }}'
  mode: single
  icon: mdi:led-strip-variant
  fields:
    requested_playlist:
      description: Name of the Plex playlist to play, shuffled.
      selector:
        text:
      name: requested_playlist
      required: true
    start_on_off_only:
      selector:
        boolean: {}
      default: true
      name: Start On off chromecasts only
      required: true
non_important_broadcast_alert_in_the_house:
  alias: non-important broadcast alert in the house
  description: Low-priority alert. Briefly (1.25 s) switches the notification lights
    that are on to the given color and then restores their colors, speaks the message
    unless party mode is on or all residents are asleep, and shows an image (for 40
    s) or a web page (until the front door unlocks, max 1 minute) on idle Chromecasts
    before turning them off. Runs are queued, max 3.
  sequence:
  - variables:
      light_entity_ids: "{% set light_group = state_attr('light.group_notifications_light','entity_id')%}
        \  {% set ns = namespace( rgb_dict= [] ) %} {% for entity_id in light_group
        %}\n    {% set light_state = states(entity_id)  %}\n    {% set light_rgb_color
        = state_attr(entity_id, \"rgb_color\") %}\n    {% if light_state == 'on' and
        light_rgb_color %}\n        {%- set rgb_values = light_rgb_color | replace('(','')
        | replace(')','')| replace(' ','')| string  -%}\n        {% set rgb_dict =
        [(entity_id , rgb_values, states(entity_id))] %}\n        {% set ns.rgb_dict
        = ns.rgb_dict + rgb_dict %}\n    {% endif %}    \n{% endfor %}  {{ ns.rgb_dict
        }}\n"
      playing_chromecasts: '{{ integration_entities(''cast'') |  select(''search'',
        ''chromecast'') | expand | selectattr(''state'', ''eq'', ''playing'')| map(attribute=''entity_id'')|
        list }}

        '
      non_playing_chromecasts: '{{ integration_entities(''cast'') |  select(''search'',
        ''chromecast'') | expand | rejectattr(''state'', ''eq'', ''playing'')| map(attribute=''entity_id'')|
        list }}

        '
    alias: Capture lit notification lights and chromecasts
  - alias: Run lights, speech and TV alerts in parallel
    parallel:
    - alias: Flash notification lights then restore
      sequence:
      - if:
        - alias: A color was given
          condition: template
          value_template: '{% if color is defined %}

            true

            {% else %}

            false

            {% endif %}'
        then:
        - alias: Set each lit light to the given color
          repeat:
            sequence:
            - alias: Set this light to the given color
              target:
                entity_id: '{{light_entity_ids[repeat.index - 1].0}}'
              data:
                color_name: '{{color}}'
              enabled: true
              action: light.turn_on
            count: '{{ light_entity_ids | length }}'
        alias: If a color was given
      - alias: Wait 1.25 seconds
        delay:
          hours: 0
          minutes: 0
          seconds: 1
          milliseconds: 250
      - alias: Restore lights to their initial state
        repeat:
          sequence:
          - if:
            - alias: Light was off before
              condition: template
              value_template: '{{ not light_entity_ids[repeat.index - 1].2 | bool
                }}'
            then:
            - target:
                entity_id: '{{light_entity_ids[repeat.index - 1].0}}'
              enabled: true
              alias: Turn back off lights to previous state
              action: light.turn_{{ 'on' if light_entity_ids[repeat.index - 1].2 ==
                'on' else 'off' }}
            alias: Turn off lights back to off
          - if:
            - alias: Light was on before
              condition: template
              value_template: '{{ light_entity_ids[repeat.index - 1].2 | bool }}'
            then:
            - target:
                entity_id: '{{light_entity_ids[repeat.index - 1].0}}'
              data:
                rgb_color: '{{light_entity_ids[repeat.index - 1].1}}'
              enabled: true
              alias: Turn back on lights to previous state
              action: light.turn_{{ 'on' if light_entity_ids[repeat.index - 1].2 ==
                'on' else 'off' }}
            alias: Turn on lights back to their original colors
          count: '{{ light_entity_ids | length }}'
    - alias: TTS announcement on speakers
      if:
      - alias: A message was given
        condition: template
        value_template: '{% if message is defined %}

          true

          {% else %}

          false

          {% endif %}'
      - alias: Party mode is off
        condition: state
        entity_id: input_boolean.party_mode
        state:
        - 'off'
      - alias: Not all residents are sleeping
        condition: state
        entity_id: binary_sensor.all_residents_sleeping
        state:
        - 'off'
      then:
      - alias: Speak the message on the speakers
        action: script.broadcast_alert_tts_announce
        data:
          message: '{{ message }}'
        continue_on_error: true
    - alias: 'Old: announce via NabuDemon or Piper'
      if:
      - alias: A message was given
        condition: template
        value_template: '{% if message is defined %}

          true

          {% else %}

          false

          {% endif %}'
      - alias: Party mode is off
        condition: state
        entity_id: input_boolean.party_mode
        state:
        - 'off'
      - alias: NabuDemon voice is available
        condition: not
        conditions:
        - alias: NabuDemon TTS is unavailable
          condition: state
          entity_id: tts.openai_tts_nabudemon
          state:
          - unavailable
      then:
      - alias: Announcements via Music Assistant with Nabu Demon Voice
        parallel:
        - alias: Speak on home speaker group (NabuDemon)
          action: tts.speak
          metadata: {}
          target:
            entity_id:
            - tts.openai_tts_nabudemon
          data:
            cache: true
            media_player_entity_id: media_player.group_mass_home_group_speakers
            message: '{{ message }}'
          continue_on_error: true
        - alias: If nobody sleeps in the bedroom
          if:
          - alias: Nobody sleeping in the bedroom
            condition: state
            entity_id: input_boolean.sleeper_in_bedroom
            state: 'off'
          then:
          - alias: Speak on bedroom speaker (NabuDemon)
            action: tts.speak
            metadata: {}
            target:
              entity_id: tts.openai_tts_nabudemon
            data:
              cache: true
              media_player_entity_id: media_player.mass_bedroom_vpe_speaker
              message: '{{ message }}'
            continue_on_error: true
        - alias: Speak on bathroom speaker (NabuDemon)
          action: tts.speak
          metadata: {}
          target:
            entity_id: tts.openai_tts_nabudemon
          data:
            cache: true
            media_player_entity_id: media_player.mass_bathroom_vpe_speaker
            message: '{{ message }}'
          continue_on_error: true
      enabled: false
      else:
      - alias: If a message was given and no party
        if:
        - alias: A message was given
          condition: template
          value_template: '{% if message is defined %}

            true

            {% else %}

            false

            {% endif %}'
        - alias: Party mode is off
          condition: state
          entity_id: input_boolean.party_mode
          state:
          - 'off'
        then:
        - alias: Announce via Piper voice in parallel
          parallel:
          - alias: Speak on home speaker group (Piper)
            action: tts.speak
            metadata: {}
            target:
              entity_id: tts.piper_2
            data:
              cache: true
              media_player_entity_id: media_player.group_mass_home_group_speakers
              message: '{{ message }}'
            continue_on_error: true
          - alias: If nobody sleeps in the bedroom
            if:
            - alias: Nobody sleeping in the bedroom
              condition: state
              entity_id: input_boolean.sleeper_in_bedroom
              state: 'off'
            then:
            - alias: Speak on bedroom speaker (Piper)
              action: tts.speak
              metadata: {}
              target:
                entity_id: tts.piper_2
              data:
                cache: true
                media_player_entity_id: media_player.mass_bedroom_vpe_speaker
                message: '{{ message }}'
              continue_on_error: true
          - alias: Speak on bathroom speaker (Piper)
            action: tts.speak
            metadata: {}
            target:
              entity_id: tts.piper_2
            data:
              cache: true
              media_player_entity_id: media_player.mass_bathroom_vpe_speaker
              message: '{{ message }}'
            continue_on_error: true
    - alias: Show image or web page on idle TVs
      parallel:
      - alias: Broadcast image to paused TVs if image is present
        if:
        - alias: An image was given
          condition: template
          value_template: '{% if image is defined %}

            true

            {% else %}

            false

            {% endif %}'
        then:
        - alias: Broadcast Image to paused chromecasts
          repeat:
            sequence:
            - alias: Cast the image to this chromecast
              data:
                entity_id: '{{non_playing_chromecasts[repeat.index - 1]}}'
                media:
                  media_content_id: '{{image}}'
                  media_content_type: video
                  metadata: {}
              action: media_player.play_media
            for_each: '{{ non_playing_chromecasts }}'
        - alias: Wait 40 seconds
          delay:
            hours: 0
            minutes: 0
            seconds: 40
            milliseconds: 0
        - alias: Turn off the idle chromecasts
          repeat:
            sequence:
            - alias: Turn off all idle chromecasts
              action: media_player.turn_off
              metadata: {}
              data: {}
              target:
                entity_id: '{{ non_playing_chromecasts }}'
            for_each: '{{ non_playing_chromecasts }}'
        enabled: true
        continue_on_error: true
      - alias: Show web page on idle TVs if URL given
        if:
        - alias: A URL was given
          condition: template
          value_template: '{% if url is defined %}

            true

            {% else %}

            false

            {% endif %}'
        then:
        - alias: Load the URL on each idle chromecast
          repeat:
            sequence:
            - alias: Load the URL on this chromecast
              action: dash_cast.load_url
              data:
                entity_id: '{{non_playing_chromecasts[repeat.index - 1]}}'
                url: '{{url}}'
                force: true
            for_each: '{{ non_playing_chromecasts }}'
        - alias: Wait 40 seconds
          delay:
            hours: 0
            minutes: 0
            seconds: 40
            milliseconds: 0
          enabled: false
        - alias: Wait up to 1 min for front door to unlock
          wait_for_trigger:
          - alias: Front door unlocks
            trigger: state
            entity_id:
            - lock.lock_front_door
            to: unlocked
          timeout:
            hours: 0
            minutes: 1
            seconds: 0
            milliseconds: 0
        - alias: Turn off the idle chromecasts
          repeat:
            sequence:
            - alias: Turn off all idle chromecasts
              action: media_player.turn_off
              metadata: {}
              data: {}
              target:
                entity_id: '{{ non_playing_chromecasts }}'
            for_each: '{{ non_playing_chromecasts }}'
        enabled: true
        continue_on_error: true
      enabled: true
  - alias: Restore lights to their initial state
    repeat:
      sequence:
      - alias: Turn off lights back to off
        if:
        - alias: Light was off before
          condition: template
          value_template: '{{ not light_entity_ids[repeat.index - 1].2 | bool }}'
        then:
        - target:
            entity_id: '{{light_entity_ids[repeat.index - 1].0}}'
          enabled: true
          alias: Turn back off lights to previous state
          action: light.turn_{{ 'on' if light_entity_ids[repeat.index - 1].2 == 'on'
            else 'off' }}
      - alias: Turn on lights back to their original colors
        if:
        - alias: Light was on before
          condition: template
          value_template: '{{ light_entity_ids[repeat.index - 1].2 | bool }}'
        then:
        - target:
            entity_id: '{{light_entity_ids[repeat.index - 1].0}}'
          data:
            rgb_color: '{{light_entity_ids[repeat.index - 1].1}}'
          enabled: true
          alias: Turn back on lights to previous state
          action: light.turn_{{ 'on' if light_entity_ids[repeat.index - 1].2 == 'on'
            else 'off' }}
      count: '{{ light_entity_ids | length }}'
    enabled: false
  mode: queued
  icon: mdi:speaker-message
  max: 3
generate_and_save_localai_image:
  alias: Generate and save LocalAI image
  description: Generates an image using LocalAI's image generation API with the specified
    prompt, model, size, and steps parameters, then downloads and saves the result
    as stable_diffusion.jpg.
  sequence:
  - alias: Request an image from LocalAI
    service: rest_command.local_ai_generate_image
    metadata: {}
    data:
      prompt: '{{prompt}}'
      model: '{{model}}'
      size: '{{size}}'
      steps: '{{steps}}'
    response_variable: return
  - alias: Download the image as stable_diffusion.jpg
    service: downloader.download_file
    metadata: {}
    data:
      overwrite: true
      url: '{{return.content.data[0].url}}'
      filename: stable_diffusion.jpg
  mode: single
  icon: mdi:image-frame
generate_fake_white_colors:
  alias: Generate fake white colors
  description: Gives every light that is on and can show color (members of the light
    groups) a random tint at 30% saturation, either red-orange (hue 1–19) or purple-to-pink
    (hue 260–359), for a 'fake white' look made with colored bulbs.
  sequence:
  - alias: List lit color lights in light groups
    variables:
      on_lights: "{% set ns = namespace(lights=[]) %} {% set groups = integration_entities('group')|
        \ select('search', '^light.')   | list %} {% for group in groups %}\n    {%
        set individual_lights = state_attr(group,'entity_id')%}\n    {% for individual_light
        in individual_lights %}\n    {% if \"group\" not in individual_light  and
        state_attr(individual_light, 'rgb_color') and states(individual_light) ==
        'on' %}\n      {% set ns.lights = ns.lights  + [individual_light] %}\n    {%
        endif %}\n    {% endfor %}    \n{% endfor %} {{  ns.lights  }}\n"
  - alias: 'For each lit light: set a random tint'
    repeat:
      sequence:
      - alias: Set light to random hue at 30% saturation
        service: light.turn_on
        metadata: {}
        data:
          hs_color: "{% set hue_under_20 = range(1, 20) | random | string + ',' +
            30 | string %} {% set hue_over_260 = range(260, 360) | random | string
            + ',' + 30 | string %} {% set random = range(1, 3) | random %}           {%
            if random == 1 %}\n {{hue_under_20 }}\n{% elif random > 1 %}           {{hue_over_260}}
            {%endif%}\n"
        target:
          entity_id: '{{on_lights[repeat.index - 1]}}'
      for_each: '{{ on_lights }}'
  mode: restart
  icon: mdi:sale
  fields: {}
in_home_defense_script:
  alias: All on defense script
  description: 'Intruder response: rings Maxi''s phone, notifies both users with the
    latest Frigate snapshot, turns on the front and back door horns and plays a burglar
    alarm at full volume on the house speakers. If the security occupancy sensors
    still detect someone, the alarm plays until they are clear for 2 minutes (max
    30 minutes); otherwise it stops right away. Afterwards music following is turned
    back on, a follow-up notification is sent and the house volume is equalized; the
    horns are not turned off.'
  sequence:
  - alias: Ring Maxi's phone
    action: script.find_phone
    metadata: {}
    data: {}
    continue_on_error: true
  - alias: 'Notify users: intruder inside, with snapshot'
    metadata: {}
    data:
      message: 'The all on defense script has been turned on. '
      title: Intruder inside the home
      data:
        image: https://hass.purgatoire.ca/api/frigate/notifications/{{states("sensor.latest_frigate_event_id")}}/snapshot.jpg
        ttl: 0
        priority: high
        channel: security_alerts_notifications
    action: notify.users_notification_group
    continue_on_error: true
  - alias: Turn off music following
    metadata: {}
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.following_music
    data: {}
    continue_on_error: true
  - alias: Turn on front and back door horns
    metadata: {}
    data: {}
    target:
      entity_id:
      - switch.plug_back_door_horn
      - switch.plug_front_door_horn
    enabled: true
    action: switch.turn_on
    continue_on_error: true
  - alias: Set eight speakers to full volume
    action: media_player.volume_set
    metadata: {}
    data:
      volume_level: 1
    target:
      entity_id:
      - media_player.mass_bedroom_vpe_speaker
      - media_player.mass_hallway_wiim_speaker
      - media_player.mass_kitchen_wiim_speaker
      - media_player.mass_workshop_wiim_speaker
      - media_player.mass_salon_wiim_speaker
      - media_player.mass_lounge_wiim_speaker
      - media_player.mass_bathroom_vpe_speaker
      - media_player.closet_aux2_speaker
    continue_on_error: true
  - alias: Play burglar alarm on eight speakers
    data:
      media:
        media_content_id: media-source://media_source/local/burglar_alarm.mp3
        media_content_type: music
        metadata: {}
      enqueue: replace
    action: media_player.play_media
    target:
      entity_id:
      - media_player.mass_bedroom_vpe_speaker
      - media_player.mass_hallway_wiim_speaker
      - media_player.mass_kitchen_wiim_speaker
      - media_player.mass_workshop_wiim_speaker
      - media_player.mass_salon_wiim_speaker
      - media_player.mass_lounge_wiim_speaker
      - media_player.mass_bathroom_vpe_speaker
      - media_player.closet_aux2_speaker
    continue_on_error: true
  - alias: Set eight speakers to full volume again
    action: media_player.volume_set
    metadata: {}
    data:
      volume_level: 1
    target:
      entity_id:
      - media_player.mass_bedroom_vpe_speaker
      - media_player.mass_hallway_wiim_speaker
      - media_player.mass_kitchen_wiim_speaker
      - media_player.mass_workshop_wiim_speaker
      - media_player.mass_salon_wiim_speaker
      - media_player.mass_lounge_wiim_speaker
      - media_player.mass_bathroom_vpe_speaker
      - media_player.closet_aux2_speaker
    continue_on_error: true
  - alias: Raise volume 10 times on all speakers
    repeat:
      count: 10
      sequence:
      - alias: Raise volume on eight speakers
        action: media_player.volume_up
        metadata: {}
        data: {}
        target:
          entity_id:
