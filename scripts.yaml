set_one_light_to_white:
  alias: Set one light to white
  description: Stops the running effect of one light when it has one (effect_stop,
    stop_effect, WLED Solid, or ZHA colorloop off), then sets it to white. Called
    once per light by change_received_lights_to_white.
  mode: parallel
  max: 200
  icon: mdi:white-balance-iridescent
  fields:
    target_light:
      description: Light to change.
      name: Target light
      required: true
      selector:
        entity:
          domain: light
    color_temp_kelvin:
      description: White color temperature in Kelvin (4632 if omitted).
      name: Color temperature
      default: 4632
      selector:
        color_temp:
          unit: kelvin
          min: 2000
          max: 6500
    brightness_pct:
      description: Brightness in percent (100 if omitted).
      name: Brightness
      default: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: '%'
    transition_speed:
      name: Transition
      description: Fade time in seconds.
      default: 1
      selector:
        number:
          min: 0
          max: 30
          step: 0.5
          unit_of_measurement: s
  sequence:
  - alias: Find the light's stop-effect option
    variables:
      effects: '{{ state_attr(target_light, ''effect_list'') or [] }}'
      stop_effect: '{%- if ''effect_stop'' in effects -%} effect_stop {%- elif ''stop_effect''
        in effects -%} stop_effect {%- elif ''Solid'' in effects -%} Solid {%- elif
        ''off'' in effects and state_attr(target_light, ''effect'') == ''colorloop''
        -%} off {%- endif -%}'
  - alias: If the light has an effect to stop
    if:
    - alias: A stop-effect option was found
      condition: template
