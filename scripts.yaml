    - alias: Stop running effects on the inside lights that support effect_stop
      repeat:
        for_each: '{%- set ns = namespace(out=[]) -%} {%- for e in expand(''light.group_all_inside_lights'')
          | map(attribute=''entity_id'') -%} {%- if ''effect_stop'' in (state_attr(e,
          ''effect_list'') or []) -%} {%- set ns.out = ns.out + [e] -%} {%- endif
          -%} {%- endfor -%} {{ ns.out }}'
        sequence:
        - alias: Stop this light's effect at 4282 K, 100%
          action: light.turn_on
          metadata: {}
          data:
            color_temp_kelvin: 4282
            transition: 5
            brightness_pct: 100
            effect: effect_stop
          target:
            entity_id: '{{ repeat.item }}'
          continue_on_error: true
      continue_on_error: true
    - if:
      - alias: Home speakers are playing
