    parallel:
    - alias: Load party page on hallway tablet (disabled)
      action: fully_kiosk.load_url
      data:
        url: http://192.168.0.15:8095/#/party?frameless=true
        device_id: 9e6b82b1f2fa641af98d847cc1cf06a6
      continue_on_error: true
      enabled: false
    - alias: Load party page on Tablet Kitchen S6 Lite
      action: fully_kiosk.load_url
      data:
        url: http://192.168.0.15:8095/#/party?frameless=true
        device_id: a94170d4bf7a596defcb763eda129822
      continue_on_error: true
    - alias: Load party page on workshop tablet
      action: fully_kiosk.load_url
      data:
        url: http://192.168.0.15:8095/#/party?frameless=true
        device_id: ea5d6e406b53af2043a0e3e21444f36e
      continue_on_error: true
  alias: Launch Party Mode Jukebox on All Kiosks
  description: Loads the Music Assistant party jukebox page on the kitchen and workshop
    tablets at the same time through Fully Kiosk; the hallway tablet step is disabled.
    Useful for hosting events or gatherings.
apply_random_existing_effect_to_a_light_entity:
  alias: Apply random existing effect to a light entity
  description: Turns on each given light with a random effect from its own effect
    list, different from its current effect when possible. Lights are handled one
    after another.
  mode: parallel
  max: 200
  fields:
    light:
      name: light
      description: The light entity (or entities) to apply a random effect to.
      required: true
      selector:
        entity:
          multiple: true
          filter:
            domain: light
  sequence:
  - alias: 'For each light: apply a random different effect'
    repeat:
      for_each: '{{ light }}'
      sequence:
      - alias: Compute current effect and the other available effects
        variables:
          current_eff: '{{ state_attr(repeat.item, ''effect'') | default('''', true)
            }}'
          all_effs: '{{ state_attr(repeat.item, ''effect_list'') | default([], true)
            }}'
          filtered_effs: '{{ all_effs | reject(''eq'', current_eff) | list }}'
      - alias: Turn on light with a random other effect
        action: light.turn_on
        target:
          entity_id: '{{ repeat.item }}'
        data:
          effect: "{% if filtered_effs | count > 0 %}\n  {{ filtered_effs | random
            }}\n{% else %}\n  {{ all_effs | random }}\n{% endif %}\n"
apply_random_effect_to_all_effect_enabled_lights:
  alias: Apply random effect to all effect enabled lights
  description: Applies a random effect, different from the current one, to every house
    light that has effects (the lights in light.group_all_lights with more than one
    effect to choose from), all at the same time. By default only lights that are
    on change. Calls apply_random_existing_effect_to_a_light_entity once per light.
  mode: parallel
  max: 10
  icon: mdi:auto-fix
  fields:
    only_on:
      name: Only lights that are on
      description: Only change lights that are already on. Turn off to also switch
        on the effect lights that are off.
      default: true
      selector:
        boolean: {}
  sequence:
  - alias: List effect-capable lights of all lights group (on only by default)
    variables:
      on_only: '{{ only_on | default(true) | bool }}'
      lights: "{%- set ns = namespace(out=[]) -%} {%- for s in expand('light.group_all_lights')\n
        \    | selectattr('state', 'in', ['on'] if on_only else ['on', 'off']) -%}\n
        \ {%- if (s.attributes.get('effect_list') or []) | count > 1 -%}\n    {%-
        set ns.out = ns.out + [s.entity_id] -%}\n  {%- endif -%}\n{%- endfor -%} {{
        ns.out }}"
  - alias: 'For each light: start random effect script'
    repeat:
      for_each: '{{ lights }}'
      sequence:
      - alias: Start random effect script for this light
        action: script.turn_on
        target:
          entity_id: script.apply_random_existing_effect_to_a_light_entity
        data:
          variables:
            light:
            - '{{ repeat.item }}'
  - alias: Build result with the changed lights
    variables:
      result:
        changed: '{{ lights | count }}'
        lights: '{{ lights }}'
  - alias: Stop and return the changed lights
    stop: Effects applied
    response_variable: result
vibe_arc_gathering:
  alias: Vibe Arc - Gathering Phase
  description: 'Vibe Arc gathering phase (1–4 guests arriving): runs the cozy ambiance
    script and turns off the UV lamps and the trippy, vibrating and trippy-warm light
    effects. The Vibe Arc acting flag is on while the changes apply and for 3 seconds
    after.'
  icon: mdi:account-group-outline
  mode: single
  sequence:
  - alias: Mark Vibe Arc as acting
    action: input_boolean.turn_on
    target:
      entity_id: input_boolean.vibe_arc_acting
  - alias: Apply gathering settings in parallel
    parallel:
    - alias: Run the cozy ambiance script
      action: script.set_whole_house_to_cozy_ambiance_2
    - alias: Turn off all UV lamps
      action: switch.turn_off
      target:
        entity_id: switch.group_all_uv_lamps
      data: {}
    - alias: Turn off trippy, vibrating and trippy-warm effects
      action: input_boolean.turn_off
      target:
        entity_id:
        - input_boolean.trippy_lights_effect
        - input_boolean.vibrating_colors_effect
        - input_boolean.trippy_warm_colors_effect
  - alias: Wait 3 seconds
    delay:
      seconds: 3
  - alias: Clear the Vibe Arc acting flag
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.vibe_arc_acting
vibe_arc_warming_up:
  alias: Vibe Arc - Warming Up Phase
  description: 'Vibe Arc warming-up phase (5–7 guests): fades the inside lights to
    78% brightness over 90 seconds and the salon and lounge decorative lights to full
    over 30 seconds, turns on warm colors mode, turns off the trippy and vibrating
    effects and puts a flame effect on four ceiling and wall lights. The Vibe Arc
    acting flag stays on until 7 seconds after the changes.'
  icon: mdi:thermometer-chevron-up
  mode: single
  sequence:
  - alias: Mark Vibe Arc as acting
    action: input_boolean.turn_on
    target:
      entity_id: input_boolean.vibe_arc_acting
  - alias: Apply warming-up settings in parallel
    parallel:
    - alias: Fade inside lights to 78% over 90 s
      action: light.turn_on
      target:
        entity_id: light.group_all_inside_lights
      data:
        brightness: 200
        transition: 90
    - alias: Fade salon decorative lights to full over 30 s
      action: light.turn_on
      target:
        entity_id: light.group_salon_decorative_lights
      data:
        brightness: 255
        transition: 30
    - alias: Fade lounge decorative lamp to full over 30 s
      action: light.turn_on
      target:
        entity_id: light.group_lounge_decorative_lamp
      data:
        brightness: 255
        transition: 30
    - alias: Turn on warm colors mode
      action: input_boolean.turn_on
      target:
        entity_id: input_boolean.warm_colors
      data: {}
    - alias: Turn off trippy and vibrating effects
      action: input_boolean.turn_off
      target:
        entity_id:
        - input_boolean.trippy_lights_effect
        - input_boolean.vibrating_colors_effect
      data: {}
    - alias: Flame effect on four ceiling and wall lights
      action: light.turn_on
      target:
        entity_id:
        - light.kitchen_ceiling
        - light.salon_wall_light
        - light.lounge_ceiling_light
        - light.workshop_wall_light
      data:
        effect: effect_flame
        brightness_pct: 100
  - alias: Wait 5 seconds
    delay:
      seconds: 5
  - alias: Wait 2 seconds
    delay:
      seconds: 2
  - alias: Clear the Vibe Arc acting flag
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.vibe_arc_acting
vibe_arc_peak_party:
  alias: Vibe Arc - Peak Party Phase
  description: 'Vibe Arc peak-party phase (8+ guests, or loud and crowded): turns
    on party mode and runs the party ambiance script (pastel colors, LIFX morph, party
    visuals and playlist, blinds closed). The Vibe Arc acting flag stays on until
    3 seconds after.'
  icon: mdi:party-popper
  mode: single
  sequence:
  - alias: Mark Vibe Arc as acting
    action: input_boolean.turn_on
    target:
      entity_id: input_boolean.vibe_arc_acting
  - alias: Start party mode and ambiance in parallel
    parallel:
    - alias: Turn on party mode
      action: input_boolean.turn_on
      target:
        entity_id: input_boolean.party_mode
    - alias: Run the party ambiance script
      action: script.set_whole_house_to_party_ambiance
  - alias: Wait 3 seconds
    delay:
      seconds: 3
  - alias: Clear the Vibe Arc acting flag
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.vibe_arc_acting
vibe_arc_late_night:
  alias: Vibe Arc - Late Night Phase
  description: 'Vibe Arc late-night phase (after 1 AM with 5–8 guests): turns on Acid
    Time and the trippy warm colors effect and runs the psychedelic ambiance script.
    The Vibe Arc acting flag stays on until 3 seconds after.'
  icon: mdi:weather-night
  mode: single
  sequence:
  - alias: Mark Vibe Arc as acting
    action: input_boolean.turn_on
    target:
      entity_id: input_boolean.vibe_arc_acting
    data: {}
  - alias: Start psychedelic settings in parallel
    parallel:
    - alias: Turn on Acid Time
      action: input_boolean.turn_on
      target:
        entity_id: input_boolean.acid_time
    - alias: Run the psychedelic ambiance script
      action: script.set_whole_house_to_acid_time
      data: {}
    - alias: Turn on trippy warm colors effect
      action: input_boolean.turn_on
      target:
        entity_id: input_boolean.trippy_warm_colors_effect
  - alias: Wait 3 seconds
    delay:
      seconds: 3
  - alias: Clear the Vibe Arc acting flag
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.vibe_arc_acting
vibe_arc_wind_down:
  alias: Vibe Arc - Wind Down Phase
  description: 'Vibe Arc wind-down phase (after 3 AM or fewer than 4 guests): turns
