set_one_light_to_vibrating_colors:
  alias: Set one light to vibrating colors
  description: Randomized shimmer around a light's resting hue, looping while input_boolean.vibrating_colors_effect
    is on AND the light is still on. Called once per light by change_received_lights_to_vibrating_colors.
  mode: parallel
  max: 200
  icon: mdi:sine-wave
  fields:
    target_light:
      description: Light to animate.
      name: Target light
      required: true
      selector:
        entity:
          domain: light
  sequence:
  - alias: Remember the light's current hue
    variables:
      base_hue: '{{ state_attr(target_light, ''hs_color'')[0] if state_attr(target_light,
        ''hs_color'') else 0 }}'
  - alias: Wait a random 0–2× speed seconds
    delay:
      seconds: '{{ (range(0, ((states(''input_number.vibrating_color_effect_speed'')
        | float * 2) * 10) | int + 1) | random) / 10 }}'
  - alias: Repeat while effect on and light on
    repeat:
      while:
      - alias: Vibrating colors effect is on
        condition: state
        entity_id: input_boolean.vibrating_colors_effect
        state: 'on'
      - alias: Light is still on
        condition: template
        value_template: '{{ is_state(target_light, ''on'') }}'
      sequence:
      - alias: Pick hue offset ±12–35° and timings
        variables:
          speed: '{{ states(''input_number.vibrating_color_effect_speed'') | float
            }}'
          sat: '{{ states(''input_number.vibrating_color_effect_saturation'') | int
            }}'
          offset: '{{ (range(12, 36) | random) * ([1, -1] | random) }}'
          target_hue: '{{ ((base_hue + offset) % 360) | int }}'
          move_time: '{{ ([0.5, speed * (range(60, 141) | random) / 100] | max) |
            round(1) }}'
          hold_time: '{{ ([0.4, speed * (range(70, 151) | random) / 100] | max) |
            round(1) }}'
      - alias: Fade the light to the shifted hue
        action: light.turn_on
        target:
          entity_id: '{{ target_light }}'
        data:
          transition: '{{ move_time }}'
          hs_color:
          - '{{ target_hue }}'
          - '{{ sat }}'
        continue_on_error: true
      - alias: Hold for the random hold time
        delay:
          seconds: '{{ hold_time }}'
