change_received_lights_to_white:
  alias: Change received lights to white
  description: Changes lights to white. Stops any running light effect first, then
    sets the color temperature and brightness, and finally turns off the UV lamps
    in the same rooms. Target lights with area and/or light (groups are expanded).
    With neither area nor light, every light that is currently on changes.
  mode: parallel
  max: 10
  icon: mdi:white-balance-iridescent
  fields:
    area:
      name: Area
      description: Area(s) whose lights should change. Uses the room's light groups
        when it has any, otherwise every light in the room. Leave both area and light
        out to change every light that is currently on.
      selector:
        area:
          multiple: true
    light:
      name: Light
      description: Light(s) or light groups to change. Groups are expanded to their
        member lights.
      selector:
        entity:
          multiple: true
          domain: light
    only_on:
      name: Only lights that are on
      description: Only change lights that are already on.
      default: false
      selector:
        boolean: {}
    color_temp_kelvin:
      name: Color temperature
      description: White color temperature in Kelvin.
      default: 4632
      selector:
        color_temp:
          unit: kelvin
          min: 2000
          max: 6500
    brightness_pct:
      name: Brightness
      description: Brightness in percent.
      default: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: '%'
    transition_speed:
      name: Transition
      description: Fade time in seconds.
      default: 1
      selector:
        number:
          min: 0
          max: 30
          step: 0.5
          unit_of_measurement: s
    turn_off_uv:
      name: Turn off UV lamps
      description: Also turn off the UV lamps in the rooms of the changed lights.
      default: true
      selector:
        boolean: {}
  sequence:
  - alias: Resolve target lights that can show white
    variables:
      targets: "{%- if area is not defined and light is not defined -%}\n  {{ ['light.group_all_lights']
        }}\n{%- else -%}\n  {%- set areas = area if area is defined and area else
        [] -%}\n  {%- set areas = [areas] if areas is string else areas -%}\n  {%-
        set picked = light if light is defined and light else [] -%}\n  {%- set picked
        = [picked] if picked is string else picked -%}\n  {%- set ns = namespace(roots=[])
        -%}\n  {%- for a in areas -%}\n    {%- set in_area = area_entities(a) | select('match',
        'light[.]') | list -%}\n    {%- set room_groups = in_area | select('match',
        'light[.]group_') | list -%}\n    {%- set ns.roots = ns.roots + (room_groups
        if room_groups else in_area) -%}\n  {%- endfor -%}\n  {{ (ns.roots + picked
        | list) | unique | list }}\n{%- endif -%}"
      on_only: '{{ (area is not defined and light is not defined) or (only_on | default(false)
        | bool) }}'
      lights: "{{ expand(targets)\n   | selectattr('domain', 'eq', 'light')\n   |
        rejectattr('attributes.entity_id', 'defined')\n   | selectattr('attributes.supported_color_modes',
        'defined')\n   | selectattr('attributes.supported_color_modes', 'search',
        'color_temp|hs|rgb|xy|white')\n   | selectattr('state', 'in', ['on'] if on_only
        else ['on', 'off'])\n   | map(attribute='entity_id') | unique | list }}"
  - alias: 'For each light: start white script'
    repeat:
      for_each: '{{ lights }}'
      sequence:
      - alias: Start white script for this light
        action: script.turn_on
        target:
          entity_id: script.set_one_light_to_white
        data:
          variables:
            target_light: '{{ repeat.item }}'
            color_temp_kelvin: '{{ color_temp_kelvin | default(4632) }}'
            brightness_pct: '{{ brightness_pct | default(100) }}'
            transition_speed: '{{ transition_speed | default(1) }}'
  - alias: Find UV lamp switches in the lights' rooms
    variables:
      uv_switches: "{%- set rooms = lights | map('area_id') | reject('none') | unique
        | list -%} {%- set in_rooms = rooms | map('area_entities') | sum(start=[])\n
        \    | select('match', 'switch[.]') | select('search', '([.]|_)uv[0-9]*(_|$)')\n
        \    | select('has_value') | list -%}\n{%- set house = ['switch.group_all_uv_lamps']
        if 'light.group_all_lights' in targets\n     or 'light.group_all_inside_lights'
        in targets else [] -%}\n{{ (in_rooms + house) | unique | list }}"
  - alias: If UV lamps should be turned off and some were found
    if:
    - alias: turn_off_uv enabled and UV switches found
      condition: template
      value_template: '{{ (turn_off_uv | default(true) | bool) and (uv_switches |
        count > 0) }}'
    then:
    - alias: Turn off the UV lamp switches
      action: switch.turn_off
      target:
        entity_id: '{{ uv_switches }}'
      continue_on_error: true
  - alias: Build result with the changed lights
    variables:
      result:
        changed: '{{ lights | count }}'
        lights: '{{ lights }}'
  - alias: Stop and return the changed lights
    stop: Lights changed
    response_variable: result
generate_parking_camera_description:
