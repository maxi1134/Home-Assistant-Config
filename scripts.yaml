      request:
        '[object Object]':
  - alias: Browse Jellyfin movies via the salon Chromecast
    action: media_player.browse_media
    data:
      media_content_id: media-source://jellyfin/f137a2dd21bbc1b99aa5c0f6bf02a805
      media_content_type: movies
    target:
      entity_id: media_player.salon_chromecast
    response_variable: results
  - alias: Extract media id of a title containing 'Step'
    variables:
      picked_movie2: '{% set t =  results | regex_findall(find="(title:.*Step.*)$\n.*\n.*\n.*(media_content_id:
        )(.*)") %} {{ t[2] }}

        '
  alias: Script to launch Movie from Jellyfin on a TV
  description: 'Experimental: browses the Jellyfin movie library through the salon
    Chromecast and extracts, with a regex, the media id of a title containing ''Step''
    (hard-coded). Nothing is played, and the first step overwrites the request input
    with a broken value.'
  fields:
    request:
      description: 'Movie title to look up in the Jellyfin library (default Step Brothers).
        Currently ignored: the first step overwrites it and the search is hard-coded
        to titles containing ''Step''.'
      selector:
        text:
      name: Request
      default: Step Brothers
      required: true
change_received_lights_to_warm_saturated_colors:
  alias: Change received lights to warm saturated colors
  description: Changes lights to warm saturated colors (deep reds, magentas and purples;
    hue 1-19 or 260-359 at full saturation). Each light gets its own hue, at least
    25 degrees away from its current one, and all lights change at the same time.
    Target lights with area and/or light (groups are expanded, lights that cannot
    show colors are skipped). With neither area nor light, every light that is currently
    on changes.
  mode: parallel
  max: 10
  icon: mdi:fire
  fields:
    area:
      name: Area
      description: Area(s) whose lights should change. Uses the room's light groups
        when it has any, otherwise every light in the room. Leave both area and light
        out to change every light that is currently on.
      selector:
        area:
          multiple: true
    light:
      name: Light
      description: Light(s) or light groups to change. Groups are expanded to their
        member lights.
      selector:
        entity:
          multiple: true
          domain: light
    only_on:
      name: Only lights that are on
      description: Only change lights that are already on.
      default: false
      selector:
        boolean: {}
    saturation:
      name: Saturation
      description: Color saturation in percent.
      default: 100
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: '%'
    transition_speed:
      name: Transition
      description: Fade time in seconds.
      default: 1
      selector:
        number:
          min: 0
          max: 30
          step: 0.5
          unit_of_measurement: s
  sequence:
  - alias: Resolve target lights that support color
    variables:
      targets: "{%- if area is not defined and light is not defined -%}\n  {{ ['light.group_all_lights']
        }}\n{%- else -%}\n  {%- set areas = area if area is defined and area else
        [] -%}\n  {%- set areas = [areas] if areas is string else areas -%}\n  {%-
        set picked = light if light is defined and light else [] -%}\n  {%- set picked
        = [picked] if picked is string else picked -%}\n  {%- set ns = namespace(roots=[])
        -%}\n  {%- for a in areas -%}\n    {%- set in_area = area_entities(a) | select('match',
        'light[.]') | list -%}\n    {%- set room_groups = in_area | select('match',
        'light[.]group_') | list -%}\n    {%- set ns.roots = ns.roots + (room_groups
        if room_groups else in_area) -%}\n  {%- endfor -%}\n  {{ (ns.roots + picked
        | list) | unique | list }}\n{%- endif -%}"
      on_only: '{{ (area is not defined and light is not defined) or (only_on | default(false)
        | bool) }}'
      lights: "{{ expand(targets)\n   | selectattr('domain', 'eq', 'light')\n   |
        rejectattr('attributes.entity_id', 'defined')\n   | selectattr('attributes.supported_color_modes',
        'defined')\n   | selectattr('attributes.supported_color_modes', 'search',
        'hs|rgb|xy')\n   | selectattr('state', 'in', ['on'] if on_only else ['on',
        'off'])\n   | map(attribute='entity_id') | unique | list }}"
  - alias: 'For each light: start warm saturated script'
    repeat:
      for_each: '{{ lights }}'
      sequence:
      - alias: Start warm saturated script for this light
        action: script.turn_on
        target:
          entity_id: script.set_one_light_to_a_warm_saturated_color
        data:
          variables:
            target_light: '{{ repeat.item }}'
            saturation: '{{ saturation | default(100) }}'
            transition_speed: '{{ transition_speed | default(1) }}'
  - alias: Build result with the changed lights
    variables:
      result:
        changed: '{{ lights | count }}'
        lights: '{{ lights }}'
  - alias: Stop and return the changed lights
    stop: Lights changed
    response_variable: result
start_a_random_maxi_playlist:
  sequence:
  - alias: Compute playlist, home group members and target players
    variables:
      maxi_playlists:
      - Maxi's Smart Playlist
      - Maxi's Smart Discovery Playlist
      - Infinite Mix (favorites)
      - My Mix 1
      - My Mix 2
      - My Mix 3
      - My Mix 4
      - My Mix 5
      - My Mix 6
      home_group: media_player.group_mass_home_group_speakers
      requested_playlist: '{% if requested_playlist is defined and requested_playlist
        | string | trim -%} {{- requested_playlist | string | trim -}} {%- else -%}
        Maxi''s Smart Playlist {%- endif %}'
      home_group_members: "{% set want = ['salon', 'workshop', 'kitchen', 'lounge',
        'hallway', 'hotbox', 'patio'] -%} {% set ns = namespace(members=[]) -%} {%
        for aid in areas() -%}\n  {% if ((area_name(aid) or '') | lower) in want -%}\n
        \   {% set ns.members = ns.members + (area_entities(aid) | select('search',
        'media_player.mass.*_speaker') | list) -%}\n  {% endif -%}\n{% endfor -%}
        {{ ns.members | unique | list }}"
      players: "{% set ns = namespace(players=[]) -%} {% if player_entity is defined
        and player_entity is mapping and player_entity.entity_id is defined and player_entity.entity_id
        -%}\n  {% if player_entity.entity_id is string -%}\n    {% set ns.players
        = [player_entity.entity_id | trim] -%}\n  {% else -%}\n    {% set ns.players
        = player_entity.entity_id | map('trim') | list -%}\n  {% endif -%}\n{% elif
        player_entity is defined and player_entity is string and player_entity | trim
        and '{}' not in player_entity -%}\n  {% set ns.players = [player_entity |
        trim] -%}\n{% elif area is defined and area -%}\n  {% set areas = area if
        (area is iterable and area is not string) else [area] -%}\n  {% for a in areas
        -%}\n    {% set ns.players = ns.players + (area_entities(a) | select('search',
        'media_player.mass.*_speaker') | list) -%}\n  {% endfor -%}\n{% endif -%}
        {% set valid = states.media_player | map(attribute='entity_id') | list -%}
        {% set ns.players = ns.players | select('in', valid) | unique | list -%} {%
        if ns.players | length == 0 -%}\n  {% set ns.players = [home_group] -%}\n{%
        endif -%} {{ ns.players }}"
      leader: '{{ players | first }}'
      followers: '{{ players[1:] }}'
  - alias: If a specific player (not the home group) is targeted
    if:
    - alias: Leader is not the home group
      condition: template
      value_template: '{{ leader != home_group }}'
    then:
    - alias: Unjoin the target players from any group
      action: media_player.unjoin
      target:
        entity_id: '{{ players }}'
    - alias: Wait 1 second
      delay:
        seconds: 1
  - alias: If the home group is targeted and has members
    if:
    - alias: Leader is the home group and room speakers found
      condition: template
      value_template: '{{ leader == home_group and home_group_members | length > 0
        }}'
    then:
    - alias: Stop playback on all home group room speakers
      action: media_player.media_stop
      target:
        entity_id: '{{ home_group_members }}'
    - alias: Wait 1 second
      delay:
        seconds: 1
    - alias: Join the room speakers into the home group
      action: media_player.join
      target:
        entity_id: '{{ home_group }}'
      data:
        group_members: '{{ home_group_members }}'
    - alias: Wait 2 seconds
      delay:
        seconds: 2
  - alias: If more than one player was requested
    if:
    - alias: More than one target player
      condition: template
      value_template: '{{ players | length > 1 }}'
    then:
    - alias: Join the other players to the leader
      action: media_player.join
      target:
        entity_id: '{{ leader }}'
      data:
        group_members: '{{ followers }}'
    - alias: Wait 1 second
      delay:
        seconds: 1
  - alias: Turn on shuffle on the leader (ignore errors)
    action: media_player.shuffle_set
    metadata: {}
    data:
      shuffle: true
    target:
      entity_id: '{{ leader }}'
    continue_on_error: true
  - alias: Play the requested or random playlist on the leader
    target:
      entity_id: '{{ leader }}'
    data:
      media:
        media_content_id: '{% if requested_playlist != ''none'' -%} {{- requested_playlist
          -}} {%- else -%} {{- maxi_playlists | random -}} {%- endif %}'
        media_content_type: playlist
        metadata: {}
    action: media_player.play_media
  fields:
    player_entity:
      selector:
        target: {}
      name: Player entity
      description: The player(s) to play music on. Accepts one or more media players.
        The first one becomes the group leader.
      default:
        entity_id: media_player.group_mass_home_group_speakers
      required: false
    requested_playlist:
      selector:
        text:
      name: Requested Playlist
      description: Exact name of the Music Assistant playlist to play (default Maxi's
        Smart Playlist). Pass 'none' to pick one of Maxi's nine playlists at random.
      default: Maxi's Smart Playlist
    area:
      selector:
        area:
          entity:
            integration: music_assistant
            domain: media_player
          multiple: true
      name: Area
      description: The area or areas for which the music is requested. If the request
        does not mention a target (either an area or a player), use the area the request
        comes from. If the area can not be determined from the request, or the device
        the request comes from, do not use this parameter. Only use both the "area"
        parameter and the "player_entity" parameter together if both are specifically
        used in the request.
  alias: Start a random maxi playlist (Only use for playlists)
  description: 'Plays a Music Assistant playlist on the requested player(s) or the
    speakers of the requested area(s), defaulting to the whole-house Home Group: the
    named playlist (default Maxi''s Smart Playlist) or, when ''none'' is requested,
    one of nine Maxi playlists at random. Specific players are first unjoined (extra
    players then join the first one as leader); when the Home Group is the target,
    its room WiiM speakers (salon, workshop, kitchen, lounge, hallway, hotbox, patio)
    are stopped and re-joined to it first. Shuffle is turned on before playing.'
  mode: restart
change_received_lights_to_random_pastel_colors:
  alias: Change received lights to random pastel colors
  description: Changes lights to random pastel colors (random hue at low saturation).
    Each light gets its own hue, at least 25 degrees away from its current one, and
    all lights change at the same time. Target lights with area and/or light (groups
    are expanded, lights that cannot show colors are skipped). With neither area nor
    light, every light that is currently on changes.
  mode: parallel
  max: 10
  icon: mdi:palette-swatch
  fields:
    area:
      name: Area
      description: Area(s) whose lights should change. Uses the room's light groups
        when it has any, otherwise every light in the room. Leave both area and light
        out to change every light that is currently on.
      selector:
        area:
          multiple: true
    light:
      name: Light
      description: Light(s) or light groups to change. Groups are expanded to their
        member lights.
      selector:
        entity:
          multiple: true
          domain: light
    only_on:
      name: Only lights that are on
      description: Only change lights that are already on.
      default: false
      selector:
        boolean: {}
    saturation:
      name: Saturation
      description: Color saturation in percent. Pastel is 40.
      default: 40
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: '%'
    transition_speed:
      name: Transition
      description: Fade time in seconds.
      default: 1
      selector:
        number:
          min: 0
          max: 30
          step: 0.5
          unit_of_measurement: s
  sequence:
  - alias: Resolve target lights that support color
    variables:
      targets: "{%- if area is not defined and light is not defined -%}\n  {{ ['light.group_all_lights']
        }}\n{%- else -%}\n  {%- set areas = area if area is defined and area else
        [] -%}\n  {%- set areas = [areas] if areas is string else areas -%}\n  {%-
        set picked = light if light is defined and light else [] -%}\n  {%- set picked
        = [picked] if picked is string else picked -%}\n  {%- set ns = namespace(roots=[])
        -%}\n  {%- for a in areas -%}\n    {%- set in_area = area_entities(a) | select('match',
        'light[.]') | list -%}\n    {%- set room_groups = in_area | select('match',
        'light[.]group_') | list -%}\n    {%- set ns.roots = ns.roots + (room_groups
        if room_groups else in_area) -%}\n  {%- endfor -%}\n  {{ (ns.roots + picked
        | list) | unique | list }}\n{%- endif -%}"
      on_only: '{{ (area is not defined and light is not defined) or (only_on | default(false)
        | bool) }}'
      lights: "{{ expand(targets)\n   | selectattr('domain', 'eq', 'light')\n   |
        rejectattr('attributes.entity_id', 'defined')\n   | selectattr('attributes.supported_color_modes',
        'defined')\n   | selectattr('attributes.supported_color_modes', 'search',
        'hs|rgb|xy')\n   | selectattr('state', 'in', ['on'] if on_only else ['on',
        'off'])\n   | map(attribute='entity_id') | unique | list }}"
  - alias: 'For each light: start pastel color script'
    repeat:
      for_each: '{{ lights }}'
      sequence:
      - alias: Start pastel color script for this light
        action: script.turn_on
        target:
          entity_id: script.set_one_light_to_a_random_pastel_color
        data:
          variables:
            target_light: '{{ repeat.item }}'
            saturation: '{{ saturation | default(40) }}'
            transition_speed: '{{ transition_speed | default(1) }}'
  - alias: Build result with the changed lights
    variables:
      result:
        changed: '{{ lights | count }}'
        lights: '{{ lights }}'
  - alias: Stop and return the changed lights
    stop: Lights changed
    response_variable: result
