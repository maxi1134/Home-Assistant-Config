        condition: template
        value_template: '{{ include_visuals | default(true) | bool }}'
      then:
      - alias: Start Fireplace Visuals on idle TVs
        action: script.start_visual_playlist_on_plex
        metadata: {}
        data:
          requested_playlist: Fireplace Visuals
          start_on_off_only: false
        continue_on_error: true
  description: 'Sets a cozy fireplace ambiance: first a warm 2236 K base at 40% on
    all inside lights (60-second fade), then the fireplace effect at full brightness
    on the inside lights (LIFX bulbs excluded), the flame effect on six LIFX wall
    and ceiling lights and the hotbox desk tube (of these, only the tube''s LIFX model
    can show flame), a warm 2668 K breathing effect on the patio lights (75%), the
    ''1 Vintage'' effect on the lounge Christmas tree, the Blaze effect on the lounge
    Nanoleaf, and Fireplace Visuals on idle TVs (skipped when include_visuals is false).
    Meant for an LLM to use when a cozy mood is wanted; it is not the normal mode.'
  icon: mdi:fireplace
  fields:
    include_visuals:
      name: Include TV visuals
      description: Start Fireplace Visuals on idle TVs. Defaults to on; pass false
        to only change the lights.
      default: true
      required: false
      selector:
        boolean: {}
changes_selected_light_group_to_random_fake_white:
  alias: Changes selected light group to random fake white
  sequence:
  - alias: Assign shuffled evenly spaced hues
    variables:
      lights: "{%- set light_group = states.light | selectattr('entity_id', 'in',
        state_attr(selected_group, 'entity_id'))  | list -%} {%- set num_lights =
        light_group | count -%} {%- set h_increment = (360 // num_lights) | int -%}
        {%- set hue_values = namespace(values=[]) %}\n{%- for i in range(num_lights)
        %}\n  {%- set hue_values.values = hue_values.values + [i * h_increment] %}\n{%-
        endfor %}\n{%- set ns = namespace(output=[], shuffled_hues=[]) %}\n{%- for
        i in range(num_lights) %}\n  {%- set rand = (range(hue_values.values | count)
        | random) -%}\n  {%- set h = hue_values.values[rand] -%}\n  {%- set hue_values.values
        = hue_values.values | reject('equalto', h) | list -%}\n  {%- set ns.shuffled_hues
        = ns.shuffled_hues + [h] -%}\n{%- endfor %}\n{%- for i in range(num_lights)
        %}\n  {%- set light = light_group[i] -%}\n  {%- set h = ns.shuffled_hues[i]
        -%}\n  {%- set s = 100 -%}\n  {%- set hs_color = [h, s] -%}\n  {% set temp_output
        = {\n    \"entity_id\": light.entity_id,\n    \"hs_color\": hs_color\n  }
        %}\n  {% set ns.output = ns.output + [temp_output] %}\n{%- endfor %}\n{{ ns.output
        }}\n"
  - alias: 'For each light: apply its hue'
    repeat:
      sequence:
      - alias: Set light to its hue instantly
        data:
          hs_color: '{{ repeat.item.hs_color }}'
          transition: 0
        target:
          entity_id: '{{ repeat.item.entity_id }}'
        action: light.turn_on
      for_each: '{{ lights }}'
  mode: parallel
  icon: mdi:sale
  fields: {}
  description: Distributes evenly-spaced hues across the lights in a selected group
    with shuffled assignments, creating a randomized rainbow "fake white" effect where
    no single bulb is actually white but the combined output approximates white light.
  max: 2
equalize_home_group_volume:
  alias: Equalize Home GRoup volume
  sequence:
  - alias: Get average volume and speaker list
    variables:
      average_volume: '{{ states(''sensor.template_average_unmuted_speakers_volume'')|float
        / 100}}'
      speakers:
      - media_player.mass_hallway_wiim_speaker
