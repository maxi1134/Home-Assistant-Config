    data:
      volume_level: '{{average_volume}}'
    target:
      entity_id: '{{ speakers}}

        '
  - alias: 'For each speaker: mute if room empty'
    repeat:
      sequence:
      - alias: Mute if empty
        if:
        - alias: Speaker's room has no motion
          condition: template
          value_template: '{{ area_id(repeat.item) | string | lower not in states(''sensor.active_motion_rooms'')
