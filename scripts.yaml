changes_all_on_lights_to_fake_white:
  alias: Changes selected light group to ordered fake white
  sequence:
  - alias: Assign evenly spaced hues, shuffle order
    variables:
      lights: "{%- set light_group = states.light | selectattr('entity_id', 'in',
        state_attr(selected_group, 'entity_id'))  | list -%} {%- set num_lights =
        light_group | count -%} {%- set h_increment = 360 / num_lights -%} {% set
        ns = namespace(output=[] ) %}\n{%- for i in range(num_lights) %}\n  {%- set
        light = light_group[i] -%}\n  {%- set h = (h_increment * i) | int -%}\n  {%-
        set s = 100 -%}\n  {%- set hs_color = [h, s] -%}\n  {% set temp_output= {\n
        \   \"entity_id\":  light.entity_id ,\n    \"hs_color\":  hs_color \n  } %}\n
        \ {% set ns.output = [temp_output] + ns.output %}\n  \n{%- endfor %}  {% set
        lights = ns.output %} {% set ns = namespace(x = lights) %}  {% for i in range(ns.x
        | length - 1, 0, -1) %}\n    {% set j = range(0, i + 1) | random %}\n    {%
        if j != i %}\n      {% set ns.x = ns.x[:j]+[ns.x[i]]+ns.x[j+1:i]+[ns.x[j]]+ns.x[i+1:]
        %}\n    {% endif %}\n{% endfor %} {{ ns.x }}\n"
  - alias: 'For each light: apply its hue'
    repeat:
      sequence:
      - alias: Set light to its hue instantly
        data:
          hs_color: '{{ repeat.item.hs_color }}'
          transition: 0
        target:
          entity_id: '{{ repeat.item.entity_id }}'
        action: light.turn_on
      for_each: '{{ lights }}'
  mode: restart
  icon: mdi:sale
  fields:
    area:
      selector:
        area:
          entity:
            integration: group
            domain: light
          multiple: true
      name: Area
      description: Not used by the script; it reads the light group from a selected_group
        variable instead.
  description: Gives each light in the selected light group a different fully saturated
    hue, spread evenly around the color wheel in entity order, with no transition.
    The lights are updated in random order, but each light's hue is fixed.
inside_only_home_defense_script:
  alias: Inside only home defense script
  sequence:
  - alias: Turn off music following
    action: input_boolean.turn_off
    metadata: {}
    data: {}
    target:
      entity_id: input_boolean.following_music
  - alias: Clear the home speaker group queue
    action: media_player.clear_playlist
    metadata: {}
    data: {}
    target:
      entity_id: media_player.group_mass_home_group_speakers
    continue_on_error: true
  - alias: Turn off the home speaker group
    action: media_player.turn_off
    metadata: {}
    data: {}
    target:
      entity_id: media_player.group_mass_home_group_speakers
    continue_on_error: true
  - alias: Set home speakers to full volume
    action: media_player.volume_set
    metadata: {}
    data:
      volume_level: 1
    target:
      entity_id:
      - media_player.group_mass_home_group_speakers
      - media_player.mass_bedroom_vpe_speaker
      - media_player.mass_kitchen_wiim_speaker
      - media_player.mass_workshop_wiim_speaker
      - media_player.mass_lounge_wiim_speaker
      - media_player.mass_salon_wiim_speaker
      - media_player.mass_hallway_wiim_speaker
    continue_on_error: true
  - alias: Play burglar alarm on home speakers
    action: media_player.play_media
    metadata: {}
    target:
      entity_id:
      - media_player.group_mass_home_group_speakers
      - media_player.mass_bathroom_vpe_speaker
      - media_player.mass_bedroom_vpe_speaker
      - media_player.mass_closet_vpe_speaker
    data:
      media:
        media_content_id: media-source://media_source/local/burglar_alarm.mp3
        media_content_type: audio/mpeg
        metadata:
          title: burglar_alarm.mp3
          thumbnail:
          media_class: music
          children_media_class:
          navigateIds:
          - {}
          - media_content_type: app
            media_content_id: media-source://media_source
          - media_content_type: ''
            media_content_id: media-source://media_source/local/.
          browse_entity_id: media_player.group_mass_home_group_speakers
    continue_on_error: true
  - alias: Set all home speakers to full volume
    action: media_player.volume_set
    metadata: {}
    data:
      volume_level: 1
    target:
      entity_id:
      - media_player.group_mass_home_group_speakers
      - media_player.mass_bedroom_vpe_speaker
      - media_player.mass_kitchen_wiim_speaker
      - media_player.mass_workshop_wiim_speaker
      - media_player.mass_lounge_wiim_speaker
      - media_player.mass_salon_wiim_speaker
      - media_player.mass_hallway_wiim_speaker
      - media_player.mass_bathroom_vpe_speaker
      - media_player.mass_closet_vpe_speaker
    continue_on_error: true
  - alias: Wait up to 40 min for 5 min without occupancy
    wait_for_trigger:
    - alias: Security occupancy clears for 5 min
      entity_id:
      - binary_sensor.group_security_occupancy_sensors
      to:
      - 'off'
      from:
      - 'on'
      for:
        hours: 0
        minutes: 5
        seconds: 0
      trigger: state
    timeout:
      hours: 0
      minutes: 40
      seconds: 0
      milliseconds: 0
    continue_on_timeout: false
    continue_on_error: true
  - alias: Stop the alarm on home speakers
    action: media_player.media_stop
    metadata: {}
    data: {}
    target:
      entity_id:
      - media_player.group_mass_home_group_speakers
      - media_player.mass_bathroom_vpe_speaker
      - media_player.mass_bedroom_vpe_speaker
      - media_player.mass_closet_vpe_speaker
    continue_on_error: true
  - alias: Turn music following back on
    action: input_boolean.turn_on
    metadata: {}
    data: {}
    target:
      entity_id: input_boolean.following_music
    continue_on_error: true
  mode: restart
  description: 'Indoor-only alarm: turns off music following, stops the home speaker
    group and plays a burglar alarm at full volume on the home speakers. Once the
    security occupancy sensors go from detected to clear for 5 minutes, it stops the
    alarm and turns music following back on. If that does not happen within 40 minutes
    the script ends and the alarm keeps playing.'
start_plex_media_on_requested_player:
  alias: Start plex media on requested player
  sequence:
  - alias: List all chromecasts
    variables:
      chromecasts: '{{integration_entities(''cast'')  |  select(''search'', ''chromecast'')
        | list}}

        '
  - alias: For each chromecast
    repeat:
      sequence:
      - alias: If the next listed chromecast is off
        if:
        - alias: Next listed chromecast is off
          condition: template
          value_template: '{{states(chromecasts[repeat.index ]) == "off"}}'
        then:
        - alias: Build shuffled Plex playlist URI
          variables:
            playlist: 'plex://{"playlist_name":"{{requested_playlist}}","shuffle":"1"}

              '
        - alias: Play the playlist on that chromecast
          service: media_player.play_media
          data:
            media_content_id: '{{playlist}}'
            media_content_type: playlist
          target:
            entity_id: '{{chromecasts[repeat.index]}}'
        - alias: Wait 15 seconds
          delay:
            hours: 0
            minutes: 0
            seconds: 15
            milliseconds: 0
      for_each: '{{ chromecasts }}'
  mode: single
  icon: mdi:audio-video
  description: Starts the requested Plex playlist, shuffled, on each Chromecast that
    is off, waiting 15 seconds after each start. The loop reads the list one position
    ahead, so the first Chromecast is never used.
set_whole_house_to_cozy_ambiance_2:
  alias: Set whole house to cozy ambiance
  sequence:
  - alias: 'Warm base: all inside lights to 2236 K at 40% over 60 s (before the effects)'
    action: light.turn_on
    metadata: {}
    data:
      brightness_pct: 40
      color_temp_kelvin: 2236
      transition: 60
    target:
      entity_id: light.group_all_inside_lights
