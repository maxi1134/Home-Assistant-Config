change_lights_in_an_area_to_a_random_fake_white:
  sequence:
  - alias: Expand the area's light groups into individual colour lights
    variables:
      lights: "{%- set areas = [area] if area is string else area -%}\n{%- set groups
        = areas | map('area_entities') | sum(start=[])\n     | select('match', 'light[.]group_')
        | list -%}\n{{ expand(groups)\n   | selectattr('domain', 'eq', 'light')\n
        \  | rejectattr('attributes.entity_id', 'defined')\n   | rejectattr('state',
        'in', ['unavailable', 'unknown'])\n   | selectattr('attributes.supported_color_modes',
        'defined')\n   | selectattr('attributes.supported_color_modes', 'search',
        'hs|rgb|xy')\n   | map(attribute='entity_id') | unique | list }}"
  - alias: Split 360 degrees evenly across the lights and shuffle the hues
    variables:
      assignments: "{%- set n = lights | count -%}\n{%- set ns = namespace(pool=[],
        out=[]) -%}\n{%- for i in range(n) -%}\n  {%- set ns.pool = ns.pool + [(i
        * 360 / n) | round(1)] -%}\n{%- endfor -%}\n{%- for l in lights -%}\n  {%-
        set pick = range(ns.pool | count) | random -%}\n  {%- set ns.out = ns.out
        + [{'entity_id': l, 'hs_color': [ns.pool[pick], 100]}] -%}\n  {%- set ns.pool
        = ns.pool[:pick] + ns.pool[pick + 1:] -%}\n{%- endfor -%}\n{{ ns.out }}"
  - alias: 'For each light: set its hue'
    repeat:
      sequence:
      - alias: Turn on light with its hue at full saturation
        metadata: {}
        data:
          hs_color: '{{ repeat.item.hs_color }}'
          transition: 1
        target:
          entity_id: '{{ repeat.item.entity_id }}'
        action: light.turn_on
        continue_on_error: true
      for_each: '{{ assignments }}'
  alias: Change lights in an area to a random fake white
  mode: parallel
  icon: mdi:white-balance-auto
  fields:
    area:
      description: Area(s) whose lights should change. Every light group in the area
        is expanded down to its individual lights, nested groups included.
      selector:
        area:
          entity:
            integration: group
            domain: light
          multiple: true
  description: Splits the colour wheel evenly across every colour-capable light in
    the area's light groups (360 / number of lights degrees apart), shuffles which
    light gets which hue, and sets each at 100% saturation with a 1 s fade, so the
    lights' combined output approximates white. Groups are expanded, nested ones included;
    unavailable lights and lights that can't show colour are skipped. Meant for the
    LLM to approximate white in a room that has no white-capable bulb.
  max: 10
stream_a_specific_security_camera_on_a_specific_tv_chromecast:
  sequence:
  - alias: Compute Chromecast id and go2rtc stream URL for the cameras
    variables:
      camera: '{{ camera }}

        '
      tv_chromecast: '{{ tv | lower | replace(''universal_'','''') | replace('' '',''_'')
        | replace(''tv'',''chromecast'') | lower }}

        '
      url: 'http://192.168.0.11:1984/stream.html?{% for c in camera %}src={{ state_attr(c,''camera_name'')}}_sub&{%endfor%}

        '
  - alias: If the Chromecast is already running DashCast
    if:
    - alias: Chromecast app is DashCast
      condition: template
      value_template: '{{ state_attr(tv_chromecast,''app_name'') | lower == ''dashcast''
        }}'
    then:
    - alias: Turn off the Chromecast
      action: media_player.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: '{{tv_chromecast}}'
  - alias: Load the camera stream page on the Chromecast via DashCast
    action: dash_cast.load_url
    metadata: {}
    data:
      force: true
      reload_seconds: 0
      url: '{{ url }}'
      entity_id: '{{ tv_chromecast | replace (''universal_'','''') }}'
  fields:
    camera:
      selector:
        entity:
          integration: frigate
          domain: camera
          multiple: true
      name: camera
      description: This field should contain the entity_id of one or multiple cameras.
        An example of such an entity id is 'camera.back_door_camera'
      required: true
      default:
      - camera.back_door_camera
    tv:
      selector:
        entity:
          integration: cast
          domain: media_player
      name: tv
      description: The chromecast or TV where the stream should be sent. This should
        be an entity id starting by 'media_player.' Furthermore, do not use the 'universal'
        media player. This one should be ignored for this script.
      required: true
  alias: Stream a security camera on a Chromecast
  description: Shows the live sub-streams of one or more Frigate cameras (go2rtc)
    on a Chromecast through DashCast. The TV id is turned into its Chromecast id (for
    example 'tv' becomes 'chromecast'), and a Chromecast already showing DashCast
    is turned off first. Meant for the LLM to stream a security camera on a specific
    Chromecast.
quickbars_display_notification:
  alias: QuickBars - Show Front door Camera on TVs
  use_blueprint:
    path: Trooped/notification.yaml
    input:
      message: ' Someone is at the door'
      image_url: /api/camera_proxy/camera.front_door_camera
      transparency: 0
      interrupt: true
      length: 120
      sound_url: /config/www/sounds/ding-dong.mp3
      sound_volume_percent: 32
      action_1_id: unlock_door
      action_1_label: Unlock the door
      action_1_action:
      - sequence:
        - action: lock.unlock
          metadata: {}
          data: {}
          target:
            entity_id: lock.lock_front_door
        - wait_for_trigger:
          - trigger: state
            entity_id:
            - lock.lock_front_door
            from:
            to:
            - unlocked
          timeout:
            hours: 0
            minutes: 0
            seconds: 6
            milliseconds: 0
        - action: input_text.set_value
          metadata: {}
          data:
            value: Come in, It's unlocked!
          target:
            entity_id: input_text.front_door_phone_text
        - wait_for_trigger:
          - trigger: state
            entity_id:
            - lock.lock_front_door
            from:
            to:
            - locked
          timeout:
            hours: 0
            minutes: 1
            seconds: 0
            milliseconds: 0
        - action: input_text.set_value
          metadata: {}
          data:
            value: Empty
          target:
            entity_id: input_text.front_door_phone_text
  description: Shows a 'Someone is at the door' overlay with a still of the front
    door camera on every QuickBars Android TV for 120 seconds (replacing any current
    notification), plays ding-dong.mp3 at 32% and offers an 'Unlock the door' button.
    Pressing it unlocks the front door, waits up to 6 s for it to report unlocked,
    shows 'Come in, It's unlocked!' on the front door phone text, then resets it to
    'Empty' once the door is locked again or after 1 minute.
restart_all_network_equipment:
