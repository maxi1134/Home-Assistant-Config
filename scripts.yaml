      - button.ap_workshop_restart
      - button.ap_patio_restart
      - button.ap_salon_restart
      - button.switch_workshop_tv_mini_restart
      - button.switch_desktop_lounge_restart
      - button.switch_server_restart
      - button.switch_salon_restart
      - button.switch_workshop_restart
      - button.switch_workshop_library_restart
      - button.ucg_ultra_restart
    data: {}
  alias: Restart all network equipment
  description: Restarts all UniFi network infrastructure devices simultaneously, including
    all access points (hotbox, workshop, patio, salon), all network switches (desktop,
    server, salon, workshop, library, TV mini), and the UCG Ultra gateway.
launch_party_mode_on_all_kiosks:
