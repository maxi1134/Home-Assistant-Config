jellyfin_play_random_episode_of_a_selected_tv_show:
  alias: 'Jellyfin: Play Random Episode'
  description: Searches the given Jellyfin player for the show name and plays a random
    item from the results as an episode. When nothing is found it is meant to post
    a persistent notification, but picking a random item from an empty result fails
    first.
  fields:
    show_name:
      name: Show Name
      description: The title of the TV show (e.g., The Office)
      example: The Office
      required: true
      selector:
        text:
    target_player:
      name: Target Player
      description: The Jellyfin media player entity to play on.
      example: media_player.jellyfin_living_room
      required: true
      selector:
        entity:
          domain: media_player
  sequence:
  - alias: Search the player for the show
    action: media_player.search_media
    target:
      entity_id: '{{ target_player }}'
    data:
      search_query: '{{ show_name }}'
    response_variable: search_results
  - alias: Pick a random search result
    variables:
      episodes: '{{ search_results[target_player].result }}'
      random_episode: '{{ episodes | random }}'
  - alias: If the search found anything
    if:
    - alias: Search returned results
      condition: template
      value_template: '{{ episodes | count > 0 }}'
    then:
    - alias: Play the random episode
      action: media_player.play_media
      target:
        entity_id: '{{ target_player }}'
      data:
        media:
          media_content_id: '{{ random_episode.media_content_id }}'
          media_content_type: episode
          metadata: {}
    else:
    - alias: 'Post notification: no episodes found'
      action: notify.persistent_notification
      data:
        title: Jellyfin Search Failed
        message: No episodes found for '{{ show_name }}'.
llm_script_to_start_tv_shows_and_movies_on_tvs_duplicate:
  sequence:
  - alias: If the title is only a description
    if:
    - alias: is_description is true
      condition: template
      value_template: '{{ is_description | default(false) }}'
    then:
    - alias: Confirm Title through LLM/WebSearch
      action: ai_task.generate_data
      data:
        task_name: media name lookup
        instructions: 'The user has asked to watch "{{ media_id }}", but he is unsure
          about the actual name of the media. Look it up online with a web search
          tool call to make confirm the name. If it does not seem to exist, output
          the most probable match.


          Return the result only in the requested structured field.'
        structure:
          media_id_name:
            description: The confirmed name/title for the requested media ID, or the
              most probable match if no exact result exists.
            required: true
            selector:
              text:
      response_variable: media_lookup
  - alias: If no library was given
    if:
    - alias: library_name not given
      condition: template
      value_template: '{{ library_name is not defined }}'
    then:
    - alias: Confirm media library through LLM/WebSearch
      action: ai_task.generate_data
      data:
        task_name: media library lookup
        instructions: 'The user has asked to watch "{{ media_lookup.data.media_id_name
          if media_lookup is defined else media_id }}", but he is unsure about the
          actual type of the media that it is. Look that up online with a web search
          tool call to make confirm the type.


          The answer can only be either ''TV Shows'' or ''Movies''!


          Return the result only in the requested structured field.'
        structure:
          media_library_name:
            description: The library where this media is located; The answer can only
              be either 'TV Shows' or 'Movies'!
            required: true
            selector:
              text:
      response_variable: media_lookup_library_name
      enabled: true
  - alias: If no media type was given
    if:
    - alias: media_type not given
      condition: template
      value_template: '{{ media_type is not defined }}'
    then:
    - alias: Confirm media type through LLM/WebSearch
      action: ai_task.generate_data
      data:
        task_name: media type lookup
        instructions: 'The user has asked to watch "{{ media_lookup.data.media_id_name
          if media_lookup is defined else media_id  }}", but he is unsure about the
          actual type of the media. Look that up online with a web search tool call
          to make confirm the type.


          The answer can only be either ''tvshow'' or  ''movie''!


          Return the result only in the requested structured field.'
        structure:
          media_type_name:
            description: The confirmed media typee for the requested media ID, or
              the most probable match if no exact result exists. The answer can only
              be either 'tvshow' or  'movie'!
            required: true
            selector:
              text:
      response_variable: media_lookup_type
  - alias: Resolve final title, type and library
    variables:
      resolved_media_id: '{{ media_lookup.data.media_id_name if media_lookup is defined
        else media_id }}'
      resolved_media_type: '{{ media_lookup_type.data.media_type_name if media_lookup_type
        is defined else media_type }}'
      resolved_media_library_name: "{% if resolved_media_type == 'movie' %}\n  Movies\n{%
        elif resolved_media_type == 'tvshow' %} TV Shows {% else %} {{ media_lookup_library_name.data.media_library_name
        if media_lookup_library_name is defined else library_name }} {% endif %}"
  - alias: Find the room's TV player
    variables:
      player_data: '{%- set universal = integration_entities(''universal'') | select(''search'',
        ''chromecast'') | list -%}

        {%- set mp_in = media_player | default('''', true) -%}

        {%- set mp = (mp_in if mp_in is string else (mp_in | first if mp_in else ''''))
        | lower | trim -%}

        {%- set ar_in = area | default('''', true) -%}

        {%- set ar = ar_in if ar_in is string else (ar_in | first if ar_in else '''')
        -%}

        {%- set ns = namespace(found=[]) -%}

        {#- Resolve to the room''s universal TV player: 1. the player itself, 2. the
        player''s area, 3. the area field, 4. an area name in free text -#}

        {%- if mp in universal -%}{%- set ns.found = [mp] -%}{%- endif -%}

        {%- if not ns.found and mp and area_id(mp) -%}{%- set ns.found = universal
        | select(''in'', area_entities(area_id(mp))) | list -%}{%- endif -%}

        {%- if not ns.found and ar -%}{%- set ns.found = universal | select(''in'',
        area_entities(area_id(ar) or ar)) | list -%}{%- endif -%}

        {%- if not ns.found and mp -%}{%- for u in universal if not ns.found -%}{%-
        set an = (area_name(u) or '''') | lower -%}{%- if an and an in mp -%}{%- set
        ns.found = [u] -%}{%- endif -%}{%- endfor -%}{%- endif -%}

        {{ ns.found }}'
      target_data:
        entity_id: '{{ (player_data ) | default(''NA'', true) }}'
      invalid_target:
        response: Unable to find valid target
    enabled: true
  - alias: Build the Plex search request
    variables:
      action_data:
        media_content_type: '{{resolved_media_type}}'
        media_content_id: 'plex://{"library_name": "{{resolved_media_library_name}}",
          "title":"{{ resolved_media_id }}", "shuffle": 1, "allow_multiple": 1}'
  - alias: Stop with a clear answer when no TV matches (prevents blind LLM retries)
    if:
    - alias: No TV player matched
      condition: template
      value_template: '{{ player_data | count == 0 }}'
    then:
    - alias: Build error listing valid TV players
      variables:
        invalid_target:
          response: 'No TV found for media_player "{{ media_player | default('''',
            true) }}" / area "{{ area | default('''', true) }}". Retry once with one
            of these TV players: {{ integration_entities(''universal'') | select(''search'',
            ''chromecast'') | join('', '') }}'
    - alias: 'Stop: no TV found for this request'
      stop: Unable to find a TV for this request
      response_variable: invalid_target
  - alias: Play the Plex title on the TV
    action: media_player.play_media
    data: '{{ dict(action_data.items() | rejectattr(''1'', ''eq'', ''NA'')) }}'
    target: '{{ dict(target_data.items() | rejectattr(''1'', ''eq'', ''NA'')) }}'
  - alias: Stop and return the target used
    stop: Playback started!
    response_variable: target_data
    enabled: true
  mode: single
  max_exceeded: silent
  description: Plays a movie or TV show from Plex (shuffled) on the TV player for
    the requested media player or area. When the title is only a description, or the
    library or type is missing, it first asks an AI task with web search to find them;
    if no TV matches, it stops and lists the valid TV players. This script must be
    used by the LLM to initiate a Movie or Show playback on a TV or a chromecast,
    and should never be used when Youtube is mentioned.
  fields:
    media_type:
      selector:
        select:
          options:
          - tvshow
          - movie
      name: Media Type
      description: 'This argument is mandatory and must always be provided no matter
        what! "media_type" can only be one of 2 different values: "movie" if the search
        is about a specific movie.- "tvshow" if the search is about a tv show serie.media_type
        is mandatory and must always be provided. In case a request does not match
        any of these types, for example when music from a specific genre is requested,
        then use "tvshow".'
      required: false
      default: tvshow
    library_name:
      selector:
        select:
          options:
          - TV Shows
          - Movies
      name: Library Name
      description: '"library_name" is the library the user wants to play the media
        from. ''Movies'' for movies and ''TV Shows'' for TV series'
      required: false
    is_description:
      description: Set to true when media_id is a description of the show or movie
        rather than its title; the script then looks up the real title with a web
        search.
      selector:
        boolean: {}
      default: false
      required: true
    media_id:
      selector:
        text:
      name: Media ID
      description: "This argument is mandatory and must always be provided no matter
        what! media_id is the queried name- If the search is about a tv show: Then
        media_id is the tv show title - If the search is about a movie: Then media_id
        is the movie title This is a mandatory argument and must always be provided.\n\n
        If the user only gives a description rather than a title, pass the description
        here and set \"is_description\" to true!"
      required: true
    media_player:
      selector:
        entity: {}
      name: Media Player
      required: true
      description: This argument allows the LLM to select the right CHROMECAST  TV
        to use. A speaker should NEVER be used. An entity containing "Speaker" is
        INCORRECT
    area:
      selector:
        area: {}
      name: area
      description: This argument allows the LLM to select the right area to use
  alias: LLM Script to start TV SHOWS and MOVIES on TVs
generate_front_street_camera_description:
  sequence:
  - alias: Move front door PTZ camera to street preset
    action: select.select_option
    metadata: {}
    target:
      entity_id: select.front_door_ptz_camera_ptz_preset
    data:
      option: street
  - alias: Wait 4 seconds
    delay:
      hours: 0
      minutes: 0
      seconds: 4
      milliseconds: 0
  - alias: Analyze 5 s of front door camera with LLM Vision
    action: llmvision.stream_analyzer
    data:
      store_in_timeline: true
      use_memory: true
      duration: 5
      max_frames: 3
      include_filename: false
      target_width: 1280
      max_tokens: 3000
      generate_title: false
      expose_images: false
      response_format: text
      title_field: title
      description_field: description
      provider: 01KPNMJBE3FPHY7TEGKG6K7MVM
      image_entity:
      - camera.front_door_camera
      message: 'Describe in one sentence the human activities in this image, if there
        is any. '
    response_variable: answer
  - alias: 'Stop: return the camera description'
    stop: Finished
    response_variable: answer
  alias: Generate front street camera description
  description: Turns the front door PTZ camera to its street preset, waits 4 seconds,
    then has LLM Vision analyze 5 seconds of the front door camera (up to 3 frames)
    and returns a one-sentence description of any human activity, also saved to the
    timeline. The LLM can use it to describe the current situation on the street in
    front of the home.
generate_security_audit_and_text_it_to_maxi:
  sequence:
  - alias: Analyze six camera snapshots with LLM Vision
    action: llmvision.image_analyzer
    metadata: {}
    data:
      store_in_timeline: true
      include_filename: true
      target_width: 1280
      generate_title: true
      expose_images: false
      response_format: text
      provider: 01KPNMJBE3FPHY7TEGKG6K7MVM
      message: Analyse the following CCTV Images and describe the human activity or
        lack of.
      image_entity:
      - camera.parking_camera
      - camera.parking_exit_camera
      - camera.patio_camera
      - camera.back_door_camera
      - camera.front_door_camera
      - camera.back_yard_camera
      max_tokens: 3000
    response_variable: images_analyzer_activity
  - alias: Wrap the analysis text for the summary
    variables:
      compounded_answers: '(''answers'':{{images_analyzer_activity.response_text}}
        ) '
  - alias: Summarize human activity with AI task
    action: ai_task.generate_data
    metadata: {}
    data:
      task_name: Security Cameras Overview generation
      instructions: 'Analyze all the previous activity reports and provide an activity
        overview, mention only the human activity!

        This is the data: ''{{compounded_answers}}''


        Be brief! This is an emergency situation.'
      entity_id: ai_task.remote_llama_qwen3_5_4b_general_ai_task
    response_variable: final_audit
  - alias: Send security report to Maxi's phone
    metadata: {}
    data:
      title: 'Security Report:'
      data:
        ttl: 0
        priority: high
        channel: security_alerts_notifications
        color: Red
      message: '{{final_audit.data}}'
    action: notify.maxi_notification_group
  alias: Generate security audit and text it to maxi
  description: Has LLM Vision describe the human activity in snapshots from six security
    cameras (parking, parking exit, patio, back door, front door, back yard), asks
    the local Qwen AI task for a brief overview of that activity, and sends the report
    to Maxi's phone as a high-priority security notification. An LLM can use it to
    run a security audit and text the result to Maxi.
join_player_to_music_assistant_group:
  alias: Join player to Music Assistant group
  description: 'Add a Music Assistant speaker to a sync group. Tell it the area/room
    of the speaker to add (e.g. "office") and it finds the Music Assistant speaker
    there automatically. It also auto-detects the group to join: the group currently
    playing, or the home group when more than one group is playing. Use this when
    the user asks to add a room/speaker to the music that is already playing, or to
    group a room with another one.'
  icon: mdi:speaker-multiple
  mode: queued
  max: 10
  fields:
    area:
      name: Area / room of the speaker to add
      description: The room/area that contains the speaker to add (e.g. Office, Kitchen,
        Bedroom). The script automatically finds the Music Assistant speaker in that
        area. This is the easiest and most reliable way to choose a speaker.
      required: true
      selector:
        area:
    player_to_add:
      name: Specific player to add (optional override)
      description: Optional advanced override. A specific Music Assistant media_player
        entity to add (e.g. media_player.kitchen). If set, the area lookup is skipped.
      required: false
      selector:
        entity:
          filter:
          - integration: music_assistant
            domain: media_player
      example: media_player.kitchen
    target_player:
      name: Target group player (optional)
      description: Optional. Any Music Assistant media_player that is already in the
        target group (either the leader or any member). Leave empty to automatically
        use the Music Assistant group that is currently playing (and the home group
        if more than one group is playing).
      required: false
      selector:
        entity:
          filter:
          - integration: music_assistant
            domain: media_player
  sequence:
  - alias: Resolve speaker to add and group leader
    variables:
      area_in: '{{ area | default('''') }}'
      override: '{{ player_to_add | default('''') }}'
      tgt: '{{ target_player | default('''') }}'
      home_group: media_player.group_mass_home_group_speakers
      mass_players: "{{ integration_entities('music_assistant')\n   | select('match',
        '^media_player\\.') | list }}"
      add: "{%- set ns = namespace(add='', first='') -%} {%- if override -%}\n  {%-
        set ns.add = override -%}\n{%- elif area_in -%}\n  {%- set cand = area_entities(area_in)\n
        \        | select('match', '^media_player\\.')\n         | select('in', mass_players)
        | list -%}\n  {%- for e in cand -%}\n    {%- if ns.first == '' -%}{%- set
        ns.first = e -%}{%- endif -%}\n    {%- if ns.add == '' and states(e) not in
        ['unavailable', 'unknown'] -%}\n      {%- set ns.add = e -%}\n    {%- endif
        -%}\n  {%- endfor -%}\n  {%- set ns.add = ns.add if ns.add else ns.first -%}\n{%-
        endif -%} {{ ns.add }}"
      leader: "{%- set ns = namespace(leader='', others=[], solo=[]) -%} {%- if tgt
        -%}\n  {%- set gm = state_attr(tgt, 'group_members') -%}\n  {%- set ns.leader
        = (gm[0] if (gm and (gm | length) > 0) else tgt) -%}\n{%- else -%}\n  {%-
        set home_state = states(home_group) -%}\n  {%- set home_exists = home_state
        not in ['unavailable', 'unknown'] -%}\n  {%- set home_playing = home_exists
        and home_state in ['playing', 'buffering', 'paused'] -%}\n  {%- set home_members
        = state_attr(home_group, 'group_members') or [] -%}\n  {%- for p in mass_players
        -%}\n    {%- if p != home_group and p not in home_members -%}\n      {%- set
        gm = state_attr(p, 'group_members') -%}\n      {%- if gm and (gm | length)
        > 1 and states(p) in ['playing', 'buffering', 'paused'] -%}\n        {%- set
        ns.others = ns.others + [gm[0]] -%}\n      {%- elif states(p) in ['playing',
        'buffering'] -%}\n        {%- set ns.solo = ns.solo + [p] -%}\n      {%- endif
        -%}\n    {%- endif -%}\n  {%- endfor -%}\n  {%- set ns.others = ns.others
        | unique | list -%}\n  {%- set total = (ns.others | length) + (1 if home_playing
        else 0) -%}\n  {%- if total > 1 -%}\n    {%- set ns.leader = home_group if
        home_exists else ns.others[0] -%}\n  {%- elif total == 1 -%}\n    {%- set
        ns.leader = home_group if home_playing else ns.others[0] -%}\n  {%- elif (ns.solo
        | length) > 0 -%}\n    {%- set ns.leader = ns.solo[0] -%}\n  {%- endif -%}\n{%-
        endif -%} {{ ns.leader }}"
      current_members: '{{ (state_attr(leader, ''group_members'') or []) if leader
        else [] }}'
      target_members: '{{ ((current_members | reject(''eq'', leader) | list) + [add])
        | unique | list }}'
      already_member: '{{ add in current_members }}'
  - alias: Decide whether and how to join
    choose:
    - alias: No speaker found → stop with error
      conditions:
      - alias: No speaker resolved
        condition: template
        value_template: '{{ not add }}'
      sequence:
      - alias: Build 'no speaker found' result
        variables:
          result:
            success: false
            message: Could not find a Music Assistant speaker to add. No Music Assistant
              media_player was found in area '{{ area_in }}'. Make sure the Music
              Assistant speaker entity (not just the native one) is assigned to that
              area, or pass player_to_add.
      - alias: 'Stop: no speaker resolved from area'
        stop: No speaker resolved from area
        response_variable: result
    - alias: No group leader → stop with error
      conditions:
      - alias: No group leader found
        condition: template
        value_template: '{{ not leader }}'
      sequence:
      - alias: Build 'no leader found' result
        variables:
          result:
            success: false
            added: '{{ add }}'
            message: No Music Assistant group leader could be found. Make sure a Music
              Assistant player is currently playing, or specify a target_player that
              is in the desired group.
      - alias: 'Stop: no Music Assistant leader found'
        stop: No Music Assistant leader found
        response_variable: result
    - alias: Speaker is the leader → stop
      conditions:
      - alias: Speaker to add is the leader
        condition: template
        value_template: '{{ add == leader }}'
      sequence:
      - alias: Build 'already the leader' result
        variables:
          result:
            success: false
            leader: '{{ leader }}'
            message: '{{ add }} is already the group leader; nothing to join.'
      - alias: 'Stop: requested player is the leader'
        stop: Requested player is the leader
        response_variable: result
    - alias: Already in the group → stop
      conditions:
      - alias: Speaker is already a group member
        condition: template
        value_template: '{{ already_member }}'
      sequence:
      - alias: Build 'already in group' result
        variables:
          result:
            success: true
            leader: '{{ leader }}'
            message: '{{ add }} is already part of the group led by {{ leader }}.'
      - alias: 'Stop: player already in group'
        stop: Requested player already in group
        response_variable: result
    default:
    - alias: 'Otherwise: join the speaker to the leader''s group'
      action: media_player.join
      target:
        entity_id: '{{ leader }}'
      data:
        group_members: '{{ target_members }}'
    - alias: Build the success result
      variables:
        result:
          success: true
          leader: '{{ leader }}'
          added: '{{ add }}'
          group_members: '{{ target_members }}'
          message: Added {{ add }} to the Music Assistant group led by {{ leader }}.
    - alias: Stop and return the join result
      stop: Joined
      response_variable: result
unjoin_speaker_or_area_from_group:
  alias: Unjoin speaker or area from group
  icon: mdi:speaker-off
  description: Remove Music Assistant speakers from any group / sync group they are
    playing in, so they play on their own again. Provide `area` to unjoin every Music
    Assistant speaker in a room (e.g. the user says "unjoin the patio"), and/or `player`
    to unjoin one specific speaker. Use whenever the user asks to unjoin, ungroup,
    separate, remove, or split off a speaker or a room from a multi-room / synced
    group.
  fields:
    area:
      name: Area
      description: Room/area to unjoin. Every Music Assistant speaker in this area
        is removed from its group. Use this when the user names a room, e.g. "unjoin
        the patio".
      required: false
      selector:
        area:
          entity:
            integration: music_assistant
            domain: media_player
    player:
      name: Speaker
      description: A single Music Assistant speaker to unjoin. Use this when the user
        names a specific speaker instead of (or in addition to) a room.
      required: false
      selector:
        entity:
          filter:
          - integration: music_assistant
            domain: media_player
  mode: parallel
  max: 10
  sequence:
  - alias: Collect Music Assistant speakers to unjoin
    variables:
      mass_players: "{%- set mass = integration_entities('music_assistant') -%} {%-
        set ns = namespace(targets=[]) -%} {%- if player is defined and player -%}\n
        \ {%- set ns.targets = ns.targets + ([player] if player is string else player
        | list) -%}\n{%- endif -%} {%- if area is defined and area -%}\n  {%- set
        areas = [area] if area is string else area | list -%}\n  {%- for a in areas
        -%}\n    {%- for e in area_entities(a) -%}\n      {%- if e in mass and e.startswith('media_player.')
        -%}\n        {%- set ns.targets = ns.targets + [e] -%}\n      {%- endif -%}\n
        \   {%- endfor -%}\n  {%- endfor -%}\n{%- endif -%} {{- ns.targets | unique
        | list }}"
  - alias: Unjoin if any speakers were found
    choose:
    - alias: Speakers found → unjoin them
      conditions:
      - alias: At least one speaker found
        condition: template
        value_template: '{{ mass_players | count > 0 }}'
      sequence:
      - alias: Unjoin the speakers from their groups
        action: media_player.unjoin
        target:
          entity_id: '{{ mass_players }}'
    default:
    - alias: 'Otherwise: stop, no speakers found'
      stop: No Music Assistant speakers found for the requested area/speaker.
