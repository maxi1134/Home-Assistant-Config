    titled 'Someone is at the door!' and hidden after 120 seconds.
favorite_currently_playing_song:
  sequence:
  - alias: Pick speaker based on home group state
    choose:
    - alias: Home group not off → favorite there
      conditions:
      - alias: Home speaker group is not off
        condition: not
        conditions:
        - alias: Home speaker group is off
          condition: state
          entity_id: media_player.group_mass_home_group_speakers
          state:
          - 'off'
      sequence:
      - alias: Press home group's favorite song button
        action: button.press
        metadata: {}
        target:
          entity_id: button.group_mass_home_speakers_favorite_current_song
        data: {}
    - alias: Home group off → favorite on Maxi's room speaker
      conditions:
      - alias: Home speaker group is off
        condition: state
        entity_id: media_player.group_mass_home_group_speakers
        state:
        - 'off'
      sequence:
      - variables:
          favorite_entity: "{{ integration_entities('music_assistant') \n | expand\n
            | selectattr('entity_id', 'search', states('sensor.maxi_location_by_petro_v2')
            )\n | selectattr('entity_id', 'search', 'favorite' )\n | map(attribute='entity_id')
            | list }} \n"
        alias: Define Closest speaker to maxi and its favorite button entity
      - alias: Press that speaker's favorite song button
        action: button.press
        metadata: {}
        target:
          entity_id: '{{ favorite_entity }}

            '
