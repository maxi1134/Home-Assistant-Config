      - media_player.mass_bedroom_vpe_speaker
      - media_player.mass_closet_vpe_speaker
    data:
      media:
        media_content_id: media-source://media_source/local/burglar_alarm.mp3
        media_content_type: audio/mpeg
        metadata:
          title: burglar_alarm.mp3
          thumbnail:
          media_class: music
          children_media_class:
          navigateIds:
          - {}
          - media_content_type: app
            media_content_id: media-source://media_source
          - media_content_type: ''
            media_content_id: media-source://media_source/local/.
          browse_entity_id: media_player.group_mass_home_group_speakers
    continue_on_error: true
  - action: media_player.volume_set
    metadata: {}
    data:
      volume_level: 1
    target:
