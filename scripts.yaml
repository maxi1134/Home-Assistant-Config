    (up to 4 frames) and returns a one-sentence description of any human activity,
    also saved to the timeline. The LLM can use it to describe the current situation
    at the parking.
chromecast_automatic_volume_adjustment_script:
  sequence:
  - alias: Take the Chromecast from received_chromecast
    variables:
      chromecast_id: '{{ received_chromecast }}

        '
  - alias: Set volume then mute if empty
    sequence:
    - alias: Pick volume by time of day
      choose:
      - alias: 08:45–11:30 → 60% and unmute
        conditions:
        - alias: Between 08:45 and 11:30
          condition: time
          after: 08:45:00
          before: '11:30:00'
          weekday:
          - fri
          - thu
          - wed
          - tue
          - mon
          - sat
          - sun
        sequence:
        - alias: Set Chromecast volume to 60%
          metadata: {}
          data:
            volume_level: 0.6
          target:
            entity_id: '{{chromecast_id}}'
          enabled: true
          action: media_player.volume_set
        - metadata: {}
          data:
            is_volume_muted: false
          target:
            entity_id: '{{chromecast_id}}'
          alias: Unmute speaker
          action: media_player.volume_mute
      - alias: 11:30–21:30 → 90% and unmute
        conditions:
        - alias: Between 11:30 and 21:30
          condition: time
          after: '11:30:00'
          before: '21:30:00'
          weekday:
          - fri
          - thu
          - wed
          - tue
          - mon
          - sun
          - sat
        sequence:
        - alias: Set Chromecast volume to 90%
          metadata: {}
          data:
            volume_level: 0.9
          target:
            entity_id: '{{chromecast_id}}'
          enabled: true
          action: media_player.volume_set
        - metadata: {}
          data:
            is_volume_muted: false
          target:
            entity_id: '{{chromecast_id}}'
          alias: Unmute speaker
          action: media_player.volume_mute
      - alias: 21:30–23:30 → 65% and unmute
        conditions:
        - alias: Between 21:30 and 23:30
          condition: time
          after: '21:30:00'
          before: '23:30:00'
          weekday:
          - fri
          - thu
          - wed
          - tue
          - mon
          - sun
          - sat
        sequence:
        - alias: Set Chromecast volume to 65%
          metadata: {}
          data:
            volume_level: 0.65
          target:
            entity_id: '{{chromecast_id}}'
          enabled: true
          action: media_player.volume_set
        - metadata: {}
          data:
            is_volume_muted: false
          target:
            entity_id: '{{chromecast_id}}'
          alias: Unmute speaker
          action: media_player.volume_mute
      - alias: 23:30–01:00 → 55% and unmute
        conditions:
        - alias: Between 23:30 and 01:00
          condition: time
          after: '23:30:00'
          before: 01:00:00
          weekday:
          - fri
          - thu
          - wed
          - tue
          - mon
          - sun
          - sat
        sequence:
        - alias: Set Chromecast volume to 55%
          metadata: {}
          data:
            volume_level: 0.55
          target:
            entity_id: '{{chromecast_id}}'
          enabled: true
          action: media_player.volume_set
        - metadata: {}
          data:
            is_volume_muted: false
          target:
            entity_id: '{{chromecast_id}}'
          alias: Unmute speaker
          action: media_player.volume_mute
      - alias: 01:00–03:00 → 45% and unmute
        conditions:
        - alias: Between 01:00 and 03:00
          condition: time
          after: 01:00:00
          before: 03:00:00
          weekday:
          - fri
          - thu
          - wed
          - tue
          - mon
          - sun
          - sat
        sequence:
        - alias: Set Chromecast volume to 45%
          metadata: {}
          data:
            volume_level: 0.45
          target:
            entity_id: '{{chromecast_id}}'
          enabled: true
          action: media_player.volume_set
        - metadata: {}
          data:
            is_volume_muted: false
          target:
            entity_id: '{{chromecast_id}}'
          alias: Unmute speaker
          action: media_player.volume_mute
      - alias: 03:00–08:45 → 35% and unmute
        conditions:
        - alias: Between 03:00 and 08:45
          condition: time
          after: 03:00:00
          before: 08:45:00
          weekday:
          - fri
          - thu
          - wed
          - tue
          - mon
          - sun
          - sat
        sequence:
        - alias: Set Chromecast volume to 35%
          metadata: {}
          data:
            volume_level: 0.35
          target:
            entity_id: '{{chromecast_id}}'
          enabled: true
          action: media_player.volume_set
        - metadata: {}
          data:
            is_volume_muted: false
          target:
            entity_id: '{{chromecast_id}}'
          alias: Unmute speaker
          action: media_player.volume_mute
      default:
      - alias: 'Otherwise: set Chromecast volume to 50%'
        metadata: {}
        data:
          volume_level: 0.5
        target:
          entity_id: '{{chromecast_id}}'
        enabled: true
        action: media_player.volume_set
      - metadata: {}
        data:
          is_volume_muted: false
        target:
          entity_id: '{{chromecast_id}}'
        alias: Unmute speaker
        action: media_player.volume_mute
    - alias: Mute if empty
      if:
      - alias: Chromecast's room has no motion
        condition: template
        value_template: '{{ area_id(chromecast_id ) | string | lower not in states(''sensor.active_motion_rooms'')
          | string | lower }}

          '
      - alias: Chromecast's room has no motion (old copy)
        condition: template
        value_template: '{{ area_id(chromecast_id | first) | string | lower not in
          states(''sensor.active_motion_rooms'') | string | lower }}

          '
        enabled: false
      - alias: Music following is on
        condition: state
        entity_id: input_boolean.following_music
        state: 'on'
      then:
      - alias: Mute the Chromecast
        data:
          is_volume_muted: true
        target:
          entity_id: '{{chromecast_id}}'
        action: media_player.volume_mute
      enabled: true
  alias: Chromecast Automatic Volume Adjustment script
  description: 'Sets one Chromecast''s volume by time of day and unmutes it: 60% from
    08:45, 90% from 11:30, 65% from 21:30, 55% from 23:30, 45% from 01:00 and 35%
    from 03:00. Then mutes it again if music following is on and its room has no active
    motion. The Chromecast comes from the received_chromecast variable.'
  mode: parallel
  max: 10
