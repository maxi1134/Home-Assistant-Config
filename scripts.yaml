        -%}\n  {%- for a in areas -%}\n    {%- set in_area = area_entities(a) | select('match',
        'light[.]') | list -%}\n    {%- set room_groups = in_area | select('match',
        'light[.]group_') | list -%}\n    {%- set ns.roots = ns.roots + (room_groups
        if room_groups else in_area) -%}\n  {%- endfor -%}\n  {{ (ns.roots + picked
        | list) | unique | list }}\n{%- endif -%}"
      on_only: '{{ (area is not defined and light is not defined) or (only_on | default(false)
        | bool) }}'
      lights: "{{ expand(targets)\n   | selectattr('domain', 'eq', 'light')\n   |
        rejectattr('attributes.entity_id', 'defined')\n   | selectattr('attributes.supported_color_modes',
        'defined')\n   | selectattr('attributes.supported_color_modes', 'search',
        'hs|rgb|xy')\n   | selectattr('state', 'in', ['on'] if on_only else ['on',
        'off'])\n   | map(attribute='entity_id') | unique | list }}"
  - repeat:
      for_each: '{{ lights }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.set_one_light_to_a_warm_saturated_color
        data:
          variables:
            target_light: '{{ repeat.item }}'
            saturation: '{{ saturation | default(100) }}'
            transition_speed: '{{ transition_speed | default(1) }}'
  - variables:
      result:
        changed: '{{ lights | count }}'
        lights: '{{ lights }}'
  - stop: Lights changed
    response_variable: result
start_a_random_maxi_playlist:
  sequence:
  - variables:
      maxi_playlists:
      - Maxi's Smart Playlist
      - Maxi's Smart Discovery Playlist
      - Infinite Mix (favorites)
      - My Mix 1
      - My Mix 2
      - My Mix 3
      - My Mix 4
      - My Mix 5
      - My Mix 6
      home_group: media_player.group_mass_home_group_speakers
      requested_playlist: '{% if requested_playlist is defined and requested_playlist
        | string | trim -%} {{- requested_playlist | string | trim -}} {%- else -%}
        Maxi''s Smart Playlist {%- endif %}'
      home_group_members: "{% set want = ['salon', 'workshop', 'kitchen', 'lounge',
        'hallway', 'hotbox', 'patio'] -%} {% set ns = namespace(members=[]) -%} {%
        for aid in areas() -%}\n  {% if ((area_name(aid) or '') | lower) in want -%}\n
        \   {% set ns.members = ns.members + (area_entities(aid) | select('search',
        'media_player.mass.*_speaker') | list) -%}\n  {% endif -%}\n{% endfor -%}
        {{ ns.members | unique | list }}"
      players: "{% set ns = namespace(players=[]) -%} {% if player_entity is defined
        and player_entity is mapping and player_entity.entity_id is defined and player_entity.entity_id
        -%}\n  {% if player_entity.entity_id is string -%}\n    {% set ns.players
        = [player_entity.entity_id | trim] -%}\n  {% else -%}\n    {% set ns.players
        = player_entity.entity_id | map('trim') | list -%}\n  {% endif -%}\n{% elif
        player_entity is defined and player_entity is string and player_entity | trim
        and '{}' not in player_entity -%}\n  {% set ns.players = [player_entity |
        trim] -%}\n{% elif area is defined and area -%}\n  {% set areas = area if
        (area is iterable and area is not string) else [area] -%}\n  {% for a in areas
        -%}\n    {% set ns.players = ns.players + (area_entities(a) | select('search',
        'media_player.mass.*_speaker') | list) -%}\n  {% endfor -%}\n{% endif -%}
        {% set valid = states.media_player | map(attribute='entity_id') | list -%}
        {% set ns.players = ns.players | select('in', valid) | unique | list -%} {%
        if ns.players | length == 0 -%}\n  {% set ns.players = [home_group] -%}\n{%
        endif -%} {{ ns.players }}"
      leader: '{{ players | first }}'
      followers: '{{ players[1:] }}'
  - if:
    - condition: template
      value_template: '{{ leader != home_group }}'
    then:
    - action: media_player.unjoin
      target:
        entity_id: '{{ players }}'
    - delay:
        seconds: 1
  - if:
    - condition: template
      value_template: '{{ leader == home_group and home_group_members | length > 0
        }}'
    then:
    - action: media_player.media_stop
      target:
        entity_id: '{{ home_group_members }}'
    - delay:
        seconds: 1
    - action: media_player.join
      target:
        entity_id: '{{ home_group }}'
      data:
        group_members: '{{ home_group_members }}'
    - delay:
        seconds: 2
  - if:
    - condition: template
      value_template: '{{ players | length > 1 }}'
    then:
    - action: media_player.join
      target:
        entity_id: '{{ leader }}'
      data:
        group_members: '{{ followers }}'
    - delay:
        seconds: 1
  - action: media_player.shuffle_set
    metadata: {}
    data:
      shuffle: true
    target:
      entity_id: '{{ leader }}'
    continue_on_error: true
  - target:
      entity_id: '{{ leader }}'
    data:
      media:
        media_content_id: '{% if requested_playlist != ''none'' -%} {{- requested_playlist
          -}} {%- else -%} {{- maxi_playlists | random -}} {%- endif %}'
        media_content_type: playlist
        metadata: {}
    action: media_player.play_media
  fields:
    player_entity:
      selector:
        target: {}
      name: Player entity
      description: The player(s) to play music on. Accepts one or more media players.
        The first one becomes the group leader.
      default:
        entity_id: media_player.group_mass_home_group_speakers
      required: false
    requested_playlist:
      selector:
        text:
      name: Requested Playlist
      description: Use this if a specific playlist is requested
      default: Maxi's Smart Playlist
    area:
      selector:
        area:
          entity:
            integration: music_assistant
            domain: media_player
          multiple: true
      name: Area
      description: The area or areas for which the music is requested. If the request
        does not mention a target (either an area or a player), use the area the request
        comes from. If the area can not be determined from the request, or the device
        the request comes from, do not use this parameter. Only use both the "area"
        parameter and the "media_player" parameter together if both are specifically
        used in the request.
  alias: Start a random maxi playlist (Only use for playlists)
  description: Plays a specifically requested playlist or randomly selects from a
    curated list of Maxi's favorite playlists. Detaches the target player(s) from
    the home group, and when multiple are requested groups them under the first one.
    When the home group is the target, rebuilds its membership (Salon, Workshop, Kitchen,
    Lounge, Hallway) first so it is never empty. Enables shuffle mode.
  mode: restart
change_received_lights_to_random_pastel_colors:
  alias: Change received lights to random pastel colors
  description: Changes lights to random pastel colors (random hue at low saturation).
    Each light gets its own hue, at least 25 degrees away from its current one, and
    all lights change at the same time. Target lights with area and/or light (groups
    are expanded, lights that cannot show colors are skipped). With neither area nor
    light, every light that is currently on changes.
  mode: parallel
  max: 10
  icon: mdi:palette-swatch
  fields:
    area:
      name: Area
      description: Area(s) whose lights should change. Uses the room's light groups
        when it has any, otherwise every light in the room. Leave both area and light
        out to change every light that is currently on.
      selector:
        area:
          multiple: true
    light:
      name: Light
      description: Light(s) or light groups to change. Groups are expanded to their
        member lights.
      selector:
        entity:
          multiple: true
          domain: light
    only_on:
      name: Only lights that are on
      description: Only change lights that are already on.
      default: false
      selector:
        boolean: {}
    saturation:
      name: Saturation
      description: Color saturation in percent. Pastel is 40.
      default: 40
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: '%'
    transition_speed:
      name: Transition
      description: Fade time in seconds.
      default: 1
      selector:
        number:
          min: 0
          max: 30
          step: 0.5
          unit_of_measurement: s
  sequence:
  - variables:
      targets: "{%- if area is not defined and light is not defined -%}\n  {{ ['light.group_all_lights']
        }}\n{%- else -%}\n  {%- set areas = area if area is defined and area else
        [] -%}\n  {%- set areas = [areas] if areas is string else areas -%}\n  {%-
        set picked = light if light is defined and light else [] -%}\n  {%- set picked
        = [picked] if picked is string else picked -%}\n  {%- set ns = namespace(roots=[])
        -%}\n  {%- for a in areas -%}\n    {%- set in_area = area_entities(a) | select('match',
        'light[.]') | list -%}\n    {%- set room_groups = in_area | select('match',
        'light[.]group_') | list -%}\n    {%- set ns.roots = ns.roots + (room_groups
        if room_groups else in_area) -%}\n  {%- endfor -%}\n  {{ (ns.roots + picked
        | list) | unique | list }}\n{%- endif -%}"
      on_only: '{{ (area is not defined and light is not defined) or (only_on | default(false)
        | bool) }}'
      lights: "{{ expand(targets)\n   | selectattr('domain', 'eq', 'light')\n   |
        rejectattr('attributes.entity_id', 'defined')\n   | selectattr('attributes.supported_color_modes',
        'defined')\n   | selectattr('attributes.supported_color_modes', 'search',
        'hs|rgb|xy')\n   | selectattr('state', 'in', ['on'] if on_only else ['on',
        'off'])\n   | map(attribute='entity_id') | unique | list }}"
  - repeat:
      for_each: '{{ lights }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.set_one_light_to_a_random_pastel_color
        data:
          variables:
            target_light: '{{ repeat.item }}'
            saturation: '{{ saturation | default(40) }}'
            transition_speed: '{{ transition_speed | default(1) }}'
  - variables:
      result:
        changed: '{{ lights | count }}'
        lights: '{{ lights }}'
  - stop: Lights changed
    response_variable: result
