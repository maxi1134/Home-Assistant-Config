start_retro_gaming_session:
  alias: Start retro gaming session
  description: 'This Script is used to start the retro-gaming console connected to
    the Salon TV.

    It should be called whenever someone asks to play retro games or any retro title'
  sequence:
  - alias: Power on the salon TV over RS-232 (a discrete on, so it's harmless if the
      TV is already on)
    action: media_player.turn_on
    target:
      entity_id: media_player.sony_tv
  - alias: From standby, wait for the TV to come up (Android TV Remote reports within
      seconds; RS-232 only polls every 60 s)
    if:
    - condition: not
      conditions:
      - condition: state
        entity_id: media_player.bravia_4k_ae2
        state: 'on'
    then:
    - wait_for_trigger:
      - trigger: state
        entity_id: media_player.bravia_4k_ae2
        to: 'on'
      timeout: 00:00:30
      continue_on_timeout: true
    - delay: 00:00:03
  - alias: Switch to the retro console on HDMI 1 (a freshly woken TV can refuse the
      first input command)
    action: media_player.select_source
    target:
      entity_id: media_player.sony_tv
    data:
      source: HDMI 1
    continue_on_error: true
  - delay: 00:00:03
  - alias: 'Second try: re-selecting the active input is harmless, and a real failure
      surfaces here'
    action: media_player.select_source
    target:
      entity_id: media_player.sony_tv
    data:
      source: HDMI 1
change_received_lights_to_vibrating_colors:
  alias: Change received lights to vibrating colors
  description: Starts the vibrating color effect on lights. Each light shimmers around
    its current hue while input_boolean.vibrating_colors_effect is on and the light
    stays on; speed and saturation come from input_number.vibrating_color_effect_speed
    and input_number.vibrating_color_effect_saturation. Target lights with area and/or
    light (groups are expanded, lights that cannot show colors are skipped). With
    neither area nor light, every light that is currently on is used.
  mode: parallel
  max: 10
  icon: mdi:sine-wave
  fields:
    area:
      name: Area
      description: Area(s) whose lights should change. Uses the room's light groups
        when it has any, otherwise every light in the room. Leave both area and light
        out to change every light that is currently on.
      selector:
        area:
          multiple: true
    light:
      name: Light
      description: Light(s) or light groups to change. Groups are expanded to their
        member lights.
      selector:
        entity:
          multiple: true
          domain: light
    only_on:
      name: Only lights that are on
      description: Only change lights that are already on.
      default: false
      selector:
        boolean: {}
  sequence:
  - variables:
      targets: "{%- if area is not defined and light is not defined -%}\n  {{ ['light.group_all_lights']
        }}\n{%- else -%}\n  {%- set areas = area if area is defined and area else
        [] -%}\n  {%- set areas = [areas] if areas is string else areas -%}\n  {%-
        set picked = light if light is defined and light else [] -%}\n  {%- set picked
        = [picked] if picked is string else picked -%}\n  {%- set ns = namespace(roots=[])
        -%}\n  {%- for a in areas -%}\n    {%- set in_area = area_entities(a) | select('match',
        'light[.]') | list -%}\n    {%- set room_groups = in_area | select('match',
        'light[.]group_') | list -%}\n    {%- set ns.roots = ns.roots + (room_groups
        if room_groups else in_area) -%}\n  {%- endfor -%}\n  {{ (ns.roots + picked
        | list) | unique | list }}\n{%- endif -%}"
      on_only: '{{ (area is not defined and light is not defined) or (only_on | default(false)
        | bool) }}'
      lights: "{{ expand(targets)\n   | selectattr('domain', 'eq', 'light')\n   |
        rejectattr('attributes.entity_id', 'defined')\n   | selectattr('attributes.supported_color_modes',
        'defined')\n   | selectattr('attributes.supported_color_modes', 'search',
        'hs|rgb|xy')\n   | selectattr('state', 'in', ['on'] if on_only else ['on',
        'off'])\n   | map(attribute='entity_id') | unique | list }}"
  - repeat:
      for_each: '{{ lights }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.set_one_light_to_vibrating_colors
        data:
          variables:
            target_light: '{{ repeat.item }}'
  - variables:
      result:
        changed: '{{ lights | count }}'
        lights: '{{ lights }}'
  - stop: Lights changed
    response_variable: result
